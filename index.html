<style>
  :root{
    --ink:#1C2541;
    --ink-soft:#2C3A63;
    --paper:#EDE6D6;
    --paper-dark:#E1D6BE;
    --paper-line:#cdbf9c;
    --seal:#A63A32;
    --seal-dark:#7f2b25;
    --brass:#93762F;
    --charcoal:#2A2620;
    --muted:#726B58;
    --shadow: 0 8px 24px rgba(28,37,65,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(28,37,65,0.04), transparent 60%),
      var(--paper);
    color:var(--charcoal);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
    overflow-x:hidden;
  }
  .wrap{max-width:900px;margin:0 auto;}

  /* ===== Header / Letterhead ===== */
  header.letterhead{
    background:var(--ink);
    color:var(--paper);
    border-radius:6px;
    padding:28px 30px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow);
    margin-bottom:28px;
  }
  header.letterhead::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(237,230,214,0.25);
    border-radius:3px;
    pointer-events:none;
  }
  .eyebrow{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-size:11px;
    letter-spacing:0.18em;
    color:#C9BFA0;
    text-transform:uppercase;
    margin:0 0 8px;
  }
  h1{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-weight:900;
    font-size:clamp(24px,4vw,34px);
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  .sub{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-size:14px;
    color:#D6CDB2;
    margin:0;
  }
  .seal{
    position:absolute;
    top:20px;
    right:24px;
    width:64px;
    height:64px;
    opacity:0.92;
  }

  /* ===== Tabs (folder tabs) ===== */
  .tabbar{
    display:flex;
    gap:6px;
    align-items:flex-end;
    margin-bottom:0;
    padding-left:6px;
  }
  .tab{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-weight:600;
    font-size:15px;
    padding:12px 22px 11px;
    background:var(--paper-dark);
    color:var(--muted);
    border:1px solid var(--paper-line);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    transform:translateY(4px);
    transition:transform .15s ease, background .15s ease, color .15s ease;
    position:relative;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{
    background:#F7F2E6;
    color:var(--ink);
    transform:translateY(0);
    box-shadow:0 -2px 6px rgba(0,0,0,0.04);
    z-index:2;
  }
  .tab .count{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-size:11px;
    color:var(--brass);
    margin-left:6px;
  }

  .panel{
    background:#F7F2E6;
    border:1px solid var(--paper-line);
    border-radius:0 8px 8px 8px;
    box-shadow:var(--shadow);
    padding:22px 24px 26px;
    position:relative;
  }

  /* ===== Sub-category chips ===== */
  .subbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
    padding-bottom:16px;
    border-bottom:1px dashed var(--paper-line);
  }
  .subchip{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-size:12px;
    color:var(--muted);
    background:var(--paper);
    border:1px solid var(--paper-line);
    padding:6px 13px;
    border-radius:16px;
    cursor:pointer;
    transition:all .12s ease;
    white-space:nowrap;
  }
  .subchip:hover{color:var(--ink);border-color:var(--brass);}
  .subchip.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .subchip.unassigned{
    border-style:dashed;
    color:var(--seal);
  }
  .subchip.unassigned.active{
    background:var(--seal);
    border-color:var(--seal);
    color:#fff;
  }
  .subchip .n{
    opacity:0.7;
    margin-left:5px;
  }

  .panel-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .panel-title{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-size:12px;

    // 從未使用即時訂閱（onSnapshot），這條長連線純屬多餘負擔；且此連線曾出現連不上、
    // 每隔幾秒自動重試又失敗的情形，反而拖慢網頁反應速度，故予以移除。
    window.__cloudMode = true;
  }
}catch(fbInitErr){
  db = null;
  window.__cloudMode = false;
}
}

const ENTRIES_COLLECTION = 'examarchive_entries';
const IMAGES_COLLECTION = 'examarchive_images';
const META_COLLECTION = 'examarchive_meta';
const LAZY_IMAGE_MARKER = '__LAZY_IMG__';
const imageCache = {}; // 記憶體快取：entryId -> base64 圖片字串，避免同一張圖重複下載

async function firestoreSaveImage(entryId, dataUrl){
  await db.collection(IMAGES_COLLECTION).doc(entryId).set({ data: dataUrl });
}

async function firestoreLoadImage(entryId){
  if(imageCache[entryId]) return imageCache[entryId];
  const docSnap = await db.collection(IMAGES_COLLECTION).doc(entryId).get();
  const dataUrl = docSnap.exists ? (docSnap.data().data || '') : '';
  imageCache[entryId] = dataUrl;
  return dataUrl;
}

// 把一筆題目資料裡真正的圖片內容抽離出來，另存到 IMAGES_COLLECTION，
// 主要題目資料裡只留下一個輕量標記，讓題目清單載入時不用一併下載所有圖片。
async function offloadEntryImage(entry){
  if(entry.questionImage && entry.questionImage !== LAZY_IMAGE_MARKER && entry.questionImage.indexOf('data:image') === 0){
    await firestoreSaveImage(entry.id, entry.questionImage);
    imageCache[entry.id] = entry.questionImage;
    entry.questionImage = LAZY_IMAGE_MARKER;
    entry.hasQuestionImage = true;
  }
}

async function firestoreLoadAllEntries(){
  await firestorePersistenceReady;
  // 優先向伺服器要最新資料，確保畫面顯示的一定是雲端資料庫目前的真實內容；
  // 只有在真的連不上伺服器（例如離線）時，才退回使用本機快取資料，避免顯示過期的舊快照。
  try{
    const snapshot = await db.collection(ENTRIES_COLLECTION).get({ source: 'server' });
    const list = [];
    snapshot.forEach(docSnap => { list.push({ id: docSnap.id, ...docSnap.data() }); });
    return list;
  }catch(serverErr){
    try{
      const cacheSnap = await db.collection(ENTRIES_COLLECTION).get({ source: 'cache' });
      const list = [];
      cacheSnap.forEach(docSnap => { list.push({ id: docSnap.id, ...docSnap.data() }); });
      return list;
    }catch(cacheErr){
      throw serverErr;
    }
  }
}

async function firestoreGetImportedBatches(){
  const docSnap = await db.collection(META_COLLECTION).doc('importedBatches').get();
  return docSnap.exists ? (docSnap.data().list || []) : [];
}

async function firestoreSetImportedBatches(list){
  await db.collection(META_COLLECTION).doc('importedBatches').set({ list });
}

async function firestoreSaveEntry(entry){
  await offloadEntryImage(entry);
  const data = {}; for(const k in entry){ if(k !== 'id') data[k] = entry[k]; }
  await db.collection(ENTRIES_COLLECTION).doc(entry.id).set(data, { merge: true });
}

async function firestoreBatchWriteEntries(entriesArray){
  for(const entry of entriesArray){ await offloadEntryImage(entry); }
  for(let i=0;i<entriesArray.length;i+=450){
    const chunk = entriesArray.slice(i, i+450);
    const batch = db.batch();
    chunk.forEach(entry=>{
      const data = {}; for(const k in entry){ if(k !== 'id') data[k] = entry[k]; }
      const ref = db.collection(ENTRIES_COLLECTION).doc(entry.id);
      batch.set(ref, data, { merge: true });
    });
    await batch.commit();
  }
}

// 離線／獨立瀏覽器備援機制：若不在 Claude 環境內（沒有 window.storage），
// 則自動改用瀏覽器內建的 localStorage，讓本檔案下載後可離線單獨開啟使用。
if(!window.storage){
  window.__storageMode = 'local';
  window.storage = {
    async get(key, shared){
      const k = 'exam-archive-local::' + (shared ? 'shared::' : '') + key;
      const v = localStorage.getItem(k);
      if(v === null){ throw new Error('Key not found'); }
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared){
      const k = 'exam-archive-local::' + (shared ? 'shared::' : '') + key;
      localStorage.setItem(k, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      const k = 'exam-archive-local::' + (shared ? 'shared::' : '') + key;
      localStorage.removeItem(k);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('exam-archive-local::')) keys.push(k);
      }
      return { keys, prefix, shared: !!shared };
    }
  };
}else{
  window.__storageMode = 'claude';
}

const GEMINI_PATCH_103_ERGA_OMNES = "erga omnes（普遍管轄義務／對一切人的義務）概念是國際法由傳統「雙邊對等關係」邁向「國際社會整體利益」的核心轉捩點。以下就題旨兩大問題進行剖析：\n\n## （一）何以erga omnes的發展與國際法上國家責任制度有關？\n\n傳統國際法上的國家責任制度（State Responsibility）主要建立在雙邊對等關係的基礎上。換言之，只有直接遭受受害的國家（Injured State），才有資格主張國家責任並提出求償或採取反制措施。\n\n然而，1970年國際法院（ICJ）在「巴塞隆納牽引力案」（Barcelona Traction Case）中，劃時代地區分了兩類國家義務：\n\n1. 對特定國家的雙邊義務：僅直接受害國得主張責任。\n2. 對整體國際社會的義務（Obligations erga omnes）：鑑於其保護之價值極為重要，所有國家在法律上皆被視為具有合法利益（Legal interest），因此任何國家皆得主張責任。\n\n### 對國家責任制度的重大變革\n\n1. 突破「受害國」主張責任的限制：在涉及嚴重違反人類整體利益（如禁止侵略、禁止種族滅絕、保護基本人權）時，即使某國未直接受害，亦可基於erga omnes義務主張違約國承擔法律責任。\n\n2. 重塑聯合國國際法委員會（ILC）《國家責任條文草案》：該概念直接促成了2001年《國家責任條文草案》（Draft Articles on Responsibility of States for Internationally Wrongful Acts）第48條的制定。根據第48條，非直接受害國（States other than an injured State）在被告國違反erga omnes義務時，得請求被告國：停止不當行為並提供不重複發生的保證；履行對受害國或受益人的損害賠償義務。\n\n## （二）erga omnes與jus cogens（絕對法／強制規律）本質上有何不同？\n\nerga omnes與jus cogens皆旨在維護國際社會的共同價值與秩序，且在實體內容上高度重疊（例如：禁止侵略、禁止酷刑、禁止種族滅絕），但兩者在法理本質、關注焦點與功能適用上有根本差異：\n\n比較維度：概念核心\n- Jus Cogens：規範的位階與效力（Substantive Status/Normative Hierarchy）\n- Erga Omnes：義務的履行對象與救濟資格（Enforcement & Standing）\n\n比較維度：核心問題\n- Jus Cogens：「這條法律規範是否不許以條約任意偏離或締結相反約定？」\n- Erga Omnes：「當此義務被違反時，誰有資格向違約國主張責任？」\n\n比較維度：法律效果\n- Jus Cogens：1. 違反jus cogens的條約無效（《維也納條約法公約》第53條）。2. 產生新jus cogens時，現存抵觸條約失效（第64條）。\n- Erga Omnes：任何國家皆有訴訟適格（Locus standi）或主張責任資格，得要求停止違法行為並要求賠償受害者。\n\n比較維度：邏輯關係\n- Jus Cogens：原因／實體源頭：因其規範具有不可動搖的最高位階。\n- Erga Omnes：結果／程序延伸：因其保護利益關乎全人類，故產生對一切人履行的效果。\n\n### 兩者之邏輯關聯與差異總結\n\n關聯性：學者與國際法院常指出一種「邏輯上的必然」——所有的jus cogens規範原則上都會產生erga omnes義務（因為既然該規範是不可偏離的最高價值，其被違反時自然全體國家皆得主張）。\n\n差異性：\n- 方向不同：Jus cogens側重於禁止締約自由的無效性（無效宣告）；Erga omnes側重於程序上的主張資格（Standing / Remedy）。\n- 範圍非完全重合：有些erga omnes義務（例如出於國際習慣法或多邊公約保護共同利益的規範，如公海自由、特定區域環境保護）未必達到jus cogens（不可偏離之絕對法）的嚴格位階，但仍具備對一切人履行的性質（erga omnes partes）。";

const CLAUDE_PATCH_103_Q1 = "一、開羅宣言與波茨坦公告、降伏文書之關連性\n\n（一）開羅宣言的內容\n\n1943年11月，中、美、英三國領袖（蔣中正、羅斯福、邱吉爾）在開羅會議後發表《開羅宣言》，其主要內容包括：\n\n1. 三國對日作戰的目的，在於制止並懲罰日本之侵略。\n2. 三國決不為自身謀求領土擴張，亦無拓展疆土之意思。\n3. 三國之宗旨，在剝奪日本自1914年第一次世界大戰開始後，在太平洋上所奪得或佔領之一切島嶼；並將日本竊取於中國之領土，例如東北四省、臺灣、澎湖群島等，歸還中華民國。\n4. 三國並決定，將使朝鮮於相當時期，獲得自由與獨立。\n5. 三國將堅持進行為獲得日本無條件投降所需之重大而長期之行動。\n\n須注意者，《開羅宣言》在性質上為一項「新聞公報」（communiqué），並非正式簽署之條約，惟其內容仍具有政治宣示及後續被納入其他國際文件而發生法律效果之意義。\n\n（二）與《波茨坦公告》之關連\n\n1945年7月，中、美、英三國（後蘇聯加入對日宣戰後亦加入）發表《波茨坦公告》（Potsdam Declaration），其第8條明文規定：「開羅宣言之條件必將實施，而日本之主權必將限於本州、北海道、九州、四國及吾人所決定其他小島之內。」\n\n由此可知，《波茨坦公告》係以明文方式將《開羅宣言》之內容「納入」（incorporate by reference）並「重申」其效力，使原僅屬政治宣示性質的《開羅宣言》，透過《波茨坦公告》之引用，取得更進一步之國際法律拘束意涵，尤其是有關日本應歸還其自中國竊取之領土（含臺灣、澎湖）之部分。\n\n（三）與日本《降伏文書》之關連\n\n1945年9月2日，日本簽署《降伏文書》（Instrument of Surrender），其中明文承諾接受盟國於《波茨坦公告》所列各項條款。換言之，《降伏文書》構成日本對《波茨坦公告》（進而及於其所納入之《開羅宣言》）內容之正式、單方且具拘束力之承諾與接受，使得原先僅具政治宣示性質的《開羅宣言》，經由《波茨坦公告》之納入，再經由《降伏文書》之承諾接受，形成一個層層銜接、日本以條約性文件形式表示同意接受拘束的完整法律鏈條。\n\n（四）小結\n\n三份文件之關係可簡述為：《開羅宣言》提出戰後處置原則（政治宣示）→《波茨坦公告》正式引用並重申其內容（具條約性質之要約）→《降伏文書》為日本對前述條款之正式承諾接受（承諾）。學說上有認為，此一法律鏈條足以構成日本同意歸還臺灣、澎湖予中華民國之國際法依據；惟亦有論者（如「臺灣地位未定論」之主張者）認為，《舊金山和約》僅規定日本放棄對臺灣、澎湖之一切權利，並未明文將其歸屬指定予中華民國，故臺灣之最終法律地位，仍有爭議空間。此一問題涉及條約解釋、嗣後國家實踐及對日和約體系之整體理解，為國際法與國際政治交錯之重要爭議領域。";
const CLAUDE_PATCH_103_Q2 = "二、關於條約的錯誤\n\n（一）1969年《維也納條約法公約》第48條有關「錯誤」之規定\n\n《維也納條約法公約》（VCLT）第48條規範「錯誤」（Error/Mistake）作為條約得撤銷（invalidate）之事由，其要件與內容大致如下：\n\n1. 錯誤須涉及「事實」或「情況」（fact or situation）：締約國得主張撤銷其同意受條約拘束之意思表示，如該錯誤係關於該國於締約時假設為存在，且構成其同意受條約拘束之必要基礎（essential basis）之事實或情況。\n\n2. 排除法律錯誤：第48條第1項原則上僅適用於「事實錯誤」，而非「法律錯誤」（error of law），蓋條約本身即為法律文件，締約國本應審慎審視其法律效果。\n\n3. 可歸責性之排除（第48條第2項）：若該國以其自身行為導致此一錯誤，或依當時情況該國應可預見此項錯誤之可能性，則不得主張錯誤而撤銷條約，此乃基於「自己行為不得置辯」（estoppel-like）之法理，防止締約國以自身過失卸免其條約義務。\n\n4. 錯誤僅涉及條約用語（wording）：依第48條第3項，若錯誤僅涉及條約之文字用語，並不影響其實質同意之基礎，則不適用第48條，而應依第79條「更正條約本文或正式抄本之錯誤」處理。\n\n（二）1962年國際法院「隆端古寺案」（柏威夏寺案）之見解\n\n在Case Concerning the Temple of Preah Vihear（Cambodia v. Thailand）實質判決中，泰國主張其於1908年至1909年間，接受法國（代表柬埔寨）所提出之邊界地圖時，係基於錯誤，因該地圖所繪之分水嶺界線與實際地理分水嶺不符，泰國因而誤信隆端古寺位於柬埔寨境內。\n\n國際法院最終駁回泰國此一錯誤主張，其主要理由包括：\n\n1. 泰國官員長期以來已知悉或應已發現地圖上之錯誤：法院指出，泰國之相關官員早於數十年前即有機會發現地圖界線與分水嶺不符之處，且泰國政府從未在合理期間內就此提出異議或保留，反而長期以行為（如接受、使用該地圖並未提出抗議）默示接受該地圖所繪之邊界。\n\n2. 禁反言原則（Estoppel）之適用：法院認為，泰國之默示接受及其後續一貫之行為表示（包括未於適當時機提出異議），已構成對柬埔寨（及其後之法國）之禁反言效果，泰國不得事後翻異其詞而主張錯誤。\n\n3. 錯誤主張須以締約當時實際受該錯誤影響為前提：法院並強調，即便地圖確有繪製上之技術性錯誤，惟若該國之同意並非「因該錯誤而形成」（即並非該錯誤構成其同意之必要基礎），亦難以據此主張條約或協議無效。\n\n此判決確立了後續VCLT第48條第2項「可歸責性排除」及禁反言限制錯誤主張之重要先例基礎，亦即：締約國若明知或可得而知有錯誤情事，卻仍長期以行為默示接受，將喪失事後主張錯誤而撤銷相關協議或安排之權利。";
const CLAUDE_PATCH_103_Q3 = "三、巴塞隆納牽引力案與erga omnes義務\n\n（一）本案背景與erga omnes概念之提出\n\n在Barcelona Traction, Light and Power Company, Limited案（Belgium v. Spain, 1970）中，國際法院雖然最終以比利時欠缺求償適格（股東之國籍與公司之國籍不同）為由駁回比利時之訴，但法院於判決理由中提出了一段極具影響力的附帶意見（obiter dictum），區分了國家對外承擔義務之兩種性質：\n\n1. 國家對其他特定國家所負之雙邊義務（bilateral obligations）：此類義務僅該特定受害國得主張責任，例如基於雙邊條約或外交保護關係所生之義務。\n\n2. 國家對「整體國際社會」所負之義務（obligations erga omnes）：法院指出，鑑於此類義務所涉利益之根本重要性，「所有國家均可認為在其獲得保護方面具有法律利益」（all States can be held to have a legal interest in their protection），法院並舉例：禁止侵略行為、禁止種族滅絕，以及源於基本人權保護（包括禁止奴隸及種族歧視）之相關原則與規則。\n\n（二）與國家責任制度之關聯\n\n此一區分對傳統國家責任制度造成重大衝擊，原因在於：\n\n1. 傳統上，國家責任之追訴資格（locus standi）僅限於「直接受害國」，此為雙邊互惠關係下之當然結果；惟erga omnes義務之提出，使得縱非直接受害之國家，亦得因該義務所保護利益具有普世重要性，而主張具有法律利益、進而得追究違反國之責任。\n\n2. 此一發展後續反映於2001年國際法委員會（ILC）通過之《國家責任條文草案》第48條，該條明文規定，非直接受害國於特定情形下（包括該義務係對整體國際社會所負者），亦得對違反國主張責任，得請求其停止不法行為、提供不重複保證，並得為受害國或受益人之利益要求履行賠償義務，此可謂erga omnes概念自司法先例走向成文條文化之具體展現。\n\n（三）與jus cogens之本質差異\n\nerga omnes（對世義務／普遍性義務）與jus cogens（絕對法／強制規律）雖常被相提並論，且在具體規範內容上高度重疊（如禁止侵略、種族滅絕、酷刑等重大國際不法行為，往往同時具備此兩種性質），惟兩者在法理層次上分屬不同範疇，不應混為一談：\n\n1. 規範層次不同：Jus cogens（VCLT第53條）係關於「規範位階」之概念，指某些國際法規範具有最高強制效力，任何國家不得以條約方式加以偏離，違反者條約當然無效；而erga omnes則係關於「義務對象與主張適格」之概念，指某義務之履行對象及於全體國際社會，任何國家均得就其違反主張責任，兩者關注焦點分別在於「規範能否被合意排除」與「誰有資格主張違反責任」。\n\n2. 法律效果不同：Jus cogens之效果展現於條約法領域，主要為使牴觸之條約無效（VCLT第53條、第64條）；erga omnes之效果則展現於國家責任法領域，使非直接受害國取得程序上之訴訟適格或求償資格。\n\n3. 範圍未必完全重合：學說上一般認為，凡屬jus cogens之規範，通常亦會產生erga omnes之效果（因其保護價值之重要性使然）；但反之未必成立，亦即並非所有erga omnes義務均已提升至jus cogens不可克減之強制規律位階，例如部分僅在特定多邊條約締約國間所生之「erga omnes partes」義務（對條約全體締約國之義務），其重要性雖高，未必已達到jus cogens不可以任何方式偏離之最高強行法位階。\n\n簡言之，jus cogens聚焦於「規範本身在法秩序中的位階與不可偏離性」，erga omnes則聚焦於「義務違反後由誰取得追究資格」，二者概念層次不同，但因均源自對維護國際社會根本共同利益之重視，在實務案例中常有重疊而彼此呼應。";
const CLAUDE_PATCH_103_Q4 = "四、政府繼承之「國家繼續原則」與國際索償之「國籍繼續規則」\n\n（一）「國家繼續原則」（Principle of State Continuity）——政府繼承脈絡\n\n在政府繼承（Succession of Governments）之討論中，須先區辨「國家繼承」（State Succession，涉及國際法人格主體之更迭，例如領土主權移轉、國家分裂、合併）與「政府繼承」（Succession of Governments，僅涉及一國內部政權更迭，而國家之國際法人格並未消滅）。\n\n「國家繼續原則」係指：只要「國家」本身之法律人格未曾中斷或消滅（即使其政府經由革命、政變、內戰等非正常憲政程序更迭），該國作為國際法主體之同一性（identity）及延續性（continuity），並不因政府更替而受影響。具體內涵包括：\n\n1. 條約義務之延續：新政府原則上應承受舊政府所締結條約之權利義務，蓋條約係國家對外承擔之義務，而非特定政府之個人承諾（此與「政府承認」是否影響條約履行的實務爭議略有不同，但條約義務之國家延續性原則仍為通說）。\n\n2. 國家責任之延續：新政府對於前政府任內國家所生之國際不法行為，原則上仍應負國家責任，不因政權更迭而免責，此即所謂「國家責任不因政府更迭而中斷」之原則。\n\n3. 國家財產與債務之延續：國家對外之公債、國有財產等權利義務關係，原則上亦隨國家之延續而由新政府概括承受。\n\n此一原則之理論基礎在於：國際法上國家責任與權利義務之主體為「國家」而非特定「政府」，政府僅為國家對外行使主權之代理機關，其更迭並不改變國家作為法律主體之同一性，此有助於維護國際法律關係之穩定性與可預測性，避免國家藉由政權更迭而規避既存之國際義務。\n\n（二）「國籍繼續規則」（Continuous Nationality Rule）——外交保護／國際索償脈絡\n\n在外交保護（Diplomatic Protection）與國際索償（International Claims）之領域，「國籍繼續規則」係指：一國為其國民行使外交保護、代其向加害國提起國際求償時，該受害之自然人或法人，原則上須自「受害之時」起，持續具有求償國之國籍，直至「求償正式提出」（或依部分實踐延伸至判決確定）之時為止，中間不得中斷或變更國籍，該項外交保護方為合法、有效。\n\n其主要內涵及理由包括：\n\n1. 「損害發生時」須具備求償國國籍：此為外交保護之基本前提要件之一，蓋外交保護制度之理論基礎，係擬制國家因其國民受害而視為國家自身之權利受侵害（Vattel之擬制理論），故若受害人於受害當時並非該國國民，該國即無「自身」權益受侵害可言。\n\n2. 須持續維持該國籍至求償時：其目的在防止「國籍投機」（nationality shopping），即避免受害人於受害後，為圖利用某一國家較強之外交實力或較有利之求償地位，而刻意變更或取得該國國籍後，再由該國提出求償，此將違反外交保護制度原始擬制受害國家利益之本旨。\n\n3. 例外情形：晚近實踐及2006年國際法委員會（ILC）《外交保護條文草案》第5條亦承認若干例外，例如國籍之變更非出於自願（如國家繼承、婚姻、收養等法定原因所生之非自願國籍變更），或原國籍已不復存在等情形，可能不適用嚴格之國籍繼續要求，以避免因技術性國籍中斷而剝奪受害人受保護之機會。\n\n（三）兩概念之比較\n\n「國家繼續原則」處理的是「國家」作為國際法主體之同一性延續問題，聚焦於國家與其政府更迭間之關係，確保國家對外權利義務不因政府更替而中斷；「國籍繼續規則」則處理「個人（自然人／法人）」與求償國籍之連結延續問題，聚焦於外交保護制度下受害人國籍之持續要件，確保求償國家與受害人間之聯繫具有正當性及一貫性，二者雖然都以「延續性」（continuity）作為核心概念，但適用之主體（國家 vs. 個人）與規範目的（維護國家責任體系之穩定 vs. 防止國籍投機、確保外交保護正當性）截然不同，不宜混淆。";

const CHATGPT_PATCH_103_Q2 = "一、1969年《維也納條約法公約》第48條\n\n《維也納條約法公約》第48條所稱的「錯誤」（error），是指一國締結條約時，對某項既存事實或情況產生錯誤認識，且該錯誤構成其同意受條約拘束的基本依據。此時，該國原則上得主張其同意無效。\n\n（一）得主張錯誤的積極要件\n\n依第48條第1項，必須同時符合下列要件：\n\n1. 錯誤涉及締約時已存在的事實或情況：錯誤必須關於國家締結條約時認為已經存在的「事實或情況」（fact or situation）。例如，國家在劃定邊界時誤認某條河流的位置、誤認某座山脈的分水嶺，或誤用不正確的地圖。因此，第48條所處理的主要是事實錯誤，而非單純對國際法規則、條約法律效果或法律評價的錯誤。\n\n2. 該事實或情況為國家同意受拘束的基本依據：並非任何細微錯誤都足以使條約無效。該錯誤必須構成國家同意受條約拘束的「基本基礎」（essential basis）。換言之，若無該項錯誤，該國原本不會締結條約，或至少不會依相同條件表示同意，始符合此要件。\n\n因此可以將第48條第1項濃縮為：締約時的重大事實錯誤＋該錯誤構成締約同意的基本依據。\n\n（二）不得主張錯誤的消極要件\n\n第48條第2項規定，即使存在重大事實錯誤，在下列兩種情況下，該國仍不得援引錯誤使其締約同意無效：\n\n1. 國家本身的行為造成該錯誤：若錯誤係由主張錯誤的國家自行造成或促成，例如自己提供錯誤資料、自己疏於調查、自己參與製圖或測量卻未檢查成果、因本國機關的重大疏忽而發生錯誤，則該國不得事後以自己造成的錯誤推翻條約。\n\n2. 當時情況已足以使該國注意到可能存在錯誤：若締約時的客觀情況已足以使國家對錯誤有所警覺，國家卻未進一步查證，也不得事後主張錯誤。此即所謂：主張錯誤者不得對明顯可疑的情況視而不見。第48條第2項反映誠信原則及「自己過失不得使自己獲利」的觀念，也維護條約關係的安定性。\n\n（三）文字錯誤不影響條約效力\n\n第48條第3項規定：僅與條約文字措辭有關的錯誤，不影響條約效力，應依《條約法公約》第79條有關條約文本錯誤更正的程序處理。例如條約誤植日期、數字打錯、地名拼寫錯誤、不同語文作準文本間出現技術性誤差。此種情形原則上是「更正條約文本」的問題，而不是使整個締約同意失效的問題。\n\n（四）第48條的法律效果\n\n依第48條文義，一國得援引錯誤，主張其「同意受條約拘束」無效，而不是條約當然、自始、自動無效。因此，錯誤屬於一種相對無效、得撤銷的原因。這與違反國際強行法的條約不同：違反強行法的條約依第53條原則上無效；錯誤則須由受錯誤影響的國家依法提出主張。此外，國家主張錯誤仍須遵守《條約法公約》第65條以下的通知及爭端處理程序，不能單方面任意宣布條約不存在。\n\n二、1962年「隆端古寺案」（柏威夏寺案）之背景\n\n「隆瑞古寺案」通常稱為柏威夏寺案／普里維希爾寺案（Temple of Preah Vihear, Cambodia v. Thailand），爭議涉及位於柬埔寨與泰國邊界的柏威夏寺主權。1904年法國所代表的法屬印度支那與暹羅締結條約，約定在相關地區以分水嶺線作為邊界。其後，法國方面製作了一幅地圖，即訴訟中所稱的「附件一地圖」（Annex I map）；該地圖將寺廟劃在柬埔寨一側。柬埔寨主張泰國長期接受該地圖，因此寺廟位於柬埔寨領土。\n\n泰國則主張：(1) 附件一地圖並非由條約所設混合劃界委員會正式核准；(2) 地圖上的邊界線偏離1904年條約所規定的分水嶺線；(3) 泰國過去之所以未反對，是因為誤以為地圖線符合分水嶺；(4) 因此，泰國對該地圖的接受係基於「錯誤」，不應受其拘束。\n\n三、泰國有關「錯誤」的主張\n\n泰國的核心論點是：泰國政府並不知道附件一地圖所畫的邊界線偏離真正的分水嶺；泰國係因誤認地圖正確，才未提出抗議，因此不能認為泰國已有效接受該地圖。換言之，泰國主張其對附件一地圖的接受，係基於一項重要事實錯誤：泰國以為地圖線符合條約分水嶺；實際上地圖線並未完全依分水嶺繪製；若泰國知道此事，就不會接受該地圖。從條約錯誤理論觀察，泰國試圖主張該錯誤構成其同意的基本依據。\n\n四、國際法院對泰國錯誤主張的見解\n\n國際法院並未接受泰國的主張。法院提出的重要原則是：一方若因自己的行為促成錯誤、原本可以避免錯誤，或當時情況已足以使其注意可能存在錯誤，就不能援引錯誤以否認其同意。此一見解後來反映在《維也納條約法公約》第48條第2項中。\n\n法院的具體理由如下：\n\n（一）泰國有充分機會檢查地圖：附件一地圖製作後，法國方面將其送交暹羅政府。暹羅具有主管機關及技術人員，完全有機會檢查地圖是否符合1904年條約規定的分水嶺線。如果暹羅政府認為地圖錯誤，理應在收到地圖後提出異議，然而暹羅政府並未及時反對。因此，法院認為泰國不能在數十年後再主張自己完全不知道地圖內容。\n\n（二）泰國官員具有專業能力，不得以疏忽為由卸責：泰國曾參與邊界調查與劃界事務，也有熟悉地形及測量工作的官員。因此，即使地圖確實偏離分水嶺，泰國政府若仔細查驗，應可發現問題。泰國未進行必要檢查，屬其自身疏忽，不能成為日後否認地圖效力的理由。這正符合後來第48條第2項的兩項限制：泰國的行為或疏忽促成錯誤；當時情況足以使泰國注意到可能存在錯誤。\n\n（三）泰國長期未抗議，構成默認：法院特別重視泰國長期以來的行為。附件一地圖送達泰國後，泰國政府多年未提出正式抗議；該地圖也曾由泰國政府機關收受、使用及散發。法院因此認為，泰國已透過長期沉默及相關行為，接受該地圖所表示的邊界。此處涉及國際法上的默認（acquiescence）、禁反言（estoppel）、誠信原則（good faith）。雖然法院並未完全以形式化的禁反言要件論證，但其核心觀念是：泰國長期使柬埔寨及法國合理相信其接受地圖，不能事後採取相反立場。\n\n（四）丹隆親王訪問寺廟是重要證據：1930年，暹羅丹隆親王訪問柏威夏寺。當時法國殖民官員以法國國旗及正式儀式迎接他，明顯表現法國將該地區視為法屬印度支那領土。丹隆親王及暹羅政府並未提出抗議，反而接受接待，並留下相關照片。法院認為，若泰國確信寺廟位於泰國領土，面對法國如此公開展示主權，本應立即抗議。泰國的沉默進一步證明其已接受附件一地圖所表示的邊界安排。\n\n（五）地圖線是否完全符合分水嶺已非決定性問題：法院並非單純認定地圖技術上完全正確，而是認為即使附件一地圖原先不是具有獨立拘束力的條約文本，泰國其後仍因接受、使用、未抗議及長期行為，而承認該地圖所表示的邊界。換言之，本案的關鍵並不是「地圖是否精確符合分水嶺」，而是泰國是否已透過嗣後行為接受該地圖。法院最終認定柏威夏寺位於柬埔寨主權之下，並命泰國撤出駐守寺廟或鄰近地區的軍警力量。\n\n五、隆瑞古寺案與第48條的關係\n\n本案判決作成於1962年，早於1969年《維也納條約法公約》，但法院對錯誤所提出的限制，與第48條高度一致：錯誤須涉及締約時存在的事實或情況（泰國主張誤認地圖線符合分水嶺）；錯誤須構成同意的基本依據（泰國主張若知地圖錯誤即不會接受）；自己行為造成或促成錯誤不得援引（泰國長期未查驗、未抗議）；情況足使國家注意可能有錯不得援引（泰國有專業官員、收到地圖且有機會審查）；嗣後確認或默認將削弱錯誤主張（泰國長期使用地圖，丹隆親王訪寺時亦未抗議）。\n\n因此，本案的重要性在於確立：錯誤不是讓國家逃避既有承諾的普遍理由；主張錯誤者必須善意、無過失，且未曾以自身行為接受或確認相關安排。\n\n結論：《維也納條約法公約》第48條允許一國在締結條約時，若對既存事實或情況發生重大錯誤，且該錯誤構成其同意受拘束的基本依據，得主張其締約同意無效。但若該國本身的行為促成錯誤，或當時情況已足以使其注意可能存在錯誤，即不得援引；若僅屬條約文字錯誤，則應依第79條更正，不影響條約效力。在1962年隆瑞古寺案中，泰國主張其因誤信附件一地圖符合1904年條約所定分水嶺，才未反對該地圖。國際法院認為，泰國早已取得地圖，具備檢查能力，卻長期未提出異議，並以收受、使用地圖及對法國公開行使權威保持沉默等行為接受該邊界。因此，即使存在錯誤，亦屬泰國本可避免或應已察覺的錯誤，泰國不得事後援引。此案遂成為《條約法公約》第48條第2項的重要司法先例。\n\n記憶口訣：重大事實錯誤可撤銷；自己造成、應該知道，不得主張；文字誤植，只能更正。";

const WAIJIAO3_CLAUDE_ANSWERS_LOOKUP = [{"year": "114", "prefix": "一、在國際法上，不屬於「國家領", "answer": "一、不屬於「國家領土」的地區\n\n國際法上並非地球表面所有陸地或海域都屬於特定國家主權範圍，主要有以下幾類「非國家領土」（areas beyond national jurisdiction）：\n\n（一）南極（Antarctica）\n依1959年《南極條約》（Antarctic Treaty）第4條，凍結所有既存領土主張，締約國不得提出新主張，南極僅供和平及科學研究用途，非任何國家之領土。\n\n（二）公海（High Seas）\n依《聯合國海洋法公約》第89條，任何國家不得對公海任何部分主張主權；公海對所有國家開放，適用航行、飛越、鋪設海纜管線等自由。\n\n（三）「區域」（the Area，國家管轄範圍以外之海床洋底）\n依公約第136、137條，「區域」及其資源為人類共同繼承財產，任何國家不得主張主權或主權權利，由國際海底管理局代表全人類統一管理。\n\n（四）外太空及天體\n依1967年《外太空條約》（Outer Space Treaty）第2條，外太空、月球及其他天體不得由任何國家以主權主張、使用或占領等方式據為己有。\n\n以上四類均體現國際法上「人類共同繼承財產」或「不得據為己有」原則，其共通特徵為：透過多邊條約凍結或禁止主權主張，改以國際合作或全人類共同利益為管理基礎。"}, {"year": "114", "prefix": "二、2022 年 3 月 2 ", "answer": "二、《聯合國海洋法公約》關於海洋環境污染與維護之規定\n\n（一）一般性義務（第192、194條）\n公約第192條明定各國有保護及保全海洋環境之一般義務；第194條要求各國採取一切必要措施，防止、減少及控制來自任何來源（包括陸地來源、船舶、傾倒、海底活動、大氣層）之海洋環境污染，並不得將損害或污染從一個區域轉移至另一區域，或將一種污染轉變為另一種污染。\n\n（二）分類規範各污染來源（第207條至第212條）\n公約按污染來源分別課予國家立法及執法義務：陸地來源污染（第207條）、國家管轄海底活動污染（第208條）、「區域」內活動污染（第209條）、傾倒污染（第210條）、船舶污染（第211條）及大氣層污染（第212條），要求各國透過國內立法及國際合作（包括經由主管國際組織或外交會議訂定全球性及區域性規則）加以規範。\n\n（三）微塑膠與新興污染物之適用\n微塑膠雖非公約制定時所預見之污染型態，惟依第194條「任何來源」之廣泛用語及晚近國家實踐（如2022年聯合國環境大會第5屆決議），微塑膠污染應可涵蓋於「海洋環境污染」之定義內，屬各國依公約負有防制義務之對象。\n\n（四）環境影響評估義務（第206條）\n凡進行可能對海洋環境造成重大污染或重大有害變化之活動前，應盡可能就活動可能影響進行評估，並將評估結果公布。\n\n（五）跨界特性與國際合作（第123條、第197條）\n海洋污染具跨境流動特性，公約第197條要求各國在全球性基礎上，並於適當情形在區域性基礎上，直接或透過主管國際組織進行合作，以擬訂並訂立國際規則、標準及建議辦法。"}, {"year": "114", "prefix": "三、國際法院如何定位和應用海洋", "answer": "三、國際法院海洋劃界方法論之定位與應用\n\n（一）方法論演進：由「等距離／特殊情況」走向「三階段法」\n國際法院早期（如1969年北海大陸礁層案）強調「公平原則」（equitable principles），拒絕將等距離線視為習慣法上唯一劃界方法。其後於2009年羅馬尼亞訴烏克蘭「黑海劃界案」中，國際法院確立了現行普遍適用之「三階段劃界法」：\n\n1. 第一階段：先劃設暫時等距離線（provisional equidistance line），以相關海岸上最適當之基點連接構成。\n\n2. 第二階段：檢視是否存在「相關情況」（relevant circumstances），如海岸線形狀特殊、島嶼存在、海岸線長度顯著不成比例等，據以調整暫時等距離線之位置，以達成公平解決（equitable solution）。\n\n3. 第三階段：進行「比例性檢驗」（disproportionality test），比較調整後界線劃分之海域面積與雙方相關海岸線長度之比例，確認結果並無顯著不成比例之情形，以驗證劃界結果之公平性。\n\n（二）舉例說明\n1. 北海大陸礁層案（1969）：確立公平原則為劃界之目標，惟尚未發展出標準化之三階段方法。\n\n2. 黑海劃界案（Romania v. Ukraine, 2009）：首次完整闡述三階段法，成為其後劃界案件之標準模板。\n\n3. 尼加拉瓜訴哥倫比亞案（2012）：適用三階段法處理島嶼與大陸海岸相向劃界，並就島嶼是否給予全部效力（full effect）或減弱效力（enclave）進行裁量。\n\n4. 加納/象牙海岸海洋劃界案（ITLOS特別分庭，2017）：延續並確認三階段法之普遍適用性，並強調單一劃界線（single maritime boundary）處理領海以外多重海域重疊之實務作法。\n\n（三）小結\n國際法院之方法論已由早期高度個案化、著重公平原則之裁量，發展為具高度可預測性、結構化之三階段法，兼顧法律安定性與個案公平調整之彈性，現已成為國際海洋法劃界爭端解決之主導方法論。"}, {"year": "113", "prefix": "一、依據 1982 年《聯合國", "answer": "一、公海海盜行為之定義與扣押權力及其限制\n\n（一）海盜行為之定義（UNCLOS第101條）\n依《聯合國海洋法公約》第101條，海盜行為係指：\n1. 私人船舶或私人航空器之船員、機組人員或乘客，為私人目的（for private ends），對公海上另一船舶或航空器，或其上人員、財物實施之任何非法暴力、扣留或掠奪行為；或對國家管轄範圍以外之地方（如公海、無主地）之船舶、人員財物實施上述行為。\n2. 明知船舶或航空器成為海盜船舶或飛機之事實而自願參加其活動之任何行為。\n3. 教唆或故意便利上述行為之任何行為。\n\n其核心要件包括：（1）須為私人船舶／航空器所為，排除軍艦、政府船舶執行公務之行為（惟第102條規定軍艦叛變後亦可構成）；（2）須為「私人目的」，排除政治動機之行為（此點學說上有爭議，如環保團體之激烈抗爭行為是否構成海盜行為）；（3）須涉及「兩船原則」（two-vessel requirement），即須有加害船舶對另一船舶或其人員財物實施行為，單一船舶內部之叛變或劫持較難單獨構成海盜行為；（4）行為地須在公海或任何國家管轄範圍以外之地方。\n\n（二）締約國之扣押權力（第105條）\n任何國家均得在公海上，或在任何國家管轄範圍以外之其他地方，扣押海盜船舶或航空器，或扣押由海盜行為劫持之船舶或航空器，並逮捕船上人員、扣押財物。此為海盜罪之普遍管轄權（universal jurisdiction）之明文化，任何國家均得追訴海盜，不以本國國籍、被害國籍或行為地與該國有連結為前提。\n\n（三）扣押權之限制\n1. 執行主體限制（第107條）：僅軍艦、軍用飛機，或經授權並有明顯標誌可識別之為政府服務之其他船舶或飛機，始得執行海盜扣押。\n2. 地域限制：扣押行為原則上限於公海或國家管轄範圍以外之地方，若海盜船逃入他國領海，扣押國原則上不得逕行追入他國領海進行扣押（涉及沿海國主權），須經沿海國同意或由沿海國自行處理。\n3. 惡意扣押之賠償責任（第106條）：若無充分理由而扣押涉嫌海盜之船舶或航空器，扣押國應對船旗國因此所受之任何損失或損害負賠償責任。\n4. 審判管轄之限制：扣押國之法院有權判定應處之刑罰，並得裁決對船舶、航空器或財產（善意第三人權利除外）應採之行動，惟其他方面之管轄權仍受一定限制，不能藉此擴張至海盜罪以外之其他犯罪。"}, {"year": "113", "prefix": "二、世界貿易組織（World ", "answer": "二、WTO爭端解決機制之爭議與MPIA之目的與程序\n\n（一）WTO爭端解決機制引發之爭議\n\n1. 上訴機構法官任命遭杯葛：美國自2017年起持續阻擋上訴機構（Appellate Body）法官之遴選程序，理由包括批評上訴機構逾越其審查範圍（如處理不必要之法律爭點、對既有裁決給予過度先例效力）、審理期限逾越DSU規定之90天上限，以及對成員國主權及國內政策空間造成侵蝕等，導致上訴機構自2019年12月起法官人數不足法定最低3人，實質陷入停擺。\n\n2. 「上訴至虛無」（appeal into the void）之策略性運用：因上訴機構停擺，敗訴方得對小組報告提起上訴，但因無法組成上訴庭審理，該案將無限期懸而未決，形同架空整體爭端解決機制之拘束力與可執行性。\n\n3. 爭端解決機制之正當性與司法造法之爭議：部分成員國質疑上訴機構透過解釋逐漸擴張其職權範圍，形同「司法造法」（judicial activism），與WTO作為會員驅動（member-driven）組織之定位產生緊張關係。\n\n（二）MPIA之目的\n\nMPIA（多方臨時上訴仲裁協議）之目的在於，於上訴機構停擺期間，為參與之會員國提供一套具有實質上訴審查功能之替代機制，維持二審終審制之爭端解決功能，避免爭端解決機制因上訴機構停擺而完全失去拘束力與可預測性，同時作為過渡性安排，待上訴機構恢復運作後即可終止適用。\n\n（三）MPIA之程序\n\n1. 法律依據：MPIA援引DSU第25條之仲裁機制作為法律基礎，將原本上訴機構之審查改由仲裁程序取代。\n2. 仲裁員組成：由參與MPIA之會員國自願組成之仲裁員庫（pool of 10名仲裁員）中，就個案選任3名仲裁員組成仲裁庭，其組成與運作方式高度模擬原上訴機構之三人小組運作模式。\n3. 審查範圍與標準：仲裁程序之審查範圍與標準比照原上訴機構之審查（僅限於法律問題及小組所為之法律解釋），並維持原上訴機構之審理期限規範。\n4. 適用對象：僅適用於參與MPIA之會員國之間所生爭端；未參與之會員國（如美國）之爭端仍面臨上訴機構停擺之風險，無法透過MPIA尋求救濟。\n5. 過渡性質：MPIA明定於上訴機構恢復正常運作後即失去適用必要，性質上屬臨時、補充性之安排，而非取代WTO上訴機構本身。"}, {"year": "113", "prefix": "三、國際法上的管轄權（juri", "answer": "三、國家域外管轄及其保護之利益與國際法衝突\n\n（一）域外管轄之意涵\n域外管轄（extraterritorial jurisdiction）係指一國將其國內法規範，適用於發生在其領土範圍以外之人、事、物或行為，涵蓋立法管轄權（jurisdiction to prescribe）、執行管轄權（jurisdiction to enforce）及審判管轄權（jurisdiction to adjudicate）三個層次，其中域外管轄爭議多集中於立法管轄權之域外延伸，至於執行管轄權原則上仍受屬地原則嚴格限制，不得未經他國同意逕自在他國領域內執行公權力行為。\n\n（二）域外管轄之傳統理論基礎\n1. 屬地原則（territoriality）：包含主觀屬地原則（行為開始於本國）與客觀屬地原則（行為結果發生於本國，即「效果原則」effects doctrine）。\n2. 屬人原則（nationality/active personality）：本於行為人具本國國籍而行使管轄。\n3. 保護原則（protective principle）：對危害本國國家安全、政府職能或重大利益之域外行為主張管轄，即使行為人非本國國民。\n4. 消極屬人原則（passive personality）：以被害人具本國國籍為連結因素。\n5. 普遍管轄原則（universality）：對海盜、種族滅絕、戰爭罪等國際法上關注全人類利益之重大罪行，任何國家均得管轄，不問行為地、國籍等傳統連結因素。\n\n（三）域外管轄所保護之利益\n域外管轄之發動，通常旨在保護：本國市場競爭秩序（如反托拉斯法域外適用）、本國金融及證券市場穩定（如美國證券法域外效力）、國家安全及外交政策目標（如美國出口管制及次級制裁）、以及全人類共同關注之基本價值（如反貪腐、反洗錢、人權保障相關立法之域外適用）。\n\n（四）舉例及與國際法之衝突\n\n1. 美國反托拉斯法之域外適用：如美國「Hartford Fire Insurance v. California」案援引效果原則，對外國企業於境外從事、但對美國市場產生實質影響之反競爭行為主張管轄，引發歐盟等貿易夥伴之強烈抗議，認為過度擴張管轄權侵害他國之屬地管轄權及經濟主權。\n\n2. 美國域外次級制裁（secondary sanctions）：如對伊朗、俄羅斯之制裁，要求第三國企業亦不得與受制裁對象進行交易，否則將面臨美國之處罰，此舉實質上將美國國內政策強加於他國企業與市場，引發他國以「阻斷法」（blocking statutes，如歐盟阻斷法規）予以反制。\n\n3. 歐盟《一般資料保護規則》（GDPR）之域外效力：對於處理歐盟境內居民個資之境外企業課予合規義務，亦具有域外管轄之性質，惟因保護個人資料隱私之目的較具普遍正當性，爭議相對較小。\n\n（五）與國際法之衝突及調和\n過度擴張之域外管轄可能牴觸國際法上之不干涉原則、國家主權平等原則，並與他國之屬地管轄權發生管轄權競合甚至衝突，導致國際禮讓（international comity）原則、合理性原則（reasonableness test，如美國法律整編之「重大利益衡量」）及雙邊或多邊協調機制（如反托拉斯合作協定）成為緩解域外管轄衝突之重要途徑。"}, {"year": "112", "prefix": "一、依據 1982 年《聯合國", "answer": "一、軍艦在公海、他國專屬經濟海域及他國領海之航行權利\n\n（一）公海（High Seas）\n依UNCLOS第87條，公海航行自由為公海自由之核心內容，軍艦與其他船舶同享完全之航行自由，不受任何國家管轄（惟受船旗國專屬管轄，第92條），亦得從事第87條所列之飛越、鋪設海纜管線、建造人工島嶼與設施、捕魚、科學研究等自由，僅須顧及其他國家行使公海自由之利益（適當顧及原則，due regard）。\n\n（二）他國專屬經濟海域（EEZ）\n依第58條，其他國家（包括軍艦）在專屬經濟海域內享有第87條所定之航行及飛越自由，以及與此有關之公海其他合法用途之自由（如與船舶、飛機營運相關之海洋科學活動），但須顧及沿海國之權利及義務，並遵守沿海國依公約規定制訂之與本部分不牴觸之法律規章。軍艦在專屬經濟海域內進行軍事測量、偵察或演習等活動之合法性存有爭議，中國、部分開發中國家主張此類活動須經沿海國同意，美國等海洋強權則主張此屬於航行自由之當然內容，此為當前國際海洋法實踐上重大爭點之一。\n\n（三）他國領海（Territorial Sea）\n依第17條至第32條，包括軍艦在內之所有船舶享有無害通過權（right of innocent passage），惟通過須「無害」（innocent），即不得損害沿海國之和平、良好秩序或安全（第19條），且須連續不停迅速進行（第18條）。針對軍艦是否須事先通知或取得沿海國許可，公約本身並無明文要求，惟部分國家（如中國、南韓、若干拉丁美洲國家）國內法要求外國軍艦通過領海前應事先通知或取得許可，此等國內法要求是否符合公約，學說及國家實踐上仍有分歧；多數海洋強權及西方學說認為，公約未設此等前提要件，故此類國內法要求逾越公約規範。此外，依第30條，軍艦如不遵守沿海國關於通過領海之法律規章，經沿海國要求仍不遵行者，沿海國得要求該軍艦立即離開領海。"}, {"year": "112", "prefix": "二、A 國國家研究單位擁有的無", "answer": "二、A國科學探測氣球遭B國擊落事件之國際法分析\n\n（一）防空識別區（ADIZ）之國際法地位\n防空識別區並非國際法上明文承認之法律概念，亦非《國際民用航空公約》（芝加哥公約）或UNCLOS所規範之領域，而係沿海國基於國家安全考量單方面劃設之空域識別及預警機制，其效力原則上僅及於要求進入該區之航空器配合識別、通報等程序性義務，並不當然賦予劃設國得對進入該區（尤其是公海或他國專屬經濟海域上空）之外國航空器逕行使用武力之權利。惟若科學探測氣球已進入B國領空（即領土及領海上空），則其法律地位即轉變為主權空域內之外國航空器，適用不同規範。\n\n（二）領空主權與外國航空器之通過\n依芝加哥公約及國際習慣法，一國對其領空享有完全且排他之主權（complete and exclusive sovereignty），外國民用航空器未經許可進入他國領空原則上構成對該國領空主權之侵犯，惟此並不當然意味沿海國得逕以武力擊落之，蓋《芝加哥公約》第3條之2（因1983年大韓航空007號班機事件而增訂）明文規定，各締約國承認每一國家對飛越其領土上空之民用航空器行使武力必須加以節制，並於攔截時不得危及機上人員生命安全及航空器安全；如遇違反公約之民用航空器，得要求其降落於指定機場，但不得對其使用武器。\n\n（三）本案分析\n1. 若氣球係屬「無人」科學探測氣球（非載人航空器），芝加哥公約第3條之2有關保障機上人員生命安全之規定固不直接適用（因無機上人員），惟該條所反映之「使用武力應加以節制」之一般法理，仍應作為評價B國行為合法性之重要參考基準。\n2. B國若僅因氣球進入其防空識別區（尚未進入領空）即逕以飛彈擊落，若擊落地點仍在公海或B國領空以外，其正當性顯有疑義，蓋防空識別區本身不賦予使用武力之權利。\n3. 若氣球確已進入B國領空，B國依國家主權原則固得採取必要之因應措施（如攔截、要求降落、聯繫溝通等），惟逕行以飛彈擊落而未先窮盡其他較低度之因應手段（如攔截機接近識別、警告等），且其後果導致擊落物墜毀致平民傷亡，其武力使用之必要性與比例性亦有可議之處，可能構成國家責任之基礎。\n4. A國就其科學研究目的之主張，若經證實非軍事偵察用途，亦為評價B國反應是否過度、是否符合必要性與比例原則之重要事實因素。\n5. B國就其擊落行為所生之人員傷亡及財產損害（即使非直接故意造成），仍可能須負國家責任，惟若能證明其行為係出於合理自衛且符合必要比例，則可能阻卻或減輕其責任；此涉及具體事實之進一步認定。"}, {"year": "111", "prefix": "一、A 國與 B 國為領土相鄰", "answer": "一、特別軍事行動占領行為與無差別轟炸之國際法分析\n\n（一）「特別軍事行動」是否構成領土取得\n\n依現行國際法，武力征服（conquest）已非合法之領土取得方式。《聯合國憲章》第2條第4項禁止使用武力侵害他國領土完整；而「不承認主義」（史汀生主義，Stimson Doctrine）及「不法行為不產生權利」（ex injuria jus non oritur）原則，均否定以武力兼併他國領土之效力。縱使A國實質控制並行使管轄權，依聯合國大會第2625號決議（友好關係宣言）及國際法院晚近實踐（如對克里米亞、頓巴斯等地區併吞行為之國際普遍不承認），此類單方面武力占領及兼併，在國際法上不生領土主權移轉之效果，國際社會（包括聯合國大會）通常會透過不承認決議加以否定其法律效力。\n\n（二）B國「無差別地毯式轟炸」能否主張自衛權\n\n1. 自衛權之要件（憲章第51條）：須有「武力攻擊」（armed attack）之發生，自衛行為須符合必要性（necessity）與比例性（proportionality）兩大習慣法要件（Caroline原則）。\n2. B國固然因A國之侵略行為受武力攻擊，原則上享有自衛權，惟其行使方式──「無差別地毯式轟炸」（indiscriminate carpet bombing）──明顯違反國際人道法上之「區別原則」（principle of distinction，要求區分戰鬥人員與平民、軍事目標與民用目標）及「比例原則」（禁止對預期軍事利益顯不成比例之平民傷亡）。\n3. 因此，即便B國自衛權之發動具有正當性基礎，其execution方式若構成無差別攻擊，仍可能違反國際人道法（如1977年日內瓦公約第一附加議定書相關規範），且可能逾越自衛權必要性與比例性之界限，而使該自衛主張之正當性大打折扣，甚至該等轟炸行為本身可能獨立構成國際不法行為（如戰爭罪），不因整體自衛權主張而當然阻卻違法。"}, {"year": "111", "prefix": "二、A 國與 B 國原簽訂有自", "answer": "二、A、B兩國斷交後自由貿易協定之效力\n\n（一）條約效力與國家承認、外交關係之區辨\n依《維也納條約法公約》，條約之效力繫諸締約國之國家同意及條約本身之規定，與兩國是否維持外交關係原則上屬不同層次之問題。斷絕外交關係（斷交）並非法定之條約終止或停止履行事由，公約第63條明文規定：「除條約之適用有賴外交或領事關係之存在外，兩國斷絕外交或領事關係，並不影響兩國間現行條約所確定之法律關係。」\n\n（二）本案分析\n1. A、B兩國之自由貿易協定，其性質為經貿性質之條約，其履行原則上不需仰賴外交或領事關係之存續（即非「有賴外交關係存在」之條約類型，此類條約多為使領館運作、外交特權相關之條約），故依第63條，斷交本身並不當然導致該協定失效或終止。\n2. 該協定已完成國內批准程序並經換文生效，屬合法有效成立之條約，其效力應持續至依條約本身規定或依公約所定之終止、停止或退出事由（如第54條合意終止、第56條退出、第60條重大違約、第62條情勢變遷等）發生為止。\n3据此，除非協定本身訂有因斷交而自動終止之條款，或雙方另行合意終止，或存在其他法定終止事由，否則A、B斷交本身尚不足以使該自由貿易協定當然失效，該協定原則上仍應繼續有效，兩國仍受其拘束。\n4. 惟若協定之履行實質上需仰賴雙方使領館之運作（例如原產地證明之簽發、貿易爭端之外交協商機制等特定履行方式），則此部分履行機制可能因斷交而實務上受阻，但此屬「履行障礙」問題，與條約「效力」本身仍應加以區辨。"}, {"year": "110", "prefix": "一、A 國和 B 國是《維也納", "answer": "一、維也納外交關係公約相關問題\n\n（一）X大使可否自行拋棄豁免\n依《維也納外交關係公約》第32條第1項，外交特權與豁免係屬「派遣國」之權利，而非外交人員個人之權利，故拋棄豁免之權利專屬於派遣國（A國），須由A國明示拋棄，外交官本人無權自行拋棄其管轄豁免。此一設計係為確保外交關係之穩定與外交人員執行職務之獨立性，避免外交人員個人任意拋棄豁免而使接受國藉此干預外交事務。\n\n（二）「不受歡迎人員」（persona non grata）之相關規定\n依公約第9條，接受國得於任何時候，不必說明理由，通知派遣國宣告其使館任何人員為不受歡迎人員（persona non grata）或使館任何其他職員為不能接受（not acceptable）。經此宣告後，派遣國應於合理期間內召回該人員或終止其於使館之職務；倘派遣國拒絕或不在合理期間內履行此項義務，接受國得拒絕承認該人員為使館人員（即拒絕繼續承認其外交身分及相應特權豁免）。此一制度賦予接受國單方面之裁量權，作為對外交人員行為不當（如本案之刑事犯罪行為）之制衡機制，惟B國於行使該權利前，通常仍應循外交慣例先向A國提出交涉或抗議。\n\n（三）A國可否拒絕Y擔任駐A國大使，且不給予理由\n依公約第4條，派遣國應查明擬派遣為駐該國使館館長之人選，已獲得接受國之同意（agrément）。接受國無須說明拒絕同意之理由（第4條第2項）。故A國得逕行拒絕Y擔任B國駐A國大使之人選，且依公約明文規定，無須向B國說明拒絕之理由，此屬接受國基於國家主權所享有之裁量權。"}, {"year": "110", "prefix": "二、請依據《聯合國憲章》回答下", "answer": "二、聯合國憲章相關問題\n\n（一）新會員入會案：大會與安理會投票方式之差異\n依《聯合國憲章》第4條，新會員入會須經大會依安理會之推薦決定之。\n1. 安理會層次：依憲章第27條第3項，關於非程序事項（包括推薦新會員入會，屬實質事項）之決議，應以9個理事國之可決票包括全體常任理事國之同意票表決之，即任一常任理事國均得行使否決權（veto）阻止推薦案通過。\n2. 大會層次：依憲章第18條第2項，關於接納新會員國之決議屬「重要問題」（important questions），應以出席並參加表決之會員國三分之二多數決定之，並無否決權之設計。\n因此，新會員入會案之關�卡實際上在於安理會層次（任一常任理事國均可否決推薦案），一旦安理會完成推薦，大會之三分之二多數決通常較容易達成。\n\n（二）憲章第2條所規定之原則\n《聯合國憲章》第2條規定聯合國及其會員國應遵行之原則，主要包括：\n1. 主權平等原則（第1項）：各會員國主權平等。\n2. 履行憲章義務原則（第2項）：善意履行憲章所負之義務。\n3. 和平解決爭端原則（第3項）：以和平方法解決國際爭端，不危及國際和平、安全及正義。\n4. 禁止使用武力原則（第4項）：各會員國不得使用威脅或武力，侵害任何國家之領土完整或政治獨立，或以與聯合國宗旨不符之任何其他方式為之。\n5. 協助聯合國並不得協助被制裁國原則（第5項）：對聯合國依憲章採取之行動盡力予以協助，對被聯合國採取防止或執行行動之國家不得予以協助。\n6. 確保非會員國遵行原則（第6項）：聯合國在維持國際和平及安全之必要範圍內，應確保非會員國遵行上述原則。\n7. 不干涉內政原則（第7項）：聯合國不得干涉在本質上屬於任何國家國內管轄之事件，但此不妨礙依憲章第七章採取執行辦法。"}, {"year": "109", "prefix": "一、在 1982 年《聯合國海", "answer": "一、1982年《聯合國海洋法公約》創設之新國際組織\n\n《聯合國海洋法公約》為落實其各項制度之運作，創設或授權設立以下新的國際組織及機構：\n\n（一）國際海底管理局（International Seabed Authority, ISA）\n依公約第156條設立，為締約國組織，代表全人類對「區域」（國家管轄範圍以外之海床洋底及底土）內之資源進行管理，負責核發探勘及開發許可、監督相關活動並確保海洋環境受到保護。\n\n（二）國際海洋法法庭（International Tribunal for the Law of the Sea, ITLOS）\n依公約第287條及附件六設立，總部設於德國漢堡，為締約國間因公約解釋或適用所生爭端提供司法解決之專門法庭，具有強制管轄權之選項地位（締約國得選擇接受其管轄）。\n\n（三）大陸礁層界限委員會（Commission on the Limits of the Continental Shelf, CLCS）\n依公約第76條及附件二設立，負責就沿海國主張200浬以外大陸礁層外部界限之科學及技術資料提出建議，其建議為沿海國劃定最終及具拘束力大陸礁層外部界限之基礎。\n\n（四）仲裁法庭及特別仲裁法庭（附件七、附件八）\n公約另設仲裁及特別仲裁（就漁業、海洋環境保護、海洋科學研究、航行等特定技術性事項）之爭端解決機制，締約國得選擇以仲裁方式解決爭端。\n\n上述機構共同構成公約所建立之完整海洋治理及爭端解決體系，使公約不僅為實體規範性文件，亦具備制度性、程序性之執行機制。"}, {"year": "109", "prefix": "二、請析論構成條約中止（sus", "answer": "二、條約中止或停止之原因\n\n依1969年《維也納條約法公約》第五編第三節，條約之終止（termination）與停止施行（suspension）主要原因如下：\n\n（一）依條約規定終止或退出（第54條、第56條）\n條約明定終止日期、期限屆滿，或依條約條款允許締約國退出者。\n\n（二）當事國合意終止或停止（第54條、第57條）\n全體當事國於諮商其他締約國後，隨時得經全體同意終止或停止條約之施行。\n\n（三）嗣後條約之締結（第59條）\n全體當事國就同一事項另訂新條約，且有意以新約代替舊約，或新舊約不能同時適用者，舊約視為終止或停止施行。\n\n（四）重大違約（material breach，第60條）\n一當事國嚴重違反雙邊條約時，他當事國得援引違約作為終止或停止施行之理由；多邊條約情形下，其他當事國得一致同意在其相互關係上或對違約國停止施行該條約。\n\n（五）履行不能（supervening impossibility of performance，第61條）\n條約履行所不可缺少之標的物永久消滅或毀壞，致無法履行條約時，當事國得援引作為終止或退出之理由；惟若履行不能係因該當事國違反條約義務或其他國際義務所致，則不得援引。\n\n（六）情勢重大變遷（fundamental change of circumstances，第62條）\n條約締結時存在之情況發生基本改變，且該情況之存在構成當事國同意受條約拘束之必要基礎，該改變並使尚待履行之義務範圍發生根本變化者，得作為終止或退出之理由，惟此原則適用受嚴格限制（不適用於邊界條約，亦不得由自己違反國際義務所致之情勢變遷而援引）。\n\n（七）新強行法規範之產生（jus cogens，第64條）\n條約於締結後與新產生之一般國際法強制規律（強行法）牴觸者，該條約即成為無效並終止。\n\n（八）斷絕外交或領事關係（第63條，原則上不影響條約效力，僅於條約履行有賴外交關係存在時方生影響，已如前述）。\n\n上述各項原因均須依公約第65條至第68條所定之通知及爭端解決程序辦理，不得由當事國片面、任意主張終止或停止條約之施行。"}, {"year": "108", "prefix": "一、假設 A 國與 B 國對於", "answer": "一、C島嶼主權爭議之國際法分析\n\n（一）國際法院管轄權之成立\n依《國際法院規約》第36條，國際法院之管轄權以當事國同意為基礎，可能之管轄依據包括：（1）雙方另行合意將本案提交國際法院之特別協定（compromis）；（2）雙方均為規約第36條第2項「任擇條款」（optional clause）之聲明國，且聲明內容涵蓋本類爭端；（3）雙方所締結之條約中訂有將爭端提交國際法院之管轄條款。A、B兩國均為聯合國會員及規約當事國，惟此僅代表兩國「得」利用國際法院，尚不當然構成「管轄權」之基礎，仍須具備上述至少一項管轄權連結因素，法院始得受理並為實體裁判；若欠缺上述基礎，A國片面提出訴訟，B國得提出先決反對（preliminary objection）主張法院無管轄權。\n\n（二）「先占」（occupation）主張之法律要件\n依國際法上先占之傳統法理（如帕爾馬斯島仲裁案Palmas Case所揭示），主張先占取得領土主權須具備：（1）標的須為無主地（terra nullius），即非屬其他國家主權範圍之土地；（2）須有國家有效占有之意思（animus occupandi）；（3）須有和平、持續且有效之國家權力行使（effective and continuous display of state authority），包括行政管理、立法、司法管轄等主權行為之實際展現，單純之發現（discovery）並不足以完成領土取得，僅生「不成熟權利」（inchoate title），須輔以其後之有效占領方能完足。惟本案C島已有A、B兩國部分居民定居，其是否仍屬「無主地」已有疑義，若非無主地，先占主張即無從成立。\n\n（三）「時效」（prescription）主張之法律要件\n時效取得領土主權，係指一國對原屬他國（或主權歸屬不明）之領土，經長期、持續、和平且公開行使主權權力，且未遭受他國有效抗議，因而依國際法取得該地主權之制度。其要件包括：（1）占有須公開、和平（非以武力或脅迫取得）；（2）須經相當期間持續行使主權（國際法未設固定期限，須綜合考量個案情況）；（3）他國（原主權國或競爭主張國）須未提出有效之外交抗議，若持續且及時提出抗議，則不生時效取得之效果。B國若主張時效取得，須舉證其確已長期、和平、公開對C島行使主權，且A國並未對此提出有效抗議，惟本案A、B雙方顯然一直存在主權爭執，恐難認定符合時效制度所要求之「未受抗議」要件。"}, {"year": "108", "prefix": "二、在近年方興未艾的國際貿易糾", "answer": "二、國際經濟組織之會員資格與決策模式\n\n（一）原始會員與新加入會員資格\n1. 國際貨幣基金（IMF）：原始會員為參加1944年布列頓森林會議且於成立時簽署基金協定之國家；其後欲加入者，須經理事會（Board of Governors）決議通過，並依其經濟規模分配認股額（quota），繳納相應之份額始完成入會。\n2. 世界銀行（World Bank）：依其協定，入會資格原則上以已為IMF會員國為前提（IBRD協定第2條），此為兩機構會籍之聯動設計；新加入須經理事會核准並認繳股本。\n3. 世界貿易組織（WTO）：原始會員為WTO設立協定生效時已為GATT締約方且接受烏拉圭回合協定一攬子承諾之國家或個別關稅領域；新加入會員須經「入會工作小組」就其貿易體制進行審查，與現有會員完成雙邊及多邊市場開放談判，最終經WTO部長會議或總理事會以三分之二多數同意（實踐上多以共識決通過）始得加入，此程序遠較IMF、世銀複雜且耗時。\n\n（二）決策模式之差異\n1. IMF與World Bank：採加權投票制（weighted voting），會員國之投票權依其認股額（份額）多寡而定，經濟規模愈大之國家（如美國）享有愈高之投票權重，重大事項（如份額調整、協定修正）須經特定高門檻（如85%）多數決通過，使主要出資國（尤其美國）事實上享有否決權。\n2. WTO：原則上採「一國一票」（one member, one vote）之主權平等投票制，且實務上高度依賴「共識決」（consensus）而非正式投票，僅於共識決無法達成時始訴諸多數表決（依事項性質分別需簡單多數、三分之二或四分之三多數），此與IMF、World Bank之加權投票制形成鮮明對比，反映WTO作為貿易規則制定機構強調會員國主權平等之制度設計理念。"}, {"year": "107", "prefix": "一、學習國際法不能忽視國際性司", "answer": "一、國際法院判決先例相關問題\n\n（一）殘害人群罪公約保留諮詢意見所推翻之以往見解\n在1951年諮詢意見之前，國際法傳統見解（源自國際聯盟時期之實踐）認為，多邊條約之保留須經全體締約國一致同意始生效力（即所謂「完整性原則」integrity doctrine），任一締約國反對即足以排除保留國成為締約國，以維護多邊條約內容之統一性與完整性。國際法院於該號諮詢意見中推翻此一見解，改採「相容性標準」（compatibility test）：只要保留與條約之目的及宗旨相容（compatible with the object and purpose of the treaty），保留國即可能被視為締約國，此一見解嗣後為1969年《維也納條約法公約》第19條至第23條所採納並成文化，成為現行國際條約法上保留制度之基本原則。\n\n（二）碰撞管轄之差異：蓮花號案與海洋法公約\n常設國際法院於蓮花號案（1927）判決，就公海上發生船舶碰撞致生刑事責任問題，土耳其對碰撞影響及於其船舶（波茲考特號）之法國籍船員行使刑事管轄權並無不法，蓋國際法未明文禁止，土耳其得依「效果原則」對其領域內發生影響之行為主張管轄（「凡國際法未明文禁止者即為許可」之立場）。惟1982年《聯合國海洋法公約》第97條則明確規定，公海碰撞或其他航行事故所生之刑事或紀律責任，僅得向船旗國或該人員所屬國之司法或行政機關提起，非船旗國不得下令扣留船舶。此規定實質推翻蓮花號案之結論，改採船旗國專屬管轄原則，以避免各國競相對外國船員主張刑事管轄所生之法律不確定性與外交摩擦。\n\n（三）判決得修訂既有規則或創立新規則之條件\n國際法院之判決依規約第59條僅對當事國、就本案有拘束力（無先例拘束原則，即非普通法系之stare decisis），惟實務上，國際法院之判決常因其論理之權威性、反覆被引用及嗣後之國家實踐追認，逐漸形成或確認習慣國際法規則，甚至促成條約明文化既有判例見解（如前述保留制度）或反向修正判例所生規則（如碰撞管轄原則）。此種「規則變遷」通常須具備：（1）該判決之論理獲得廣泛國家實踐與法律確信之支持；（2）嗣後國家實踐與判決見解一致或以條約形式加以確認或推翻；（3）新規則之形成須符合習慣國際法「一般實踐」（general practice）及「法之確信」（opinio juris）之形成要件。\n\n（四）國際法院規約第38條與司法判例之適用\n依《國際法院規約》第38條第1項第4款，司法判例（judicial decisions）與各國權威公法學家學說，均僅屬「決定法律原則之補助資料」（subsidiary means for the determination of rules of law），而非獨立之法律淵源；此意味國際法院適用自己或其他國際法庭之判例時，須注意其僅具輔助性、參考性地位，終究仍須回歸條約、國際習慣及一般法律原則（第38條第1項第1至3款）作為實質法律淵源依據，不得逕以先前判例本身作為裁判之直接法律依據。"}, {"year": "107", "prefix": "二、聯合國會員國 N 國是禁止", "answer": "二、核武使用、不承認原則及國際制裁相關問題\n\n（一）核子武器使用與威脅之合法性諮詢意見（1996）\n國際法院於1996年諮詢意見中認為，核子武器之使用或威脅使用一般而言違反武裝衝突法及國際人道法之相關原則與規則（尤其區別原則及比例原則），惟法院就「在國家生存面臨危急存亡之極端自衛情況下（an extreme circumstance of self-defence, in which the very survival of a State would be at stake），核子武器之使用或威脅使用是否合法」一節，表示無法確切斷定（could not conclude definitively），亦即法院並未完全排除在此種極端自衛情形下核武使用可能合法之可能性，此為該諮詢意見最受矚目且最具爭議之部分。\n\n（二）不承認原則（南羅德西亞先例）之意涵與法律理由\n聯合國安理會曾就南羅德西亞白人少數政權於1965年單方宣布獨立（UDI）一事，通過決議要求會員國不予承認，其法理基礎在於：（1）該政權之成立違反聯合國憲章所揭示之人民自決原則及禁止種族歧視原則；（2）依「不承認主義」（史汀生主義之延伸），對於違反國際法基本原則（尤其違反禁止使用武力、自決權等強行法性質規範）所產生之既成事實，國際社會不應賦予法律承認，以避免鼓勵或縱容此類違法行為；（3）此種集體不承認義務具有「對世義務」（erga omnes）之性質，任何國家均負有不承認之義務，不因其與該政權有無直接利害關係而異。本案中安理會要求各國不承認L國，其意涵即在於否定該以武力兼併及片面扶植獨立所生之既成事實在國際法上之正當性，防止既成事實轉化為受國際法承認之合法地位。\n\n（三）對個人之國際法制裁方式\n對於違反國際法之個人（如國家元首、軍事將領等），現行國際法上之制裁及究責方式包括：（1）國際刑事法院（ICC）或特設國際刑事法庭（如前南斯拉夫法庭、盧安達法庭）之刑事追訴，就滅絕種族罪、危害人類罪、戰爭罪及侵略罪行使管轄；（2）普遍管轄原則下，任何國家依其國內法對上述國際罪行行使域外刑事管轄；（3）標的性制裁（targeted/smart sanctions），如聯合國安理會或個別國家對特定個人實施旅行禁令、資產凍結等措施；（4）國內法院之民事求償或引渡程序等。\n\n（五）安理會依憲章第七章制裁之相關規定\n《聯合國憲章》第七章（第39條至第51條）規定安理會對於「和平之威脅、和平之破壞及侵略行為」之因應辦法：第39條由安理會認定上述情事之存在並提出建議或決定應採措施；第40條得先行採取臨時辦法；第41條得決定採取武力以外之辦法（如經濟制裁、外交關係斷絕、通訊及交通中斷等）；第42條若第41條辦法不足或已被證明不足時，得採取必要之空、海、陸軍行動。就N國入侵L島及違反條約義務之情事，若安理會認定已構成「和平之破壞」或「侵略行為」，依上開規定，安理會確有法律依據可決議採取第41條之非武力制裁措施，甚至於必要時援引第42條授權採取武力行動，惟第42條之發動須以第41條辦法不足為前提，且須經安理會決議（受五常任理事國一致決之限制，任一常任理事國均得否決相關決議）。"}, {"year": "106", "prefix": "一、A 國與 B 國間有一無人", "answer": "一、X島領土主權、海域疆界與捕魚權主張\n\n（一）X島領土主權主張\n\n作為A國外交部人員，可主張：\n1. 先占與有效管領：A國自1930年起即在X島建立燈塔、簡易碼頭，並每年派員維修，展現持續、和平之國家權力行使（display of state authority），構成有效占領（effective occupation）之重要證據，符合帕爾馬斯島仲裁案所揭示「和平、持續行使國家權力」之先占要件。\n2. 實效控制（effectivités）：依國際法院實踐（如白礁案Pedra Branca），國家對爭議領土之行政、立法、司法等主權行為之實際展現（即使規模較小），較之單純之發現或歷史性主張更具證明力；A國之燈塔維護及對B國漁民之救助行為，均屬有利於A國之實效控制證據。\n3. 對B國1880年發現及1882年地圖主張之反駁：單純之發現至多僅生「不成熟權利」（inchoate title），須輔以嗣後之有效占領方能完足取得領土主權；B國若僅止於發現及地圖公布，而未能證明其有持續、有效之國家權力行使，其主張基礎將較A國薄弱。\n4. 就B國於1990年方以海軍控制X島一事，A國可主張B國此舉本身即係遲至數十年後始首次展現實效控制，難以推翻A國自1930年代起已長期建立之實效控制基礎；且B國此一片面軍事控制行為，本身亦可能構成對A國既有領土主權（或至少對等主權主張）之武力侵害。\n\n（二）X島海域疆界主張\nA國可主張，於雙方主權爭議未決前，依UNCLOS第74條、第83條及國家實踐，雙方應本諒解合作精神，尋求達成臨時性實際安排，B國不應片面公布領海基線並主張200浬專屬經濟海域，此種片面行為有違「不得片面採取行動危害最終劃界協議達成」之國際法義務。\n\n（三）X島海域捕魚權主張\nA國可主張：1. 現有九成漁民為A國籍，顯示A國漁民對該海域已形成長期、實質之利用利益，依國際法上「既得利益」及公平原則，於最終劃界或共同管理安排達成前，應維持現狀，保障A國漁民既有之捕魚活動；2. B國以武力驅逐A國漁船之片面執法行為，逾越其主權主張本身尚未確定之現狀，構成不當之片面行動，A國得要求B國停止此類片面驅離行為，並提議透過談判或國際司法／仲裁途徑（如依附件七提付仲裁）解決海域疆界及漁業權爭議。"}, {"year": "106", "prefix": "二、甲國與其鄰國乙國夙來不睦，", "answer": "二、甲國空軍轟炸乙國軍隊及丙國境內衝突之國際法分析\n\n（一）甲國轟炸乙國軍隊之合法性\n1. 甲國以空軍轟炸位於丙國境內之乙國軍隊，此行為地點在丙國領土內，涉及對丙國主權之侵害問題，除非取得丙國同意，否則甲國此舉本身即可能違反《聯合國憲章》第2條第4項禁止使用武力原則，侵害丙國之領土完整。\n2. 甲國主張基於與丙國之共同防禁約而採取集體自衛，惟集體自衛之發動依憲章第51條及國際法院尼加拉瓜案之見解，須符合：（1）確有「武力攻擊」（armed attack）之發生（乙國舊政府殘餘勢力對丙國之越界侵擾行為是否已達「武力攻擊」之嚴重程度，尚待具體事實認定，一般性之越界騷擾或資源掠奪，未必達到武力攻擊之門檻）；（2）受攻擊國（丙國）須明確表示遭受攻擊並請求協助；（3）自衛行為須符合必要性與比例性。若乙國舊政府殘餘勢力之行為尚未達到「武力攻擊」之嚴重程度，甲國逕以空軍轟炸方式介入，其比例性及必要性均有可議之處。\n\n（二）「人道干預」主張之評估\n1. 傳統國際法及憲章體制下，「人道干預」（humanitarian intervention）並未獲得普遍承認為合法使用武力之依據，蓋此將牴觸憲章第2條第4項禁止使用武力及第2條第7項不干涉內政原則之明文規定。\n2. 雖然近年「保護的責任」（Responsibility to Protect, R2P）之新興理念逐漸受到重視，惟其正式適用仍高度依賴聯合國安理會依憲章第七章之授權（如利比亞案之安理會第1973號決議），若未經安理會授權，甲國逕自以「人道干預」為由對乙國採取單方面武力行動，難謂已獲得現行國際法之普遍承認為合法。\n3. 綜上，甲國前述兩項抗辯──集體自衛及人道干預──均存在相當程度之法律瑕疵，能否成立尚須視具體事實（尤其乙國舊政府殘餘勢力行為之嚴重程度、丙國請求協助之明確性及甲國轟炸行為之必要性與比例性）而定，惟就人道干預部分，在欠缺安理會授權之情形下，其合法性基礎相對薄弱。"}, {"year": "105", "prefix": "一、條約發生錯誤是否得撤銷，大", "answer": "一、隆端古寺案錯誤主張與條約法公約第48條\n\n（一）國際法院對泰國兩項錯誤主張之見解\n\n1. 就管轄權先決反對部分：國際法院認為，泰國於1950年更新接受強制管轄之宣言時，縱使泰國內部就是否更新宣言存有若干認識上之瑕疵，惟此並不構成得以推翻其宣言效力之「錯誤」，蓋泰國之更新宣言行為本身係其自主決定之結果，且泰國嗣後之行為（包括其後之外交實踐）並未及時對此表示異議，法院因此駁回泰國此部分之管轄權異議，認定其宣言仍屬有效，法院對此案具有管轄權。\n\n2. 就劃界地圖之實體部分：國際法院認為，即使附件地圖之繪製與條約所定分水嶺線確有技術上之出入，惟泰國於地圖送達後之相當期間內，透過其官方之接受、使用及默示行為（包括未及時提出異議、後續官員之正式訪問及接待儀式等），已構成對該地圖所定邊界之默示接受（acquiescence）及禁反言（estoppel），泰國不得於數十年後始翻異其詞、主張錯誤而否認地圖之拘束力，故法院最終認定隆端古寺主權歸屬柬埔寨。\n\n（二）1969年條約法公約第48條關於錯誤之規定\n\n依第48條：\n1. 第1項：一國得援引其同意受條約拘束時所犯之錯誤，作為使其同意無效之理由，惟該錯誤須關於該國於締約時假定為存在，且構成其同意受條約拘束必要基礎之事實或情況。\n2. 第2項：如該國以其本身行為導致該錯誤，或依當時情況該國本應注意及該錯誤之可能性者，不適用第1項規定，即不得主張錯誤。\n3. 第3項：僅與條約約文用語有關之錯誤，不影響條約之效力，此時應適用第79條（更正條約約文或正式副本內錯誤之程序）。\n\n上開規定與隆端古寺案所建立之法理高度契合：法院認為泰國本應注意（或至少有合理機會發現）地圖與分水嶺不符之情事，卻長期未予異議，此正對應第48條第2項「本應注意錯誤可能性」而排除錯誤主張之要件，顯示該案判決先於公約而實質確立之法理，嗣後為公約明文化並予以體系化。"}, {"year": "105", "prefix": "二、國際公法範圍廣博，有些觀念", "answer": "二、國際公法基本觀念之區分\n\n（一）報復（retorsion）或報仇（reprisal）\n美國凍結伊朗在美財產之行為，性質上應屬「報仇」（reprisal），而非單純之「報復」（retorsion）。報復係指以本身合法但不友好之行為（unfriendly but lawful act）回應他國之不友好或違法行為（如召回大使、中止外交關係、限制貿易優惠等，本身不違反國際法）；而報仇則係指以本身原屬違反國際法之行為（如凍結他國財產，本可能違反外交財產不可侵犯之相關國際法義務），作為對他國先前違法行為之對應措施，藉由「反致行為之不法性因對方先行違法而被阻卻」之法理，正當化己方原屬違法之行為。伊朗扣押人質、侵犯美國使領館不可侵犯性之行為已構成國際不法行為在先，美國凍結伊朗財產之行為原則上亦具有干涉他國財產之違法外觀，惟因係對伊朗先行違法行為之對應措施，故屬「報仇」性質，而非單純之「報復」。\n\n（二）國家豁免或國家行為主義\n美國最高法院駁回原告之訴，其理由應係基於「國家行為主義」（Act of State Doctrine），而非「國家豁免」（State Immunity）。國家行為主義係美國國內法上之司法自制原則，指法院對於外國政府在其本國領域內依其主權所為之行為（如沒收、國有化等），原則上不予審查其合法性，而逕予尊重承認其效力，此原則之基礎在於避免法院對外國主權行為妄加評斷，干預行政部門之外交裁量權限；而國家豁免原則則係處理外國政府「作為被告」時，法院對其有無管轄權之問題（管轄豁免、執行豁免）。本案原告並非以法國政府為被告請求賠償，而係就法國政府先前沒收、改裝船舶之行為效力本身提起訴訟請求返還船舶，法院係基於尊重外國主權行為之既成效果（不審查其合法性）而駁回，此核心爭點在於「行為效力之承認與否」，而非「管轄權之有無」，故應歸類為國家行為主義之適用，而非國家豁免。\n\n（三）國家繼承之全部繼承或部分繼承\n蘇聯解體分裂為十五個獨立國家，應屬「部分繼承」（partial succession，或稱「分離型繼承」dismemberment/separation之一種特殊型態，亦有學說稱為「多重延續」問題）。惟須注意，蘇聯解體之特殊實踐為：俄羅斯被國際社會普遍承認為蘇聯之「延續國」（continuing state），承接蘇聯之國際法人格、聯合國安理會常任理事國席位及大部分條約義務與國際債務，其餘十四個新獨立國家則被視為「新獨立國家」，僅就特定領域（如部分條約）發生繼承問題。此種安排並非典型「全部繼承」（如國家完全消滅、由單一繼承國概括承受，如兩德統一之西德延續模式的相反情形），亦非單純之「部分繼承」（如僅割讓部分領土），而係一種混合型態，惟主流見解仍傾向將俄羅斯定位為「延續國」，其餘國家則屬「新獨立國家」之繼承型態，而非全部由十五國平均分擔之全部繼承。\n\n（四）「區域」資源之公有物或人類共同繼承財產\n依UNCLOS第136條，明文規定「區域」及其資源為「人類共同繼承財產」（common heritage of mankind），而非傳統國際法上之「公有物」（res communis，如公海、公海生物資源，任何國家均得自由使用、先占先贏）。兩者關鍵差異在於：公有物任何國家均得自由開發利用，不生財產歸屬或利益分享問題；而人類共同繼承財產則強調：（1）任何國家不得主張主權或據為己有（第137條）；（2）資源之開發利用須透過國際海底管理局統一管理，並使全人類（尤其開發中國家）公平分享開發利益（第140條）；（3）強調為和平目的保留予全人類。此一制度設計明顯有別於公海資源傳統上「先占先贏」之公有物邏輯，而更強調國際共管與利益共享。"}, {"year": "104", "prefix": "一、國際法與國際禮讓有何不同？", "answer": "一、國際法與國際禮讓之區別\n\n（一）國際法（International Law）\n國際法係規範國家（及其他國際法主體，如國際組織）相互間權利義務關係之法律規範體系，其淵源依《國際法院規約》第38條包括：國際條約、國際習慣（一般實踐加上法之確信opinio juris）、文明國家所承認之一般法律原則，以及司法判例、學說等輔助資料。國際法具有法律拘束力（legally binding），違反國際法將產生國家責任，他國得依國際法上之救濟機制（外交保護、國際求償、對抗措施、司法或仲裁程序等）加以究責。\n\n（二）國際禮讓（Comity）\n國際禮讓（comity of nations）係指國家間基於禮貌、便利、互惠期待或善意，而非基於法律義務，所給予他國之尊重或優遇，例如外國判決之承認與執行、外國法律之適用、外交豁免範圍之從寬解釋等，在若干國內法（尤其英美法系）實踐上常訴諸「國際禮讓」作為法院自我節制或給予外國優遇之依據。\n\n（三）兩者之區別\n1. 拘束力來源不同：國際法之拘束力源於國家同意（條約）或普遍法律確信（習慣法），具有法律上之強制性；國際禮讓則純屬禮貌性、慣行性之互惠期待，並無法律上之強制拘束力，一國得隨時基於己身利益考量而不予遵循，不生違反國際法之責任問題。\n2. 違反後果不同：違反國際法將構成國際不法行為，產生國家責任；未依循國際禮讓，至多招致外交上之不快或關係惡化，不生法律責任問題。\n3. 性質定位不同：國際法屬於「法律規範」（law），國際禮讓則屬於「禮貌與便利之實踐」（practice of courtesy and convenience），兩者雖有時外觀相似（如皆涉及國家間之互動與尊重），惟性質截然不同，不應混淆。例如，外交豁免制度本身係國際法（如維也納外交關係公約）之明文規範，具法律拘束力；但若干國家對外國元首、政府高層來訪給予超出條約規定範圍之額外禮遇，則屬國際禮讓範疇，而非法律義務。"}, {"year": "104", "prefix": "二、何謂國際人道法？國際人道法", "answer": "二、國際人道法：海牙法系統與日內瓦法系統\n\n（一）國際人道法之意涵\n國際人道法（International Humanitarian Law, IHL），又稱武裝衝突法（Law of Armed Conflict）或戰爭法（Law of War），係規範武裝衝突期間交戰雙方行為之國際法規範體系，其目的在於限制戰爭方法及手段、保護未參與或不再參與敵對行動之人員（如平民、傷病者、戰俘），並於軍事必要性（military necessity）與人道考量（humanity）間求取平衡。\n\n（二）海牙法系統（Hague Law）\n海牙法系統源於1899年及1907年海牙和平會議所通過之一系列公約（尤其1907年海牙第四公約及其附件陸戰法規），其規範重點在於「作戰方法及手段之限制」（means and methods of warfare），包括交戰者資格之認定、禁止使用特定武器（如毒氣、爆炸性子彈等）、占領法規（占領國於被占領土之權利義務）等，核心關注點為「如何作戰」（jus in bello之作戰行為規範面向）。\n\n（三）日內瓦法系統（Geneva Law）\n日內瓦法系統源於1864年首部日內瓦公約，歷經多次修訂，現行體系以1949年四部日內瓦公約（分別保護：陸戰傷病者、海戰傷病者及船難者、戰俘、平民）及1977年兩項附加議定書（分別適用於國際性及非國際性武裝衝突）為核心，其規範重點在於「戰爭受難者之保護」（protection of victims of war），核心關注點為「如何保護不再參與或未參與戰鬥之人員」。\n\n（四）兩系統之合流\n海牙法系統著重限制作戰手段，日內瓦法系統著重保護戰爭受難者，兩者原各自發展，惟隨著武裝衝突型態演變及國際人道法之整合需求，1977年《日內瓦公約第一附加議定書》（適用於國際性武裝衝突）首度將海牙法系統之作戰方法手段限制規範（如禁止不分皂白之攻擊、比例原則、預防措施等）與日內瓦法系統之受難者保護規範整合於同一法律文件之中，實質上標誌著海牙法系統與日內瓦法系統自此開始合而為一，形成現行國際人道法兼顧「作戰行為規範」與「受難者保護」之統一體系，此一整合過程持續透過國際刑事法院羅馬規約等晚近文件進一步深化與體系化。"}, {"year": "103", "prefix": "一、請附理由回答下列問題：\n\n", "answer": "一、海岸劃界、里約宣言與聯合國代表權問題\n\n（一）海岸相向或相鄰國家間領海及大陸礁層之劃界\n依UNCLOS第15條，海岸相向或相鄰國家間領海之劃界，除另有協議外，任一國均無權將其領海伸延至一條其每一點與兩國基線最近點距離相等之「中間線」（等距離線）以外，惟如因歷史性所有權或其他特殊情況，有必要按照與此不同之方法劃定兩國領海界限者，不適用此一規定（等距離／特殊情況原則）。就大陸礁層劃界，依第83條，海岸相向或相鄰國家間大陸礁層之界限，應在《國際法院規約》第38條所指之國際法基礎上，以協議劃定，以求得公平解決（equitable solution），並非強制適用等距離線，而係綜合考量海岸地形、比例性等因素，透過協議或國際爭端解決機制達成公平劃界結果。\n\n（二）里約宣言之「善鄰原則」與「永續發展」\n1. 善鄰原則（good neighbourliness）：源於1992年里約環境與發展宣言原則2，即國家於其管轄或控制範圍內之活動，不得對其他國家之環境或其國家管轄範圍以外之地區造成損害，此原則要求國家行使主權時須顧及鄰國及國際社會之環境利益，不得以鄰為壑。\n2. 永續發展（sustainable development）：指兼顧當代發展需求與後代子孫發展權益之發展模式，強調環境保護、經濟發展與社會公平三者之整合與平衡，里約宣言多項原則（如原則3、原則4）均體現此一核心理念，要求發展權之行使應公平滿足當代與後代在發展與環境方面之需要。\n\n（三）新會員加入聯合國之程序及代表權爭議之解決\n1. 依憲章第4條第2項，新會員入會由大會經安理會推薦後以決議行之（詳如前述，安理會非程序事項適用五常任理事國一致決，大會則以三分之二多數決定）。\n2. 聯大第396號決議（1950年，關於中國代表權問題）確立：當一個以上之當局（authority）就代表同一會員國在聯合國之席位發生爭執時，此一問題應依聯合國憲章之宗旨及原則，並參照各項事件之情況，由大會加以考量，若發生於大會開會期間，應由大會處理；若發生於大會閉會期間，則由臨時委員會或下屆大會處理之，藉此建立代表權爭議之處理機制及原則性指引，惟其實際適用仍高度受政治因素影響（如1971年中國代表權變更即為著例）。"}, {"year": "103", "prefix": "二、A 國於 1990 年在 ", "answer": "二、國家豁免、報仇與國際習慣相關問題\n\n（一）外交豁免與國家豁免之區辨及本案適用\n1. 外交豁免（diplomatic immunity）：規範於《維也納外交關係公約》，其保護對象為「人」（外交使節及其人員），賦予外交人員本身之刑事、民事管轄豁免及使館館舍、檔案之不可侵犯性，目的在確保外交人員得獨立執行職務，不受接受國干預。\n2. 國家豁免（state immunity）：規範基礎主要為習慣國際法（部分國家另有國內立法，如美國《外國主權豁免法》），其保護對象為「國家本身」，指一國於他國法院享有不受該他國法院管轄（管轄豁免）及其財產不受扣押執行（執行豁免）之權利，現行普遍採「限制豁免論」（restrictive immunity），區分國家之「主權行為」（acta jure imperii，享有豁免）與「商業或私法行為」（acta jure gestionis，不享有豁免）。\n3. 本案適用：A國發行政府公債之行為，性質上屬於國家從事之商業融資行為（借貸行為），依限制豁免論之通說及國家實踐，發行公債、舉借外債等行為多被認定屬「商業行為」性質，不屬於主權行為，故本案應屬「國家豁免」（而非外交豁免，因本案被告為A國本身，非特定外交人員）之適用範圍，且依限制豁免論，A國就此商業性質之發債行為，原則上不得主張管轄豁免，B國法院對此類商業性質之訴訟行使管轄權，並未違反國際法上有關管轄豁免之規範。\n\n（二）「報仇」（reprisal）主張之當否\nA國國會議員主張凍結B國財產作為合法報仇行為，惟依國際法，報仇之發動須符合：（1）須有他國先行違反國際法之行為存在；（2）報仇措施須符合必要性及比例性；（3）現行國際法（尤其WTO及投資協定體制下）已大幅限縮傳統自助式報仇之空間，改以多邊爭端解決機制為優先。本案中，B國法院依限制豁免論行使管轄權並判決A國敗訴，此為國際法所肯認之合法管轄權行使，並非國際不法行為，A國尚難主張B國有何「先行違法行為」存在，故A國凍結B國財產之行為，欠缺報仇成立所須之「他國先行違法」前提要件，難謂符合reprisal之定義，其正當性基礎薄弱。\n\n（三）國際法院規約第38條「國際習慣」之意涵\n依《國際法院規約》第38條第1項第2款，國際習慣（international custom）作為「通例之證明而經接受為法律者」（evidence of a general practice accepted as law），其構成須具備兩項要件：（1）客觀要件「一般實踐」（general practice, state practice）：即國家反覆、一致且廣泛之實踐；（2）主觀要件「法之確信」（opinio juris sive necessitatis）：即國家從事該實踐時，係出於認為其受法律義務拘束（而非僅出於禮讓、政策考量或巧合）之信念。兩要件須同時具備，方能認定該實踐已昇華為具拘束力之國際習慣法規則。"}, {"year": "102", "prefix": "一、甲國近年軍方干政問題十分嚴", "answer": "一、政變情勢下之國家責任分析\n\n（一）ILC國家責任條文草案之基本架構\n依2001年國際法委員會（ILC）通過之《國家對國際不法行為之責任條文草案》，國家責任之成立須具備：（1）行為可歸責於國家（attribution）；（2）該行為構成違反國際義務（breach of an international obligation）。就可歸責性，草案第4條規定國家機關（含政府軍隊）之行為可歸責於國家；第7條規定即使國家機關逾越權限或違反指示（ultra vires），其行為仍可歸責於國家，只要該機關係以此身分行事。\n\n（二）政變軍人誤殺記者之責任歸屬\n本案乙國記者B遭甲國政變軍人誤殺，若該軍人於行為時仍屬甲國正式政府軍之編制人員，依草案第4條及第7條，即使其行為出於誤判（誤殺）且逾越合法之武力使用限度，仍應歸責於甲國，蓋國家對其武裝部隊人員之行為原則上負有國家責任，不因該行為出於過失、誤判或違反上級指示而免責，惟仍須符合國際人道法上武力使用之必要性及比例性標準加以審視是否構成不法。\n\n（三）若政變成功並取得政權：草案第10條之特殊規則\n依草案第10條，若一叛亂運動（insurrectional movement）之行為其後成為一國新政府，則該運動先前之行為應視為該國之行為，溯及既往地歸責於國家。準此，若甲國軍方政變成功並取得政權，則政變軍人（即叛亂運動成員）於政變過程中所為之行為（包括誤殺記者B之行為），依第10條規定，仍將被視為甲國之國家行為而生國家責任，此一規則之設計目的在於避免透過政權更迭之外觀而規避先前不法行為所生之國家責任，確保國家責任不因政府更迭而中斷（此與「國家繼續原則」之法理相呼應）。準此，無論政變是否成功，就B之死亡，甲國原則上均應負國家責任，僅在責任成立之法律路徑（第4/7條之現職國家機關責任，或第10條之嗣後追溯責任）有所不同而已。"}, {"year": "102", "prefix": "二、甲國人民 A 於乙國境內架", "answer": "二、詐騙案之國際管轄權與引渡問題\n\n（一）甲、乙、丙三國管轄權之依據\n1. 甲國：依屬人原則（active personality principle），A為甲國國民，甲國得基於國籍管轄權對其在境外之行為主張刑事管轄。\n2. 乙國：依屬地原則（territoriality），A架設電腦網站之行為地（伺服器所在地或行為實施地）在乙國境內，乙國得依主觀屬地原則主張管轄。\n3. 丙國：依消極屬人原則（passive personality principle）或效果原則（effects doctrine），丙國人民為詐騙行為之被害人，且詐騙結果（財產損害）發生於丙國境內或對丙國人民產生實質影響，丙國得依被害人國籍或犯罪結果發生地主張管轄。\n綜上，甲、乙、丙三國依國際法上不同之管轄權基礎（屬人、屬地、消極屬人／效果原則），均對A之行為具有管轄權基礎，此為典型之管轄權競合（concurrent jurisdiction）情形，國際法原則上並不禁止此種管轄權重疊之現象，僅須各國於執行管轄權時尊重他國之主權及屬地管轄之優先性。\n\n（二）我國之處理方式\n1. 引渡條約之欠缺：依國際法及我國《引渡法》，引渡原則上以締有引渡條約為前提，惟《引渡法》第1條但書及國際實踐上亦承認得依「互惠原則」（reciprocity）於個案基礎上進行引渡合作，故欠缺引渡條約並非當然阻卻引渡之可能性，僅程序上須另行協商互惠安排。\n2. 政治犯不引渡及本國國民不引渡原則：若甲、乙、丙提出引渡請求之罪名屬普通刑事犯罪（詐欺），並非政治性犯罪，原則上不生政治犯不引渡之問題；惟若A具我國國籍，則可能涉及本國國民不引渡原則（如採此原則之國家，改以我國自行追訴之方式處理，即「或引渡或起訴」originally aut dedere aut judicare之精神）。\n3. 綜合處理原則：我國得依《引渡法》相關規定，審酌雙重犯罪原則（該行為依我國法及請求國法均構成犯罪）、罪刑相當原則、有無政治性質、我國與各請求國之外交關係及互惠可能性等因素，並得優先考量：（1）若A行為地、被害人國籍等連結因素與丙國關聯最為密切且丙國之請求證據完備，可優先考慮將A引渡予丙國；（2）若基於本國國民保護或欠缺互惠基礎等考量而不引渡任何一方，我國得依屬地原則或普遍性合作義務，自行對A涉犯之詐欺行為進行刑事追訴（前提是我國法律對此有域外管轄或至少行為結果與我國有一定關聯之管轄基礎），以避免A因管轄權競合及引渡障礙而完全逃避刑事究責。"}, {"year": "101", "prefix": "一、甲國政府是一軍事極權政府，", "answer": "一、內政干涉之合法性分析\n\n（一）不干涉原則之內涵\n依《聯合國憲章》第2條第7項及1970年聯合國大會第2625號決議（友好關係宣言），不干涉原則禁止國家以任何形式（外交、經濟、軍事等）干預他國在本質上屬其國內管轄之事項，尤其明文禁止使用經濟、政治或其他措施脅迫他國，以求屈服其主權權利之行使或圖謀從中取得任何利益。\n\n（二）乙、丙兩國行為之定性\n1. 乙國宣稱將斷絕經濟關係：此屬「報復」（retorsion）性質之行為，即以本身合法之行為（斷絕自願性經濟往來，一國並無義務與他國維持經濟關係）表達對甲國人權狀況之不滿，此類經濟性反應措施原則上屬國家主權範圍內之外交裁量，並不當然構成國際法上禁止之「干涉」，蓋干涉之核心特徵在於「脅迫性」（coercion），而非單純消極地終止自願性合作關係。\n2. 丙國召回軍事顧問團之表示：性質上亦屬丙國對其自身資源（軍事顧問人員）之處分權，屬丙國主權範圍內之自主決定，同樣不構成脅迫性之干涉行為。\n\n（三）甲國主張之當否\n甲國主張乙、丙兩國行為構成內政干涉，惟依上述分析，乙、丙兩國之行為性質上屬報復而非脅迫性干涉，甲國之主張尚難成立。乙、丙兩國之抗辯（干涉須以軍事力強制特定政策實施）雖過於狹隘（現代國際法上干涉之範疇不以軍事脅迫為限，經濟脅迫達一定嚴重程度者亦可能構成干涉），惟其結論（本案行為並非干涉）尚屬可採，因其行為欠缺脅迫性要素。\n\n（四）人道干涉主張之補充評估\n乙、丙兩國進一步主張縱認定構成干涉，亦屬「人道干涉」而不違法，惟如前所述，現行國際法對於未經安理會授權之單方人道干涉，其合法性基礎仍屬薄弱，惟因本案乙丙兩國行為本身尚未達到「干涉」之門檻（欠缺脅迫性），故此部分抗辯於本案中僅具補充性、備位性質，尚無須進一步深究其合法性，惟仍應指出人道干涉於現行國際法上並非已獲普遍承認之合法例外。"}, {"year": "101", "prefix": "二、A 國與 C 國發生武裝衝", "answer": "二、政治犯不引渡、政治犯認定及禁止驅逐遣返原則\n\n（一）「政治犯不引渡」是否為國際習慣法\n政治犯不引渡原則（non-extradition of political offenders）廣泛見於各國引渡條約及國內引渡立法，惟其是否已昇華為具普遍拘束力之國際習慣法，學說上仍有爭議：多數見解認為，此原則主要係透過雙邊或多邊引渡條約及國內法予以落實之「條約及國內法原則」，而非獨立存在、不待條約即對所有國家生拘束力之國際習慣法規則，蓋此涉及國家於引渡合作上之高度裁量權限，各國實踐及例外規定（如排除暴力性政治犯罪、恐怖主義行為之「政治犯罪除外條款」）差異甚大，尚難認定已形成具普遍法之確信之一致實踐。故甲主張「政治犯不引渡乃國際習慣法」之論點，理論基礎尚有不足，較為精確之定性應為：政治犯不引渡係國際間普遍承認之引渡合作原則及實踐，惟其規範依據主要仍繫諸具體引渡條約或內國法之規定，而非獨立自足之強制性國際習慣法規則。\n\n（二）甲是否為「政治犯」\n政治犯之認定通常採「政治性行為理論」，須審酌：（1）行為人主觀上是否基於政治目的或政治信念而為；（2）行為與政治目的間是否具有相當關聯性（政治行為理論political offence doctrine之「附隨關係」incidence test）；（3）多數國家實踐排除暴力性、恐怖主義性質之行為列入政治犯罪範疇（政治犯罪除外條款）。甲僅係批判A國政府並加入反政府組織進行政治性活動，未涉及暴力手段，較符合政治犯之認定要件，惟仍須視B國國內法及相關引渡實踐之具體標準而定，不能一概而論。\n\n（三）禁止驅逐、遣返原則（non-refoulement）\n禁止驅逐遣返原則規範於1951年《難民地位公約》第33條及晚近國際人權法（如禁止酷刑公約第3條、公民與政治權利公約第6、7條所衍生之保護），禁止締約國將難民或面臨迫害風險之人員驅逐或送返至其生命或自由因種族、宗教、國籍、特定社會團體成員身分或政治意見而可能受威脅之領域。惟此原則之適用前提通常以當事人已具備「難民」身分（或至少face出真實風險）為要件，若甲僅屬非法入境之政治異議人士，尚未經難民地位認定程序確認其符合難民要件，B國逕行主張其強制遞解出境並未違反該原則，仍待viewed個案中甲是否確實面臨遭受迫害之真實風險，以及B國有無提供難民地位認定之正當程序而定；若甲確實可證明其返回A國將面臨政治迫害之真實風險，則不論其是否已正式取得難民身分，依國際人權法之發展（如人權事務委員會相關見解），仍可能對B國產生不遣返之義務。"}, {"year": "100", "prefix": "一、請比較分析北極、南極、深海", "answer": "一、北極、南極、深海床、領海、太空之國際法地位比較\n\n（一）北極\n北極並無如南極條約般之統一國際法律體制，其海域部分適用UNCLOS一般規範（沿岸國得主張領海、專屬經濟區及大陸礁層，尤其涉及200浬以外大陸礁層外部界限之科學認定爭議，如俄羅斯、加拿大、丹麥就羅蒙諾索夫海嶺之主張），陸地及冰封區域則分屬俄、美（阿拉斯加）、加、挪、丹麥（格陵蘭）等環北極國家之主權範圍，國際合作主要透過「北極理事會」（Arctic Council）等軟性論壇進行協調，並無如南極條約凍結主權主張之強制性法律安排。\n\n（二）南極\n依1959年《南極條約》，凍結所有既存領土主張，禁止提出新主張，南極僅供和平及科學研究之用，非任何國家之領土，另有《南極條約環境保護議定書》禁止礦產資源商業開發，形成獨特之「非領土化、非軍事化」國際共管體制。\n\n（三）深海床（「區域」）\n依UNCLOS第136、137條，國家管轄範圍以外之深海床（the Area）及其資源，屬「人類共同繼承財產」，任何國家不得主張主權或據為己有，由國際海底管理局統一管理其資源探勘與開發，並確保開發利益公平分配予全人類（尤其開發中國家）。\n\n（四）領海\n依UNCLOS第2條，沿海國主權及於其領海（自基線起最寬12浬），並及於領海上覆空域及海床底土，惟外國船舶享有無害通過權（第17條至第26條）之限制，故領海雖屬沿海國主權範圍，惟其主權之行使受無害通過制度之限制，非如陸地領土般享有完全排他之支配。\n\n（五）外太空\n依1967年《外太空條約》，外太空、月球及其他天體不得由任何國家以主權主張、使用、占領或其他方式據為己有，供全人類探索及利用，各國應為和平目的從事太空活動，並對其太空活動負國際責任（第6條、第7條）。\n\n（六）小結比較\n上述五者之國際法地位可依「主權可主張程度」形成一光譜：陸地領海（沿海國完全主權，僅受通行權限制）→北極（部分陸地屬國家主權，海域依一般海洋法規範，無統一凍結機制）→南極（凍結既存主張，非任何國家領土）→深海床及外太空（明文禁止主權主張，均定性為全人類共同利益或共同繼承財產，惟深海床著重資源共管共享，外太空則著重和平探索利用及國家責任）。"}, {"year": "100", "prefix": "二、我國於 1967 年 10", "answer": "二、公民與政治權利國際公約等人權公約之締結、國內法效力問題\n\n（一）為何1967年得簽署，2009年始批准\n條約之簽署（signature）與批准（ratification）係條約締結程序上不同階段之行為：簽署原則上僅表示簽署國對條約內容初步認可，並使該國負有依《維也納條約法公約》第18條不得違反條約目的及宗旨之義務，惟尚不生完全受條約拘束之效果；批准則為國家依其國內憲政程序（如立法院審議通過），正式表示同意受條約拘束之最終確認行為。我國於1967年簽署該等公約後，因國內政治情勢（如退出聯合國後之國際處境變化）及立法院審議程序延宕等因素，遲至2009年始完成立法院審議並由總統批准，此為國內憲政程序及政治考量所致，簽署與批准間本得有相當時間落差，此為條約締結程序之常態設計，並非法律障礙所致。\n\n（二）為何得加入「消除對婦女一切形式歧視公約」\n「加入」（accession）係指一國未曾簽署條約，而於條約已對其他國家生效後，直接以加入方式表示同意受條約拘束之程序，通常適用於未及參與條約談判及簽署階段之國家。我國雖非聯合國會員國，惟依國際法及該公約性質，一國之加入原則上不以聯合國會籍為前提要件（除非公約本身明文限制僅聯合國會員國或特定機構會員國得加入），故我國依國內憲政程序（行政院提案、立法院審議通過）完成加入之國內程序後，即得以加入方式表示同意受该公約拘束，僅因欠缺國際承認，我國之加入書未能為聯合國秘書長（作為公約保管機關）所「接受」（存放），此涉及國際承認及普遍參與資格之政治現實問題，而非我國締約能力本身之法律障礙。\n\n（三）國內法律效力及位階\n依司法院大法官解釋（如釋字第329號）及晚近實踐，條約經立法院審議通過並經總統公布者，其位階通常被理解為與法律相當（部分學說主張條約優於一般法律，惟未有明確憲法位階之定論）。就本案三公約而言，立法院已分別通過《公民與政治權利國際公約及經濟社會文化權利國際公約施行法》及《消除對婦女一切形式歧視公約施行法》，此類「施行法」模式係我國特有之因應機制（因公約保管機關拒絕接受我國批准書／加入書，我國透過國內立法方式將公約內容內國法化，賦予其國內法效力），依施行法明文規定，該等公約之規定具有國內法律之效力，其位階應與一般法律相當（施行法本身即為法律位階）。\n\n（四）拘束之國家機關\n依上開施行法規定（如兩公約施行法第3條、第4條），各級政府機關（包括行政、立法、司法機關）行使職權，應符合公約有關人權保障之規定，避免侵害人權，並應積極促進各項人權之實現；同時應提出人權報告接受國際審查（我國透過邀請國際獨立專家進行審查之替代機制）。故上開公約於國內法化後，拘束範圍及於中央與地方之所有政府機關（行政、立法、司法），要求渠等於行使職權時均應遵循公約所定之人權保障標準。"}, {"year": "99", "prefix": "一、何謂條約之「批准」（rat", "answer": "一、條約之「批准」與「加入」及第三國權利問題\n\n（一）批准（ratification）\n依《維也納條約法公約》第2條及第14條，批准係指國家於簽署條約後，經其國內完成憲政程序（如國會審議、元首核可）後，正式向其他締約國或條約保管機關表示同意受條約拘束之國際法行為。批准之作用在於使簽署階段僅具初步政治承諾性質之條約，轉化為對批准國具完全法律拘束力之義務，通常適用於重大條約，賦予國家於簽署後仍有一段時間得依其國內程序審慎考慮是否最終同意受拘束之機制。\n\n（二）加入（accession）\n依公約第2條及第15條，加入係指國家並未參與條約之談判及簽署階段，而於條約已對其他國家生效（或雖未生效但條約另有規定允許）後，直接以單一之加入行為表示同意受條約拘束，其法律效果與批准相當（均使該國成為條約當事國），僅程序上省略簽署階段，通常適用於条約締結後始決定加入之國家，或原非談判參與國之情形。\n\n（三）條約可否為第三國創設權利\n依公約第34條，條約非經第三國同意，不為該国creates義務或權利，此即「條約相對效力原則」（pacta tertiis nec nocent nec prosunt）之明文化，惟公約第36條設有例外規定：若條約當事國有意以條約之一項規定對第三國或其所屬之一組國家或所有國家給予一項權利，且第三國對此表示同意，該項規定即對第三國發生賦予權利之效力，此種同意於未經表示相反意思前應推定其存在（除非條約另有規定或另有表示）。故條約於符合上開要件（當事國有意授予、第三國同意，得為默示同意）之情形下，確實得為第三國創設權利，惟此仍以第三國之同意為前提，並非當事國得片面對第三國課予義務或賦予權利而不問其意願，充分體現條約效力以國家同意為基礎之基本法理。"}, {"year": "99", "prefix": "二、在成文的國際法規範中，有關", "answer": "二、不受歡迎人士（persona non grata）之成文規範\n\n（一）規範依據：《維也納外交關係公約》第9條\n依公約第9條第1項，接受國得於任何時候，不必說明理由，通知派遣國宣告該國使館館長或任何其他外交職員為不受歡迎人員（persona non grata），或使館任何其他職員為不能接受（not acceptable）。經此宣告後，派遣國應視情形將該員召回，或終止其在使館之職務。若派遣國拒絕履行，或不在合理期間內履行此項義務，接受國得拒絕承認該員為使館人員（第9條第2項）。\n\n（二）制度特徵與意涵\n1. 接受國之片面裁量權：接受國得逕行宣告，無須說明理由，亦無須經任何國際或司法程序之審查，此係基於國家主權及接受國對其領域內外國人員活動之固有管制權限。\n2. 適用時點之彈性：依第9條明文「於任何時候」（at any time），此宣告權不僅適用於外交人員抵任前（此時類似拒絕同意，見第4條agrément機制），亦得於外交人員已在職執行職務期間隨時行使，賦予接受國高度彈性之因應工具。\n3. 法律效果：宣告本身不當然剝奪外交人員之外交身分或豁免（於其實際離境前，其人身及豁免仍應受尊重，此涉及公約其他保障規定），惟課予派遣國召回或終止其職務之義務；若派遣國逾期不履行，接受國得逕自不再承認其外交身分，實質上使該人員喪失於接受國繼續享有外交特權豁免之基礎。\n4. 適用對象不限使館館長：依條文文義，不僅使館館長（大使等），使館其他外交職員及一般職員（如行政技術人員）亦均得為宣告對象（僅用語上區分「不受歡迎人員」persona non grata適用於外交職員，「不能接受」not acceptable適用於其他職員，惟法律效果相當）。\n此一制度為外交關係實踐中最常見之外交手段之一，作為接受國在不需完全斷絕外交關係之前提下，對特定外交人員行為表達不滿或予以制衡之重要法律工具。"}, {"year": "98", "prefix": "一、假設 A、B 兩國於 18", "answer": "一、X島爭端之合法解決途徑\n\n（一）爭端背景與國際法上之現狀\nA國自1850年戰爭後即已佔領並有效統治X島至今（逾百年之久），已構成相當程度之「有效占領」及「時效」取得之事實基礎；B國雖始終不承認A國主權，惟長期未能透過有效之武力或合法途徑收復，其後B國趁A國內亂之際突然出兵佔領X島，此一行為本身即構成使用武力片面改變領土現狀之違法行為，違反《聯合國憲章》第2條第4項禁止使用武力原則。\n\n（二）A國可採取之合法途徑\n\n1. 訴諸聯合國安理會（憲章第35條、第六章、第七章）：A國得將此爭端提交安理會，主張B國之出兵構成對國際和平與安全之威脅或破壞，甚至構成侵略行為，請求安理會依憲章第39條至第42條採取相應之因應措施（包括要求B國撤軍、經濟制裁乃至授權集體安全行動）。\n\n2. 提交國際法院（ICJ）：若B國亦為《國際法院規約》第36條任擇條款之聲明國，或雙方另行合意（特別協定）將爭端提交國際法院，A國得訴請國際法院確認其對X島之主權（基於長期有效占領及時效），並確認B國之武力兼併行為違反國際法、不生領土主權移轉之效力，請求判命B國撤軍並回復原狀。\n\n3. 主張「不承認原則」並尋求國際社會集體不承認：援引史汀生主義及聯合國大會友好關係宣言之相關法理，主張B國以武力兼併所生之既成事實，國際社會不應予以承認，並得於聯合國大會尋求通過不承認決議，強化國際壓力。\n\n4. 尋求區域性或多邊爭端解決機制：如雙方均為特定區域組織成員，亦得利用該組織之爭端解決機制（調解、仲裁等和平解決手段）。\n\n5. 自衛權之保留：依憲章第51條，若B國之武力占領構成持續之武力攻擊狀態，A國固保有行使自衛權、以武力收復失土之權利，惟此非A國之優先或唯一選項，現行國際法秩序更鼓勵並要求優先透過上述和平解決途徑（憲章第2條第3項、第33條）處理爭端，避免武力衝突升級。\n\n綜上，A國應優先運用聯合國安理會及國際法院等制度性、和平性之爭端解決機制，並輔以不承認原則之外交操作，作為其收復X島主權之合法途徑，而非逕以武力對抗方式解決爭端。"}, {"year": "98", "prefix": "二、依 1969 年維也納條約", "answer": "二、1969年維也納條約法公約下條約絕對無效之事由\n\n依公約規定，條約無效之事由可區分為「相對無效」（得由受害國選擇主張撤銷，如錯誤、詐欺、賄賂等，且此類瑕疵得因嗣後之明示同意或默示追認而治癒）與「絕對無效」（void ab initio，自始、當然、絕對無效，不因任何後續行為而治癒或補正）兩大類。屬於「絕對無效」之事由，依公約規定主要有以下三種：\n\n（一）強制締約代表（第51條）\n以強制行為對一國代表本人施加強制（coercion of a representative of a State），迫使其代表國家表示同意受條約拘束者，該項同意應無法律效果，屬絕對無效，此類強制係針對代表個人（如脅迫、人身威脅），而非針對國家整體。\n\n（二）以威脅或使用武力強制締約國（第52條）\n條約之締結違反《聯合國憲章》所含國際法原則，係以威脅或使用武力（threat or use of force）之方式而獲致者，該條約無效。此為現代國際法禁止使用武力原則於條約法領域之具體化，任何透過武力脅迫他國締結之條約，均自始絕對無效，此原則明確否定傳統國際法上「城下之盟」之效力。\n\n（三）與一般國際法強制規律（強行法，jus cogens）相牴觸（第53條）\n條約於締結時與一般國際法強制規律相牴觸者，無效。依第53條之定義，一般國際法強制規律係指國家之國際社會全體接受並公認為不許損抑，且僅有以後具有同等性質之一般國際法規律始得更改之規律（如禁止侵略、禁止種族滅絕、禁止奴隸制度、禁止酷刑等基本規範）。任何條約若其內容與此類強行法規範相牴觸（如約定共同侵略他國、販賣奴隸等），該條約自始絕對無效。\n\n上述三種絕對無效事由之共通特徵在於：其所保護之利益已超越個別締約國之私益，而涉及國際社會之根本公共秩序（如國家意思自主之核心保障、禁止使用武力之基本原則、國際強行法之根本價值），故其法律效果為自始、絕對、當然無效，不因當事國之嗣後同意、默示追認或時效經過而治癒，此與前述相對無效事由（如錯誤、詐欺）僅得由受害國選擇是否主張撤銷、且得因追認而補正之法律效果，形成鮮明對比。"}];

const NTPU_115_Q1_CHATGPT_ANSWER = "# 一、維也納條約法公約關於條約無效之規定\n\n## （一）前言\n\n《1969年維也納條約法公約》第48條至第53條，規定國家締結條約時因意思表示不自由、不真實，或條約內容違反國際法基本秩序，而導致國家同意或條約本身無效的情形。\n\n嚴格而言，這六種情形並非條約生效後因新事由發生的「失效」或「終止」，而是：\n\n1. 第48條至第50條：國家同意受到瑕疵，受害國得主張其同意無效，屬相對無效或可撤銷；\n2. 第51條至第53條：因強迫或違反國際法強制規則，條約自始無效，屬絕對無效。\n\n聯合國官方資料亦將第48條至第53條列於《維也納條約法公約》第五編「條約之失效、終止及停止施行」中，而第53條所確立的國際法強制規則制度，是公約對條約法的重要發展。\n\n## （二）錯誤：第48條\n\n### 1. 意義\n\n所謂錯誤，是指一國在締結條約時，對某項已存在的事實或情況發生錯誤認識，而該錯誤構成該國同意受條約拘束的重要基礎。\n\n依第48條第1項，一國得以錯誤為由，主張其受條約拘束之同意無效，但須符合下列要件。\n\n### 2. 成立要件\n\n第一，錯誤必須涉及「事實或情況」。因此，原則上必須是對客觀事實的誤認，例如地圖、國界位置、島嶼位置、資源分布或地理狀況的錯誤。單純對法律規範或條約法律效果的誤解，通常不屬本條所稱錯誤。\n\n第二，該事實或情況必須在條約締結時已被該國假定為存在。換言之，錯誤必須發生於締約當時，而非條約締結後情況發生改變。若屬事後情勢重大變更，應依第62條「情勢根本變更」處理，而非第48條。\n\n第三，該錯誤必須構成該國同意受拘束的「重要基礎」。亦即，若無此項錯誤，該國即不會締結條約，或至少不會依相同條件締結條約。無關緊要的枝節性錯誤，不足以影響同意的效力。\n\n### 3. 不得主張錯誤的情形\n\n依第48條第2項，一國如有下列情形，不得援引錯誤：\n\n1. 該國以自己的行為促成錯誤；\n2. 當時情勢足以使該國注意到可能存在錯誤。\n\n此乃基於誠信原則。一國不得因自身疏失或明知可能有誤而未查證，嗣後再以錯誤為由否定條約。\n\n### 4. 文字錯誤\n\n依第48條第3項，若錯誤僅涉及條約文字的措辭、抄寫或印刷錯誤，並不影響條約效力，而應依第79條所定程序更正條約文本。\n\n### 5. 法律效果\n\n錯誤並不使條約當然無效，而是受錯誤影響的國家「得主張」其同意無效，屬相對無效。該國如明知錯誤後仍明示同意條約有效，或以行為默認條約有效，依第45條可能喪失援引錯誤的權利。\n\n## （三）詐欺：第49條\n\n### 1. 意義\n\n依第49條，一國如因另一談判國的詐欺行為而締結條約，得援引詐欺作為其同意受條約拘束無效的理由。詐欺係指一談判國故意以虛偽陳述、隱匿重要事實、偽造資料或其他欺罔手段，使另一國陷於錯誤，並因而同意締結條約。\n\n### 2. 成立要件\n\n第一，必須存在另一「談判國」的詐欺行為。行為原則上須可歸責於參與條約談判的國家。若僅為無關第三人所為，而無法歸責於締約國，通常不能直接適用第49條。\n\n第二，行為人須具有故意欺罔的主觀意圖。單純提供錯誤資料、疏忽、過失或誤解，尚不足構成詐欺，而可能僅涉及第48條的錯誤。\n\n第三，詐欺必須與受害國締約同意間具有因果關係。即受害國是「因詐欺行為」而同意締約。若詐欺事項與該國締約決定無關，則不得據以主張同意無效。\n\n第四，詐欺須具有一定重要性。詐欺所涉及的事項，必須足以影響國家的締約判斷；無關緊要的陳述或談判策略，不當然構成第49條的詐欺。\n\n### 3. 法律效果\n\n受詐欺國得主張其同意受條約拘束無效，屬相對無效，而非條約當然、自動失效。詐欺通常只得由受詐欺國主張；若該國知悉詐欺後仍明示接受條約，或依其行為應認為已默認條約有效，依第45條即可能喪失援引權。\n\n## （四）賄賂：第50條\n\n### 1. 意義\n\n依第50條，一國同意受條約拘束，如係因另一談判國直接或間接賄賂該國代表而作成，受賄代表所屬國得援引賄賂，主張其同意無效。本條旨在確保國家代表締約意思形成的廉潔性，避免締約結果受到私人利益不當干預。\n\n### 2. 成立要件\n\n第一，賄賂的對象必須是代表一國參與締約的代表。包括具有締約權限或實際參與談判、簽署、表示同意受拘束的國家代表。\n\n第二，賄賂行為必須由另一談判國直接或間接實施。直接賄賂，是由另一談判國直接給付金錢或利益；間接賄賂，則可透過代理人、私人企業、中間人或其他管道提供利益。\n\n第三，必須存在不正利益。除金錢外，亦可能包括財產、職位、契約、特殊待遇或其他足以影響代表判斷的私人利益。\n\n第四，賄賂與國家締約同意間須具有因果關係。亦即，該代表因受賄而影響談判立場或作成同意，且該影響反映於國家同意受條約拘束的過程。一般外交禮遇、合理餽贈或正常接待，如不足以不當影響代表的締約判斷，並不構成本條所稱賄賂。\n\n### 3. 法律效果\n\n受賄代表所屬國得援引賄賂，主張其受條約拘束的同意無效，屬相對無效。其目的並非保護收受賄賂的代表，而是保護國家締約意思不受外國不法干預。受害國若知情後仍承認條約效力，亦可能依第45條喪失主張權。\n\n## （五）強迫：第51條\n\n### 1. 意義\n\n第51條所規範的強迫，是指對「國家代表本人」施以行為或威脅，使其被迫表示同意受條約拘束。此處應與第52條對國家使用或威脅使用武力相區別：第51條係強迫國家代表；第52條係以武力威脅或使用武力強迫國家。\n\n### 2. 成立要件\n\n第一，強迫對象必須是國家代表。即代表國家談判、簽署或表示受條約拘束同意的人。\n\n第二，必須存在針對代表的行為或威脅。例如拘禁、暴力、死亡威脅、酷刑、迫害，或以危害代表本人及其家屬生命、身體或自由相威脅。\n\n第三，強迫必須達到剝奪代表自由意思，使其所作的同意並非國家正常、自由形成之意思表示。一般政治壓力、外交壓力或經濟談判壓力，通常不足以構成第51條的強迫。\n\n第四，強迫與同意間須有因果關係。代表必須是因受到強迫，才表示國家同意受條約拘束。\n\n### 3. 法律效果\n\n第51條明定，由強迫國家代表所取得的國家同意「不具任何法律效果」。因此，與第48條至第50條不同，第51條不是單純可由國家選擇撤銷的同意瑕疵，而是該同意自始不生法律效果。依第44條第5項，涉及第51條的情形不得將條約個別條款分離保存；依第45條，亦不得因事後默認而使其有效。\n\n## （六）以武力威脅或使用武力：第52條\n\n### 1. 意義\n\n依第52條，條約如係以違反《聯合國憲章》所揭示國際法原則的武力威脅或武力使用迫使一國締結者，該條約無效。其規範基礎主要是《聯合國憲章》第2條第4項所確立的禁止以武力威脅或使用武力原則。\n\n### 2. 成立要件\n\n第一，必須存在武力威脅或武力使用。典型情形包括侵略、軍事占領、武裝攻擊、以即將發動軍事攻擊迫使他國締約，或以軍事力量迫使戰敗國割讓領土、提供基地或接受不平等條件。\n\n第二，武力威脅或使用必須違反《聯合國憲章》所體現的國際法原則。因此，若武力使用本身具有合法依據，例如依《聯合國憲章》第51條行使自衛權，或依安全理事會第七章授權採取行動，是否當然導致相關條約無效，不能一概而論；第52條所針對的是「非法」武力。\n\n第三，非法武力與條約締結間須有因果關係。亦即，該國係因受到非法武力威脅或武力使用，才被迫同意締結條約。\n\n第四，強制對象是國家本身。這與第51條針對個別代表不同。第52條所涉及的是對國家領土、人民、政府或國家安全施加軍事壓力。\n\n### 3. 是否包括經濟或政治壓力\n\n第52條明文使用「武力」概念，通說主要指武裝力量或軍事武力。單純的經濟制裁、斷絕援助、政治施壓或外交孤立，縱然可能極為強烈，原則上仍不當然構成第52條所稱武力。然而，若經濟或政治措施與軍事威脅結合，或實質上構成違反《聯合國憲章》的武力威脅，則仍可能適用本條。\n\n### 4. 法律效果\n\n違反第52條所締結的條約自始無效，而非僅由受害國選擇撤銷。依第44條第5項，不能僅切割受強迫影響的個別條款而保留其餘部分；整個條約均屬無效。此種無效亦不得因受害國事後默認而治癒。\n\n## （七）違反國際法強制規則：第53條\n\n### 1. 意義\n\n依第53條，條約在締結時如與一般國際法的強制規則相牴觸，該條約無效。國際法強制規則，又稱「絕對法」或jus cogens，係國際社會全體國家接受並承認為不得減損，且僅得由具有相同性質的後來一般國際法規則加以變更的規則。\n\n### 2. 成立要件\n\n第一，必須是一項「一般國際法規則」。因此，原則上須具有普遍適用性，而非僅存在於特定區域或少數國家間的特殊規則。\n\n第二，須為國際社會全體國家所接受並承認。此處並非要求每一國均個別、明示同意，而是要求國際社會整體具有高度普遍的接受與承認。少數國家的反對，不必然妨礙強制規則的形成。\n\n第三，該規則具有不得減損的性質。國家不得以條約約定排除、變更或違反該規則。此點正是強制規則與一般任意國際法規則的主要差異。\n\n第四，該規則只能由具有相同性質的後來一般國際法強制規則加以變更。亦即，普通條約、個別國家實踐或一般國際法規則，均不足以變更既存的強制規則。\n\n第五，條約在締結時即與該強制規則牴觸。例如兩國締結條約，約定共同實施侵略、種族滅絕、奴隸制度、酷刑或其他嚴重違反國際法基本規範的行為，即可能因違反強制規則而無效。\n\n### 3. 常見的強制規則\n\n雖然第53條未列舉具體項目，但通常被認為具有或可能具有強制法性質者，包括：\n\n1. 禁止侵略\n2. 禁止種族滅絕\n3. 禁止奴隸制度及奴隸貿易\n4. 禁止酷刑\n5. 禁止種族隔離\n6. 民族自決原則的核心內容\n7. 國際人道法中若干不可減損的基本規則\n\n惟是否構成強制規則，仍須依國際社會全體國家的接受與承認加以判斷，不能僅因某規則十分重要，即當然認定為強制規則。\n\n### 4. 法律效果\n\n與國際法強制規則相牴觸的條約自始無效，且不得以當事國同意、保留、默認或特別約定使其有效。依第44條第5項，不能將違反強制規則的條款與條約其他部分分離，原則上整個條約均屬無效。\n\n依第71條，締約國並負有下列義務：\n\n1. 儘量消除依違反強制規則之條約所實施行為的一切後果\n2. 使彼此關係符合該強制規則\n\n此外，第53條處理的是「條約締結時」即與既存強制規則衝突的情形。若條約締結後才出現新的國際法強制規則，則應適用第64條，原條約自新強制規則形成時起失效並終止，而非自始無效。\n\n## （八）六種類型之比較\n\n第48條錯誤、第49條詐欺及第50條賄賂，均屬國家締約同意形成過程中的瑕疵。其法律效果是受害國「得援引」該事由主張其同意無效，故屬相對無效；受害國在知悉事實後如明示承認或默示接受條約，可能依第45條喪失主張權。\n\n第51條強迫國家代表、第52條以非法武力強迫國家，以及第53條條約違反國際法強制規則，則涉及國際法基本秩序。第51條下的同意不具任何法律效果，第52條及第53條下的條約自始無效，均不得因事後承認而治癒，亦不得以條款可分性保留條約的一部分。\n\n因此，六種類型可以整理如下：\n\n| 類型 | 條文 | 主要對象或原因 | 效果 |\n| --- | --- | --- | --- |\n| 錯誤 | 第48條 | 對重要事實或情況的錯誤認識 | 得主張同意無效 |\n| 詐欺 | 第49條 | 另一談判國故意欺罔 | 得主張同意無效 |\n| 賄賂 | 第50條 | 另一談判國賄賂本國代表 | 得主張同意無效 |\n| 強迫代表 | 第51條 | 對國家代表施以行為或威脅 | 同意不具法律效果 |\n| 非法武力 | 第52條 | 對國家威脅或使用非法武力 | 條約自始無效 |\n| 強制規則 | 第53條 | 條約內容牴觸既存jus cogens | 條約自始無效 |\n\n## （九）結論\n\n《維也納條約法公約》第48條至第53條，一方面透過錯誤、詐欺及賄賂制度，保障國家締約意思的真實與廉潔；另一方面透過禁止強迫代表、禁止以非法武力迫使國家締約，以及國際法強制規則制度，維護國家主權平等、自由同意及國際社會的基本法律秩序。\n\n作答時尤應指出：第48條至第50條屬相對無效，須由受害國援引；第51條至第53條則屬絕對無效，不能因默認或條款分離而治癒。此一區分即為本題最重要的體系性結論。";
