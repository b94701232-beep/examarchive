    { id: IMPORT_BATCH_ID_44, data: SEED_INTL_WAISHI_POLICE },
    { id: IMPORT_BATCH_ID_45, data: SEED_INTL_NTPU },
    { id: IMPORT_BATCH_ID_46, data: SEED_INTL_NTPU2 },
    { id: IMPORT_BATCH_ID_47, data: SEED_INTL_ZHENGDA_102 },
    { id: IMPORT_BATCH_ID_48, data: SEED_IR_ZHENGDA_EA }
  ];

  if(batchesToImport.some(b => !importedBatches.includes(b.id))){
    updateLoadingProgress(65, '正在準備匯入歷屆試題批次…');
  }

  batchesToImport.forEach(batch=>{
    try{
      if(!importedBatches.includes(batch.id)){
        if(Array.isArray(batch.data)){
          batch.data.forEach((seed, idx)=>{
            entries.push({
              id: 'seed-' + batch.id + '-' + idx,
              createdAt: Date.now(),
              ...seed
            });
          });
        }
        importedBatches.push(batch.id);
        changed = true;
      }
    }catch(batchErr){
      // 單一批次失敗不應影響其他批次的匯入
      window.__loadDiagnostics.batchError = (window.__loadDiagnostics.batchError || '') + batch.id + ': ' + batchErr.message + '; ';
    }
  });

  let saveOk = true;
  if(changed){
    updateLoadingProgress(80, '正在將更新後的資料寫回 Firebase…');
    if(window.__cloudMode && db){
      try{
        await firestoreBatchWriteEntries(entries);
        await firestoreSetImportedBatches(importedBatches);
        updateStorageStatus('ok');
      }catch(cloudSaveErr){
        saveOk = false;
        window.__loadDiagnostics.saveEntriesFailed = 'cloud: ' + cloudSaveErr.message;
        updateStorageStatus('error');
      }
    }else{
      saveOk = await saveToStorage();
      if(saveOk){
        try{ await window.storage.set('exam-archive-imported-batches', JSON.stringify(importedBatches), false); }catch(e){}
      }else{
        window.__loadDiagnostics.importedBatchesSkipped = '題目資料存檔失敗，已跳過標記已匯入批次，下次會重新嘗試匯入。';
      }
    }
  }

  showDiagnosticsIfNeeded(batchesToImport.length);
  render();
}

function showDiagnosticsIfNeeded(expectedBatchCount){
  const d = window.__loadDiagnostics || {};
  const hasError = d.storageGetError || d.migrationError || d.batchError || d.importedBatchesGetError || d.backgroundRefreshError;
  const suspiciouslyLow = entries.length === 0 && expectedBatchCount > 0;
  if(!hasError && !suspiciouslyLow) return;

  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#A63A32;color:#fff;padding:12px 16px;font-family:-apple-system,sans-serif;font-size:13px;line-height:1.6;max-height:60vh;overflow-y:auto;';
  let html = '<strong>⚠ 診斷訊息（請截圖給 Claude）</strong><br>';
  html += '題目數量：' + entries.length + '（預期批次數：' + expectedBatchCount + '）<br>';
  if(d.storageGetError) html += 'storageGetError: ' + chineseSafe(d.storageGetError) + '<br>';
  if(d.selfHealTriggered) html += '🔧 ' + chineseSafe(d.selfHealTriggered) + '<br>';
  if(d.importedBatchesGetError) html += 'importedBatchesGetError: ' + chineseSafe(d.importedBatchesGetError) + '<br>';
  if(d.migrationError) html += 'migrationError: ' + chineseSafe(d.migrationError) + '<br>';
  if(d.batchError) html += 'batchError: ' + chineseSafe(d.batchError) + '<br>';
  if(d.backgroundRefreshError) html += 'backgroundRefreshError: ' + chineseSafe(d.backgroundRefreshError) + '（背景更新失敗，畫面可能停留在較舊的本機快取資料）<br>';
  if(d.saveEntriesFailed) html += 'saveEntriesFailed: ' + chineseSafe(d.saveEntriesFailed) + '（資料量可能超過瀏覽器離線儲存空間上限）<br>';
  if(d.importedBatchesSkipped) html += chineseSafe(d.importedBatchesSkipped) + '<br>';
  html += '<button onclick="this.parentElement.remove()" style="margin-top:8px;padding:4px 10px;">關閉</button>';
  banner.innerHTML = html;
  document.body.insertBefore(banner, document.body.firstChild);
}

async function saveToStorage(){
  updateStorageStatus('saving');
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
    updateStorageStatus('ok');
    return true;
  }catch(e){
    try{
      await new Promise(r=>setTimeout(r, 800));
      await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
      updateStorageStatus('ok');
      return true;
    }catch(e2){
      try{
        await new Promise(r=>setTimeout(r, 1500));
        await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
        updateStorageStatus('ok');
        return true;
      }catch(e3){
        // 完全靜默：不輸出任何 console 訊息，避免介面跳出提示面板
        updateStorageStatus('error');
        window.__loadDiagnostics = window.__loadDiagnostics || {};
        window.__loadDiagnostics.saveEntriesFailed = e3.message || String(e3);
        return false;
      }
    }
  }
}

let isSignedIn = false;

function updateAuthUI(user){
  const btn = document.getElementById('authStatusBtn');
  if(!btn) return;
  if(user){
    isSignedIn = true;
    btn.textContent = '✓ 已登入（' + user.email + '）點此登出';
    btn.onclick = ()=>{
      if(confirm('確定要登出嗎？登出後將無法編輯或新增題目。')){
        auth.signOut();
      }
    };
  }else{
    isSignedIn = false;
    btn.textContent = '🔒 未登入（僅可瀏覽）';
    btn.onclick = openAuthModal;
  }
}

function openAuthModal(){
  document.getElementById('authError').style.display = 'none';
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
  document.getElementById('authModal').style.display = 'flex';
}

function closeAuthModal(){
  document.getElementById('authModal').style.display = 'none';
}

if(window.__cloudMode && auth){
  auth.onAuthStateChanged(user=>{ updateAuthUI(user); });
}else{
  document.addEventListener('DOMContentLoaded', ()=>{
    const btn = document.getElementById('authStatusBtn');
    if(btn) btn.style.display = 'none';
  });
}

document.addEventListener('DOMContentLoaded', ()=>{
  const cancelBtn = document.getElementById('authCancelBtn');
  const submitBtn = document.getElementById('authSubmitBtn');
  if(cancelBtn) cancelBtn.addEventListener('click', closeAuthModal);
  if(submitBtn) submitBtn.addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const errEl = document.getElementById('authError');
    errEl.style.display = 'none';
    if(!auth){
      errEl.textContent = '目前未連上雲端服務，無法登入。';
      errEl.style.display = 'block';
      return;
    }
    try{
      await auth.signInWithEmailAndPassword(email, password);
      closeAuthModal();
    }catch(authErr){
      errEl.textContent = '登入失敗：' + (authErr.message || '帳號或密碼錯誤');
      errEl.style.display = 'block';
    }
  });
  const authModalEl = document.getElementById('authModal');
  if(authModalEl) authModalEl.addEventListener('click', (ev)=>{ if(ev.target.id === 'authModal') closeAuthModal(); });
});

function updateStorageStatus(state){
  const el = document.getElementById('storageStatus');
  const textEl = document.getElementById('storageStatusText');
  if(!el || !textEl) return;
  let mode;
  if(window.__cloudMode){ mode = 'Firebase 雲端儲存'; }
  else if(window.__storageMode === 'local'){ mode = '本機離線儲存'; }
  else{ mode = 'Claude 雲端儲存'; }
  el.classList.remove('saving','error');
  if(state === 'saving'){
    el.classList.add('saving');
    textEl.textContent = mode + '・儲存中…';
  }else if(state === 'error'){
    el.classList.add('error');
    textEl.textContent = mode + '・儲存失敗';
  }else{
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    textEl.textContent = mode + '・已存檔 ' + hh + ':' + mm;
  }
}

function chineseSafe(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function inlineMarkdown(s){
  // 先跳脫HTML，再處理行內語法：**粗體**、*斜體*、`代碼`
  let out = escapeHtml(s);
  out = out.replace(/`([^`]+?)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
  return out;
}

function typesetMath(){
  // render() 會動態重建題目／解答內容，因此每次 render 後都讓 MathJax 重新處理 LaTeX。
  // MathJax 尚未載入時直接略過，不影響頁面正常顯示。
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetClear && MathJax.typesetClear([document.getElementById('content')]);
    MathJax.typesetPromise([document.getElementById('content')]).catch(()=>{});
  }
}

function renderMarkdown(text){
  if(!text) return '';
  // 修正 ChatGPT 常見的編號格式：有些答案會把每個項目都輸出成「1.」，
  // 且項目說明之間夾有一般段落。瀏覽器會因此把每段視為新的清單而全部顯示 1。
  // 這裡先在同一個中文大段落（如（一）（二）（三））內，自動將重複的 1. 依序改為 1.2.3.4.；
  // 遇到新的（中文數字）段落標題時重新從 1 開始。
  const rawLines = text.replace(/\r\n/g, '\n').split('\n');
  let autoOrderedNo = 0;
  const lines = rawLines.map(rawLine => {
    const t = rawLine.trim();
    if(/^[(（][一二三四五六七八九十]+[)）]/.test(t)){
      autoOrderedNo = 0;
      return rawLine;
    }
    const repeatedOne = t.match(/^1[.、]\s+(.*)$/);
    if(repeatedOne){
      autoOrderedNo += 1;
      const indent = rawLine.match(/^\s*/)[0];
      return indent + autoOrderedNo + '. ' + repeatedOne[1];
    }
    // 若來源本身已有正確 2. 3. 4.，尊重原編號並同步計數器。
    const explicitNo = t.match(/^(\d+)[.、]\s+(.*)$/);
    if(explicitNo){
      autoOrderedNo = Number(explicitNo[1]);
    }
    return rawLine;
  });
  let html = '';
  let i = 0;
  let listType = null; // 'ul' | 'ol' | null
  let inTable = false;
  let tableRows = [];

  function closeList(){
    if(listType){ html += listType === 'ul' ? '</ul>' : '</ol>'; listType = null; }
  }
  function flushTable(){
    if(!inTable) return;
    const rows = tableRows.filter(r => !/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(r));
    if(rows.length){
      html += '<table>';
      rows.forEach((row, idx)=>{
        const cells = row.replace(/^\||\|$/g, '').split('|').map(c=>c.trim());
        const tag = idx === 0 ? 'th' : 'td';
        html += '<tr>' + cells.map(c=>'<'+tag+'>'+inlineMarkdown(c)+'</'+tag+'>').join('') + '</tr>';
      });
      html += '</table>';
    }
    inTable = false;
    tableRows = [];
  }

  while(i < lines.length){
    const raw = lines[i];
    const line = raw.trim();

    if(line === ''){
      flushTable();
      // 空行不一定代表清單結束：如果往下第一個非空行仍是同類型的清單項目
      // （例如 ChatGPT 的解答習慣在每個編號項目之間空一行），就不要斷開清單，
      // 否則每一項都會變成獨立的 <ol>，編號永遠顯示 1. 而不會累加成 1.2.3.4.
      if(listType){
        let j = i + 1;
        while(j < lines.length && lines[j].trim() === '') j++;
        const nextLine = j < lines.length ? lines[j].trim() : '';
        const continuesUl = listType === 'ul' && /^[-*]\s+/.test(nextLine);
        const continuesOl = listType === 'ol' && /^\d+[.、]\s+/.test(nextLine);
        if(!continuesUl && !continuesOl){
          closeList();
        }
      }
      i++;
      continue;
    }

    // 正常的 LaTeX 區塊公式：\[ ... \]
    // Markdown renderer 原本會把起始符、公式內容、結束符各自包成不同 <p>，
    // MathJax 因此無法跨 DOM 元素辨識。這裡先把整個區塊收集成同一個元素。
    if(line === '\\['){
      closeList();
      flushTable();
      const mathLines = [];
      let k = i + 1;
      while(k < lines.length && lines[k].trim() !== '\\]'){
        mathLines.push(lines[k]);
        k++;
      }
      if(k < lines.length && lines[k].trim() === '\\]'){
        const mathText = mathLines.join('\n').trim();
        html += '<div class="math-display">\\[' + escapeHtml(mathText) + '\\]</div>';
        i = k + 1;
        continue;
      }
    }

    // 也支援 $$ ... $$ 的區塊公式。
    if(line === '$$'){
      closeList();
      flushTable();
      const mathLines = [];
      let k = i + 1;
      while(k < lines.length && lines[k].trim() !== '$$'){
        mathLines.push(lines[k]);
        k++;
      }
      if(k < lines.length && lines[k].trim() === '$$'){
        const mathText = mathLines.join('\n').trim();
        html += '<div class="math-display">\\[' + escapeHtml(mathText) + '\\]</div>';
        i = k + 1;
        continue;
      }
    }

    // 修復 LaTeX 區塊公式：部分舊資料中的 \[ ... \] 在寫入 JavaScript / Firebase 後
    // 反斜線可能被吃掉，變成三段式的「[ / 公式 / ]」。
    // 遇到單獨一行 [ 時，收集到下一個單獨 ]，自動還原成 MathJax display math。
    if(line === '['){
      closeList();
      flushTable();
      const mathLines = [];
      let k = i + 1;
      while(k < lines.length && lines[k].trim() !== ']'){
        if(lines[k].trim() !== '') mathLines.push(lines[k].trim());
        k++;
      }
      if(k < lines.length && lines[k].trim() === ']' && mathLines.length){
        const mathText = mathLines.join(' ');
        html += '<div class="math-display">\\[' + escapeHtml(mathText) + '\\]</div>';
        i = k + 1;
        continue;
      }
      // 找不到成對的 ] 時，仍按一般文字處理，避免誤吞內容。
    }

    // 表格偵測：含有 | 且下一行是分隔線，或已經在表格中
    if(/\|/.test(line) && (inTable || (lines[i+1] && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i+1])))){
      closeList();
      inTable = true;
      tableRows.push(line);
      i++;
      continue;
    }
    flushTable();

    const hMatch = line.match(/^(#{1,4})\s+(.*)$/);
    if(hMatch){
      closeList();
      const level = hMatch[1].length;
      html += '<h'+level+'>' + inlineMarkdown(hMatch[2]) + '</h'+level+'>';
      i++;
      continue;
    }

    if(/^(-{3,}|\*{3,})$/.test(line)){
      closeList();
      html += '<hr>';
      i++;
      continue;
    }

    const ulMatch = line.match(/^[-*]\s+(.*)$/);
    if(ulMatch){
      if(listType !== 'ul'){ closeList(); html += '<ul>'; listType = 'ul'; }
      html += '<li>' + inlineMarkdown(ulMatch[1]) + '</li>';
      i++;
      continue;
    }

    const olMatch = line.match(/^(\d+)[.、]\s+(.*)$/);
    if(olMatch){
      const itemNo = Number(olMatch[1]) || 1;
      // 永遠保留來源文字中的實際編號（例如 1. / 2. / 3. / 4.）。
      // 國安等解答常在每個編號項目之間插入一般說明段落，會使 <ol> 被拆成多段；
      // 因此除了在新清單用 start 指定起始值，也在每個 <li> 明確指定 value，
      // 避免瀏覽器把拆開後的清單全部重新從 1 開始。
      if(listType !== 'ol'){ closeList(); html += '<ol start="' + itemNo + '">'; listType = 'ol'; }
      html += '<li value="' + itemNo + '">' + inlineMarkdown(olMatch[2]) + '</li>';
      i++;
      continue;
    }

    // 引用區塊（> 開頭）：ChatGPT 貼過來的內容常常每一行引用之間夾了空行，
    // 也常常把 **粗體** 拆成跨越好幾行才收尾，所以這裡把連續（可穿過空行）
    // 的引用行合併成一段文字再一起做行內語法解析，粗體才能正確跨行配對，
    // 而不是留下原始的 > 和 ** 符號沒被轉換。
    const bqMatch = line.match(/^>\s?(.*)$/);
    if(bqMatch){
      closeList();
      const bqLines = [bqMatch[1]];
      let k = i + 1;
      while(k < lines.length){
        let m = k;
        while(m < lines.length && lines[m].trim() === '') m++;
        if(m >= lines.length) break;
        const nextBq = lines[m].trim().match(/^>\s?(.*)$/);
        if(!nextBq) break;
        bqLines.push(nextBq[1]);
        k = m + 1;
      }
      html += '<blockquote>' + inlineMarkdown(bqLines.join('\n')).replace(/\n/g, '<br>') + '</blockquote>';
      i = k;
      continue;
    }

    closeList();
    html += '<p>' + inlineMarkdown(line) + '</p>';
    i++;
  }
  flushTable();
  closeList();
  return html;
}

function renderSubbar(){
  const subbar = document.getElementById('subbar');
  const catEntries = entries.filter(e => e.category === currentCat);
  const subs = subLists[currentCat];
  const unassignedCount = catEntries.filter(e => !e.sub || !subs.includes(e.sub)).length;

  const chips = [`<div class="subchip ${currentSub==='all'?'active':''}" data-sub="all">全部<span class="n">${catEntries.length}</span></div>`]
    .concat(subs.map(s=>{
      const n = catEntries.filter(e=>e.sub===s).length;
      return `<div class="subchip ${currentSub===s?'active':''}" data-sub="${chineseSafe(s)}">${chineseSafe(s)}<span class="n">${n}</span></div>`;
    }));

  if(unassignedCount > 0){
    chips.push(`<div class="subchip unassigned ${currentSub==='__unassigned__'?'active':''}" data-sub="__unassigned__">未分類<span class="n">${unassignedCount}</span></div>`);
  }

  subbar.innerHTML = chips.join('');
  subbar.querySelectorAll('.subchip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      currentSub = chip.dataset.sub;
      render();
    });
  });
}

function updateLoadingProgress(percent, text){
  const fill = document.getElementById('loadingBarFill');
  const label = document.getElementById('loadingBarText');
  if(fill) fill.style.width = percent + '%';
  if(label && text) label.textContent = text;
}

function hideLoadingOverlay(){
  const overlay = document.getElementById('loadingOverlay');
  if(overlay){
    updateLoadingProgress(100, '完成');
    setTimeout(()=>{ overlay.style.display = 'none'; }, 200);
  }
}

function render(){
  document.getElementById('panel-title').textContent = '卷宗分類：' + catNames[currentCat];
  document.getElementById('count-intl').textContent = entries.filter(e=>e.category==='intl').length || '';
  document.getElementById('count-ir').textContent = entries.filter(e=>e.category==='ir').length || '';
  document.getElementById('count-history').textContent = entries.filter(e=>e.category==='history').length || '';
  document.getElementById('count-econ').textContent = entries.filter(e=>e.category==='econ').length || '';
  document.getElementById('count-politics').textContent = entries.filter(e=>e.category==='politics').length || '';
  document.getElementById('count-econstudy').textContent = entries.filter(e=>e.category==='econstudy').length || '';
  hideLoadingOverlay();

  renderSubbar();

  const list = entries.filter(e => {
    if(e.category !== currentCat) return false;
    if(currentSub === 'all') return true;
    if(currentSub === '__unassigned__') return !e.sub || !subLists[currentCat].includes(e.sub);
    return e.sub === currentSub;
  });
  const content = document.getElementById('content');
  const scopeLabel = currentSub === 'all' ? catNames[currentCat] : (currentSub === '__unassigned__' ? '未分類' : currentSub);

  if(list.length === 0){
    content.innerHTML = `<div class="empty-state"><span class="big">卷宗空白</span>尚未建立「${chineseSafe(scopeLabel)}」的題目，點擊右上角「＋ 新增題目」開始存卷。</div>`;
    typesetMath();
    return;
  }

  const byYear = {};
  list.forEach(e=>{
    const y = e.year || '未標年度';
    if(!byYear[y]) byYear[y] = [];
    byYear[y].push(e);
  });

  const years = Object.keys(byYear).sort((a,b)=>{
    const na = parseInt(a), nb = parseInt(b);
    if(!isNaN(na) && !isNaN(nb)) return nb - na;
    return b.localeCompare(a);
  });

  content.innerHTML = years.map(y=>{
    const isOpen = openYears.has(currentCat+'-'+y);
    const items = byYear[y];
    const entriesHtml = items.map((e, idx)=>{
      return `
        <div class="entry">
          <div class="stamp">${idx+1}</div>
          <div class="entry-body">
            ${currentSub==='all' ? `<div class="sub-tag">${chineseSafe(e.sub||'未分類')}</div>` : ''}
            <p class="q-text">${chineseSafe(e.question)}</p>
            ${e.questionImage ? `<img class="q-image" src="${e.questionImage}" alt="題目附圖">` : ''}
            <div class="entry-actions">
              <button class="link-btn" onclick="copyQuestion('${e.id}', this)">複製</button>
              <button class="link-btn" onclick="toggleAnswer('${e.id}','chatgpt')">ChatGPT 解答</button>
              <button class="link-btn" onclick="toggleAnswer('${e.id}','gemini')">Gemini 解答</button>
              <button class="link-btn" onclick="toggleAnswer('${e.id}','claude')">Claude 解答</button>
              <button class="link-btn" onclick="editEntry('${e.id}')">編輯</button>
              <button class="link-btn danger" onclick="deleteEntry('${e.id}')">刪除</button>
            </div>
            <div class="answer-box" id="ans-${e.id}-chatgpt">
              <div class="answer-label">ChatGPT 解答</div>
              ${e.answerChatGPT ? renderMarkdown(e.answerChatGPT) : chineseSafe('（尚未填寫解答）')}
            </div>
            <div class="answer-box" id="ans-${e.id}-gemini">
              <div class="answer-label">Gemini 解答</div>
              ${e.answerGemini ? renderMarkdown(e.answerGemini) : chineseSafe('（尚未填寫解答）')}
            </div>
            <div class="answer-box" id="ans-${e.id}-claude">
              <div class="answer-label">Claude 解答</div>
              ${e.answerClaude ? renderMarkdown(e.answerClaude) : chineseSafe('（尚未填寫解答）')}
            </div>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="year-block ${isOpen?'open':''}" id="yb-${currentCat}-${y}">
        <div class="year-head" onclick="toggleYear('${y}')">
          <span class="year-tag">${y}</span>
          <span class="year-label">年度題卷</span>
          <span class="year-meta">共 ${items.length} 題</span>
          <span class="chevron">▶</span>
        </div>
        <div class="year-entries">${entriesHtml}</div>
      </div>
    `;
  }).join('');

  // 支援動態內容中的 LaTeX：例如 \(i^*\) 會顯示成 i*（* 為上標）。
  typesetMath();
}

function toggleYear(y){
  const key = currentCat+'-'+y;
  if(openYears.has(key)) openYears.delete(key);
  else openYears.add(key);
  render();
}

function copyQuestion(id, btn){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  const text = e.question;

  const showCopied = () => {
    if(!btn) return;
    const original = btn.textContent;
    btn.textContent = '已複製 ✓';
    btn.disabled = true;
    setTimeout(()=>{
      btn.textContent = original;
      btn.disabled = false;
    }, 1500);
  };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(()=>{
      fallbackCopy(text, showCopied);
    });
  }else{
    fallbackCopy(text, showCopied);
  }
}

function fallbackCopy(text, cb){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    if(cb) cb();
  }catch(e){
    alert('複製失敗，請手動選取文字複製。');
  }
}

function toggleAnswer(id, source){
  const box = document.getElementById('ans-'+id+'-'+source);
  if(!box) return;
  const willShow = !box.classList.contains('show');
  ['chatgpt','gemini','claude'].forEach(s=>{
    const b = document.getElementById('ans-'+id+'-'+s);
    if(b) b.classList.remove('show');
  });
  if(willShow) box.classList.add('show');
}

function editEntry(id){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  document.getElementById('modalTitle').textContent = '編輯題目';
  document.getElementById('editId').value = e.id;
  document.getElementById('f-cat').value = e.category;
  populateSubSelect(e.category, e.sub);
  document.getElementById('f-year').value = e.year;
  document.getElementById('f-question').value = e.question;
  document.getElementById('f-answer-chatgpt').value = e.answerChatGPT || '';
  document.getElementById('f-answer-gemini').value = e.answerGemini || '';
  document.getElementById('f-answer-claude').value = e.answerClaude || '';
  document.getElementById('f-image-input').value = '';
  if(e.questionImage){
    currentImageData = e.questionImage;
    document.getElementById('image-preview').src = e.questionImage;
    document.getElementById('image-preview-wrap').style.display = 'block';
  }else{
    currentImageData = null;
    document.getElementById('image-preview-wrap').style.display = 'none';
  }
  document.getElementById('overlay').classList.add('show');
}

async function deleteEntry(id){
  if(!confirm('確定要刪除這一題嗎？此動作無法復原。')) return;
  entries = entries.filter(e=>e.id!==id);
  // 修正：原本只寫入本機離線儲存，雲端模式下 Firestore 裡的資料並沒有真的被刪除，
  // 導致重新整理或換裝置後，刪除的題目又會從雲端重新讀回來。這裡改成跟新增／編輯一樣，
  // 雲端模式下先呼叫 firestoreDeleteEntry 真正刪除雲端文件，失敗時才退回本機備援儲存。
  if(window.__cloudMode && db){
    updateStorageStatus('saving');
    try{
      await firestoreDeleteEntry(id);
      updateStorageStatus('ok');
    }catch(cloudDeleteErr){
      updateStorageStatus('error');
      try{ await saveToStorage(); }catch(e){}
    }
  }else{
    await saveToStorage();
  }
  render();
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentCat = tab.dataset.cat;
    currentSub = 'all';
    render();
  });
});

function populateSubSelect(cat, selected){
  const sel = document.getElementById('f-sub');
  sel.innerHTML = subLists[cat].map(s=>`<option value="${chineseSafe(s)}">${chineseSafe(s)}</option>`).join('');
  if(selected) sel.value = selected;
}

document.getElementById('f-cat').addEventListener('change', (ev)=>{
  populateSubSelect(ev.target.value);
});

document.getElementById('openAdd').addEventListener('click', ()=>{
  document.getElementById('modalTitle').textContent = '新增題目';
  document.getElementById('editId').value = '';
  document.getElementById('f-cat').value = currentCat;
  populateSubSelect(currentCat, currentSub !== 'all' ? currentSub : undefined);
  document.getElementById('f-year').value = '';
  document.getElementById('f-question').value = '';
  document.getElementById('f-answer-chatgpt').value = '';
  document.getElementById('f-answer-gemini').value = '';
  document.getElementById('f-answer-claude').value = '';
  document.getElementById('f-image-input').value = '';
  currentImageData = null;
  document.getElementById('image-preview-wrap').style.display = 'none';
  document.getElementById('overlay').classList.add('show');
});

document.getElementById('f-image-input').addEventListener('change', (ev)=>{
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  if(file.size > 4 * 1024 * 1024){
    alert('圖片檔案過大，請選擇小於 4MB 的圖片。');
    ev.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    currentImageData = reader.result;
    document.getElementById('image-preview').src = currentImageData;
    document.getElementById('image-preview-wrap').style.display = 'block';
  };
  reader.readAsDataURL(file);
});

document.getElementById('removeImageBtn').addEventListener('click', ()=>{
  currentImageData = null;
  document.getElementById('f-image-input').value = '';
  document.getElementById('image-preview-wrap').style.display = 'none';
});

document.getElementById('cancelBtn').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('show');
});
document.getElementById('overlay').addEventListener('click', (ev)=>{
  if(ev.target.id === 'overlay') document.getElementById('overlay').classList.remove('show');
});

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const id = document.getElementById('editId').value;
  const cat = document.getElementById('f-cat').value;
  const sub = document.getElementById('f-sub').value;
  const year = document.getElementById('f-year').value.trim();
  const question = document.getElementById('f-question').value.trim();
  const answerChatGPT = document.getElementById('f-answer-chatgpt').value.trim();
  const answerGemini = document.getElementById('f-answer-gemini').value.trim();
  const answerClaude = document.getElementById('f-answer-claude').value.trim();

  if(!question){
    alert('請至少填寫題目內容');
    return;
  }

  let savedEntry = null;
  if(id){
    const e = entries.find(x=>x.id===id);
    if(e){
      e.category = cat; e.sub = sub; e.year = year; e.question = question;
      e.answerChatGPT = answerChatGPT; e.answerGemini = answerGemini; e.answerClaude = answerClaude;
      delete e.answer;
      if(currentImageData){ e.questionImage = currentImageData; }
      else{ delete e.questionImage; }
      savedEntry = e;
    }
  }else{
    const newEntry = {
      id: 'e' + Date.now() + Math.random().toString(36).slice(2,7),
      category: cat, sub, year, question,
      answerChatGPT, answerGemini, answerClaude,
      createdAt: Date.now()
    };
    if(currentImageData){ newEntry.questionImage = currentImageData; }
    entries.push(newEntry);
    savedEntry = newEntry;
  }

  if(window.__cloudMode && db && savedEntry){
    updateStorageStatus('saving');
    try{
      await firestoreSaveEntry(savedEntry);
      updateStorageStatus('ok');
    }catch(cloudSaveErr){
      updateStorageStatus('error');
      // 雲端寫入失敗時，仍嘗試寫入本機離線儲存作為備援，避免這次編輯完全遺失
      try{ await saveToStorage(); }catch(e){}
    }
  }else{
    await saveToStorage();
  }
  currentCat = cat;
  currentSub = sub;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.cat === cat);
  });
  document.getElementById('overlay').classList.remove('show');
  render();
});

const fsBtn = document.getElementById('fullscreenBtn');
if(fsBtn){
  fsBtn.addEventListener('click', async ()=>{
    const el = document.documentElement;
    const isFull = document.fullscreenElement || document.webkitFullscreenElement;
    try{
      if(!isFull){
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if(!req) throw new Error('unsupported');
        await req.call(el);
      }else{
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if(exit) await exit.call(document);
      }
    }catch(err){
      alert('目前所在的瀏覽器視窗不允許切換全螢幕（通常是因為被包在 Claude 的預覽框架內，這是 Claude 那一層的限制，無法從網頁內部解除）。建議改用瀏覽器直接開啟此檔案，或使用瀏覽器本身的全螢幕／閱讀模式功能。');
    }
  });
  ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(evt=>{
    document.addEventListener(evt, ()=>{
      const isFull = document.fullscreenElement || document.webkitFullscreenElement;
      fsBtn.textContent = isFull ? '⤢' : '⛶';
    });
  });
}

function exportSnapshotHtml(){
  try{
    const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const startMarker = 'window.__SNAPSHOT_EXPORT_TAIL_START__';
    const endMarker = '__SNAPSHOT_EXPORT_TAIL_END__';
    const startIdx = fullHtml.indexOf(startMarker);
    if(startIdx === -1){
      alert('匯出失敗：找不到起始標記，請截圖回報給 Claude。');
      return;
    }
    const endIdx = fullHtml.indexOf(endMarker, startIdx);
    if(endIdx === -1){
      alert('匯出失敗：找不到結尾標記，請截圖回報給 Claude。');
      return;
    }
    const entriesJson = JSON.stringify(entries);
    const replacement =
      "window.__cloudMode = false;\n" +
      "entries = " + entriesJson + ";\n" +
      "render();\n" +
      "updateStorageStatus('ok');\n" +
      "hideLoadingOverlay();\n" +
      "saveToStorage();\n";
    // 只依賴起始標記本身是否存在，不依賴中間程式碼的確切格式，
    // 也不怕日後部署平台對 JS 做壓縮/移除註解導致比對失敗。
    const finalHtml = fullHtml.slice(0, startIdx) + replacement + '<\/script>\n</body>\n</html>';

    const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const filename = 'archive-snapshot-' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + '-' + pad(now.getHours()) + pad(now.getMinutes()) + '.html';
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }catch(exportErr){
    alert('匯出失敗：' + (exportErr.message || String(exportErr)));
  }
}

document.addEventListener('DOMContentLoaded', ()=>{
  const dlBtn = document.getElementById('downloadSnapshotBtn');
  if(dlBtn) dlBtn.addEventListener('click', exportSnapshotHtml);
  const refreshBtn = document.getElementById('refreshPageBtn');
  if(refreshBtn) refreshBtn.addEventListener('click', forceFirestoreRefresh);
});

window.addEventListener('load', ()=>{
  // defer script 可能晚於第一次 render 完成；載入後再補做一次公式排版。
  setTimeout(typesetMath, 100);
});

window.__SNAPSHOT_EXPORT_TAIL_START__ = true;
(function(){
  const loadingTimeoutMs = 20000;
  let finished = false;
  const timer = setTimeout(()=>{
    if(finished) return;
    const panel = document.querySelector('.panel');
    if(panel){
      const notice = document.createElement('div');
      notice.style.cssText = 'padding:16px;background:#fff3cd;border:1px solid #D9A441;border-radius:6px;margin:12px 0;font-size:13px;line-height:1.6;';
      notice.innerHTML = '⏳ 載入時間較久（超過20秒），可能是第一次把資料寫入 Firebase 雲端資料庫，資料量較大需要較長時間，請耐心等候；如果超過1-2分鐘仍無反應，代表可能真的卡住了，請截圖給 Claude 看主控台（Console）錯誤訊息。';
      panel.insertBefore(notice, panel.firstChild);
    }
  }, loadingTimeoutMs);
  loadEntries().then(()=>{
    finished = true;
    clearTimeout(timer);
    updateStorageStatus('ok');
  }).catch((err)=>{
    finished = true;
    clearTimeout(timer);
    const panel = document.querySelector('.panel');
    if(panel){
      const notice = document.createElement('div');
      notice.style.cssText = 'padding:16px;background:#A63A32;color:#fff;border-radius:6px;margin:12px 0;font-size:13px;line-height:1.6;';
      notice.textContent = '⚠ 載入發生錯誤：' + (err && err.message ? err.message : String(err));
      panel.insertBefore(notice, panel.firstChild);
    }
  });
})();
window.__SNAPSHOT_EXPORT_TAIL_END__ = true;
</script>
