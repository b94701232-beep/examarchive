{"category": "intl", "sub": "政大外交所", "year": "115", "question": "一、(30分)\n\n甲國及乙國領土接壤,在其之間的800多公里邊界中,兩國就其中一段邊界之確切位置有歧見,且長期以來無法達成共識,偶爾出現零星邊界衝突,但大多限於邊界巡防人員互擲石塊等小規模暴力事件。在一次較激烈的衝突後,甲乙兩國各有人員受傷,甲國一名巡防人員重傷後死亡,雙方互相指控對方人員先出手才發生此次衝突,並分別決定加派武裝部隊成員駐守於爭議邊界周邊區域,後續雙方另數度交火。 面對兩國緊張情勢的升高,鄰近的丙國決定出面促成兩國進行談判,其後在甲、乙、 丙三國元首共同出席會議後,甲、乙兩國發表聯合聲明,表示願意暫時停火並自邊界區域撤兵。然兩週後,甲國總統發表聲明表示收到可靠情報顯示乙國重新於邊界區域部署軍力,並較停火前動員更多人員,甲國認為乙國顯然已展開備戰動作,故決定針對爭議邊界周邊的乙國的A省進行空襲,並主要以A省內軍事用地為攻擊目標。此波攻擊後,乙國總理發表聲明嚴正譴責甲國的攻擊,並指控甲國之行為違反兩國聯合聲明以及其他國際法規範。\n\n請問上述甲國對A省之攻擊可能涉及哪些國際法議題?若你為甲國外交部之法律顧問,你將如何就這些議題回駁乙國總理的聲明?", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "115", "question": "二、(30分)\n\n丁國位於B半島,近年來因衝突及氣候變遷導致之災害因素,丁國面臨逐漸嚴重的非常態移民現象,大量來自他國的人民透過海路希望到丁國尋求安穩的生活環境, 因此丁國決定採取多項措施因應此現象,此等措施包括以下兩者:第一,丁國派出海上巡邏隊於離其海岸50海里內範圍內巡邏,針對所有其懷疑將於丁國靠港之「非法移民」船舶進行登檢,若船上確有人員無入境許可,則強制此等船舶離開其巡邏範圍;第二,丁國與戊國達成協議,針對所有未持有入境許可但嘗試或成功入境丁國之「非法移民」,一律移送至戊國,由戊國進行安置及後續遣返作業,而若有希望尋求保護者,也由戊國審議是否提供保護。\n\n上述丁國的兩項措施,是否符合國際法?", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "115", "question": "三、(40分)\n\n國際法院及國際海洋法法庭分別於2024年5月及2025年7月分別做成與氣候變遷相關之諮詢意見,請說明:\n\n1. 國際法院及國際海洋法法庭各自審理諮詢意見程序之管轄權依據。(10分) 2. 上開兩項諮詢意見涉及之國際法規範。(10分) 3. 上開兩項諮詢意見之主要結論。(20分)", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "114", "question": "一、甲、乙、丙三國均為《維也納外交關係公約》締約國,甲國於提交該公約批准書同時,以書面聲明表示:「針對《維也納外交關係公約》第27條中對外交郵袋之規定,我國保留於特殊情況下開拆或扣留外交郵袋之權利,此種特殊情況包括有合理根據懷疑郵袋中含有禁止進出口之物品時」,針對此項聲明,乙國表示反對,丙國則並未表態,若甲國與乙國及丙國分別建立外交關係,根據現行相關國際法規範,甲國與乙國間及甲國與丙國間的外交郵袋使用應如何處理?甲國若決定扣押乙國或丙國之外交郵袋,可能衍生違反何種國際法規範之爭議?(30分)", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "114", "question": "二、丁、戊兩國均為《國際刑事法院羅馬規約》之締約國,在戊、己兩國爆發戰爭後,國際刑事法院依照《規約》規定發出對己國總統A及戰爭前期擔任國防部長的前部長B發出逮捕令,依據相關國際法規範,丁國是否有配合逮捕 A、B之義務?是否有國際法上之理由拒絕配合?若A前往庚國參與國際會議,而庚國僅簽署但未批准《國際刑事法院羅馬規約》,庚國是否有配合逮捕A之義務?(20分)", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "114", "question": "三、辛、壬均為《聯合國海洋法公約》之締約國,兩國之間海岸相向,中間海域寬度最窄處為30海里,鄰近辛國海岸處有數個天然形成之海上地物。兩國於建國後不久針對陸地邊界達成共識並締結劃界協議,但對於前述海上地物之法律性質有不同看法,對於兩國海域重疊主張部分應如何劃分,亦無共識。根據相關國際規範,辛國若要將前述海上地物納入劃設基線及海域主張之基礎,應受到哪些限制?若兩國無法就海域主張及劃界達成共識,應如何依照國際法解決此項爭端?若壬國決定在兩國海域主張重疊部分展開資源開發行動並發給探勘資源之特許執照,是否可能違反相關國際規範?(30分)", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "114", "question": "四、國際法上禁止威脅使用武力(threat of force)之概念內涵為何?若子國主張以威脅使用武力作為保衛自己的手段以對抗丑國,可能違反何種國際規範?子國之主張是否可能有國際法上之合法性基礎?(20分)", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "113", "question": "一、請根據以下事實,附理由回答各小題問題: A國人口由B、C兩大民族組成,自建國以來,A國中央政府長期由佔多數的B族 人執政,該國之D黨經常指控中央政府採取對C族人不利或具歧視性的政策。與A國 相鄰之E國的多數人口為C族人,E國政府亦曾表示對A國境內C族人的權益表達關 切。2005年初,D黨開始鼓吹A國境內之C族人應擺脫「嚴重種族歧視之A國政權」, 並由D黨黨主席F於同年2月1日召開記者會宣布,將加速推動落實C族人民族自決 權,也不排除尋求獨立建國。A國中央政府立即發表聲明譴責D黨「分裂國土」的行 為,並於同日派出檢調單位人員至D黨總部,以搜查總部辦公室並逮捕F,F聽聞消息 後,趕在檢調人員抵達前離開辦公室,並前往E國駐A國大使館尋求保護。2月3日A 國檢調單位人員在追蹤F的行動軌跡後,發現他於2月1日進入E國大使館之後就未 曾離開,同日A國總統即發表聲明譴責E國大使館「窩藏嫌犯」,並要求其交出F,但 E國及其大使館均未做出回應;2月10日,一批A國警消人員來到E國大使館,帶隊 警官表示接獲情報指出,有D黨反對者在E 國大使館內放置爆裂物,因此警消人員強 行進入E國大使館,進入後並未找到爆裂物或F。三天後,A國公布調查結果,發現F 於2月6日在友人及E國大使館人員掩護下,離開大使館並潛逃至王國。\n\n1.前述2月10日的事件發生後,E國表達高度不滿,A國外交部隨即發出聲明,其 中部份表示:「我國重申總統於2月3日表達對E國大使館的譴責,E國無權窩藏 嫌犯,且此舉顯然違反國際法,但我國原仍因出於對E國之尊重,並未採取強制 措施。今日(2月10日)警消人員行動前雖未先取得E國大使之同意,但此舉乃 是出於情況緊急而必須迅速採取之保護行動,更顯示我國積極防止侵害E國大使 館行為之態度,並無違反國際法的問題。」請問以上A國外交部聲明是否符合國 際法?請指出聲明中符合或違反國際法之特定部分,並分別說明理由。\n\n2. A國發現F已逃至E國後,要求E國配合將F移送回E國,針對此事,E國總理 指示由司法部及外交部共同研議E國是否有義務配合A國請求,為此,請問應考 量哪些相關國際法概念?請指出應納入考量的概念,並說明應如何應用於本案。", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "113", "question": "二、請根據以下事實,附理由回答各小題問題: G、H兩國位於I半島上,兩國之間的國界大多由J山脈形成,但仍有部分陸地及 海域邊界未定,使得兩國在陸地及海域開發及資源取用上,均暫時避開兩國重疊主張之 範圍,雖然歷史上兩國多次展開談判,但仍無法達成協議,2010年,在又一輪的談判破局後,G國於6月10日發出聲明表示:「我國多年來嘗試與H國進行善意對話,但H 國卻不願意做出任何讓步,這輪談判的失敗顯示H國毫無誠意解決兩國之間的爭端,為 了國家及全國人民福祉考量,我國將展開全面的邊境防禦及資源開發計畫」。\n\n1. G、H兩國於1990年成為《聯合國海洋法公約》締約國,並於各自批准《聯合國 海洋法公約》後公告領海基線及領海、專屬經濟海域及大陸礁層外界線,兩國公告 之領海、專屬經濟海域及大陸礁層範圍均有所重疊,請問兩國間的海洋邊界應如 何劃定?H國可否單方將此案提交給國際法院,並請求法院劃定邊界?\n\n2. G國與鄰近的K國於2010年8月公布兩國聯合海上軍事演習的規劃,預計行動 範圍包括H國領海及專屬經濟海域,G、K兩國國防部共同聲明中指出:「本次演 習行動範圍包括未有重疊海域主張之H國領海及專屬經濟海域,此乃為捍衛兩國 安全之必要安排,但兩國在此承諾將避免於H國領海停留,以示尊重。」以上描 述之聯合軍事演習活動是否有違反國際法之虞?請指出可能涉及的問題,並說明 是否可能違法。\n\n3. 2012年2月,G、H兩國分別派駐於爭議邊界區的警衛隊間發生衝突,隔月情勢 升級為兩國間大規模交戰,4月間G國接獲情報指出,H國境內的L醫院疑似被 H 國軍方徵用作為臨時總部,醫護人員及傷病者可能均已撤出,且軍方高層經常 在此醫院停留,故G國決定對該醫院發動攻擊,此次攻擊行動不但摧毀L醫院, 且波及鄰近住宅區,導致人員死傷。請問上述情況是否有違反國際法之虞?請指 出可能涉及的問題,並說明是否有違法情事。", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "112", "question": "一、 A國在聖誕節前夕,派遣軍隊進入B國,發動「特殊的軍事行動」,目的是要奪回 有爭議的領土,AB二國軍隊因此發生嚴重武裝衝突。由於發生此一國際大事,因此在 國際公法課堂上,老師請你報告,說明\n\n(一)傳統國際法是從那二個層面分析國家使用武力所涉及的法律議題? 20%\n\n(二)禁止使用武力原則是當代確立的國際法原則,但是將國家使用武力所涉及的法律議題區分為這二個類別為什麼依舊有其必要性? 5%", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "112", "question": "二、 請依《國家對國際不法行為的責任條款草案》(Draft Articles on Responsibility of States for Internationally Wrongful Acts)回答下列問題:\n\n(一)說明第二十條以「同意」(consent)免除國家責任的內容。 10%\n\n(二)第三十七條表示,如果損失不能以恢復原狀或補償的方式得到賠償,責任國有義務抵償不法行為造成的損失,請說明第三十七條有關「抵償」(satisfaction,或譯為滿足)的方式和相關應注意事項的內容。 15%", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "112", "question": "三、 A國和我國無邦交,但是今年決定來台灣設立代表機構,處理領事業務,該機構之設立已經經外交部核准,其人員也應經外交部認定。請依據《駐華外國機構及其人員特權暨豁免條例》,說明該外國機構人員享受豁免權的相關規定。 25%", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "112", "question": "四、 請回答以下問題:\n\n(一)承認是國際法上的獨特制度,國際法為何有此制度以處理國家承認問題。5%\n\n(二)與一九五八年《領海公約》有關海峽部分作比較,一九八二年《海洋法公約》為何會大幅的修改與增加海峽有關通行權的規定? 10%\n\n(三)《維也納外交關係公約》序言和第三條提出了關於外交代表能享有豁免的理由,請說明之。 10%", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "111", "question": "一、一九四八年十月三日秘魯發生軍人叛亂，但立刻被平定，秘鲁認為美洲人民革命同盟(American People's Revolutionary Alliance)領袖德拉托雷(Victor Raul Haya de la Torre)應負責並受司法裁判。但一九四九年一月三日德氏卻潛赴哥倫比亞大使館事求庇護，哥倫比亞大使館要求秘國領發通行證，以便德氏離境。但秘魯拒絕發通行證，認為德氏不是政治犯。雙方同意將此案提交國際法院解决，請說明一九五零年國際法院對哥倫比亞控告秘鲁的「庇護權案」(The Asylum Case)判決中，有關外交庇護權與區域國際法問題的見解。", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "111", "question": "二、一八一零年法國對英國宣布封鎖令，原告所有的一艘船在當時為法國拿捕沒收後，被改装為法國軍艦，並將其重新命名為白樂號(Balaou)。白樂號後因故到美國港口，原告因而要求歸還船隻，本案最後上訴到美國最高法院，最高法院判決美國對此案無管轄權而駁回原告之訴。\n\n(一)請說明一八一二年美國最高法院在上述「交易號控麥法登號案」(The Schooner Exchange v. McFaddon)中，有關國家何以享有管轄豁免權的見解。\n\n(二)一般認為「交易號控麥法登號案」是「國家豁免原則」中「絕對豁免論」的代表案例，請解釋「絕對豁免論」的內容。", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "111", "question": "三、一九七九年伊朗學生和人民攻擊美國大使館並佔領美使館\n\n(一)請說明國際法院一九八零年「關於美國在德黑蘭外交領事人員案」(Case Concerning United States Diplomatic and Consular Staff in Tehran)有關伊朗是否應當負責的見解；\n\n(二)請依照二零零一年國際法委員會《國家對國際不法行為的責任條款草案》(Draft Articles on Responsibility of States for Internationally Wrongful Acts)，說明國家應為個人行為負責的情况。", "answer": ""},
{"category": "intl", "sub": "政大外交所", "year": "111", "question": "四、一九五八年六月三十日冰島宣布建立十二海里漁區，禁止外國漁船在區內捕魚。英國抗議，一九六一年三月十一日英國與冰島兩國換文，英國承認冰島的十二海里漁區，冰島同意將來漁區擴充至十二海浬 以外時，如發生争端將提交國際法院。一九七一年七月十四日冰島宣布自次年九月一日起將漁區擴至五十海浬，英國反對，因此在一九七二年四月十四日英國將此爭端提交國際法院。同年五月二十九日冰島通知法院，表示不接受法院的管轄權，且不願出庭應訴，冰島的主要論點是，在過去十年中，十二海浬的漁區逐漸被普遍承認，變化的法律環境(changed legal circumstances)使其當時付出的對價，即授與法院管轄權，以換取英國承認其十二海浬的漁區失效。請依照一九七三年國際法院對「捕魚管轄區案(法院的管轄權)」(Fisheries Jurisdiction Case, Jurisdiction of the Court，又譯為「漁權管轄案」)判決，說明法院針對上述冰島主張的見解與理由。", "answer": ""},

{"category": "intl", "sub": "政大外交所", "year": "103", "question": "一、 請說明「開羅宣言」的內容，以及其與「波茨坦公告」和日本「降伏文書」的關連性。25%", "answer": "", "answerClaude": "一、開羅宣言與波茨坦公告、降伏文書之關連性\n\n（一）開羅宣言的內容\n\n1943年11月，中、美、英三國領袖（蔣中正、羅斯福、邱吉爾）在開羅會議後發表《開羅宣言》，其主要內容包括：\n\n1. 三國對日作戰的目的，在於制止並懲罰日本之侵略。\n2. 三國決不為自身謀求領土擴張，亦無拓展疆土之意思。\n3. 三國之宗旨，在剝奪日本自1914年第一次世界大戰開始後，在太平洋上所奪得或佔領之一切島嶼；並將日本竊取於中國之領土，例如東北四省、臺灣、澎湖群島等，歸還中華民國。\n4. 三國並決定，將使朝鮮於相當時期，獲得自由與獨立。\n5. 三國將堅持進行為獲得日本無條件投降所需之重大而長期之行動。\n\n須注意者，《開羅宣言》在性質上為一項「新聞公報」（communiqué），並非正式簽署之條約，惟其內容仍具有政治宣示及後續被納入其他國際文件而發生法律效果之意義。\n\n（二）與《波茨坦公告》之關連\n\n1945年7月，中、美、英三國（後蘇聯加入對日宣戰後亦加入）發表《波茨坦公告》（Potsdam Declaration），其第8條明文規定：「開羅宣言之條件必將實施，而日本之主權必將限於本州、北海道、九州、四國及吾人所決定其他小島之內。」\n\n由此可知，《波茨坦公告》係以明文方式將《開羅宣言》之內容「納入」（incorporate by reference）並「重申」其效力，使原僅屬政治宣示性質的《開羅宣言》，透過《波茨坦公告》之引用，取得更進一步之國際法律拘束意涵，尤其是有關日本應歸還其自中國竊取之領土（含臺灣、澎湖）之部分。\n\n（三）與日本《降伏文書》之關連\n\n1945年9月2日，日本簽署《降伏文書》（Instrument of Surrender），其中明文承諾接受盟國於《波茨坦公告》所列各項條款。換言之，《降伏文書》構成日本對《波茨坦公告》（進而及於其所納入之《開羅宣言》）內容之正式、單方且具拘束力之承諾與接受，使得原先僅具政治宣示性質的《開羅宣言》，經由《波茨坦公告》之納入，再經由《降伏文書》之承諾接受，形成一個層層銜接、日本以條約性文件形式表示同意接受拘束的完整法律鏈條。\n\n（四）小結\n\n三份文件之關係可簡述為：《開羅宣言》提出戰後處置原則（政治宣示）→《波茨坦公告》正式引用並重申其內容（具條約性質之要約）→《降伏文書》為日本對前述條款之正式承諾接受（承諾）。學說上有認為，此一法律鏈條足以構成日本同意歸還臺灣、澎湖予中華民國之國際法依據；惟亦有論者（如「臺灣地位未定論」之主張者）認為，《舊金山和約》僅規定日本放棄對臺灣、澎湖之一切權利，並未明文將其歸屬指定予中華民國，故臺灣之最終法律地位，仍有爭議空間。此一問題涉及條約解釋、嗣後國家實踐及對日和約體系之整體理解，為國際法與國際政治交錯之重要爭議領域。"},
{"category": "intl", "sub": "政大外交所", "year": "103", "question": "二、 關於條約的錯誤： （一） 請說明 1969 年《條約法公約》第 48 條有關「錯誤」的重要內容。 （二） 請說明 1962 年國際法院「隆瑞古寺案」實質部分判決泰國有關錯誤的主張與法院的見解。25%", "answer": "", "answerChatGPT": "一、1969年《維也納條約法公約》第48條\n\n《維也納條約法公約》第48條所稱的「錯誤」（error），是指一國締結條約時，對某項既存事實或情況產生錯誤認識，且該錯誤構成其同意受條約拘束的基本依據。此時，該國原則上得主張其同意無效。\n\n（一）得主張錯誤的積極要件\n\n依第48條第1項，必須同時符合下列要件：\n\n1. 錯誤涉及締約時已存在的事實或情況：錯誤必須關於國家締結條約時認為已經存在的「事實或情況」（fact or situation）。例如，國家在劃定邊界時誤認某條河流的位置、誤認某座山脈的分水嶺，或誤用不正確的地圖。因此，第48條所處理的主要是事實錯誤，而非單純對國際法規則、條約法律效果或法律評價的錯誤。\n\n2. 該事實或情況為國家同意受拘束的基本依據：並非任何細微錯誤都足以使條約無效。該錯誤必須構成國家同意受條約拘束的「基本基礎」（essential basis）。換言之，若無該項錯誤，該國原本不會締結條約，或至少不會依相同條件表示同意，始符合此要件。\n\n因此可以將第48條第1項濃縮為：締約時的重大事實錯誤＋該錯誤構成締約同意的基本依據。\n\n（二）不得主張錯誤的消極要件\n\n第48條第2項規定，即使存在重大事實錯誤，在下列兩種情況下，該國仍不得援引錯誤使其締約同意無效：\n\n1. 國家本身的行為造成該錯誤：若錯誤係由主張錯誤的國家自行造成或促成，例如自己提供錯誤資料、自己疏於調查、自己參與製圖或測量卻未檢查成果、因本國機關的重大疏忽而發生錯誤，則該國不得事後以自己造成的錯誤推翻條約。\n\n2. 當時情況已足以使該國注意到可能存在錯誤：若締約時的客觀情況已足以使國家對錯誤有所警覺，國家卻未進一步查證，也不得事後主張錯誤。此即所謂：主張錯誤者不得對明顯可疑的情況視而不見。第48條第2項反映誠信原則及「自己過失不得使自己獲利」的觀念，也維護條約關係的安定性。\n\n（三）文字錯誤不影響條約效力\n\n第48條第3項規定：僅與條約文字措辭有關的錯誤，不影響條約效力，應依《條約法公約》第79條有關條約文本錯誤更正的程序處理。例如條約誤植日期、數字打錯、地名拼寫錯誤、不同語文作準文本間出現技術性誤差。此種情形原則上是「更正條約文本」的問題，而不是使整個締約同意失效的問題。\n\n（四）第48條的法律效果\n\n依第48條文義，一國得援引錯誤，主張其「同意受條約拘束」無效，而不是條約當然、自始、自動無效。因此，錯誤屬於一種相對無效、得撤銷的原因。這與違反國際強行法的條約不同：違反強行法的條約依第53條原則上無效；錯誤則須由受錯誤影響的國家依法提出主張。此外，國家主張錯誤仍須遵守《條約法公約》第65條以下的通知及爭端處理程序，不能單方面任意宣布條約不存在。\n\n二、1962年「隆端古寺案」（柏威夏寺案）之背景\n\n「隆瑞古寺案」通常稱為柏威夏寺案／普里維希爾寺案（Temple of Preah Vihear, Cambodia v. Thailand），爭議涉及位於柬埔寨與泰國邊界的柏威夏寺主權。1904年法國所代表的法屬印度支那與暹羅締結條約，約定在相關地區以分水嶺線作為邊界。其後，法國方面製作了一幅地圖，即訴訟中所稱的「附件一地圖」（Annex I map）；該地圖將寺廟劃在柬埔寨一側。柬埔寨主張泰國長期接受該地圖，因此寺廟位於柬埔寨領土。\n\n泰國則主張：(1) 附件一地圖並非由條約所設混合劃界委員會正式核准；(2) 地圖上的邊界線偏離1904年條約所規定的分水嶺線；(3) 泰國過去之所以未反對，是因為誤以為地圖線符合分水嶺；(4) 因此，泰國對該地圖的接受係基於「錯誤」，不應受其拘束。\n\n三、泰國有關「錯誤」的主張\n\n泰國的核心論點是：泰國政府並不知道附件一地圖所畫的邊界線偏離真正的分水嶺；泰國係因誤認地圖正確，才未提出抗議，因此不能認為泰國已有效接受該地圖。換言之，泰國主張其對附件一地圖的接受，係基於一項重要事實錯誤：泰國以為地圖線符合條約分水嶺；實際上地圖線並未完全依分水嶺繪製；若泰國知道此事，就不會接受該地圖。從條約錯誤理論觀察，泰國試圖主張該錯誤構成其同意的基本依據。\n\n四、國際法院對泰國錯誤主張的見解\n\n國際法院並未接受泰國的主張。法院提出的重要原則是：一方若因自己的行為促成錯誤、原本可以避免錯誤，或當時情況已足以使其注意可能存在錯誤，就不能援引錯誤以否認其同意。此一見解後來反映在《維也納條約法公約》第48條第2項中。\n\n法院的具體理由如下：\n\n（一）泰國有充分機會檢查地圖：附件一地圖製作後，法國方面將其送交暹羅政府。暹羅具有主管機關及技術人員，完全有機會檢查地圖是否符合1904年條約規定的分水嶺線。如果暹羅政府認為地圖錯誤，理應在收到地圖後提出異議，然而暹羅政府並未及時反對。因此，法院認為泰國不能在數十年後再主張自己完全不知道地圖內容。\n\n（二）泰國官員具有專業能力，不得以疏忽為由卸責：泰國曾參與邊界調查與劃界事務，也有熟悉地形及測量工作的官員。因此，即使地圖確實偏離分水嶺，泰國政府若仔細查驗，應可發現問題。泰國未進行必要檢查，屬其自身疏忽，不能成為日後否認地圖效力的理由。這正符合後來第48條第2項的兩項限制：泰國的行為或疏忽促成錯誤；當時情況足以使泰國注意到可能存在錯誤。\n\n（三）泰國長期未抗議，構成默認：法院特別重視泰國長期以來的行為。附件一地圖送達泰國後，泰國政府多年未提出正式抗議；該地圖也曾由泰國政府機關收受、使用及散發。法院因此認為，泰國已透過長期沉默及相關行為，接受該地圖所表示的邊界。此處涉及國際法上的默認（acquiescence）、禁反言（estoppel）、誠信原則（good faith）。雖然法院並未完全以形式化的禁反言要件論證，但其核心觀念是：泰國長期使柬埔寨及法國合理相信其接受地圖，不能事後採取相反立場。\n\n（四）丹隆親王訪問寺廟是重要證據：1930年，暹羅丹隆親王訪問柏威夏寺。當時法國殖民官員以法國國旗及正式儀式迎接他，明顯表現法國將該地區視為法屬印度支那領土。丹隆親王及暹羅政府並未提出抗議，反而接受接待，並留下相關照片。法院認為，若泰國確信寺廟位於泰國領土，面對法國如此公開展示主權，本應立即抗議。泰國的沉默進一步證明其已接受附件一地圖所表示的邊界安排。\n\n（五）地圖線是否完全符合分水嶺已非決定性問題：法院並非單純認定地圖技術上完全正確，而是認為即使附件一地圖原先不是具有獨立拘束力的條約文本，泰國其後仍因接受、使用、未抗議及長期行為，而承認該地圖所表示的邊界。換言之，本案的關鍵並不是「地圖是否精確符合分水嶺」，而是泰國是否已透過嗣後行為接受該地圖。法院最終認定柏威夏寺位於柬埔寨主權之下，並命泰國撤出駐守寺廟或鄰近地區的軍警力量。\n\n五、隆瑞古寺案與第48條的關係\n\n本案判決作成於1962年，早於1969年《維也納條約法公約》，但法院對錯誤所提出的限制，與第48條高度一致：錯誤須涉及締約時存在的事實或情況（泰國主張誤認地圖線符合分水嶺）；錯誤須構成同意的基本依據（泰國主張若知地圖錯誤即不會接受）；自己行為造成或促成錯誤不得援引（泰國長期未查驗、未抗議）；情況足使國家注意可能有錯不得援引（泰國有專業官員、收到地圖且有機會審查）；嗣後確認或默認將削弱錯誤主張（泰國長期使用地圖，丹隆親王訪寺時亦未抗議）。\n\n因此，本案的重要性在於確立：錯誤不是讓國家逃避既有承諾的普遍理由；主張錯誤者必須善意、無過失，且未曾以自身行為接受或確認相關安排。\n\n結論：《維也納條約法公約》第48條允許一國在締結條約時，若對既存事實或情況發生重大錯誤，且該錯誤構成其同意受拘束的基本依據，得主張其締約同意無效。但若該國本身的行為促成錯誤，或當時情況已足以使其注意可能存在錯誤，即不得援引；若僅屬條約文字錯誤，則應依第79條更正，不影響條約效力。在1962年隆瑞古寺案中，泰國主張其因誤信附件一地圖符合1904年條約所定分水嶺，才未反對該地圖。國際法院認為，泰國早已取得地圖，具備檢查能力，卻長期未提出異議，並以收受、使用地圖及對法國公開行使權威保持沉默等行為接受該邊界。因此，即使存在錯誤，亦屬泰國本可避免或應已察覺的錯誤，泰國不得事後援引。此案遂成為《條約法公約》第48條第2項的重要司法先例。\n\n記憶口訣：重大事實錯誤可撤銷；自己造成、應該知道，不得主張；文字誤植，只能更正。", "answerClaude": "二、關於條約的錯誤\n\n（一）1969年《維也納條約法公約》第48條有關「錯誤」之規定\n\n《維也納條約法公約》（VCLT）第48條規範「錯誤」（Error/Mistake）作為條約得撤銷（invalidate）之事由，其要件與內容大致如下：\n\n1. 錯誤須涉及「事實」或「情況」（fact or situation）：締約國得主張撤銷其同意受條約拘束之意思表示，如該錯誤係關於該國於締約時假設為存在，且構成其同意受條約拘束之必要基礎（essential basis）之事實或情況。\n\n2. 排除法律錯誤：第48條第1項原則上僅適用於「事實錯誤」，而非「法律錯誤」（error of law），蓋條約本身即為法律文件，締約國本應審慎審視其法律效果。\n\n3. 可歸責性之排除（第48條第2項）：若該國以其自身行為導致此一錯誤，或依當時情況該國應可預見此項錯誤之可能性，則不得主張錯誤而撤銷條約，此乃基於「自己行為不得置辯」（estoppel-like）之法理，防止締約國以自身過失卸免其條約義務。\n\n4. 錯誤僅涉及條約用語（wording）：依第48條第3項，若錯誤僅涉及條約之文字用語，並不影響其實質同意之基礎，則不適用第48條，而應依第79條「更正條約本文或正式抄本之錯誤」處理。\n\n（二）1962年國際法院「隆端古寺案」（柏威夏寺案）之見解\n\n在Case Concerning the Temple of Preah Vihear（Cambodia v. Thailand）實質判決中，泰國主張其於1908年至1909年間，接受法國（代表柬埔寨）所提出之邊界地圖時，係基於錯誤，因該地圖所繪之分水嶺界線與實際地理分水嶺不符，泰國因而誤信隆端古寺位於柬埔寨境內。\n\n國際法院最終駁回泰國此一錯誤主張，其主要理由包括：\n\n1. 泰國官員長期以來已知悉或應已發現地圖上之錯誤：法院指出，泰國之相關官員早於數十年前即有機會發現地圖界線與分水嶺不符之處，且泰國政府從未在合理期間內就此提出異議或保留，反而長期以行為（如接受、使用該地圖並未提出抗議）默示接受該地圖所繪之邊界。\n\n2. 禁反言原則（Estoppel）之適用：法院認為，泰國之默示接受及其後續一貫之行為表示（包括未於適當時機提出異議），已構成對柬埔寨（及其後之法國）之禁反言效果，泰國不得事後翻異其詞而主張錯誤。\n\n3. 錯誤主張須以締約當時實際受該錯誤影響為前提：法院並強調，即便地圖確有繪製上之技術性錯誤，惟若該國之同意並非「因該錯誤而形成」（即並非該錯誤構成其同意之必要基礎），亦難以據此主張條約或協議無效。\n\n此判決確立了後續VCLT第48條第2項「可歸責性排除」及禁反言限制錯誤主張之重要先例基礎，亦即：締約國若明知或可得而知有錯誤情事，卻仍長期以行為默示接受，將喪失事後主張錯誤而撤銷相關協議或安排之權利。"},
{"category": "intl", "sub": "政大外交所", "year": "103", "question": "三、 1970 年國際法院的「巴塞隆納牽引力電燈及電力公司案」提到 rights and obligations erga omnes 的觀念，請說明下列兩個問題： （一） 何以此一概念的發展與國際法上國家責任制度有關？ （二） 此一概念和國際法上 jus cogens 本質上有何不同？25%", "answer": "", "answerClaude": "三、巴塞隆納牽引力案與erga omnes義務\n\n（一）本案背景與erga omnes概念之提出\n\n在Barcelona Traction, Light and Power Company, Limited案（Belgium v. Spain, 1970）中，國際法院雖然最終以比利時欠缺求償適格（股東之國籍與公司之國籍不同）為由駁回比利時之訴，但法院於判決理由中提出了一段極具影響力的附帶意見（obiter dictum），區分了國家對外承擔義務之兩種性質：\n\n1. 國家對其他特定國家所負之雙邊義務（bilateral obligations）：此類義務僅該特定受害國得主張責任，例如基於雙邊條約或外交保護關係所生之義務。\n\n2. 國家對「整體國際社會」所負之義務（obligations erga omnes）：法院指出，鑑於此類義務所涉利益之根本重要性，「所有國家均可認為在其獲得保護方面具有法律利益」（all States can be held to have a legal interest in their protection），法院並舉例：禁止侵略行為、禁止種族滅絕，以及源於基本人權保護（包括禁止奴隸及種族歧視）之相關原則與規則。\n\n（二）與國家責任制度之關聯\n\n此一區分對傳統國家責任制度造成重大衝擊，原因在於：\n\n1. 傳統上，國家責任之追訴資格（locus standi）僅限於「直接受害國」，此為雙邊互惠關係下之當然結果；惟erga omnes義務之提出，使得縱非直接受害之國家，亦得因該義務所保護利益具有普世重要性，而主張具有法律利益、進而得追究違反國之責任。\n\n2. 此一發展後續反映於2001年國際法委員會（ILC）通過之《國家責任條文草案》第48條，該條明文規定，非直接受害國於特定情形下（包括該義務係對整體國際社會所負者），亦得對違反國主張責任，得請求其停止不法行為、提供不重複保證，並得為受害國或受益人之利益要求履行賠償義務，此可謂erga omnes概念自司法先例走向成文條文化之具體展現。\n\n（三）與jus cogens之本質差異\n\nerga omnes（對世義務／普遍性義務）與jus cogens（絕對法／強制規律）雖常被相提並論，且在具體規範內容上高度重疊（如禁止侵略、種族滅絕、酷刑等重大國際不法行為，往往同時具備此兩種性質），惟兩者在法理層次上分屬不同範疇，不應混為一談：\n\n1. 規範層次不同：Jus cogens（VCLT第53條）係關於「規範位階」之概念，指某些國際法規範具有最高強制效力，任何國家不得以條約方式加以偏離，違反者條約當然無效；而erga omnes則係關於「義務對象與主張適格」之概念，指某義務之履行對象及於全體國際社會，任何國家均得就其違反主張責任，兩者關注焦點分別在於「規範能否被合意排除」與「誰有資格主張違反責任」。\n\n2. 法律效果不同：Jus cogens之效果展現於條約法領域，主要為使牴觸之條約無效（VCLT第53條、第64條）；erga omnes之效果則展現於國家責任法領域，使非直接受害國取得程序上之訴訟適格或求償資格。\n\n3. 範圍未必完全重合：學說上一般認為，凡屬jus cogens之規範，通常亦會產生erga omnes之效果（因其保護價值之重要性使然）；但反之未必成立，亦即並非所有erga omnes義務均已提升至jus cogens不可克減之強制規律位階，例如部分僅在特定多邊條約締約國間所生之「erga omnes partes」義務（對條約全體締約國之義務），其重要性雖高，未必已達到jus cogens不可以任何方式偏離之最高強行法位階。\n\n簡言之，jus cogens聚焦於「規範本身在法秩序中的位階與不可偏離性」，erga omnes則聚焦於「義務違反後由誰取得追究資格」，二者概念層次不同，但因均源自對維護國際社會根本共同利益之重視，在實務案例中常有重疊而彼此呼應。", "answerGemini": "erga omnes（普遍管轄義務／對一切人的義務）概念是國際法由傳統「雙邊對等關係」邁向「國際社會整體利益」的核心轉捩點。以下就題旨兩大問題進行剖析：\n\n## （一）何以erga omnes的發展與國際法上國家責任制度有關？\n\n傳統國際法上的國家責任制度（State Responsibility）主要建立在雙邊對等關係的基礎上。換言之，只有直接遭受受害的國家（Injured State），才有資格主張國家責任並提出求償或採取反制措施。\n\n然而，1970年國際法院（ICJ）在「巴塞隆納牽引力案」（Barcelona Traction Case）中，劃時代地區分了兩類國家義務：\n\n1. 對特定國家的雙邊義務：僅直接受害國得主張責任。\n2. 對整體國際社會的義務（Obligations erga omnes）：鑑於其保護之價值極為重要，所有國家在法律上皆被視為具有合法利益（Legal interest），因此任何國家皆得主張責任。\n\n### 對國家責任制度的重大變革\n\n1. 突破「受害國」主張責任的限制：在涉及嚴重違反人類整體利益（如禁止侵略、禁止種族滅絕、保護基本人權）時，即使某國未直接受害，亦可基於erga omnes義務主張違約國承擔法律責任。\n\n2. 重塑聯合國國際法委員會（ILC）《國家責任條文草案》：該概念直接促成了2001年《國家責任條文草案》（Draft Articles on Responsibility of States for Internationally Wrongful Acts）第48條的制定。根據第48條，非直接受害國（States other than an injured State）在被告國違反erga omnes義務時，得請求被告國：停止不當行為並提供不重複發生的保證；履行對受害國或受益人的損害賠償義務。\n\n## （二）erga omnes與jus cogens（絕對法／強制規律）本質上有何不同？\n\nerga omnes與jus cogens皆旨在維護國際社會的共同價值與秩序，且在實體內容上高度重疊（例如：禁止侵略、禁止酷刑、禁止種族滅絕），但兩者在法理本質、關注焦點與功能適用上有根本差異：\n\n比較維度：概念核心\n- Jus Cogens：規範的位階與效力（Substantive Status/Normative Hierarchy）\n- Erga Omnes：義務的履行對象與救濟資格（Enforcement & Standing）\n\n比較維度：核心問題\n- Jus Cogens：「這條法律規範是否不許以條約任意偏離或締結相反約定？」\n- Erga Omnes：「當此義務被違反時，誰有資格向違約國主張責任？」\n\n比較維度：法律效果\n- Jus Cogens：1. 違反jus cogens的條約無效（《維也納條約法公約》第53條）。2. 產生新jus cogens時，現存抵觸條約失效（第64條）。\n- Erga Omnes：任何國家皆有訴訟適格（Locus standi）或主張責任資格，得要求停止違法行為並要求賠償受害者。\n\n比較維度：邏輯關係\n- Jus Cogens：原因／實體源頭：因其規範具有不可動搖的最高位階。\n- Erga Omnes：結果／程序延伸：因其保護利益關乎全人類，故產生對一切人履行的效果。\n\n### 兩者之邏輯關聯與差異總結\n\n關聯性：學者與國際法院常指出一種「邏輯上的必然」——所有的jus cogens規範原則上都會產生erga omnes義務（因為既然該規範是不可偏離的最高價值，其被違反時自然全體國家皆得主張）。\n\n差異性：\n- 方向不同：Jus cogens側重於禁止締約自由的無效性（無效宣告）；Erga omnes側重於程序上的主張資格（Standing / Remedy）。\n- 範圍非完全重合：有些erga omnes義務（例如出於國際習慣法或多邊公約保護共同利益的規範，如公海自由、特定區域環境保護）未必達到jus cogens（不可偏離之絕對法）的嚴格位階，但仍具備對一切人履行的性質（erga omnes partes）。"},
{"category": "intl", "sub": "政大外交所", "year": "103", "question": "四、 政府繼承提到「國家繼續原則」，國際索償提到「國籍繼續規則」，請分析說明兩個概念。25%", "answer": "", "answerClaude": "四、政府繼承之「國家繼續原則」與國際索償之「國籍繼續規則」\n\n（一）「國家繼續原則」（Principle of State Continuity）——政府繼承脈絡\n\n在政府繼承（Succession of Governments）之討論中，須先區辨「國家繼承」（State Succession，涉及國際法人格主體之更迭，例如領土主權移轉、國家分裂、合併）與「政府繼承」（Succession of Governments，僅涉及一國內部政權更迭，而國家之國際法人格並未消滅）。\n\n「國家繼續原則」係指：只要「國家」本身之法律人格未曾中斷或消滅（即使其政府經由革命、政變、內戰等非正常憲政程序更迭），該國作為國際法主體之同一性（identity）及延續性（continuity），並不因政府更替而受影響。具體內涵包括：\n\n1. 條約義務之延續：新政府原則上應承受舊政府所締結條約之權利義務，蓋條約係國家對外承擔之義務，而非特定政府之個人承諾（此與「政府承認」是否影響條約履行的實務爭議略有不同，但條約義務之國家延續性原則仍為通說）。\n\n2. 國家責任之延續：新政府對於前政府任內國家所生之國際不法行為，原則上仍應負國家責任，不因政權更迭而免責，此即所謂「國家責任不因政府更迭而中斷」之原則。\n\n3. 國家財產與債務之延續：國家對外之公債、國有財產等權利義務關係，原則上亦隨國家之延續而由新政府概括承受。\n\n此一原則之理論基礎在於：國際法上國家責任與權利義務之主體為「國家」而非特定「政府」，政府僅為國家對外行使主權之代理機關，其更迭並不改變國家作為法律主體之同一性，此有助於維護國際法律關係之穩定性與可預測性，避免國家藉由政權更迭而規避既存之國際義務。\n\n（二）「國籍繼續規則」（Continuous Nationality Rule）——外交保護／國際索償脈絡\n\n在外交保護（Diplomatic Protection）與國際索償（International Claims）之領域，「國籍繼續規則」係指：一國為其國民行使外交保護、代其向加害國提起國際求償時，該受害之自然人或法人，原則上須自「受害之時」起，持續具有求償國之國籍，直至「求償正式提出」（或依部分實踐延伸至判決確定）之時為止，中間不得中斷或變更國籍，該項外交保護方為合法、有效。\n\n其主要內涵及理由包括：\n\n1. 「損害發生時」須具備求償國國籍：此為外交保護之基本前提要件之一，蓋外交保護制度之理論基礎，係擬制國家因其國民受害而視為國家自身之權利受侵害（Vattel之擬制理論），故若受害人於受害當時並非該國國民，該國即無「自身」權益受侵害可言。\n\n2. 須持續維持該國籍至求償時：其目的在防止「國籍投機」（nationality shopping），即避免受害人於受害後，為圖利用某一國家較強之外交實力或較有利之求償地位，而刻意變更或取得該國國籍後，再由該國提出求償，此將違反外交保護制度原始擬制受害國家利益之本旨。\n\n3. 例外情形：晚近實踐及2006年國際法委員會（ILC）《外交保護條文草案》第5條亦承認若干例外，例如國籍之變更非出於自願（如國家繼承、婚姻、收養等法定原因所生之非自願國籍變更），或原國籍已不復存在等情形，可能不適用嚴格之國籍繼續要求，以避免因技術性國籍中斷而剝奪受害人受保護之機會。\n\n（三）兩概念之比較\n\n「國家繼續原則」處理的是「國家」作為國際法主體之同一性延續問題，聚焦於國家與其政府更迭間之關係，確保國家對外權利義務不因政府更替而中斷；「國籍繼續規則」則處理「個人（自然人／法人）」與求償國籍之連結延續問題，聚焦於外交保護制度下受害人國籍之持續要件，確保求償國家與受害人間之聯繫具有正當性及一貫性，二者雖然都以「延續性」（continuity）作為核心概念，但適用之主體（國家 vs. 個人）與規範目的（維護國家責任體系之穩定 vs. 防止國籍投機、確保外交保護正當性）截然不同，不宜混淆。"}

{"category": "intl", "sub": "外交特考國際法組國際公法(含條約法)", "year": "110", "question": "二、A、B兩國皆為《維也納領事關係公約》之締約國。A國國民甲於B國搶劫銀行，在銀行中爆發槍戰，並擊斃一名B國警察。最後甲終於被捕，並且被B國法院判處死刑。不過甲於被逮捕以及隨後之訴訟中，無論是B國警方或法院皆未告知甲，根據《維也納領事關係公約》第36條第1項第2款，甲可以向自己本國A國派駐於B國之領事請求協助。因此甲在B國之刑事訴訟未受到A國領事之協助，就被判處死刑。A國於是向國際法院對B國提起訴訟。試回答下列問題：\n\n（一）B國抗辯：《維也納領事關係公約》第36條第1項第2款之規定只有拘束締約國之A、B兩國，只有賦予締約國A國權利，但並未賦予A國國民權利。亦即，該條文並非是自動履行（self-executing）之條約規定，因此還有賴於B國作進一步之具體化。B國縱然沒有告知甲該條款之內容，亦不構成對甲權利之侵害。甲既無權利被侵害，A國亦無從本於其國民權利受害為由提起訴訟。此一抗辯是否正確？（15分）\n\n（二）B國抗辯：B國是權力分立之民主法治國家，B國總統與外交部長負擔憲法上之義務，並不能干涉內國法院之判決，縱然B國總統曾經要求法院暫緩死刑之裁判與執行，但B國之司法機關仍然可以獨立為之，因為依照B國憲法規定，國際條約於B國之內國只具有法律位階，因此《維也納領事關係公約》之效力低於B國憲法。此一抗辯是否正確？（10分）", "answer": ""},
{"category": "intl", "sub": "外交特考國際法組國際公法(含條約法)", "year": "110", "question": "三、試回答下列問題：\n\n（一）世界衛生組織大會經聯合國大會之授權，於1993年9月3日通過決議，請求國際法院就「一國在戰爭或其他武裝衝突中使用核子武器是否違反國際法」發表諮詢意見。國際法院對於世界衛生組織之聲請案拒絕受理，其理由何在？（5分）\n\n（二）1994年12月15日聯合國大會以決議向國際法院提出問題：「國際法是否允許在任何情況下以核子武器進行威脅或使用核子武器？」請求國際法院發表諮詢意見。國際法院如何處理？（10分）\n\n（三）核子武器之使用根據國際人道法，可能違反那一個原則？（10分）", "answer": ""},

{"category": "intl", "sub": "外交特考國際法組海洋法與人權法", "year": "111", "question": "一、甲乙兩國隔著S海峽相望。甲國是一大陸型國家人口眾多，向來主張島嶼國家之乙國是其一部分，甲乙兩國之間之S海峽寬度70海浬，甲乙兩國均各自主張12海浬之領海與200海浬之專屬經濟海域。甲國不只主張軍艦在領海沒有無害通過權，最近又主張其不只對於乙國島嶼擁有主權，而且也對於S海峽擁有主權。\n\n（一）丙國軍艦在距離甲國之基線起算40海浬、距離乙國基線起算30海浬之S海峽之中間海域航行，其欲通過S海峽。甲國以丙國軍艦未經其許可通過S海峽為由，阻止其通過，根據聯合國海洋法公約是否有理？（10分）\n\n（二）甲國主張乙國不是國家，而是其叛離的一省，該乙國島嶼是其領土之一部分，甲國大陸與該島嶼均同屬於甲國之領土，因此不讓各國船舶航行通過島嶼向大陸之S海峽，要求各國船舶只能走乙國島嶼向海那一側之海域，該島嶼向海那一側之海域在航行上與水文上都與S海峽同樣方便，此種主張根據聯合國海洋法公約是否有理？（15分）\n\n（甲乙丙三國均為1982年聯合國海洋法公約之締約國）", "answer": ""},

{"category": "history", "sub": "台大政治所", "year": "102", "question": "二、在臺灣所處的東亞，面對目前日益明顯的美國、中國大陸、日本等大國的權力競逐下，目前馬英九政府在面對此三大國之對外政策上，採取如何的政策？此一政策之目標為何？如何達成此目標呢？在目前快速變化的東亞局勢上，您認為此一政策可行嗎？\n\n2009年1月，曾在美國政府服務33年的喬治城大學教授沙特（Robert Sutter）指出：「他個人支持馬總統的兩岸政策，也希望行得通，但這仍是片面善意，馬總統在外交、經濟與國防各方面的讓步，更確認了中國的全面主導權，形成不對稱的賽局，未來兩岸關係發展未必符合美國利益，甚至有可能出現最壞的狀況。」臺灣如果不再成為美國執行針對中國的遏阻戰略的盟友，美國自有其他手段；如果兩岸過於緊密，危及美國利益，美國或許將提早修正戰略，排除臺灣，直接與中國或日本來協商東亞議題。請試對上述觀點做一評論。（25%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "102", "question": "三、請完整書寫下列人物的英文姓名，然後以中文告知他／她的國籍和曾經擔任最重要的職位，並列舉一項他／她在國際關係史上最具影響力的事蹟：（12%）\n\n李希留、艾德諾、柯慈、赫魯雪夫、曼德拉、尼赫魯", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "102", "question": "四、國際組織和國際建制的創建是國際關係史上劃時代的變化，代表著主要國家和領袖們致力維繫國際秩序的努力與嘗試。請解釋下列國際組織或建制成立的背景、主要任務、運作方式，以及維繫和平的成就：（16%）\n\nConcert of Europe、G7、Non-Alignment Movement、Bretton Woods System", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "102", "question": "五、「軍事干預」是國際關係史上最能代表強權政治和現實主義作風的國際行為。請從國際關係史的角度出發，分析1789—1989年兩百年間「軍事干預」行為在國際關係中的演進，並在最後回答：「在此二百年國際關係史中，軍事干預能成功實踐外交政策的因素為何？」請先給予歷史分期，說明分期的理由和依據，然後分析不同時期軍事干預的共同特色和重要事例，最後在結論中回答上述問題。（22%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "103", "question": "一、今年是甲午戰爭二甲子週年，在1895年《馬關條約》中，日本要求割讓遼東半島，這對俄國的東亞利益造成重大威脅。俄國當時有兩種政策的辯論：一為要求修改《馬關條約》以保持中國的完整；一為向中國要求領土補償，例如滿洲，以維持和日本所獲的利益相平衡。請試分析俄國何以放棄後者而決定干涉還遼，以保持當時中國的領土完整？而「干涉還遼」要成功，顯然非俄國當時能獨力做到的，其他列強的態度將決定其成功與否。請試分析當時列強的態度及「干涉還遼」何以成功？它對當時東亞的權力均勢及中國對外關係造成什麼影響？（25%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "103", "question": "二、2014年1月24日安倍晉三說目前的「日、中如第一次大戰前夕的英、德」；1月29日英國《泰晤士報》（The Times）亦報導「中日衝突將爆世界大戰」；2月3日季辛吉亦言：「如今的亞洲像是19世紀的歐洲，軍事衝突不能被排除。」請問您贊同如此之比喻嗎？請試就第一次大戰前夕的局勢分析之。（25%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "103", "question": "三、二次大戰後，美國與前蘇聯迅速崛起成為兩大超強，主宰全球政治；原來執世界牛耳的歐洲強權和日本帝國先後戰敗、瓦解或衰落。試比較：\n\n1. 原來擁有廣大殖民地的英國和法國，如何在殖民地紛紛獨立、美蘇主宰的全球兩極體系中，採行新的外交政策，以維持其大國地位和影響力？二者有那些異同？哪一個國家的外交政策較為成功？（13%） 2. 戰敗投降的德國（原西德）和日本，又如何採行新的外交政策，以恢復其國際地位，並重建其大國的身分？二者有那些異同？哪一個國家的外交政策較為成功？（12%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "103", "question": "四、1950年韓戰爆發後，美國對前蘇聯等共產國家採取了著名的圍堵政策。然而，奧地利孤立敵人、早在十九世紀以前即行於歐洲強權之間；1871年普法戰爭後，俾斯麥即對法國採取圍堵政策，全力在外交和軍事結盟上孤立法國；同樣地，一次大戰結束後，法國亦對戰敗德國採行圍堵政策。不過，這兩個歐洲版的圍堵政策，最後都歸於失敗，間接導致了第一次和第二次世界大戰。試說明並比較：\n\n1. 這三個圍堵政策最重要的指導思想和政策作為？（10%） 2. 德法版的圍堵何以最後歸於失敗？（5%） 3. 美國在冷戰時期圍堵政策最後獲致一定成效的原因。（10%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "104", "question": "一、請論述二次大戰期間的開羅會議和雅爾達會議，對二次大戰結束後東亞權力格局（由何國主導或東亞權力真空？）及戰後中國的東亞角色之設計有何不同？請試就1943—45年中美關係和美國東亞政策，及二次大戰軍事戰略的演變，來探討此一不同的原因，並請分析上述美國政策與戰略的演變，所導致對中國國內局勢及國際地位的變化之影響。（25%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "104", "question": "二、請試分析鴉片戰爭之前中國之傳統對外關係的主要運作架構。並請簡單論述此一傳統外交觀及運作架構在鴉片戰爭之後的歷次重要戰爭及事件，包括鴉片戰爭、英法聯軍、琉球事件、甲午戰爭、八國聯軍等，中所受到之衝擊，而導致此一傳統外交觀及運作架構的轉變及瓦解過程。（25%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "104", "question": "三、霸權和強權國家向來是國際關係史上的主角，但卻不一定是唯一的角色。請按時序說明1918年一次大戰結束後迄2000年，其它角色在國際舞臺上的興起、興起原因，以及對國際關係的影響。（10%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "104", "question": "四、1898年美西戰爭後，美國正式躍入全球強權之列，並逐步攀升，終至成為全球超強。請論述1898—2008年間，美國最重要的外交政策論辯，說明其中的主要爭點、代表人物、重要政策、最後辯論終結的原因，以及對當時全球政治的影響。（20%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "104", "question": "五、廿一世紀全球區域主義和跨區域合作興起。試論述1945年以來全球區域主義的發展歷程，並比較歐洲聯盟（含前身歐洲共同體）、東南亞國協、南錐共同體、歐亞經濟共同體和亞太經合會等五個區域國際組織的成立背景，並判斷其成敗；同時據此歸結一個區域主義發展成功的主要因素為何。（20%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "105", "question": "一、締造和維持和平是國際關係研究以及外交政策的首要目的，而解決危機是維持和平的重要課題。試以危機為核心，論述1900—2010年間國際社會中解決危機的成敗，並歸納出成功的理由。（25分）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "105", "question": "二、國際關係史的論述或分期，多以西歐和美國的觀點為主，但請試從俄羅斯和日本的角度出發，解釋下列事件。論述時，請以「我們俄羅斯」、「我們日本國」的稱謂答題：以俄羅斯立場分析：甲、1815年維也納和會；乙、1989年中東歐民主運動。以日本國立場分析：甲、1905年日俄戰爭；乙、1941年日本向美宣戰；丙、1971年尼克森訪問北京。（25分）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "105", "question": "三、請試論述1970年代初至1980年代中期，美、蘇、中共「戰略三角」（Strategic Triangle）出現的成因及演變，並請分析此一「戰略三角」關係的形成與演變，對此一時期中華民國對外關係的影響，例如美國兩岸政策中的三個公報。（25分）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "105", "question": "四、1931年的九一八事變乃是對第一次世界大戰後集體安全制度的首次挑戰，它標誌著東亞地區華盛頓體系崩潰的開始。請試就當時國際聯盟的因應，論述第一次世界大戰後建構的集體安全體系何以失敗？集體安全制度失敗後國際政治如何運作呢？何以無法阻止更為慘烈的第二次世界大戰爆發？（25分）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "106", "question": "一、2016年11月巴黎氣候變遷協定生效，極可能重塑全球貿易、生態、環境，甚至能源網絡，凸顯了國際組織和國際建制對國際關係的影響。請以國際組織的發展為主軸，論述十九世紀末至今國際組織對全球政治經濟的影響與興衰，並說明理由。（25%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "106", "question": "二、英國於去年六月透過公投決定退出歐洲聯盟，將正式結束英國在歐洲統合運動中四十多年的參與，是英國外交政策的重大轉變，也將牽動美歐關係和全球局勢。現在，請論述英國外交政策自十九世紀以來的轉變、轉變的理由，並評論其成敗，以及成敗的原因。（25%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "106", "question": "三、不同於九一八事變的刻意策動，盧溝橋事變乃是一並非經過計劃的偶然衝突。九一八事變之後，中日關係甚至曾在1935年達到最高峰，由公使關係提昇至大使關係。但盧溝橋事變此一意外事件在當時的時空背景下，卻演變成中、日之間的全面戰爭。請試就當時國際格局的轉變，中、日二國之國內局勢，及中、日二國對彼此之政策的演變，分析探討盧溝橋事變發生後何以演變成中、日全面大戰的爆發。（25%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "106", "question": "四、1941年12月8日，日本攻擊一個國民生產總額十倍於它的美國的珍珠港，其結果為日本帶來了投降、被占領與非軍事化的悲慘命運：\n\n1. 請試就當時之國際局勢，尤其是和歐洲戰局發展的關連，與日本國內政局狀況，來分析日本此一冒險決策的形成。 2. 對日本當時之決策者而言，還能有其他更好的選擇嗎？ 3. 並請論述珍珠港事變對中國對外關係的影響，例如一年後中國便完全擺脫不平等條約的束縛，並在1943年底開羅會議上，以世界四大國之一的地位出現於國際舞臺。（25%）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "107", "question": "一、2016年11月川普當選美國總統後的言行，對美國的「一個中國政策」有不少衝擊。川普的核心幕僚、曾任美國駐聯合國大使的波頓（John Bolton），2017年1月17日在《華爾街日報》撰文〈重新檢視一個中國政策〉，認為：「一個中國政策乃奠基於1972年《上海公報》的背景，如今應反映2017年的現實，現在兩岸關係已發生根本性改變，《上海公報》顯然過時了。」\n\n1. 請試析論「一個中國政策」下的美國對臺政策框架之內涵，包括那些內容、原則、承諾及保證等；而此內涵有何模糊、矛盾之處？此政策之目的為何？ 2. 您是否贊同上述波頓的觀點，此一框架已經過時了嗎？尚能有效維持臺海和平嗎？（25分）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "107", "question": "二、在1895年《馬關條約》中，日本要求割讓遼東半島，俄國決定「干涉還遼」，請問它何以成功？干涉還遼成功後對東亞各列強間的權力格局、均勢造成什麼影響？中國清廷之對外關係及政策有何轉變？朝鮮半島上的局勢又有何變化？（日、俄、中三國之競爭及影響力）（25分）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "107", "question": "三、國際關係早期著重外交和軍事安全，現今則包含了各類的議題。請從國際關係中人權、環境、能源和貿易其中任三個議題的發展，來闡釋國際關係的演進。（25分）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "107", "question": "四、任何一個時期的國際關係都受強權政治的影響，但是強權有興有衰。請從1815年以來的國際關係發展中，擇三個事例，說明一個強權國家在失去原有強權地位後，如何重新界定自己的角色，取得國際影響力。然後比較這三個事例，說明對國際關係理論辯論的意義。（25分）", "answer": ""},
{"category": "history", "sub": "台大政治所", "year": "108", "question": "一、一九八○以來，全球化和區域化同時興起。有的學者認為，區域化阻礙了全球化，二者是負相關；有的則持相反論點，認為區域化反而加速了全球化。請回答：\n\n甲、從一九八○年以降國際關係的發展來看，區域化是否強化或弱化了全球化？以及全球化是否強化或弱化了區域化？（10%）\n\n乙、請舉兩個具體的事例來支持您的觀點。（10%）\n\n丙、依您的看法，哪一個國際關係理論最能解釋這樣的相關性呢？為什麼？（5%）", "answer": ""},

{"category": "intl", "sub": "薦任情報", "year": "104", "question": "二、國際法上和平解決爭端為聯合國憲章中所揭櫫之重要理念，試述下列解決國際爭端之方式有何不同？其程序分別為何？請舉例說明之。（每小題10分，共30分）\n\n（一）調停（mediation）\n\n（二）仲裁（arbitration）\n\n（三）司法裁判（judicial decision）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "104", "question": "三、國家在對外國人或公司進行徵收時，通常需要對其進行徵收補償，而對於此補償之爭執，在世界銀行下設立《解決投資之爭端的國際中心》（ICSID），試述該組織之功能與運作。（20分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "104", "question": "四、英國蘇格蘭、西班牙的加泰隆尼亞、加拿大的魁北克紛紛於其國內推動「分離運動」，但上述情況多被視為政治問題，聯合國未賦予其國際法上的權利。試從聯合國相關文獻與國際法院諮詢意見分析「民族自決」概念的範圍與界限為何？（20分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "106", "question": "一、《聯合國憲章》第2條第4項明定：「各會員國在其國際關係上不得使用威脅或武力，或以與聯合國宗旨不符之任何其他方法，侵害任何會員國或國家之領土完整或政治獨立。」請分析本條意涵。（25分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "106", "question": "二、請說明下列兩個實例適用的是國際法上的何種制度或是原則，並請解釋說明這二種制度或是原則的內容：\n\n（一）1929年義大利與教廷訂立了《拉特朗條約》，規定義大利須禁止在梵蒂岡城附近建築可以俯視梵蒂岡的建築物。（12分）\n\n（二）1986年國際法院對布吉納法索與馬利邊界糾紛案中，採取的劃界原則顯示二國應尊重在獲得獨立時的邊界。（13分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "106", "question": "三、1926年8月法國船蓮花號在公海上與土耳其船波茲考特號發生碰撞，後者沉沒並有人喪生，蓮花號將土船人員救助後，航入土耳其的君士坦丁堡。土國依土耳其刑法第6條起訴法國一位船員，判處其監禁及罰款，但法國認為土國無管轄權。雙方後來同意將爭執提交常設國際法院解決，1927年9月法院判決土國勝訴。本案為國際法著名的蓮花號案，但是其有關海上碰撞的刑事管轄之判決與後來1982年海洋法公約的規定不同。因此，請分別依照常設國際法院蓮花號案的判決和1982年海洋法公約的規定詳細說明下列問題：即關於公海上發生碰撞時，法律上應負責之人到底應由何國法院管轄？（25分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "106", "question": "四、承認（recognition）是國際法上特有的制度，在國內法中並無相似的制度。請回答下列問題：\n\n（一）為何國際法上有國家承認的問題？（5分）\n\n（二）一個國家成立後，是否必須經過其他國家承認才能成為國際法的主體，成為國際社會的成員，在學者間有二種主張，請說明之。（10分）\n\n（三）1983年11月15日土裔人民宣布成立「北賽普勒斯土族聯邦國」（Turkish Republic of Northern Cyprus）。聯合國安全理事會在同月18日通過第541號決議，認為此獨立宣告法律上無效（legally invalid），且要求各國不予承認。請問此種不承認（non-recognition）的意義與法理為何？（10分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "108", "question": "一、懸掛中華民國國旗之「廣大興號」是中華民國籍漁船，船長與船員均為中華民國國民。該船在2013年5月9日上午5時於中華民國與菲律賓重疊的專屬經濟海域進行作業。上午9時45分，菲律賓海巡署公務船（Maritime Control Surveillance 3001）命令廣大興號漁船停船，但該船卻掉頭就走。菲律賓海巡署公務船上水警甲乙丙三人未經鳴槍示警，即以機槍射擊，造成廣大興號漁船船員丁中彈身亡。試問：就本事件，中華民國可否向菲律賓主張國際法上之國家責任？（25分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "108", "question": "二、ABCDEFGH八國簽署反同性戀歧視公約，共26條。公約第5條規定：「各國應促進同性者有建立與異性者相同之婚姻關係之權利。」公約第25條規定：「本公約須經批准，本公約於有第四件批准書送交聯合國秘書長存放後生效。」八國簽署後，有ABCDEF六國批准，但只有ABCD四國將批准書送交存放。試問：\n\n（一）該公約是否生效？是否對於全體簽約國家生效？（10分）\n\n（二）若E國於批准時，作一保留之聲明，其表示：「E國於反同性戀歧視之公約中所承諾之義務，只適用於女同性戀，不適用於男同性戀。」此一保留是否有效？（10分）\n\n（三）D國發現E國的批准有附保留，因此也想比照辦理，雖然D國的批准書已經送交存放，仍還是追加附上一個保留：「D國所負擔之義務於公約生效之後第三年才開始起算，調整期為三年。」此一保留是否有效？（5分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "108", "question": "三、在聯合國憲章架構底下之集體安全體系，各會員國負擔和平之義務。會員國是否違反該和平義務，首先應由聯合國安全理事會認定。根據《聯合國憲章》第39條，聯合國安全理事會必須認定系爭國家是否有「和平之威脅」、「和平之破壞」或「侵略行為」之存在。如聯合國安全理事會確認有前述三者之一存在之情況下，才可對該國家作成決議，採取《聯合國憲章》第41條或第42條之制裁措施。以聯合國安全理事會對北韓之制裁為例，試問：\n\n（一）北韓所為之行為究被聯合國安全理事會認定為「和平之威脅」、「和平之破壞」或「侵略行為」？（15分）\n\n（二）聯合國安全理事會究依《聯合國憲章》第41條或第42條對北韓作出制裁？（10分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "108", "question": "四、兩德統一條約是在1990年8月31日東西德代表於波昂簽署，並於1990年9月29日生效。試問：\n\n（一）兩德統一在國際法上究可界定為東西德合併、東德加入西德或西德加入東德？（5分）\n\n（二）根據國際法上條約繼承之法理，東德在兩德統一之前與第三國所締結之條約以及在國際組織之會籍，例如在華沙公約組織之會籍，在兩德統一之後，其效力為何？（10分）\n\n（三）西德在北大西洋公約組織之會籍以及與第三國締結之國際條約，於兩德統一之後，該條約與國際組織之會籍之效力如何？（10分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "110", "question": "一、A國外交部長針對近日B國軍隊越過A國邊境行為，發表嚴正抗議。請說明中華民國《條約締結法》和《維也納條約法公約》有關「條約」的定義，並依據中華民國《條約締結法》和《維也納條約法公約》，判斷此一嚴正抗議是否為「條約」？（25分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "110", "question": "二、甲日前自C國外交人員訓練中心完成訓練後，已確定將至C國駐D國大使館服務。他知道在大使館的工作很繁重，也知道《維也納外交關係公約》並不禁止使館執行領事職務。但是其他有關常設使館職務的規定為何？請依據《維也納外交關係公約》說明之。（25分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "110", "question": "三、E國人乙在F國偽造G國貨幣後，逃至H國，依照EFG三國國內法，偽造本國或是外國貨幣皆為犯罪行為，請回答下列問題：\n\n（一）EFG三國政府都表示，依據國際法對於本案有管轄權。請分別說明三國依據國際法，可以主張行使管轄的原則為何？（15分）\n\n（二）H國政府表示，因為符合「雙重犯罪原則」，故已經同意「引渡」乙至F國接受審判。請問「引渡」和引渡法上「雙重犯罪原則」的意義各自為何？（10分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "110", "question": "四、I國國民丁到J國投資，蒙受重大損失。丁認為這都是由於J國政府對於外國人不公平的規範所導致的結果，因此請求I國政府進行外交保護行使國際索償。I國政府要求你寫一份法律意見，請說明下列事項：\n\n（一）何謂外交保護？（10分）\n\n（二）行使國際索償的條件與注意事項。（15分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "112", "question": "一、請問條約成為國家國內法的模式有那些？並依我國憲法規定、相關司法院釋字及《條約締結法》規定，說明我國對條約國內法化所採取的模式為何？及在國內法之地位如何？（25分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "112", "question": "二、自2022年2月24日起俄羅斯對烏克蘭採取所謂的「特別軍事行動」，至今尚未結束。俄羅斯與烏克蘭作為聯合國會員國，請依《聯合國憲章》規定，說明俄國此行動是否構成憲章義務之違反？烏克蘭在憲章規定下，可主張何種權利及採取何種行動？（25分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "112", "question": "三、有一西藏人甲，不堪因信仰及政治意見被其政府迫害，流亡至N國，再持有N國護照入境我國居留，因居留效期屆至，且經我國內政部移民署發現甲所持N國護照係偽造，而違反《入出國及移民法》第31條第1項，並依同法第36條對甲做成強制驅逐出國處分。因甲所持N國護照係偽造，我國內政部移民署無法將甲往N國驅逐，遂決定將甲驅逐回其原本出發國及原籍國。請依國際法及我國所締結的公約，說明此處分是否違反國際法？（25分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "112", "question": "四、我國在2017年6月之前與巴拿馬有外交關係，並曾締結雙邊自由貿易協定。請依《維也納條約法公約》規定及我國與巴拿馬自由貿易協定規定，說明斷交對締約當事國之影響為何？以及此協定目前效力為何？（25分）", "answer": ""},
{"category": "intl", "sub": "薦任情報", "year": "114", "question": "一、A國及B國皆為世界貿易組織（WTO）會員，2023年6月15日A國對B國突然宣布，將於當年7月1日對B國出口到A國的小家電產品，一律在既有的關稅上額外增加30%的關稅，引來B國的嚴重抗議。A國宣稱這是基於1994年關稅暨貿易總協定（GATT 1994）第20條一般例外規定。請申論1994年關稅暨貿易總協定（GATT 1994）第20條一般例外規定為何？（25分）", "answer": ""},

{"category": "intl", "sub": "薦任情報", "year": "114", "question": "三、於2023年11月，非C國籍之不明國籍甲船在C國外海出現，並於7海浬內故意下錨勾拖，導致C國海底電纜損壞，甲船隨即逃逸。2025年10月，C國海巡人員發現外觀相似於甲船的他國籍船隻正在外海11海浬持續航行緩慢通過。依據《聯合國海洋法公約》，C國可否對該外觀相似於甲船的他國籍船隻執行刑事管轄，登船調查犯罪事實，請申論之。（25分）", "answer": ""},

{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "113", "question": "依1982年《聯合國海洋法公約》與其他國際海洋法法源，締約國是否有具體義務防止、減少和控制因氣候變遷，包括人為排放溫室氣體造成之海洋環境污染，如海洋暖化、海平面上升與海水酸化？\n\n若有，分別舉出對應條文說明其具體義務之內容。（15分）", "answer": ""},
{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "112", "question": "一艘V國籍之600噸級漁船，在距離太平島40浬海域內捕撈白帶魚，遭欲自太平島返航臺灣的我國海巡艦發現，並緊追該船至距離V國領海2浬處加以捕獲後拖帶回高雄港，依違反我國《專屬經濟海域與大陸礁層法》裁罰。\n\n試問，作為該V國籍漁船船東之訴訟代理人，應如何由下列面向為免責之主張：1.專屬經濟海域之取得與劃設；2.島嶼制度；3.沿海國在專屬經濟海域內之權利；4.他國捕魚之權利；5.緊追權之合法行使。（30分）", "answer": ""},
{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "112", "question": "同屬南海主權權利之聲索國，我國對其他聲索國在南海海域岩礁進行大規模填海造陸，以及於低潮高地興築人工島嶼致破壞海洋生態之行為，若欲主張其違反海洋環境保護義務而應負擔國家責任，依據《聯合國海洋法公約》及其他國際法法源，是否有理由？\n\n試由沿海國保護海洋環境之個別義務面向申論之。（10分）", "answer": ""},
{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "111", "question": "依據《聯合國海洋法公約》，沿海國對於其陸地領土自然延伸之大陸礁層，乃屬無庸主張即自然擁有的權限。\n\n今有向來不睦的海岸相向兩國A國和B國，兩國大陸礁層重疊，尚未達成劃界協議。因B國在屬於A國之大陸礁層設置海底探測系統，以調查相關海洋環境和水文，此舉引發A國不滿，於B國海域進行飛彈試射。\n\n試述兩國行為之合法性。（20分）", "answer": ""},
{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "111", "question": "在E國沿海周遭權宜船猖獗，弊端叢生。今在E國領海外1浬處，一艘F國籍船舶甲船正準備將欲走私到E國之香菸轉運給接應的另一艘漁船乙船。\n\n此時甲船船員因細故發生鬥毆，導致甲船船員G國人某丙因重傷、失血過多，延誤就醫而死。經媒體揭露，批評E國海巡單位失職、冷血。\n\nE國海巡單位則依據《聯合國海洋法公約》，稱E國就領海外之外國船舶之走私及鬥毆事件本無管轄權。試從《聯合國海洋法公約》分析，E國海巡單位說法是否有理？（20分）", "answer": ""},
{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "110", "question": "請依《聯合國海洋法公約》，比較公海與深海床之：1.定義；2.性質；3.各自適用之規範原則。\n\n各國能否派遣本國船舶於公海水域鑽探深海床之礦藏？（20分）", "answer": ""},
{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "110", "question": "A國為沿海國，其鄰近海域漁產豐富，常見B國籍漁船在A國離岸約150海浬附近水域捕魚。\n\nA國為《聯合國海洋法公約》締約國，為維護漁權，乃對該B國漁船進行登船檢驗，甚至扣押。B國政府對A國表示抗議，認為該海域享有捕魚自由。\n\n依上述公約規定：1.A國能否禁止B國籍漁船在系爭海域內捕魚？2.A國對該B國籍漁船之登船檢驗、扣押，是否符合公約？（20分）", "answer": ""},
{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "109", "question": "A國已宣布設立其專屬經濟區，並於距離其海岸線超過24浬外海中擁有一小島，島上有約百人定居並從事漁業及農業維生，A國海岸巡防隊定期巡邏該島海域執法。\n\nB國漁船因進入該小島200浬之水域內進行捕魚，為A國海岸巡防隊所逮捕。A國依據其國內法，對該漁船課予船價與船上漁獲價值合計總額5倍之罰鍰，要求該漁船繳納上述罰鍰後，始予釋放。\n\n依1982年《聯合國海洋法公約》分析A國行為之合法性。（20分）", "answer": ""},
{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "109", "question": "A國漁船「榮昌號」於2015年2月26日，在距離該國東南方164浬處與B國重疊之專屬經濟海域內，遭B國海巡艦艇追逐掃射。\n\n「榮昌號」船身受損，船員一人喪生、二人受傷，經A國海巡艦艇救援返回A國港口。A國主張B國違反國際法，要求道歉、賠償與懲凶。\n\nB國則辯稱，「榮昌號」係在其領海非法捕魚，追逐與掃射行為係合法行使緊追權。依據國際海洋法，B國抗辯是否有理？（20分）", "answer": ""},
{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "108", "question": "A國海軍海洋探測艦P號，配備有觀測、調查海底地形、海流、海水溫度、水中雜音等設施。P號未經許可也未通知即進入我國領海中航行。\n\n我國海軍驅逐艦隨即對之施以砲擊並予以拿捕，指控P號侵入領海進行間諜活動。\n\n1.P號未經通知許可在我國領海內航行探測，是否牴觸國際海洋法或我國法之規定？（10分）2.我國海軍對P號施以砲擊拿捕，是否符合國際海洋法？（10分）", "answer": ""},
{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "108", "question": "依1982年《聯合國海洋法公約》規定，兩國間發生海域劃界爭議時，得採取那些爭端解決機制？（20分）", "answer": ""},
{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "107", "question": "出傭給B國大洋海運公司之A國籍貨輪「永明號」，於航行在B國與C國間之公海海域時，其A國籍船長與管理幹部竟合力將不聽指揮之三名C國籍船員驅逐離船，致三人不幸溺斃。\n\n永明號返抵B國港口時，船長與管理幹部遭B國警察逮捕。理由是C國依據其與B國間簽訂之引渡協定第2條：「受引渡人應為在任一方領土地理範圍內涉及本刑3年以上有期徒刑犯罪之人。」要求B國將永明號船長與管理幹部引渡至C國受審。\n\n請問：作為船長與管理幹部之訴訟代理人，應如何依海洋法與相關法律為程序抗辯？（20分）", "answer": ""},

{"category": "intl", "sub": "司法官律師海商法與海洋法", "year": "106", "question": "懸掛S國國旗之油輪「塞加號」經常在G國領海外專屬經濟海域內為外國漁船加油，便利彼等延長作業時間，該等漁船均獲有G國發給之捕魚許可。\n\n某日G國派出巡邏艇，緊追正在G國領海外專屬經濟海域內為具有G國捕魚許可之漁船加油的「塞加號」，並將其截獲拖帶回G國港口法辦。\n\n「塞加號」船長被逮捕，控以走私及逃漏G國稅捐之刑事犯罪，判處徒刑及鉅額罰金。S國於獲G國同意後，向國際海洋法法庭提起訴訟，主張G國逮捕及追訴「塞加號」及其船長違反國際海洋法，應迅即釋放「塞加號」並賠償損害。\n\nS國主張是否有理由？（20分）", "answer": ""},

{"category": "intl", "sub": "台大法律庚組", "year": "115", "question": "壹、A國與Y國不但邊界相鄰，兩國政府及人民在各層面上亦維持緊密互動。但在2015年，Y國內部發生軍事政變，領導政變的Y國參謀總長M在政變成功後被選舉為Y國總統，同時開啟其獨裁統治。除了透過司法追訴及騷擾等手段打壓境內其他政黨領導人及參選人外，M總統同時藉由修憲的方式，新設立了所謂的「愛國者民主選舉委員會」，並擔任該委員會的主席。唯有通過委員會所核可的候選人，始能參與Y國的選舉。自此，Y國境內各層級的選舉逐漸流於形式；包括A國在內的許多國家、聯合國等國際組織，均對於Y國的國內民主及法治情況表示關切。\n\n更甚者，M總統在權力鞏固後，進一步開始迫害Y國境內少數民族，不但造成少數族群大規模失蹤及非自然死亡，並使其流離失所。這些難民為了逃離M總統及其統治集團的獨裁統治及壓迫，乃尋求各種方式翻越邊境進入A國。大量來自Y國的難民進入A國後，對於A國邊境區域形成重大的財政與社會成本，相關治安狀況日益敗壞。有鑑於此，A國多次要求Y國應停止迫害其境內少數民族，並決定凍結M總統及相關政府單位主管在A國的財產，以促使Y國採取積極作為以防止難民湧入A國。惟M總統對於A國的多次要求均置之不理，甚至反過來指控A國對其的制裁以及要求其政府停止迫害少數民族係屬侵害Y國內政的行為。同時，A國近年來面臨極為嚴重的毒品氾濫問題。絕大多數的證據顯示，A國境內毒品的原料有極大部分係從Y國透過非法貿易的管道進口。雖然沒有情資證明M總統有直接指示販毒集團將其產品輸往A國，但眾多客觀證據均顯示M總統及其親信與Y國境內的販毒集團具有十分密切的政商關係。\n\nA國對於M總統及Y國政府持續在惡化國內政治環境、難民及毒品等議題的不作為漸失耐心。從而，A國決定直接採取行動。A國總統下令派遣特別執法部隊，長驅直入Y國首都並逮捕了M總統；同時宣布將在Y國進行過渡性的行政管理，並與反對派領袖合作，目標在最短的時間內重新恢復Y國的民主選舉。\n\n假設你是A國政府內閣的國際法法律顧問，試以上開事實背景為基礎，分析A國派遣軍隊進入Y國在國際法上可能的正當化依據及法律風險；同時分析其佔領Y國在國際法上之性質、與佔領期間之國際法義務。（50分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "115", "question": "貳、2025年底中國宣布在臺灣周邊海域進行軍事演習，為達其所謂對臺封鎖之目的，中國海警局表示：「福建海警局組織艦艇編隊繼續位於台島周邊鄰近海域開展執法巡查，重點實施查證識別、警告驅離、臨檢拿捕等科目演練，檢驗了區域管控能力」，而中國宣傳圖片中顯示中國海警局於周邊海域將臨檢並拿捕運送武器到臺灣的長榮貨輪，請問：\n\n(1) 在非戰爭狀態下，中國海警是否有權單方面對台灣或外籍運送武器的民用貨輪進行登船檢查、扣押？有無任何國際先例？國際法規範為何？（25分）\n\n(2) 假如你是長榮海運的諮詢顧問，就中國此一宣示，你將給長榮海運何種建議？（25分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "114", "question": "一、A地於1800至1945年間，原為B國之殖民地，聯合國成立後將A地列為「非自治領土」（Non-Self-Governing Territory）。1961年10月，A地人民自行組成A解放組織，主張A享有人民自決權，並在鄰國C之軍事及經濟援助下，使用武力對抗B國之統治，尋求建立獨立國家。B國拒絕承認A之自決及獨立，亦使用武力試圖回復其有效統治。A、B雙方之武裝衝突持續一年多，後經D國調停，A、B雙方停火，B國不再繼續對A發動軍事攻擊；A則在聯合國監督下，由A解放組織組成自治政府行使事實上管理權。至於A解放組織先前宣布建立之A國，則僅有C國予以承認，此外別無他國承認A為國家。然多數國家亦不明白承認A地為B國領土，反而多支持A得以非國家之特別實體地位加入某些政府間國際組織。1990年間，D國突出兵佔領A、D雙方有主權爭議，然在1945年後即由A實際統治之媽島，另占領媽島附近A之部分領土。A向C國求援，要求C國軍事協助以維護其自主地位及領土完整。\n\n請問：\n\n(1) A於1961年間使用武力，以實現其人民自決權，是否符合國際法？（20分）\n\n(2) D國於1990年對A使用武力以收復爭議領土，A對D國能否主張國際法上之自衛權？C國如擬軍事援助A，有無或有何國際法依據？（30分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "114", "question": "二、J國在公海擁有一環礁上之「海洋地物」（maritime features）甲，面積雖僅有400平方公尺，且無人居住，但卻永久高於海平面。國際間對於J國擁有該環礁領土主權並無爭議，但因該環礁位於颱風經過路徑，使得該地物日益減縮，為避免該地物遭受到日益侵蝕，J國在地物甲四周以金屬予以保護，並將該處環礁之珊瑚帶回J國進行繁殖，然後再植回地物甲所在之環礁上，藉此金屬建築物與日益自然繁殖的珊瑚保護地物甲。J國並根據《海洋法公約》主張地物甲擁有專屬經濟區與大陸礁層，並向聯合國大陸礁層界限委員會申請該地物甲之外部大陸礁層。然而C國在該處進行諸多海洋科學研究與洋流調查，J國認為C國若要進入地物甲周邊之200浬內進行科研，則需經J國政府同意，C國認為地物甲不能主張專屬經濟區或大陸礁層，兩國對此迭有爭執。請問：\n\n(1) 當代海洋法對於「海洋地物」如何進行分類？此種法律上之分類對系爭海洋地物之權益有何差別？（20分）\n\n(2) 假如你是C國的外交部法律顧問，而C國對地物甲周邊海域進行科研有重大國家利益，請根據國際法論述C國有權利進入地物甲之200浬範圍內進行科學研究。（15分）\n\n(3) 反之，假如你是J國外交部法律顧問，請根據國際法論述C國無權進入地物甲之專屬經濟區內進行科研。（15分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "113", "question": "第一題（50分）\n\nA國境內之X州居民約有80%與鄰國B國人民係同種族、同語言，百年前曾隸屬B國，歷史與經濟關係密切。2012年1月A國內部發生政治動盪，原總統提前下台，反對黨領袖甲當選A國新總統，改與C國結盟，B、C兩國素來敵對。2012年8月，A國通知B國自2012年9月起終止兩國間之經貿及文化合作協議，並禁止B國漁業產品之進口。依該協議規定，終止協議之通知原應於一年後（即2013年9月起）始生效。B國隨即採取經濟制裁之報復手段，宣布立即禁止A國農牧產品之進口；再於2012年12月，依上開協議之強制爭端解決條款，向國際法院起訴主張A國違反協議，請求賠償等救濟。A國主張國際法院無權受理B國之起訴，並拒絕應訴。\n\n2013年3月，X州民選州長結合當地邊境軍隊發動武力叛變，難民逃亡至鄰近B、C等國，A國動用武力鎮壓X州叛變，C國對A國提供經濟及軍事援助。B國則派遣武裝部隊，改穿X州叛軍之軍服，與X州叛軍共同對抗A國政府軍。X州叛軍又以X州與C國間有邊界爭議為由，突然以武力攻擊C國境內之平民設施，殺害近200名C國及他國國民，C國遂以武力反制，攻入X州境內，占領X州之部分區域。聯合國安理會通過決議要求各方立即停火，A、B、C國因而均撤軍。後在安理會監督下，以X州叛軍及當地領袖為代表，成立X過渡政府，管理X州。2014年1月，X過渡政府之首長，以X地人民名義，主張並行使人民自決權，宣布獨立並成立X國。A、C兩國拒絕承認X國之獨立，主張X國之宣布獨立違反聯合國安理會之決議；B國則迅速承認X國。\n\n請就上述假設事實，以「自問自答」方式，先指出其所涉國際法爭點問題至少5個（建議提出5個問題即可，每個問題之敘述不超過3行），再選擇其中2個問題回答。如能援引類似的國際法案例、國際法院判決及諮詢意見書等，並據以分析其中爭點及答案，會獲得較高評分。", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "113", "question": "第二題（50分）\n\nX國與Y國為海岸相鄰國家，但並未劃定兩國海上疆界。在兩國邊界臨海域發現油田，對此雙方皆宣稱擁有該處油田主權、主權權利與一切權利，為此雙方進一步發生海陸武裝衝突。因X國為石油輸出大國，為削弱X國戰爭的能力，Y國宣布凡進出X國港口運送原油之油輪，不論是否懸掛X國旗幟，都將予以擊沉；消息一出，部分非區域性國籍之油輪，紛紛懸掛區域海上強國Z國之旗幟，期待能繼續在該海域進出、運送油品。對此發展，區域強國Z國除持續呼籲各方節制，不應使衝突擴大外，隨後亦表示：為維護海洋航行自由與區域穩定，凡懸掛Z國旗幟之油輪，皆可尋求Z國在附近海域巡邏軍艦之協助。請問：\n\n（1）Y國是否有權利宣布如此措施？（10分）\n\n（2）未放棄原國籍之油輪是否有權懸掛Z國旗幟？此等船舶是否為Z國籍船舶？有無相關國際實踐？（20分）\n\n（3）何謂「便宜船旗」？此類懸掛Z國旗幟之船舶是否為便宜船旗船？Z國有無權利保護此等油輪？（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "112", "question": "第一題（50分）\n\n(1) 假設A、B兩國都是1969年聯合國《維也納條約法公約》（VCLT）之締約國，兩國於1990年簽署雙邊條約，約定兩國應立即停止所有核子武器試驗，並於條約生效後5年內銷毀兩國現有之舊型核子彈頭各100枚、之後每5年各自銷毀100枚，以逐步減少至不超過兩國於1990年所持有核子武器總量之半數。B國於1991年批准上述條約，A國國會對於上述條約部分內容有意見，至1993年止，A國仍未批准上述條約。而A國在1991年底更於該國領土內進行某新型核子武器試爆，並進而於1993年中生產該型武器100枚。B國主張A國違反上述條約，是否成立？（25分）\n\n(2) 假設C、D兩國都是1969年聯合國《維也納條約法公約》（VCLT）之締約國，兩國於2000年簽署協議，並約定該協議自2001年1月1日起生效。該協議規定兩國應共同採取某特定行為，以維護兩國國界間某一湖泊之生態。2005年間，C國主張該協議內容並不符合C國憲法有關環境保護之規定；又D國在其境內興建大型水庫、電廠及工業設施，致上述湖泊之動植物大量遷徙、滅絕，已難以回復。雖C國曾數度要求D國協商解決，然D國均置之不理。請問C國得為如何之主張？上述協議無效？予以撤銷？其他主張及要求？（25分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "112", "question": "第二題（50分）\n\nT國與C國向來關係緊張，不僅互不承認，C國更宣稱T國全境自古即是其不可分割領土，並一再強調有權利訴諸武力收復失土。除此之外，C國並曾屢屢表示將發動閃電攻擊，消滅T國所謂的分裂主義份子。為達震懾目的，C國經常在T國周邊海域舉行軍事演習外，近來C國又頻頻派遣軍艦至T國外海航行，並逼近24浬海上界線，進行軍事演練，展示收復失土決心。對此情勢，假設T國國防部門分析，艦載武器與速度日新月異，應盡量確保足夠反應時間，因此建議有必要進一步宣布：任何進入C國24浬鄰接區海域內之T國軍艦，將予以監控並驅離。倘若你是T國相關部門的法律顧問，請問：\n\n(1)《海洋法公約》體系下，沿海國在鄰接區內享有何種權利與義務？第三國船舶負有何種權利與義務？2022年國際法院在相關判決中，對此有何看法？（25分）\n\n(2) 倘若T國政府政策決定：必須禁止C國軍艦進入其24浬內，以確保國家安全。政策既已如此決定，請作為政府法律顧問的你，根據國際法論述此一舉措之合法性。（25分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "111", "question": "第一題（50分）\n\n假設我國與A國締結自由貿易協定（下稱協定），約定一方對他方農牧產品之輸入，除有相當科學證據證明其有危害健康之虞者外，不得禁止或限制之，此項約定內容與我國當時有效之食品安全衛生管理法（下稱食安法）規定不相牴觸。上述協定並未定有批准、接受、認可或加入條款，而係規定自雙方代表簽署日起30日後生效。立法院認為行政院應依憲法、條約締結法規定，向立法院提出條約案，並於立法院議決同意後，我國始受上述協定之拘束。然行政院拒絕向立法院提出條約案，立法院於是在該協定簽署日後第40日三讀修正食品安全衛生管理法，明定數項動物用藥及農藥於任何進口之農牧產品均須零檢出，否則不准進口。該法案後經總統公布生效。請問：\n\n(1) 依憲法及條約締結法規定，上述協定是否應送立法院審議？如於上述協定簽署日起30日後，上述協定仍未經立法院議決通過，我國於國際法上是否受上述協定之拘束？（20分）\n\n(2) 在上述食安法修正條文生效後，A國要求我國履行上述協定，開放符合國生產、含有食安法明文禁止之動物用藥，但殘留量符合國際貿易標準之農牧產品（下稱A國產品）進口，我國如以食安法為由，拒絕進口A國上述產品，是否違反國際法？（10分）\n\n(3) 假設有我國進口商B擬進口上述A國產品，經海關查驗發現含有食安法禁止之動物用藥，除銷毀該批產品外，另禁止之後續進口A國產品。B提起行政訴訟，請問管轄之行政法院應優先適用上述協定或食安法？（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "111", "question": "第二題（50分）\n\nC國與D國兩國為海域相向國家，而在兩國海域中間存有單一「尖上地物」（maritime feature）名作「群鳥岩（Birds Rock）」，該岩塊面積雖僅有20平方公里，但其上無任何植被與淡水，且無人居住，主要是海鳥聚集，C、D兩國皆宣稱該海洋地物為其不可分割領土，以致遲遲無法進行海域劃界。兩國漁民在「群鳥岩」四周捕魚已經數百年，大致相安無事。惟近年來，因過度捕撈，以致漁獲遽減，C國領袖宣稱國家海洋權益不容任何人侵害，乃派遣海上執法船艦前往驅趕D國漁民。D國領袖同樣表示維護國民海上權益是政府不容逃避的責任，因此派遣海軍前往護土護漁。請問：\n\n(1) 根據國際司法實踐，若該海洋地物屬於C國所有，則D國人民是否仍有權在該地物四周捕撈漁獲？（10分）\n\n(2) C國執法船艦可否使用武力驅離或逮捕D國漁民？此種武力使用究係「執法活動」（law enforcement activities）抑或「軍事活動」（military activities）？如何區分？（20分）\n\n(3) 若C國執法船艦追緝D國漁船，D國海軍如何在國際法容許範圍內進行因應？（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "110", "question": "第一題（50分）\n\n國際人道法包括海牙法體系和日內瓦法體系，請附理由回答以下有關國際人道法之問題：\n\n（一）國際間與非國際間之武裝衝突，是否均有日內瓦法體系之適用？（15分）\n\n（二）於戰爭中以空軍對於交戰國首都進行地毯式大規模轟炸，涉及國際人道法哪個體系之規範？是否違反當代國際法？（15分）\n\n（三）當代國際法是否禁止核子武器之試爆、移轉或使用？（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "110", "question": "第二題（50分）\n\nA國近年漁業發達，該國遠洋漁船日益擴張，在生存與利益驅使下，A國漁船進入B國海域作業，為此兩國簽署有入漁協定，但因B國入漁許可甚難取得，且作業條件嚴苛，因此A國漁船甲在未取得入漁許可文件前，即進入B國專屬經濟海域作業。作業之際，B國巡邏船出現，發現漁船甲，而該漁船並不在入漁許可所列漁船名單中，乃以無線電通知，要求登船檢查相關文件，漁船甲拒絕停船，並加速朝A國海域逃跑，B國巡邏艇乃向空朝漁船甲開槍警告，漁船甲不予理會，仍持續逃離。在漁船進入公海之際，B國巡邏艇乃朝漁船甲船身射擊，且擊中船長與數名船員，造成傷亡。請問：\n\n（一）B國巡邏艇有無權利要求登檢A國漁船？理由為何？（15分）\n\n（二）B國巡邏艇追擊A國漁船若為行使「緊追權」，則B國巡邏船必須符合哪些要件？（20分）\n\n（三）本案中B國巡邏艇可否使用武力停止漁船甲？造成人員死傷，是否須負相關責任？（15分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "109", "question": "（壹）聯合國會員A國所屬X省之9成居民為百年前由他國移入之少數族群，長期受A國中央政府壓迫，包括禁止並鎮壓X省多數人民所信仰之宗教、設立集中營拘禁約3成之X省居民、限制X省人民離開X省、禁止X省之上述9成居民從事某些類型之工作或政府公職等；A國並於2020年中廢除X省之地方選舉，改由A國中央政府直接派遣省長統治。\n\n請依現行國際法之相關條約、國際組織決議、國際法院裁判及諮詢意見、習慣國際法等，回答以下問題：\n\n(1) X省省長召集該省議員約8成舉行制憲會議，以國際法之人民自決權為依據，並以X省人民之名義，宣布獨立為X國，並制定憲法。X省之上述行動是否構成對A國領土完整之破壞，從而違反《聯合國憲章》第2條第4款規定或其他國際法規範？（20分）\n\n(2) 新成立之X國政府訴諸武力對抗A國中央政府之武力鎮壓，雙方發生武裝衝突。鄰國B國應A國政府之要求，對A國中央政府提供經濟及軍事協助，是否違反國際法？又其他國家能否援助或支持X國新政府之對抗A國？（15分）\n\n(3) 對於A與X間之武裝衝突，聯合國有無任何介入機制？（15分）\n\n相關條文：《聯合國憲章》第2條第4款：「為求實現第一條所述各宗旨起見，本組織及其會員國應遵行下列原則：……四、各會員國在其國際關係上不得使用威脅或武力，或以與聯合國宗旨不符之任何其他方法，侵害任何會員國或國家之領土完整或政治獨立。……」", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "109", "question": "（貳）懸掛T國旗幟船舶在P國專屬經濟海域作業，根據P國法律，任何進入該國專屬經濟區作業之外國漁船必須僱用該區域內國家之漁業觀察員，紀錄捕撈資料，以確保遵守P國有關專屬經濟區內漁業規章。因此T國雇用該區域內國家V國籍之女性觀察員一名，然當漁船在P國專屬經濟海域作業時，V國觀察員甲女向T國船長表示：該船V國船員乙男對其進行性騷擾。獲悉此指控後，T國船長立即將漁船駛入P國港口停泊，甲女則離船前往P國警局報案，指控乙男。請問：\n\n(1) 何謂公海船旗國專屬管轄權？（20分）\n\n(2) 本案中，P國警察能否進入停泊於其港口的T國船舶，並對本案進行調查？有何法律基礎？（10分）\n\n(3) T國可否主張擁有「專屬管轄權」？（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "108", "question": "第一題（50分）\n\n2018年10月2日，沙烏地阿拉伯籍，美國華盛頓郵報記者「賈馬爾．艾哈邁德．哈紹吉」（Jamal Ahmad Khashoggi）進入沙國駐土耳其伊斯坦堡總領事館後，隨即失蹤。同月2日沙國政府承認哈紹吉已於領事館內死亡，但宣稱他是沙國通緝犯，因與領事館內安全人員發生衝突、互毆致死。土耳其政府於調查後指控沙國政府高層派遣15人謀殺小組在館內活生生肢解、殺害哈紹吉。假設有充分證據足以證明土國政府之指控屬實，請問：\n\n(1)「沙國政府下令並派沙國政府人員，於沙國駐他國之領事館內，以殘忍方法殺害沙國人民之行為」可能違反了哪些國際法規範（包括公約、習慣國際法等）？（30分）\n\n(2) 假設土國政府如發現涉嫌殺人的上述15人（假設均不具沙國外交或領事人員身分）中，有5人仍躲藏在沙國領事館內，另10人則在沙國駐境內。土國政府就哈紹吉遇害事件，能否主張有刑事審判權？如可，應如何逮捕拘提上述15人到案接受審判？（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "108", "question": "第二題（50分）\n\n2018年11月25日，三艘烏克蘭軍艦（兩艘砲艇、一艘軍用拖船），預計從「黑海」（Black Sea）通過「克赤海峽」，然後進入「亞速海」（Sea of Azov）內的烏克蘭港口，然當該等烏克蘭軍艦正要進入「克赤海峽」（Kerch strait）之際，俄羅斯指責烏克蘭軍艦違反《海洋法公約》有關「無害通過」之相關規定，並且向俄方進行挑釁行為，因此俄國攔截三艘軍艦，接著開火，造成兩名烏克蘭船員受傷，最後並扣留全部船舶與24名船員。克赤海峽是連結黑海與亞速海唯一通道，1991年蘇聯解體，俄、烏克蘭獨立後，兩國於2003年簽訂《俄羅斯聯邦與烏克蘭間有關亞速海與克赤海峽使用合作的雙邊協議》（Agreement between the Russian Federation and the Ukraine on cooperation in the use of the sea of Azov and the strait of Kerch）（以下簡稱《雙邊協定》），根據該《協定》兩國船舶（不論民用軍用）皆有權通過該海峽，但2014年俄羅斯兼併克里米亞後，規定烏克蘭船舶必須經過俄國同意始得通過該海峽，請問：\n\n(1) 俄羅斯規定烏克蘭船舶必須經過「克赤海峽」必須經俄國同意後始得通過，是否合法？（20分）\n\n(2) 請問「軍艦」（warships）之定義為何？俄羅斯對烏國軍艦開火並扣押，有無法律上根據？（30分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "107", "question": "第壹題（50分）\n\n假設A國境內，有占全國人口數約15%之少數種族B，不滿A國政府長期歧視，致B族之宗教、語言、文化等均受壓迫，政經社地位遠不如A國境內之多數種族，B族因此組成B族人民解放陣線，於2001年開始進行武裝抗爭。A國政府經多年武力鎮壓，始終未能有效壓制。後A國政府於2005年1月以化學武器攻擊B族所佔領之城市，造成該市平民數百人死亡。聯合國安理會於上述化武攻擊後，隨即通過決議，譴責A國政府之使用化學武器，並要求A國政府立即停火，接受聯合國之調停及維和部隊之進駐。A國拒絕，揚言繼續鎮壓B族。由於B族人民10多萬人逃往A國鄰國C國，並已進入C國邊界，對C國造成嚴重的難民負擔。C國擔心A國鎮壓B族難民，可能危害該國安全，於是向與C國訂有共同防禦條約之D國求助。D國在2005年2月初某夜，突然以飛彈攻擊並摧毀A國境內之空軍基地、製造儲存化武之工廠及彈藥庫等共140處。攻擊隔天，D國宣稱A國明顯違反聯合國安理會於2000年間要求A國「凍結化武、且不得再製造化武」之決議，又違法對A國本國人民使用化武，並可能危害鄰國C國之安全及領土完整，有必要以武力摧毀A國之化武。翌日，C國宣布關閉A、C兩國邊界，並將已進入C國境內之A國難民10多萬人（絕大多數為B族人），驅逐回到A國境內。C國又聯合鄰近3國，一起斷絕C等4國與A國間之外交關係、陸海空交通及貿易（包括禁止A國輸入其民生必須之蔬菜、藥物等），並驅逐C等4國境內之A國外交官及國民共數萬人（多數為持合法簽證之留學生、工人、投資者等），理由是A國支持C等4國境內之恐怖組織行動，但C等4國均未提出任何具體證據，足以證明A國支持恐怖組織。C等4國同時要求A國政府首長下台、承認B族自治權，才會恢復與A國間之正常關係。查上述各國均為聯合國會員國。請附理由分析並回答下列問題：\n\n(1) D國攻擊並摧毀A國化武之行動，D國可主張的國際法依據為何？又從國際法院的觀點來看，D國之上述主張，在國際法上是否可以成立？（20分）\n\n(2) C國驅逐A國難民、發動並聯合其他3國共同封鎖A國（包括斷交、斷絕交通及貿易、驅逐A國國民等）、要求A國政府首長下台及承認B族自治權等行為，是否都符合國際法？（30分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "107", "question": "第貳題（50分）\n\nP島是座位於C國與J國相向海域中，是個無人居住的「海上地物」（maritime features），最高處高於海平面有一百餘公尺，面積約10平方公里。C國與J國皆宣稱P島為該國固有不可分割領土，惟從上世紀初開始，J國已事實上控制P島長達百餘年，且目前仍在J國控制下。至於C國則除持續主張P島為其固有領土外，並不時地派遣執法船艦前往P島，並編隊繞島航行，有時在P島12浬內航行，有時在12浬外航行。J國對此等行為皆正式提出強烈抗議，並派遣相對應艦艇與飛機嚴密監控要求C國船艦離開，但C國皆不予理會，並表示是在巡航本國領土，他國無權干涉。近日C國派遣艦隊在離P島15浬處循例繞島航行，但此次C國又從艦上放下「無人潛航器」，該「無人潛航器」進入P島40浬處潛行，J國艦艇對「無人潛航器」進行水下航行干擾，並試圖將之逼出水面。請問：\n\n(1)《海洋法公約》下對「海洋地物」作何分類，各可主張有哪些權益？（20分）\n\n(2) C國持續派遣艦艇前往P島巡航，在國際法下有何意義？（10分）\n\n(3) 該「無人潛航器」之法律地位為何？J國可否對之進行水下航行干擾？（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "106", "question": "壹、你是否贊成以下主張之全部？或只贊成其部分？或全部反對？理由？\n\n（一）「當代國際人權條約的內容都已成為習慣國際法，並構成所有國家的對世普遍義務（obligatio erga omnes）。而具有絕對法（jus cogens）的地位及效力。」（30分）\n\n（二）「聯合國憲章不容許聯合國之任何機構或其會員國干預一國主權。」（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "106", "question": "貳、T國與C國關係向來不睦，C國宣稱T國是其不可分割之領土，且不排除武力收復失土。C、T兩國間有一海峽存在，該海峽寬度約70浬，該海峽連結公海（專屬經濟區）兩部分，但因兩國關係緊張，其國家的船舶皆盡量避免通過該水道。2017年1月，C國新造之航空母艦沿著該海峽中央線通行，C國宣稱此航行目的在訓練航母作戰能力，於通過海峽時，該航空母艦啟動武器與偵蒐裝置，且航空母艦艦載飛機由航母甲板起飛，繞向C國一面海域後，再降落於航空母艦上。請問：\n\n（一）T國與C國間海峽是否構成1982年《海洋法公約》下之「用於國際航行之海峽」（straits used for international navigation）？（20分）\n\n（二）C國航空母艦通行之際，進行軍演與起降航空器，是否將因等行為影響航空母艦之航行權利？T國可採行何種作為？（30分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "105", "question": "第一題（50分）\n\n假設A、B兩國境內都有同一少數種族C，於2010年成立C革命組織，穩定控制A、B兩國內各約10%之土地，並持續以武力進攻A、B兩國其餘領土。A國政府邀請X國軍事支援，X國於2012年9至10月間，出動空軍轟炸A、B兩國境內C組織之武力部隊及軍事設施等。後C組織於2012年11月1日在Y國首都發動恐怖攻擊，炸毀民間歌劇院、百貨公司等，致有200多名Y國及他國人民死亡。Y國政府隨即出動空軍，於11月2至10日間轟炸A、B兩國境內的C組織部隊及軍事設施等，另導致當地人民100多人死傷。聯合國安全理事會後於2012年11月20日通過決議，除譴責C為恐怖組織，並決議如下：Calls upon Member States that have the capacity to do so to take all necessary measures, in compliance with international law, in particular with the United Nations Charter, as well as international human rights, refugee and humanitarian law, on the territory under the control of C, in A and B, to redouble and coordinate their efforts to prevent and suppress terrorist acts committed specifically by C and all other individuals, groups, undertakings, and entities associated with C, and to eradicate the safe haven they have established over significant parts of A and B. 後C組織於2013年1月宣佈成立C國，迅得到P、Q、R等同種族國家之承認。請問：\n\n(1) 在聯合國安理會通過上述決議之前，X、Y兩國對A、B兩國境內C組織用武的行為是否合乎現行國際法？請分析相關爭點並說明理由。（30分）\n\n(2) 上述聯合國安理會決議是否可成為X、Y兩國對C組織用武的合法依據？（10分）\n\n(3) P、Q、R之承認C國，是否合乎國際法？理由？（10分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "105", "question": "第二題（50分）\n\nA、B兩國為相向兩國，兩國海域距離未超過四百浬，而在兩國相向海域中間散佈著一組「海洋地物」（maritime features），兩國皆主張全部皆為其固有領土，爭議已歷數百年。事實上，兩國皆各自佔有部分島礁，然皆未能全部佔有。又因A國漁業較為發達，所以A國漁民往往在B國所控制島礁週邊水域作業，引發諸多爭執。\n\n其中A國占領此間最大島礁，面積雖有十平方公里，但其上並無淡水，且屬於珊瑚礁所形成，並無土壤可供耕作。但A國占領該島礁已經五十年，持續在其上建造水庫、海水淡化設備、太陽能發電設施，逐漸形成一個自給自足的社群，人口達到200人。B國則占領第二大島礁與第三大島礁，面積分別為3平方公里與1平方公里。該第二大島礁雖然較小，但確有淡水，且尚可耕作土壤，然水量不多，僅勉強能維持20餘人居住，且若乾旱年份，完全無法居住；而第三大島礁雖然更小，但卻擁有非常豐富礦藏，且深埋地底，週邊海域「可能」有石油與天然氣，雖一再探勘與挖掘，但一直未能證實。\n\n2016年1月初，兩國中間的斷層激烈活動，引發海底火山爆發，出現一新「海洋地物」（maritime features），面積約0.9平方公里，高有10公尺，且持續擴大中。該海洋地物剛好出現在離A國大陸本土180浬處，離B國大陸150浬處。此際A國漁民在地震過後，發現該海洋地物，立即登上該地物，並插上A國國旗，但B國巡邏艇發現後，將A國國旗拔除，改插B國國旗，A國抗議，並又派遣海軍前往，拔除B國國旗，又改插A國國旗。請問：\n\n(1) 在1982年聯合國《海洋法公約》體系下，海洋地物分成幾大類型，可以主張何種權利？（15分）\n\n(2) 因海底火山爆發所形成新的海洋地物，A、B兩國何者可主張擁有該海洋地物領土主權？理由為何？（15分）\n\n(3) 請問A國所占領最大島礁，是否可以主張200浬專屬經濟海域與大陸礁層？B國所占領之島礁可否主張專屬經濟海域與大陸礁層？（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "104", "question": "第一題（15分）\n\nC國為開採其大陸礁層上的石油與天然氣資源，乃於其專屬經濟區內設置勘探平台以探勘相關資源之蘊藏，然與C國素有海域劃界爭議的鄰國V國，雖探勘平台之所在海域並非爭議地區，但V國仍擔心C國別有意圖，為瞭解C國虛實，故派遣漁船經過該平台之安全地帶，但遭C國海巡隊驅趕，請問該驅趕是否合法？請從國際海洋法有關規範分析之。（15分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "104", "question": "第二題（35分）\n\nT國漁船在P國專屬經濟區內捕魚，P國軍艦見T國漁船，不知其是否經合法授權入漁，乃要求T國漁船停船受檢，但P國軍人向來專橫，惡名昭彰，且眾所周知；而且P國另有海岸防衛隊與漁政船，取締非法入漁，向來皆由海岸防衛隊或漁政船執行，因此T國漁船不理P國軍艦之號令，又恐受到搶劫，乃加速逃離。\n\nP國軍艦見此，隨後追趕，並向漁船開槍，擊中T國漁船船艙，且擊傷T國漁船上一名船員，T國漁船更加驚慌，乃奮力蛇行進逃。在追逐到公海之際，適逢T國海軍演習歸來，T國海軍大型艦立即橫在兩船之間，阻擋P國軍艦。請問：\n\n(1) P國軍艦可否在該國海域內執行漁業相關法規？海洋法對此有無規定？（10分）\n\n(2) 國際法固然不禁止執法之際在一定條件下得使用武力，但基於人權與對船旗國權益之考量，國際海洋法發展出對執法船舶行使武力取締外國非法漁船之限制，請論述此等武力使用應遵循之原則？（15分）\n\n(3) T國軍艦可否對P國軍艦進行警告性射擊以保護本國漁船？（10分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "104", "question": "第三題（50分）\n\n假設X國本為一聯邦國，在1990年前原有5個成員邦。其中成員邦A因經濟與軍事力量獨大，長期控制X國聯邦政府，並形成專制威權體制，持續壓迫其他4邦數十年。1990年時，A邦發生內戰，A邦以外的4邦B、C、D、E先後宣佈脫離X國，並各自成立國家。A邦控制之X國聯邦政府拒絕承認該4邦/國之獨立，並以維護領土完整為由，動用武力進行鎮壓。與A邦相鄰的原B邦、C邦（宣佈獨立後各稱為B國、C國）首先遭受X國/A邦軍隊攻擊。X國/A邦政府及總統同時以武力支援B邦/B國境內之多數種族H，對於境內另一少數種族P，進行大規模的種族屠殺，導致P族有多達5萬人慘遭殺害，另有10萬人被迫逃離家園，翻越邊界前往鄰國Y國避難。Y國鑑於難民人數眾多，X國/A邦對於B、C之軍事行動日益擴大，戰事可能會進一步擴及D、E兩地，於是向Y國參加之區域安全組織LAUBEI求援。LAUBEI隨即召開會議，經徵詢其全體會員國（包括Y國在內共5國）意見後，決議承認B、C、D、E等4國之獨立，並由其5個會員國組成聯軍，進行軍事干預。LAUBEI組織先派遣空軍對A邦進行轟炸，阻止X國/A邦軍隊繼續攻擊B、C；再派出地面部隊，以優勢武力逼迫X國/A邦停火，並逕自劃定停戰區。X國/A邦不滿LAUBEI組織之干預，一方面向聯合國安理會控訴LAUBEI組織及所屬5個會員國對其武力侵略，另方面向國際法院（ICJ）起訴，主張LAUBEI組織及所屬5個會員國之對其動武違反國際法。按X國及LAUBEI組織所屬5個會員國都是聯合國會員國。請問：\n\n(1) 現行國際法對於X國/A邦政府及總統之以武力支援H族對P族之種族屠殺，有何實體及程序規範？（20分）\n\n(2) LAUBEI組織對X國/A邦之軍事干預是否合乎現行國際法？請先分析說明「合法」及「違法」的各自理由（及依據）各為何？再說明你的看法。（30分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "103", "question": "第一題（50分）\n\nA國與B國皆為1982年聯合國《海洋法公約》締約方，且均宣布建立200浬專屬經濟區。兩國相距約300浬，A國之大陸礁層雖自然延伸約290浬，然在離A國海岸45浬處有一島嶼（寶石島），該島主權為B國所有並無爭議，面積約100平方公里。但因氣候嚴寒，島上並無人民長期居住，然B國科學家在氣候准許條件下，經常在該島從事科學研究。然A國認為該島位於其大陸礁層上，且過去一百年來A國漁民經常在該島四周水域作業，B國從未反對，B國人民亦未在該處海域作業，因而主張A國人民有權利在該島繼續作業。B國則表示，以往漁業資源豐富，且A國人民之捕魚能力有限，考量A國人民曾遍陷困境，基於人道考量，因此對A國人民之此法行為並未取締，然A國漁民作業模式對海洋資源永續利用有嚴重危害，因此不能再無視A國漁民於寶石島四周捕魚行為，將嚴格取締。請問在國際法下：\n\n(1) A國漁民是否可主張繼續在寶石島附近水域捕魚？（15分）\n\n(2) 若兩國進行海域劃界，則專屬經濟海域與大陸礁層界線應如何劃分？寶石島應如何處理？（35分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "103", "question": "第二題（20分）\n\n假設X國總統A卸任後，前往Y國旅行、演講。A在Y國期間，Y國人權團體指控A於1995-2005年在位時，指使屬下於X國境內恣意逮捕、刑求包括X、Y等國籍人民數千人並導致數百人失蹤、死亡。請問：依現行國際法，是否有任何「超國家之上、國際層級的法院」（supranational, international-level court）得追究A之刑事責任，並對之行使審判權？請說明其實體及程序上依據。（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "103", "question": "第三題（30分）\n\n2009年10月22日，臺灣與美國各自透過「駐美國台北經濟文化代表處」與「美國在台協會」簽訂一份Protocol of Bovine Spongiform Encephalopathy (BSE)-Related Measures for the Importation of Beef and Beef Products for Human Consumption from the Territory of the Authorities Represented the American Institute in Taiwan (AIT) （以下簡稱「美牛進口議定書」）。消息曝光後，引發國內極大爭議。請問：\n\n(1) 該美牛進口議定書是否為國際法上之條約？（10分）\n\n(2) 依我國現行法，上述議定書是否應送立法院審議？立法院得否實質修改上述議定書內容？（20分）\n\n（Bovine Spongiform Encephalopathy：牛海綿狀腦病）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "102", "question": "第一題（50分）\n\n答題注意事項：請標明大題及小題。\n\n1. 假設Agouh與Babu為兩個鄰近的島嶼國家，兩國均於1958年獨立。兩國間海域有一小島X，距Agouh約50海浬，距Babu約150海浬。X島因洋流交會，向為Agouh國許多漁民之傳統漁場，並為生計所賴。Babu國漁民也偶爾前往X島捕魚或登島採集植物、藥材，雙方漁民千百年來均相安無事。\n\n2. 1958年前，Agouh國本為Atoh國殖民地，Babu國本為Behchi國殖民地。在歷史上，X島最早於1850年為Sangbai國政府海洋探勘隊發現。Sangbai國海軍曾登上X島，並繪製附近海圖，但隨即離去。Sangbai國的一名作家也曾以X島為背景，著有小說一部，並為Agouh、Babu島上人民所熟知。\n\n3. 1890年間，Sangbai國與Atoh國發生戰爭。Sangbai國戰敗。在兩國簽訂的和約中，Sangbai國將X島連同另外一地割讓給Atoh國。但Atoh國因財政考量，從未在X島設官治理。1920年間，Behchi國政府於X島上建立燈塔，並命地方政府派人駐守管理。地方政府同時僱用Atoh國籍人民數人協助人員補給及燈塔維護。Atoh國政府知悉，認為燈塔有利航行又有本國人民受僱，因此不以為意。1958年Babu國從Behchi國獨立後，除延續之前Behchi國之燈塔管理外，並將X島列入官方版的領土地圖內，又宣布在X島設立海島保護區，嚴格管制人類之登島。\n\n4. 1978年時，因有報導在X島上發現俗名\"Bird, the bumbler\"的稀有種鳥類，Agouh國政府開始積極主張X島之主權，並於1979年初突然出兵攻佔X島。3日後，Babu國又出兵搶回X島。一年後，Agouh國趁Babu國發生金融危機，又出兵佔領X島。Babu國因財力限制，無力再出兵。此後，Babu國年年夏至及冬至、月月初一及十五都向Agouh國提出外交抗議，並要求談判，但Agouh國均置之不理。\n\n5. 2009年底，Agouh國決定在X島增建大笨鳥生態公園並宣布擬將Babu國國父及眾多歷史人物，塑造成侏儒銅像，以供大笨鳥棲息、方便。此舉引起Babu國政府嚴重抗議，該國人民群情激動，兩國網友更在網路上舌戰不停。Babu國政府於2010年初向國際法院起訴，要求國際法院判決X島為Babu國領土，並同時要求國際法院發布臨時措施（Provisional measures），禁止Agouh國之增建上述公園或實施其他任何具有主權意涵的國家行為。\n\n6. Agouh國於1980年加入《國際法院規約》（Statute of the International Court of Justice）同時，曾依國際法院規約第36條規定，聲明接受國際法院對其之管轄權。故國際法院確定受理Babu國之起訴，並通知Agouh國應訴。Agouh國先委請律師以書面向國際法院反對Babu國所要求之臨時措施並主張X島為其神聖不可分割的固有領土。2010年底，Agouh國突然撤回其上述管轄權聲明，主張國際法院自2011年1月1日起，對於本案不再有管轄權，Agouh國將停止參與本件訴訟，也不會接受國際法院對於本案之任何判決的拘束。\n\n請依國際法理論、相關條約及國際法院裁判，附理由回答以下問題：\n\n（一）請問Agouh國宣布撤回其對國際法院的管轄權聲明後，國際法院對於Babu國與Agouh國間之訴訟，是否得繼續審理並判決？（30分）\n\n（二）關於X島的領土主權歸屬，Agouh和Babu各得如何主張？如果妳是國際法院法官，妳會如何判決X島之領土主權歸屬？（20分）\n\n（三）1979至80年間，Agouh國兩次出兵攻佔X島，Babu國也曾以武力一度搶回X島，請問兩國之使用武力是否合法？（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "102", "question": "第二題（50分）\n\n1. A國與B國相距約350浬，均各自主張200浬之「專屬經濟海域」（exclusive economic zone, EEZ），又因兩國海域之想像中線附近漁業資源豐富，兩國漁民長期在此作業，向來相安無事。但因兩國近來關係惡化，以致A國漁民在雙方重疊海域想像中線附近作業時，遭B國執法船舶不斷干擾並驅趕，相同地，B國漁民若在想像中線附近海域作業時，A國執法船舶同樣對其干擾或驅離。\n\n2. 另外，A國因高度依賴進口石油，為求能源自給率之提升，乃與B國簽署石油探勘合作協議，惟為避免爭端，僅以衛星進行空中調查，B國並不知情。根據衛星所得資料，發現在A國與B國重疊海域想像中線附近，可能有大量天然氣與石油儲藏，為進一步確認該發現，A國再派遣海域石油探勘船隊進行研究，B國知悉後隨即表示：該海域在B國專屬經濟海域範圍內，A國不得進行探勘，於是派遣執法船舶驅離A國探勘船隊，將A國船舶驅離至B國海域兩百浬外。然在驅離過程中，號稱A國「海底探勘之父」的權威科學家甲教授不幸落海，B國執法船隊雖立即進行搜救，但甲教授因年老體衰，又因患有心臟病，在落海後，隨即死亡。\n\n3. 對此發展，A國舉國群情洶湧，要求政府必須採取強硬手段，於是A國除宣布將繼續從事石油探勘外，以慰甲教授在天之靈；並將在重疊海域中線附近進行海上軍事演習，不僅為實彈演習，且軍演規模龐大，其範圍超過想像中線而逼近B國領海，但並不會進入B國領海。B國對此提出抗議，並表示A國行為違反國際法。\n\n請問：\n\n（一）對兩國重疊專屬經濟海域，在未劃分界限之前，根據《海洋法公約》應如何處理？（10分）\n\n（二）就尚未劃界之重疊專屬經濟海域，兩國漁民是否仍有權進行捕魚？可否單方進行石油探勘或開發？兩種資源開發有何差異否？（20分）\n\n（三）對於A國在重疊專屬經濟區內進行軍事演習，是否有違反《海洋法公約》相關條文？（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "101", "question": "第一題（50分）\n\n假設A國M省內有少數民族X族，佔M省近80%人口，但只佔A國全國人口10%。A國人口其餘為Y族。Y族在A國長期執政，許多政策明顯歧視X族，並在M省實施種族隔離政策，X、Y族人民間常有衝突，X族多數人民久思獨立。2008年，X族首度贏得M省省長及議會選舉，M省議會隨即通過立法，授權省長在M省以「M省是否(1)應該獨立或(2)繼續作為A國一省」為選項，舉行公民投票。由於A國政府大力反對，結果只有50%M省人民參加投票，其中有49%的有效票贊成(1)獨立，40%的有效票選擇(2)繼續維持為A國一省，其餘11%棄權。之後，A國政府以M省政府違憲為由，出兵鎮壓，M省人民組織解放陣線軍，以武力對抗，引發內戰。原M省省長和同屬X族之省議會多數議員遂即以解放陣線臨時政府名義，在2009年1月1日宣布M省獨立，成立M國。B等20國迅即承認M國為獨立國家，並與M國建交，B國更對M國提供經濟及軍事援助。\n\n(一) 關於M國之宣佈獨立是否違反國際法，哪些機構或國際法主體可請求國際法院出具諮詢意見？（10分）\n\n(二) 依據聯合國憲章及國際法規範，聯合國能否介入A與M間之武力衝突？可主張哪些合法理由？（20分）\n\n(三) 參照國際法院見解，原屬A國之M省宣佈獨立建國，是否違反任何國際條約、習慣法、一般原則等國際法規範？理由為何？（20分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "101", "question": "第二題（50分）\n\n（一）《海洋法公約》不僅准許沿岸國設立「專屬經濟區」（exclusive economic zones; EEZ），並賦予沿岸國在該專屬經濟區內享有主權權利。根據該權利，沿海國得制定有關養護與管理海域內生物資源之法律和規章，並得處罰違反該等法律與規章之外國漁船，沿岸國並得逮捕與扣押違反該等法律與規章之外國漁船；然為避免沿岸國濫用權利，並顧及漁民基本人權與船旗國利益，《海洋法公約》另設有保障第三國船舶與船員之規定，請根據《海洋法公約》申論之。（25分）\n\n（二）此外，對於此等保障機制之適用與相關要件，「國際海洋法法庭」（International Tribunal for the Law of the Sea; ITLOS）在其所審理案件中，亦有眾多論述與釐清。請根據海洋法法庭相關判決，進一步論述該等法律與規章之適用與要件。（25分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "100", "question": "第一題（50分）\n\n假設B國於1945年9月間，即二次大戰結束後不久，以戰勝國地位，接收並佔領原屬戰敗國A國之X地。1946年初，B國進而宣佈納入其領土，並將之納為一縣。A國則一貫主張X地為其歷史領土，拒絕承認B國之主權。A、B兩國間因X地故，始終未簽署正式和約。\n\n1980年2月間，B國與新獨立的C國互相承認，並建立外交關係。在建交公報第一段中，B國表示：承認C國為獨立主權國家，除承諾給予C國美金2億之經濟援助外，並將支持C國加入各項國際組織。在第二段中，B國表示：維護各國領土主權完整是國際法的基本原則，X地為B國領土的一部分，不容分割。在第三段中，C國表示：感謝B國之支持及援助。C國同意維護各國領土主權完整是國際法的基本原則；對於B國有關X地為其領土的主張，則表示理解並尊重。至於B、C兩國間原本主權及邊界均未定之地，除劃定其疆界外，C國並承認其為B國領土。在公報第四段中，兩國共同表示：自1980年2月某日起，建立外交關係。在B國支持下，C國在1980年3月底加入聯合國，成為正式會員國。\n\nA、C兩國原於1980年4月即已建交，兩國並簽署經濟合作條約，A國給予C國美金1億經濟援助。A國知悉B、C兩國建交公報後，立即向C國提出抗議，宣佈立即斷絕與C國間之外交關係，不再承認C國為一獨立主權國家。A國並宣佈廢棄上述經濟合作條約，要求C國返還A國所給予之經濟援助美金1億元，C國拒絕返還，A國進而宣佈關閉兩國邊界，斷絕兩國間的貿易及人員往來。C國因此受到嚴重的經濟損失，估計每月損失約美金1千萬元。由於A國在1979年曾聲明接受國際法院的強制管轄權，C國因此於1980年4月向國際法院起訴，以A國為被告，主張A國單方廢棄其與C國間之經濟合作條約、關閉兩國邊境、斷絕兩國間貿易及人員往來等行為，均屬違反國際法。C國並要求A國賠償經濟損失。A國則主張其不承認C國為獨立主權國家，因此C國無原告資格，國際法院不應受理其起訴。\n\n請問：\n\n一、依現行國際法規範，B國是否已經取得X地之領土主權？（15分）\n\n二、B、C兩國所簽訂的建交公報，是否（及哪些部份）屬於有法律拘束力的國際條約？並請扼要說明理由及依據。（20分）\n\n三、有關C國控告A國一案，國際法院是否有管轄權，而可受理？（15分）", "answer": ""},
{"category": "intl", "sub": "台大法律庚組", "year": "100", "question": "第二題（50分）\n\nT國並非1982年《海洋法公約》締約國；C國則為《海洋法公約》締約國。今有懸掛T國旗幟之貨輪「光明輪」駛入C國港口後，遭公司解僱之「光明輪」上P國籍船員甲向C國檢警單位表示：在「光明輪」駛出R國港口進入公海時，船長乙發現有R國國民丙意圖藉由搭乘「光明輪」偷渡至C國。船長乙乃與其他船員共同將丙押入救生艇中，並將丙與救生艇一併投擲入海，丙在大海中因海浪翻覆呼救，船長乙仍執意依原航海計畫，前往C國港口，不予救援，丙可能已經罹難，船員甲並表示其願意留在C國協助調查與作證。\n\nC國檢警單位為調查事實真相，決定要求「光明輪」船長協助調查，但因時間問題，「光明輪」已經港口當局同意，出港前往下一港口交卸貨物。C國檢察官緊急派遣海岸巡防隊船艦攔截，並於離岸處發現「光明輪」，以無線電聯絡要求船長折返，但船長乙表示，此純屬船員甲挾怨報復，貨物有交貨期限，拒絕返航。海岸防衛隊持續追緝並施以強制措施，終於在離岸15浬處迫使「光明輪」返航，並帶回C國港口。\n\n請問：\n\n（一）若T國表示：所宣稱案件發生在公海，而公海船旗國擁有專屬管轄權，因此C國對本案無管轄權，C國之行為違反國際法，請問T國如此主張是否有理？（15分）\n\n（二）T國表示：不論是非曲直如何，「光明輪」已離開C國港口，且離開C國領海進入專屬經濟區，而根據國際海洋法專屬經濟區應適用公海航行制度，C國海岸防衛隊卻強迫「光明輪」返航，違反公海自由航行制度。請分析T國指摘是否符合國際法？（15分）\n\n（三）假如R國與C國訂有引渡條約，並要求C國將船長乙引渡交由R國法院審判，假設你是C國負責涉外法律問題顧問，C國政府決定爭取將船長乙引渡回C國審判，請擬出你的法律意見。（20分）", "answer": ""}

const GEMINI_PATCH_103_ERGA_OMNES = "erga omnes（普遍管轄義務／對一切人的義務）概念是國際法由傳統「雙邊對等關係」邁向「國際社會整體利益」的核心轉捩點。以下就題旨兩大問題進行剖析：\n\n## （一）何以erga omnes的發展與國際法上國家責任制度有關？\n\n傳統國際法上的國家責任制度（State Responsibility）主要建立在雙邊對等關係的基礎上。換言之，只有直接遭受受害的國家（Injured State），才有資格主張國家責任並提出求償或採取反制措施。\n\n然而，1970年國際法院（ICJ）在「巴塞隆納牽引力案」（Barcelona Traction Case）中，劃時代地區分了兩類國家義務：\n\n1. 對特定國家的雙邊義務：僅直接受害國得主張責任。\n2. 對整體國際社會的義務（Obligations erga omnes）：鑑於其保護之價值極為重要，所有國家在法律上皆被視為具有合法利益（Legal interest），因此任何國家皆得主張責任。\n\n### 對國家責任制度的重大變革\n\n1. 突破「受害國」主張責任的限制：在涉及嚴重違反人類整體利益（如禁止侵略、禁止種族滅絕、保護基本人權）時，即使某國未直接受害，亦可基於erga omnes義務主張違約國承擔法律責任。\n\n2. 重塑聯合國國際法委員會（ILC）《國家責任條文草案》：該概念直接促成了2001年《國家責任條文草案》（Draft Articles on Responsibility of States for Internationally Wrongful Acts）第48條的制定。根據第48條，非直接受害國（States other than an injured State）在被告國違反erga omnes義務時，得請求被告國：停止不當行為並提供不重複發生的保證；履行對受害國或受益人的損害賠償義務。\n\n## （二）erga omnes與jus cogens（絕對法／強制規律）本質上有何不同？\n\nerga omnes與jus cogens皆旨在維護國際社會的共同價值與秩序，且在實體內容上高度重疊（例如：禁止侵略、禁止酷刑、禁止種族滅絕），但兩者在法理本質、關注焦點與功能適用上有根本差異：\n\n比較維度：概念核心\n- Jus Cogens：規範的位階與效力（Substantive Status/Normative Hierarchy）\n- Erga Omnes：義務的履行對象與救濟資格（Enforcement & Standing）\n\n比較維度：核心問題\n- Jus Cogens：「這條法律規範是否不許以條約任意偏離或締結相反約定？」\n- Erga Omnes：「當此義務被違反時，誰有資格向違約國主張責任？」\n\n比較維度：法律效果\n- Jus Cogens：1. 違反jus cogens的條約無效（《維也納條約法公約》第53條）。2. 產生新jus cogens時，現存抵觸條約失效（第64條）。\n- Erga Omnes：任何國家皆有訴訟適格（Locus standi）或主張責任資格，得要求停止違法行為並要求賠償受害者。\n\n比較維度：邏輯關係\n- Jus Cogens：原因／實體源頭：因其規範具有不可動搖的最高位階。\n- Erga Omnes：結果／程序延伸：因其保護利益關乎全人類，故產生對一切人履行的效果。\n\n### 兩者之邏輯關聯與差異總結\n\n關聯性：學者與國際法院常指出一種「邏輯上的必然」——所有的jus cogens規範原則上都會產生erga omnes義務（因為既然該規範是不可偏離的最高價值，其被違反時自然全體國家皆得主張）。\n\n差異性：\n- 方向不同：Jus cogens側重於禁止締約自由的無效性（無效宣告）；Erga omnes側重於程序上的主張資格（Standing / Remedy）。\n- 範圍非完全重合：有些erga omnes義務（例如出於國際習慣法或多邊公約保護共同利益的規範，如公海自由、特定區域環境保護）未必達到jus cogens（不可偏離之絕對法）的嚴格位階，但仍具備對一切人履行的性質（erga omnes partes）。";

const CLAUDE_PATCH_103_Q1 = "一、開羅宣言與波茨坦公告、降伏文書之關連性\n\n（一）開羅宣言的內容\n\n1943年11月，中、美、英三國領袖（蔣中正、羅斯福、邱吉爾）在開羅會議後發表《開羅宣言》，其主要內容包括：\n\n1. 三國對日作戰的目的，在於制止並懲罰日本之侵略。\n2. 三國決不為自身謀求領土擴張，亦無拓展疆土之意思。\n3. 三國之宗旨，在剝奪日本自1914年第一次世界大戰開始後，在太平洋上所奪得或佔領之一切島嶼；並將日本竊取於中國之領土，例如東北四省、臺灣、澎湖群島等，歸還中華民國。\n4. 三國並決定，將使朝鮮於相當時期，獲得自由與獨立。\n5. 三國將堅持進行為獲得日本無條件投降所需之重大而長期之行動。\n\n須注意者，《開羅宣言》在性質上為一項「新聞公報」（communiqué），並非正式簽署之條約，惟其內容仍具有政治宣示及後續被納入其他國際文件而發生法律效果之意義。\n\n（二）與《波茨坦公告》之關連\n\n1945年7月，中、美、英三國（後蘇聯加入對日宣戰後亦加入）發表《波茨坦公告》（Potsdam Declaration），其第8條明文規定：「開羅宣言之條件必將實施，而日本之主權必將限於本州、北海道、九州、四國及吾人所決定其他小島之內。」\n\n由此可知，《波茨坦公告》係以明文方式將《開羅宣言》之內容「納入」（incorporate by reference）並「重申」其效力，使原僅屬政治宣示性質的《開羅宣言》，透過《波茨坦公告》之引用，取得更進一步之國際法律拘束意涵，尤其是有關日本應歸還其自中國竊取之領土（含臺灣、澎湖）之部分。\n\n（三）與日本《降伏文書》之關連\n\n1945年9月2日，日本簽署《降伏文書》（Instrument of Surrender），其中明文承諾接受盟國於《波茨坦公告》所列各項條款。換言之，《降伏文書》構成日本對《波茨坦公告》（進而及於其所納入之《開羅宣言》）內容之正式、單方且具拘束力之承諾與接受，使得原先僅具政治宣示性質的《開羅宣言》，經由《波茨坦公告》之納入，再經由《降伏文書》之承諾接受，形成一個層層銜接、日本以條約性文件形式表示同意接受拘束的完整法律鏈條。\n\n（四）小結\n\n三份文件之關係可簡述為：《開羅宣言》提出戰後處置原則（政治宣示）→《波茨坦公告》正式引用並重申其內容（具條約性質之要約）→《降伏文書》為日本對前述條款之正式承諾接受（承諾）。學說上有認為，此一法律鏈條足以構成日本同意歸還臺灣、澎湖予中華民國之國際法依據；惟亦有論者（如「臺灣地位未定論」之主張者）認為，《舊金山和約》僅規定日本放棄對臺灣、澎湖之一切權利，並未明文將其歸屬指定予中華民國，故臺灣之最終法律地位，仍有爭議空間。此一問題涉及條約解釋、嗣後國家實踐及對日和約體系之整體理解，為國際法與國際政治交錯之重要爭議領域。";
const CLAUDE_PATCH_103_Q2 = "二、關於條約的錯誤\n\n（一）1969年《維也納條約法公約》第48條有關「錯誤」之規定\n\n《維也納條約法公約》（VCLT）第48條規範「錯誤」（Error/Mistake）作為條約得撤銷（invalidate）之事由，其要件與內容大致如下：\n\n1. 錯誤須涉及「事實」或「情況」（fact or situation）：締約國得主張撤銷其同意受條約拘束之意思表示，如該錯誤係關於該國於締約時假設為存在，且構成其同意受條約拘束之必要基礎（essential basis）之事實或情況。\n\n2. 排除法律錯誤：第48條第1項原則上僅適用於「事實錯誤」，而非「法律錯誤」（error of law），蓋條約本身即為法律文件，締約國本應審慎審視其法律效果。\n\n3. 可歸責性之排除（第48條第2項）：若該國以其自身行為導致此一錯誤，或依當時情況該國應可預見此項錯誤之可能性，則不得主張錯誤而撤銷條約，此乃基於「自己行為不得置辯」（estoppel-like）之法理，防止締約國以自身過失卸免其條約義務。\n\n4. 錯誤僅涉及條約用語（wording）：依第48條第3項，若錯誤僅涉及條約之文字用語，並不影響其實質同意之基礎，則不適用第48條，而應依第79條「更正條約本文或正式抄本之錯誤」處理。\n\n（二）1962年國際法院「隆端古寺案」（柏威夏寺案）之見解\n\n在Case Concerning the Temple of Preah Vihear（Cambodia v. Thailand）實質判決中，泰國主張其於1908年至1909年間，接受法國（代表柬埔寨）所提出之邊界地圖時，係基於錯誤，因該地圖所繪之分水嶺界線與實際地理分水嶺不符，泰國因而誤信隆端古寺位於柬埔寨境內。\n\n國際法院最終駁回泰國此一錯誤主張，其主要理由包括：\n\n1. 泰國官員長期以來已知悉或應已發現地圖上之錯誤：法院指出，泰國之相關官員早於數十年前即有機會發現地圖界線與分水嶺不符之處，且泰國政府從未在合理期間內就此提出異議或保留，反而長期以行為（如接受、使用該地圖並未提出抗議）默示接受該地圖所繪之邊界。\n\n2. 禁反言原則（Estoppel）之適用：法院認為，泰國之默示接受及其後續一貫之行為表示（包括未於適當時機提出異議），已構成對柬埔寨（及其後之法國）之禁反言效果，泰國不得事後翻異其詞而主張錯誤。\n\n3. 錯誤主張須以締約當時實際受該錯誤影響為前提：法院並強調，即便地圖確有繪製上之技術性錯誤，惟若該國之同意並非「因該錯誤而形成」（即並非該錯誤構成其同意之必要基礎），亦難以據此主張條約或協議無效。\n\n此判決確立了後續VCLT第48條第2項「可歸責性排除」及禁反言限制錯誤主張之重要先例基礎，亦即：締約國若明知或可得而知有錯誤情事，卻仍長期以行為默示接受，將喪失事後主張錯誤而撤銷相關協議或安排之權利。";
const CLAUDE_PATCH_103_Q3 = "三、巴塞隆納牽引力案與erga omnes義務\n\n（一）本案背景與erga omnes概念之提出\n\n在Barcelona Traction, Light and Power Company, Limited案（Belgium v. Spain, 1970）中，國際法院雖然最終以比利時欠缺求償適格（股東之國籍與公司之國籍不同）為由駁回比利時之訴，但法院於判決理由中提出了一段極具影響力的附帶意見（obiter dictum），區分了國家對外承擔義務之兩種性質：\n\n1. 國家對其他特定國家所負之雙邊義務（bilateral obligations）：此類義務僅該特定受害國得主張責任，例如基於雙邊條約或外交保護關係所生之義務。\n\n2. 國家對「整體國際社會」所負之義務（obligations erga omnes）：法院指出，鑑於此類義務所涉利益之根本重要性，「所有國家均可認為在其獲得保護方面具有法律利益」（all States can be held to have a legal interest in their protection），法院並舉例：禁止侵略行為、禁止種族滅絕，以及源於基本人權保護（包括禁止奴隸及種族歧視）之相關原則與規則。\n\n（二）與國家責任制度之關聯\n\n此一區分對傳統國家責任制度造成重大衝擊，原因在於：\n\n1. 傳統上，國家責任之追訴資格（locus standi）僅限於「直接受害國」，此為雙邊互惠關係下之當然結果；惟erga omnes義務之提出，使得縱非直接受害之國家，亦得因該義務所保護利益具有普世重要性，而主張具有法律利益、進而得追究違反國之責任。\n\n2. 此一發展後續反映於2001年國際法委員會（ILC）通過之《國家責任條文草案》第48條，該條明文規定，非直接受害國於特定情形下（包括該義務係對整體國際社會所負者），亦得對違反國主張責任，得請求其停止不法行為、提供不重複保證，並得為受害國或受益人之利益要求履行賠償義務，此可謂erga omnes概念自司法先例走向成文條文化之具體展現。\n\n（三）與jus cogens之本質差異\n\nerga omnes（對世義務／普遍性義務）與jus cogens（絕對法／強制規律）雖常被相提並論，且在具體規範內容上高度重疊（如禁止侵略、種族滅絕、酷刑等重大國際不法行為，往往同時具備此兩種性質），惟兩者在法理層次上分屬不同範疇，不應混為一談：\n\n1. 規範層次不同：Jus cogens（VCLT第53條）係關於「規範位階」之概念，指某些國際法規範具有最高強制效力，任何國家不得以條約方式加以偏離，違反者條約當然無效；而erga omnes則係關於「義務對象與主張適格」之概念，指某義務之履行對象及於全體國際社會，任何國家均得就其違反主張責任，兩者關注焦點分別在於「規範能否被合意排除」與「誰有資格主張違反責任」。\n\n2. 法律效果不同：Jus cogens之效果展現於條約法領域，主要為使牴觸之條約無效（VCLT第53條、第64條）；erga omnes之效果則展現於國家責任法領域，使非直接受害國取得程序上之訴訟適格或求償資格。\n\n3. 範圍未必完全重合：學說上一般認為，凡屬jus cogens之規範，通常亦會產生erga omnes之效果（因其保護價值之重要性使然）；但反之未必成立，亦即並非所有erga omnes義務均已提升至jus cogens不可克減之強制規律位階，例如部分僅在特定多邊條約締約國間所生之「erga omnes partes」義務（對條約全體締約國之義務），其重要性雖高，未必已達到jus cogens不可以任何方式偏離之最高強行法位階。\n\n簡言之，jus cogens聚焦於「規範本身在法秩序中的位階與不可偏離性」，erga omnes則聚焦於「義務違反後由誰取得追究資格」，二者概念層次不同，但因均源自對維護國際社會根本共同利益之重視，在實務案例中常有重疊而彼此呼應。";
const CLAUDE_PATCH_103_Q4 = "四、政府繼承之「國家繼續原則」與國際索償之「國籍繼續規則」\n\n（一）「國家繼續原則」（Principle of State Continuity）——政府繼承脈絡\n\n在政府繼承（Succession of Governments）之討論中，須先區辨「國家繼承」（State Succession，涉及國際法人格主體之更迭，例如領土主權移轉、國家分裂、合併）與「政府繼承」（Succession of Governments，僅涉及一國內部政權更迭，而國家之國際法人格並未消滅）。\n\n「國家繼續原則」係指：只要「國家」本身之法律人格未曾中斷或消滅（即使其政府經由革命、政變、內戰等非正常憲政程序更迭），該國作為國際法主體之同一性（identity）及延續性（continuity），並不因政府更替而受影響。具體內涵包括：\n\n1. 條約義務之延續：新政府原則上應承受舊政府所締結條約之權利義務，蓋條約係國家對外承擔之義務，而非特定政府之個人承諾（此與「政府承認」是否影響條約履行的實務爭議略有不同，但條約義務之國家延續性原則仍為通說）。\n\n2. 國家責任之延續：新政府對於前政府任內國家所生之國際不法行為，原則上仍應負國家責任，不因政權更迭而免責，此即所謂「國家責任不因政府更迭而中斷」之原則。\n\n3. 國家財產與債務之延續：國家對外之公債、國有財產等權利義務關係，原則上亦隨國家之延續而由新政府概括承受。\n\n此一原則之理論基礎在於：國際法上國家責任與權利義務之主體為「國家」而非特定「政府」，政府僅為國家對外行使主權之代理機關，其更迭並不改變國家作為法律主體之同一性，此有助於維護國際法律關係之穩定性與可預測性，避免國家藉由政權更迭而規避既存之國際義務。\n\n（二）「國籍繼續規則」（Continuous Nationality Rule）——外交保護／國際索償脈絡\n\n在外交保護（Diplomatic Protection）與國際索償（International Claims）之領域，「國籍繼續規則」係指：一國為其國民行使外交保護、代其向加害國提起國際求償時，該受害之自然人或法人，原則上須自「受害之時」起，持續具有求償國之國籍，直至「求償正式提出」（或依部分實踐延伸至判決確定）之時為止，中間不得中斷或變更國籍，該項外交保護方為合法、有效。\n\n其主要內涵及理由包括：\n\n1. 「損害發生時」須具備求償國國籍：此為外交保護之基本前提要件之一，蓋外交保護制度之理論基礎，係擬制國家因其國民受害而視為國家自身之權利受侵害（Vattel之擬制理論），故若受害人於受害當時並非該國國民，該國即無「自身」權益受侵害可言。\n\n2. 須持續維持該國籍至求償時：其目的在防止「國籍投機」（nationality shopping），即避免受害人於受害後，為圖利用某一國家較強之外交實力或較有利之求償地位，而刻意變更或取得該國國籍後，再由該國提出求償，此將違反外交保護制度原始擬制受害國家利益之本旨。\n\n3. 例外情形：晚近實踐及2006年國際法委員會（ILC）《外交保護條文草案》第5條亦承認若干例外，例如國籍之變更非出於自願（如國家繼承、婚姻、收養等法定原因所生之非自願國籍變更），或原國籍已不復存在等情形，可能不適用嚴格之國籍繼續要求，以避免因技術性國籍中斷而剝奪受害人受保護之機會。\n\n（三）兩概念之比較\n\n「國家繼續原則」處理的是「國家」作為國際法主體之同一性延續問題，聚焦於國家與其政府更迭間之關係，確保國家對外權利義務不因政府更替而中斷；「國籍繼續規則」則處理「個人（自然人／法人）」與求償國籍之連結延續問題，聚焦於外交保護制度下受害人國籍之持續要件，確保求償國家與受害人間之聯繫具有正當性及一貫性，二者雖然都以「延續性」（continuity）作為核心概念，但適用之主體（國家 vs. 個人）與規範目的（維護國家責任體系之穩定 vs. 防止國籍投機、確保外交保護正當性）截然不同，不宜混淆。";

const CHATGPT_PATCH_103_Q2 = "一、1969年《維也納條約法公約》第48條\n\n《維也納條約法公約》第48條所稱的「錯誤」（error），是指一國締結條約時，對某項既存事實或情況產生錯誤認識，且該錯誤構成其同意受條約拘束的基本依據。此時，該國原則上得主張其同意無效。\n\n（一）得主張錯誤的積極要件\n\n依第48條第1項，必須同時符合下列要件：\n\n1. 錯誤涉及締約時已存在的事實或情況：錯誤必須關於國家締結條約時認為已經存在的「事實或情況」（fact or situation）。例如，國家在劃定邊界時誤認某條河流的位置、誤認某座山脈的分水嶺，或誤用不正確的地圖。因此，第48條所處理的主要是事實錯誤，而非單純對國際法規則、條約法律效果或法律評價的錯誤。\n\n2. 該事實或情況為國家同意受拘束的基本依據：並非任何細微錯誤都足以使條約無效。該錯誤必須構成國家同意受條約拘束的「基本基礎」（essential basis）。換言之，若無該項錯誤，該國原本不會締結條約，或至少不會依相同條件表示同意，始符合此要件。\n\n因此可以將第48條第1項濃縮為：締約時的重大事實錯誤＋該錯誤構成締約同意的基本依據。\n\n（二）不得主張錯誤的消極要件\n\n第48條第2項規定，即使存在重大事實錯誤，在下列兩種情況下，該國仍不得援引錯誤使其締約同意無效：\n\n1. 國家本身的行為造成該錯誤：若錯誤係由主張錯誤的國家自行造成或促成，例如自己提供錯誤資料、自己疏於調查、自己參與製圖或測量卻未檢查成果、因本國機關的重大疏忽而發生錯誤，則該國不得事後以自己造成的錯誤推翻條約。\n\n2. 當時情況已足以使該國注意到可能存在錯誤：若締約時的客觀情況已足以使國家對錯誤有所警覺，國家卻未進一步查證，也不得事後主張錯誤。此即所謂：主張錯誤者不得對明顯可疑的情況視而不見。第48條第2項反映誠信原則及「自己過失不得使自己獲利」的觀念，也維護條約關係的安定性。\n\n（三）文字錯誤不影響條約效力\n\n第48條第3項規定：僅與條約文字措辭有關的錯誤，不影響條約效力，應依《條約法公約》第79條有關條約文本錯誤更正的程序處理。例如條約誤植日期、數字打錯、地名拼寫錯誤、不同語文作準文本間出現技術性誤差。此種情形原則上是「更正條約文本」的問題，而不是使整個締約同意失效的問題。\n\n（四）第48條的法律效果\n\n依第48條文義，一國得援引錯誤，主張其「同意受條約拘束」無效，而不是條約當然、自始、自動無效。因此，錯誤屬於一種相對無效、得撤銷的原因。這與違反國際強行法的條約不同：違反強行法的條約依第53條原則上無效；錯誤則須由受錯誤影響的國家依法提出主張。此外，國家主張錯誤仍須遵守《條約法公約》第65條以下的通知及爭端處理程序，不能單方面任意宣布條約不存在。\n\n二、1962年「隆端古寺案」（柏威夏寺案）之背景\n\n「隆瑞古寺案」通常稱為柏威夏寺案／普里維希爾寺案（Temple of Preah Vihear, Cambodia v. Thailand），爭議涉及位於柬埔寨與泰國邊界的柏威夏寺主權。1904年法國所代表的法屬印度支那與暹羅締結條約，約定在相關地區以分水嶺線作為邊界。其後，法國方面製作了一幅地圖，即訴訟中所稱的「附件一地圖」（Annex I map）；該地圖將寺廟劃在柬埔寨一側。柬埔寨主張泰國長期接受該地圖，因此寺廟位於柬埔寨領土。\n\n泰國則主張：(1) 附件一地圖並非由條約所設混合劃界委員會正式核准；(2) 地圖上的邊界線偏離1904年條約所規定的分水嶺線；(3) 泰國過去之所以未反對，是因為誤以為地圖線符合分水嶺；(4) 因此，泰國對該地圖的接受係基於「錯誤」，不應受其拘束。\n\n三、泰國有關「錯誤」的主張\n\n泰國的核心論點是：泰國政府並不知道附件一地圖所畫的邊界線偏離真正的分水嶺；泰國係因誤認地圖正確，才未提出抗議，因此不能認為泰國已有效接受該地圖。換言之，泰國主張其對附件一地圖的接受，係基於一項重要事實錯誤：泰國以為地圖線符合條約分水嶺；實際上地圖線並未完全依分水嶺繪製；若泰國知道此事，就不會接受該地圖。從條約錯誤理論觀察，泰國試圖主張該錯誤構成其同意的基本依據。\n\n四、國際法院對泰國錯誤主張的見解\n\n國際法院並未接受泰國的主張。法院提出的重要原則是：一方若因自己的行為促成錯誤、原本可以避免錯誤，或當時情況已足以使其注意可能存在錯誤，就不能援引錯誤以否認其同意。此一見解後來反映在《維也納條約法公約》第48條第2項中。\n\n法院的具體理由如下：\n\n（一）泰國有充分機會檢查地圖：附件一地圖製作後，法國方面將其送交暹羅政府。暹羅具有主管機關及技術人員，完全有機會檢查地圖是否符合1904年條約規定的分水嶺線。如果暹羅政府認為地圖錯誤，理應在收到地圖後提出異議，然而暹羅政府並未及時反對。因此，法院認為泰國不能在數十年後再主張自己完全不知道地圖內容。\n\n（二）泰國官員具有專業能力，不得以疏忽為由卸責：泰國曾參與邊界調查與劃界事務，也有熟悉地形及測量工作的官員。因此，即使地圖確實偏離分水嶺，泰國政府若仔細查驗，應可發現問題。泰國未進行必要檢查，屬其自身疏忽，不能成為日後否認地圖效力的理由。這正符合後來第48條第2項的兩項限制：泰國的行為或疏忽促成錯誤；當時情況足以使泰國注意到可能存在錯誤。\n\n（三）泰國長期未抗議，構成默認：法院特別重視泰國長期以來的行為。附件一地圖送達泰國後，泰國政府多年未提出正式抗議；該地圖也曾由泰國政府機關收受、使用及散發。法院因此認為，泰國已透過長期沉默及相關行為，接受該地圖所表示的邊界。此處涉及國際法上的默認（acquiescence）、禁反言（estoppel）、誠信原則（good faith）。雖然法院並未完全以形式化的禁反言要件論證，但其核心觀念是：泰國長期使柬埔寨及法國合理相信其接受地圖，不能事後採取相反立場。\n\n（四）丹隆親王訪問寺廟是重要證據：1930年，暹羅丹隆親王訪問柏威夏寺。當時法國殖民官員以法國國旗及正式儀式迎接他，明顯表現法國將該地區視為法屬印度支那領土。丹隆親王及暹羅政府並未提出抗議，反而接受接待，並留下相關照片。法院認為，若泰國確信寺廟位於泰國領土，面對法國如此公開展示主權，本應立即抗議。泰國的沉默進一步證明其已接受附件一地圖所表示的邊界安排。\n\n（五）地圖線是否完全符合分水嶺已非決定性問題：法院並非單純認定地圖技術上完全正確，而是認為即使附件一地圖原先不是具有獨立拘束力的條約文本，泰國其後仍因接受、使用、未抗議及長期行為，而承認該地圖所表示的邊界。換言之，本案的關鍵並不是「地圖是否精確符合分水嶺」，而是泰國是否已透過嗣後行為接受該地圖。法院最終認定柏威夏寺位於柬埔寨主權之下，並命泰國撤出駐守寺廟或鄰近地區的軍警力量。\n\n五、隆瑞古寺案與第48條的關係\n\n本案判決作成於1962年，早於1969年《維也納條約法公約》，但法院對錯誤所提出的限制，與第48條高度一致：錯誤須涉及締約時存在的事實或情況（泰國主張誤認地圖線符合分水嶺）；錯誤須構成同意的基本依據（泰國主張若知地圖錯誤即不會接受）；自己行為造成或促成錯誤不得援引（泰國長期未查驗、未抗議）；情況足使國家注意可能有錯不得援引（泰國有專業官員、收到地圖且有機會審查）；嗣後確認或默認將削弱錯誤主張（泰國長期使用地圖，丹隆親王訪寺時亦未抗議）。\n\n因此，本案的重要性在於確立：錯誤不是讓國家逃避既有承諾的普遍理由；主張錯誤者必須善意、無過失，且未曾以自身行為接受或確認相關安排。\n\n結論：《維也納條約法公約》第48條允許一國在締結條約時，若對既存事實或情況發生重大錯誤，且該錯誤構成其同意受拘束的基本依據，得主張其締約同意無效。但若該國本身的行為促成錯誤，或當時情況已足以使其注意可能存在錯誤，即不得援引；若僅屬條約文字錯誤，則應依第79條更正，不影響條約效力。在1962年隆瑞古寺案中，泰國主張其因誤信附件一地圖符合1904年條約所定分水嶺，才未反對該地圖。國際法院認為，泰國早已取得地圖，具備檢查能力，卻長期未提出異議，並以收受、使用地圖及對法國公開行使權威保持沉默等行為接受該邊界。因此，即使存在錯誤，亦屬泰國本可避免或應已察覺的錯誤，泰國不得事後援引。此案遂成為《條約法公約》第48條第2項的重要司法先例。\n\n記憶口訣：重大事實錯誤可撤銷；自己造成、應該知道，不得主張；文字誤植，只能更正。";

{"category": "econstudy", "sub": "國際經濟商務人員", "year": "100", "question": "二、請回答下列問題：（20分）\n\n（一）試以互易有無（gain from exchange）及比較利益之生產分工（gain from specialization）兩觀點說明國際貿易帶來的經濟利得。\n\n（二）當國內消費者的偏好不一致時，開放自由貿易有可能導致某些消費者的利益受損，試舉例說明之。\n\n（三）開放自由貿易對兩類生產要素的提供者，即勞工（laborer）和資本家（capitalist）有不同的影響，試舉例說明當本國之資源稟賦為相對的資本富有時，國際貿易有可能對國內的勞工帶來不利的影響。", "answer": ""},
{"category": "econstudy", "sub": "國際經濟商務人員", "year": "100", "question": "三、請回答下列問題：（20分）\n\n（一）解釋已開發國家常運用的兩種進口保護措施：反傾銷（antidumping, AD）及平衡稅（countervailing duties, CVDs）。\n\n（二）試從出口國從事傾銷的經濟理由說明反傾銷政策的適當性。\n\n（三）解釋平衡稅的淨效果等於是從出口國納稅人所支付的政府出口補貼移轉至進口國的平衡稅收入，並以此說明平衡稅的課徵有抑遏出口國對出口商補貼的效益。", "answer": ""},

{"category": "econstudy", "sub": "國際經濟商務人員", "year": "101", "question": "一、請回答下列問題：\n\n（一）請簡述開放型經濟體中，匯率、資本移動、與貨幣政策間的「三難困局」（trilemma）。（5分）\n\n（二）請以IS-LM模型說明為什麼會出現上述「三難困局」的情況。（10分）\n\n（三）請根據上述理論基礎，解釋歐元區國家在何種情況之下，無法擁有獨立自主的貨幣政策。（10分）", "answer": ""},

{"category": "econstudy", "sub": "國際經濟商務人員", "year": "107", "question": "一、有一國際貿易小國，該國的汽車供給函數為Qs = −5 + 5P，需求函數為Qd = 100 − 2P，其中Qs、Qd及P分別表示汽車的供給量、需求量與價格。若生產汽車需使用A、B兩種進口生產要素，且分別占汽車價格的30%與40%。今對汽車的名目進口關稅課徵25%，與對A、B兩種中間原料分別課徵10%與5%關稅，若汽車的世界價格為$8。請依此資訊，試回答下列問題：（每小題6分，共30分）\n\n（一）自由貿易下，該國的需求、供給量與進口量各為多少？\n\n（二）關稅課徵後，該國的需求、供給量與進口量各為多少？\n\n（三）關稅課徵後，該國的關稅收入與關稅所造成的無謂損失為多少？\n\n（四）阻絕性關稅最少為多少？\n\n（五）汽車的有效關稅保護率為何？", "answer": ""},

{"category": "econstudy", "sub": "國際經濟商務人員", "year": "107", "question": "四、假設歐元兌美元的匯率是1.1760（1歐元換1.1760美元），小珠認為美國將升息，使歐元相對美元貶值，於是透過外匯保證金交易，以此匯價賣出5萬歐元。請問：（每小題6分，共30分）\n\n（一）合約價值為多少美元？\n\n（二）假設保證金比率為5%，則小珠至少應存有多少美元在保證金帳戶內才能交易？\n\n（三）若三個月後歐元兌美元的匯率貶值為1.1660，她並以此價位買進5萬歐元，請問交易損益為何？\n\n（四）投資年化報酬率為多少？\n\n（五）若合約價值每變動10%，則投資人的持倉盈虧將變動多少？（與交易保證金相比）", "answer": ""},
{"category": "econstudy", "sub": "國際經濟商務人員", "year": "109", "question": "一、全球化促進國際貿易之自由化，雖然普遍認為會使參與國互蒙其利，但是亦造成所得分配不均之問題。試分析比較李嘉圖模型（Ricardian Model）之比較利益模型，赫克歇爾－奧林模型（Heckscher-Ohlin Model, H-O）與特殊生產因素模型（Specific-Factors Model）三個模型所隱含開放貿易對所得分配之影響。其中勞動之報酬為工資、土地之報酬為地租、資本之報酬是利息。\n\n提示：\n\n（1）李嘉圖模型，只有一個生產因素（勞動），假設生產兩種商品（食物與衣服）。\n\n（2）赫克歇爾－奧林模型，一般有兩個生產因素（勞動與資本），生產兩種商品（食物與衣服）；假設食物為勞力密集，衣服為資本密集，而討論中之甲國為資本豐富之國家。\n\n（3）特殊生產因素模型，一般有三個生產因素（勞動與兩個特殊生產因素－土地與資本），生產兩種商品（食物與衣服）；生產食物需使用土地與勞動，而生產衣服需使用資本與勞動，而討論中之甲國在開放貿易後衣服價格上升。\n\n（一）分析說明開放貿易後，根據李嘉圖模型，所得分配會有何改變？（5分）\n\n（二）分析說明開放貿易後，根據赫克歇爾－奧林模型，所得分配會有何改變？（8分）\n\n（三）分析說明開放貿易後，根據特殊生產因素模型，所得分配會有何改變？（12分）", "answer": ""},
{"category": "econstudy", "sub": "國際經濟商務人員", "year": "109", "question": "二、美中貿易戰（trade war），互課報復性關稅，背離自由貿易所帶來雙方互利，最後雙方受損。從賽局理論可以表示如下，策略（strategy）為自由貿易或保護貿易；報酬矩陣（payoff matrix）如下：\n\n（一）根據以上之賽局，說明那一個結果對兩國最有利？那一個結果對兩國最不利？賽局中之納許均衡（Nash Equilibrium）是如何定義？以上賽局之納許均衡解為何？（15分）\n\n（二）賽局中有所謂囚犯困境（prisoner's dilemma），說明之。以上賽局中之納許均衡，請說明是否符合囚犯困境？並試論為何美中雙方要進行協商（negotiation）？（10分）", "answer": "", "questionImage": ""},
{"category": "econstudy", "sub": "國際經濟商務人員", "year": "109", "question": "三、附表為中央銀行年報所公布之我國國際收支會計帳（balance of payment accounting），其中包含五大項A、B、C、D與E，其關係如下：A + B − C + D = E。\n\n（一）準備與相關項目（E），一般是指國際收支餘額（balance of payment, BOP）。例如108年國際收支餘額為166.58億。根據上表，請問108年國際收支餘額之增加與減少主要是由何項目造成？請問國際收支餘額是流量或是存量的概念？並說明其與外匯存底之關係為何？（10分）\n\n（二）臺灣之經常帳一直以來即呈現盈餘，根據美國之彼得森國際經濟研究所（Peterson Institute for International Economics）之估計，臺灣之匯率一直呈現低估之現象。根據馬婁條件（Marshall-Lerner Condition），貶值有利改善經常帳，試說明何謂馬婁條件？另外，經常帳盈餘或赤字亦反映國內投資（I）與國家儲蓄（S）之缺口。試根據國民所得會計帳（例如從支出面：Y = C + I + G + CA）與國家儲蓄之定義（S = Y − C − G）推導出經常帳（CA）之餘額反映S與I之缺口。以臺灣而論，此缺口是S大於I或I大於S？並評述經常帳持續維持盈餘之利弊。（15分）", "answer": "", "questionImage": ""},
{"category": "econstudy", "sub": "國際經濟商務人員", "year": "109", "question": "四、假設外匯市場與貨幣市場之均衡式分別如下：\n\n外匯市場：R_H = R_F + (Eᵉ_H/F − E_H/F) / E_H/F\n\n其中，R_H：本國存款利率；R_F：外國存款利率；E_H/F：市場匯率（一單位外國貨幣可以換取之本國貨幣）；Eᵉ_H/F：預期市場匯率。\n\n貨幣市場：Mˢ / P = L(R_H, Y)\n\n其中，Mˢ：貨幣供給；P：物價；Y：實質產出；R_H：本國存款利率；L：貨幣需求（是R_H與Y之函數）。\n\n（一）外匯市場均衡隱含利息平價說成立，試說明何謂利息平價說？對採用固定匯率制度之國家，貨幣當局可以透過影響貨幣市場，進而影響外匯市場，以控制匯率之固定不變。請說明貨幣當局如何控制匯率之固定不變？（15分）\n\n（二）近來多方討論到，港版國安法實行後，預期港幣貶值（即Eᵉ_H/F上升），香港之聯繫匯率制度（固定匯率制度之一種）可能受到挑戰。請說明運用提高利率與資本管制以維繫匯率固定之利弊。（10分）", "answer": ""},
{"category": "econstudy", "sub": "國際經濟商務人員", "year": "111", "question": "一、請回答下列問題：\n\n（一）假設甲國與乙國有相同數量的資源，甲國在鋼鐵與布都具有絕對利益（absolute advantage），而在鋼鐵生產中有比較利益（comparative advantage），而且兩國的生產技術皆為固定規模報酬。請在同一個圖上依這些特性畫出甲國與乙國的生產可能曲線，並解釋理由。（15分）\n\n（二）承上，請分別根據亞當．史密斯（Adam Smith）的絕對利益與大衛．李嘉圖（David Ricardo）的比較利益說明甲國與乙國貿易的結果。（10分）", "answer": ""},

{"category": "econstudy", "sub": "國際經濟商務人員", "year": "111", "question": "三、請回答以下問題：\n\n（一）某公司財務人員判斷美元將會升值，因而買進6個月期遠期外匯（DF）合約，金額為50萬美元，約定匯率為32.00（新臺幣／美元）。6個月後，即期匯率為33.00。假設沒有交易成本，此公司到期時，需拿出多少新臺幣進行交割？（3分）這個遠期外匯合約的損益又為多少元？（3分，未提供計算過程者不計分）\n\n（二）某公司財務人員認為未來美元會升值，因此與銀行簽訂買進美元的無本金遠期外匯（NDF）契約，到期為6個月，名目本金為50萬美元，約定買進的匯率為32.00（新臺幣／美元）。6個月後，即期匯率為30.00（新臺幣／美元）。在沒有交易成本下，此公司需拿出多少本金進行交割？（3分）公司的獲利（或損失）為多少新臺幣？（3分，未提供計算過程者不計分）\n\n（三）我國中央銀行目前禁止國內銀行與法人簽訂無本金遠期外匯（NDF）契約。請說明中央銀行這項限制的原因及其可能造成的影響。（13分）", "answer": ""},
{"category": "econstudy", "sub": "國際經濟商務人員", "year": "111", "question": "四、根據IS-LM-BP模型，假設某一個小型開放經濟體系原本處於對內、外均衡下，請說明下列各小題的敘述，正確、錯誤或不一定。（未繪圖及說明原因，不計分）\n\n（一）在固定匯率制度下，貨幣政策無效而財政政策有效。（12分）\n\n（二）在浮動匯率制度下，財政擴張政策在資本完全不移動的效果大於資本完全移動。（13分）", "answer": ""},

{"category": "econstudy", "sub": "地特三等", "year": "109", "question": "四、當面對景氣不佳時，各國政府常需透過擴張性的貨幣政策或擴張性的財政政策來因應，然而這些反景氣措施是否有效，常與該國採取的是固定匯率制度或浮動匯率制度有關。請詳細說明不同匯率制度下，貨幣政策與財政政策的有效性。（25分）", "answer": ""},
{"category": "econstudy", "sub": "地特三等", "year": "110", "question": "一、甲與乙兩國都生產X與Y兩種商品，且只有一種生產因素－勞動，甲與乙兩國各有600個單位勞動，假設生產X與Y兩種商品之單位勞動需求量（unit labor requirement）如下表（原卷附有甲、乙兩國生產X、Y商品之單位勞動需求量表格，確切數值請對照原卷）：\n\n（一）說明那一國生產X商品有絕對利益（absolute advantage）？那一國生產Y商品有絕對利益？並說明如果有一國不管生產X或Y都有絕對利益，是否表示該國無法從兩國貿易往來中獲得利益？（8分）\n\n（二）甲與乙兩國是否各自存在比較利益（comparative advantage）？分析說明之。（9分）\n\n（三）與閉關自守相比較，透過專業化生產與交易（間接生產），在何貿易條件範圍內，兩國之X與Y商品之產出都可以增加？分析說明之。（8分）", "answer": "", "questionImage": ""},
{"category": "econstudy", "sub": "地特三等", "year": "110", "question": "二、（一）說明關稅同盟（如歐盟（European Union）之關稅同盟）與自由貿易區（如依據北美自由貿易協定（NAFTA）所形成的自由貿易區）之異同。（8分）\n\n（二）何謂貿易創造（trade creation）效果與貿易移轉（trade diversion）效果？（8分）\n\n（三）以甲國加入歐盟之關稅同盟（customs union）為例，假設汽車生產成本在甲國是$20,000，乙國是關稅同盟國，其汽車生產成本是$30,000。假設關稅同盟之汽車進口稅率為T，而非關稅同盟之丙國汽車之生產成本為C。分別說明下列三種情境下，若甲國加入關稅同盟是會帶來貿易創造或貿易移轉的效果？（9分）\n\n1. T = 50%，C = $18,000\n\n2. T = 100%，C = $18,000\n\n3. T = 100%，C = $12,000", "answer": ""},
{"category": "econstudy", "sub": "地特三等", "year": "110", "question": "三、美國財政部每年4月、10月會公布匯率報告，並設有3項標準以判斷其貿易對手國是否操縱匯率。許多證據顯示，新臺幣有被操縱之現象，例如根據大麥克指數，新臺幣低估54.5%（10/10, 2021）；或根據美國之彼得森國際經濟研究所（Peterson Institute for International Economics）之估計，新臺幣一直呈現低估之現象。另外，根據國際貨幣基金（IMF）的統計資料，2019年臺灣、南韓、瑞士之名目人均GDP分別為$24,828、$31,762、$81,994美元，但以購買力平價（PPP）計算之人均GDP則分別為$53,429、$48,603、$70,989美元。\n\n（一）說明美國財政部藉以判斷其貿易對手國是否操縱匯率的3項標準。採用此3項標準的主要著眼點為何（亦即說明如何利用此3項標準來判斷匯率是否受到操縱）？（9分）\n\n（二）低估一國貨幣之優、缺點分別為何？試說明中央銀行如何維持新臺幣低估。（8分）\n\n（三）說明為何臺灣與南韓之購買力平價（PPP）人均GDP皆大於其名目美元之人均GDP，而瑞士則是購買力平價（PPP）之人均GDP會小於名目美元計算之人均GDP？另外，臺灣之名目美元之人均GDP小於南韓，但是購買力平價（PPP）之人均GDP卻大於南韓，有謂此是「內富外窮」的現象，分析說明之。（8分）", "answer": ""},
{"category": "econstudy", "sub": "地特三等", "year": "110", "question": "四、國際收支帳五大項目之關係如下：經常帳＋資本帳－金融帳＋誤差與遺漏淨額＝準備與相關項目，準備與相關項目即是一般所指之國際收支餘額。根據中央銀行公布之2007～2011年各項目之餘額（單位：百萬美金）分別如下表（原卷附有2007～2011年臺灣之國際收支帳表格，確切數值請對照原卷）：\n\n（一）經常帳（CA）一般視為淨出口，同時反映一國國民儲蓄（S）與投資（I）之差額（即CA = S − I），說明為什麼經常帳餘額亦表示淨國外資產之增加？淨國外資產之增加，是否表示國際收支餘額一定會增加？為什麼？一直以來有所謂雙赤字（twin deficits）現象之說法，試說明其含意，並進一步依據表格資料說明臺灣於此期間是否有出現雙赤字之現象。雙赤字現象是否一定成立？說明理由。（15分）\n\n（二）何謂通貨危機（currency crisis）？21世紀以來之通貨危機和資本之快速與大量移動有關，說明資本之快速與大量移動如何引起通貨危機？2008年全球金融危機爆發前後，2007年之國際收支餘額與歷年相較是呈現負值，試說明其原因。又2009年之金融帳餘額亦是與歷年相異，為負值，試說明其原因。（10分）", "answer": "", "questionImage": ""},
{"category": "econstudy", "sub": "地特三等", "year": "111", "question": "一、下列圖例說明：國際貿易對小型開放經濟體系如臺灣，對某些產業影響是有利的。假設手機和筆電之生產只需勞動一項投入要素，且設每單位產出所需之勞動投入如下（原卷附有手機與筆電單位勞動投入表格）：\n\n假設某國有20,000人，請繪出該國以筆電為縱軸，以手機為橫軸之生產可能曲線。以手機來計算生產筆電之機會成本為何？如果沒有國際貿易之自給自足下，筆電和手機之相對價格為何？（15分）\n\n（二）假設在有國際貿易下，且國際間筆電和手機的相對價格為1:5。請以圖形說明開放國際貿易對該國產業均有利。（10分）", "answer": "", "questionImage": ""},

{"category": "econstudy", "sub": "國安", "year": "104", "question": "四、歐盟（European Union, EU）在1957年即由西德、法國等6個國家成員組成，又1994年有7個國家會員的歐洲自由貿易聯盟（European Free Trade Association, EFTA）加入EU共同形成歐洲經濟區域（European Economic Area, EEA），直到2008年的歐盟已經擴展到27個國家成員的政治與經濟整合（integration），並在2015年包含28個成員國的歐元區（Euro zone），請說明導致歐盟擴大整合的三個重要經濟理由為何？（25分）", "answer": ""},

{"category": "econstudy", "sub": "國安", "year": "105", "question": "二、請利用所學貿易理論評述下列各命題。\n\n（一）在全球跨國垂直專業分工盛行的階段，全球貿易增長的速度將高於產出增長的速度；但若各國積極推動進口替代或鼓勵製造業回流，則貿易與產出增長速度的差距將會縮減。（10分）\n\n（二）一般而言，貿易自由化對於資本家較為有利，資本報酬會增加，但對勞工則不利，工資會下跌。（10分）", "answer": ""},
{"category": "econstudy", "sub": "國安", "year": "105", "question": "三、下表顯示2015年對於相同一籃商品與服務之i國價格相對美國的價格（Pi/P_US）、i國貨幣對美元的匯率，以及i國人均GDP（GDP per capita）：\n\n國家｜Pi/P_US｜對美元匯率｜GDP per capita（美元）\n臺灣｜15.20｜31.9｜22,288\n新加坡｜0.85｜1.38｜52,888\n日本｜103｜121｜32,486\n\n（資料來源：匯率來自中華民國中央銀行資訊網；其餘來自IMF（2016）, World Economic Outlook, April。）\n\n（一）何謂購買力平價理論（Theory of Purchasing Power Parity）？又請利用表中數據說明臺灣相對新加坡的物價水準，何者較高？（10分）\n\n（二）何謂PPP人均GDP（亦即GDP per capita based on PPP）？請利用表中數據求算臺灣與日本的PPP人均GDP。並請比較臺灣與日本之人均GDP與PPP人均GDP的大小，並說明其意義。（10分）", "answer": ""},
