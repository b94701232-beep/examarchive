<style>
  :root{
    --ink:#1C2541;
    --ink-soft:#2C3A63;
    --paper:#EDE6D6;
    --paper-dark:#E1D6BE;
    --paper-line:#cdbf9c;
    --seal:#A63A32;
    --seal-dark:#7f2b25;
    --brass:#93762F;
    --charcoal:#2A2620;
    --muted:#726B58;
    --shadow: 0 8px 24px rgba(28,37,65,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at top left, rgba(28,37,65,0.04), transparent 60%),
      var(--paper);
    color:var(--charcoal);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
    overflow-x:hidden;
  }
  .wrap{max-width:900px;margin:0 auto;}

  /* ===== Header / Letterhead ===== */
  header.letterhead{
    background:var(--ink);
    color:var(--paper);
    border-radius:6px;
    padding:28px 30px;
    position:relative;
    overflow:hidden;
    box-shadow:var(--shadow);
    margin-bottom:28px;
  }
  header.letterhead::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(237,230,214,0.25);
    border-radius:3px;
    pointer-events:none;
  }
  .eyebrow{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-size:11px;
    letter-spacing:0.18em;
    color:#C9BFA0;
    text-transform:uppercase;
    margin:0 0 8px;
  }
  h1{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-weight:900;
    font-size:clamp(24px,4vw,34px);
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  .sub{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-size:14px;
    color:#D6CDB2;
    margin:0;
  }
  .seal{
    position:absolute;
    top:20px;
    right:24px;
    width:64px;
    height:64px;
    opacity:0.92;
  }

  /* ===== Tabs (folder tabs) ===== */
  .tabbar{
    display:flex;
    gap:6px;
    align-items:flex-end;
    margin-bottom:0;
    padding-left:6px;
  }
  .tab{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-weight:600;
    font-size:15px;
    padding:12px 22px 11px;
    background:var(--paper-dark);
    color:var(--muted);
    border:1px solid var(--paper-line);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    transform:translateY(4px);
    transition:transform .15s ease, background .15s ease, color .15s ease;
    position:relative;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{
    background:#F7F2E6;
    color:var(--ink);
    transform:translateY(0);
    box-shadow:0 -2px 6px rgba(0,0,0,0.04);
    z-index:2;
  }
  .tab .count{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-size:11px;
    color:var(--brass);
    margin-left:6px;
  }

  .panel{
    background:#F7F2E6;
    border:1px solid var(--paper-line);
    border-radius:0 8px 8px 8px;
    box-shadow:var(--shadow);
    padding:22px 24px 26px;
    position:relative;
  }

  /* ===== Sub-category chips ===== */
  .subbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:20px;
    padding-bottom:16px;
    border-bottom:1px dashed var(--paper-line);
  }
  .subchip{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', 'Microsoft JhengHei', Arial, sans-serif;
    font-size:12px;
    color:var(--muted);
    background:var(--paper);
    border:1px solid var(--paper-line);
    padding:6px 13px;
    border-radius:16px;
    cursor:pointer;
    transition:all .12s ease;
    white-space:nowrap;
  }
  .subchip:hover{color:var(--ink);border-color:var(--brass);}
  .subchip.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .subchip.unassigned{
    border-style:dashed;
    color:var(--seal);
  }
  .subchip.unassigned.active{
    background:var(--seal);
    border-color:var(--seal);
    color:#fff;
  }
  .subchip .n{
    opacity:0.7;
    margin-left:5px;
  }

  .panel-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .panel-title{

const ENTRIES_COLLECTION = 'examarchive_entries';
const META_COLLECTION = 'examarchive_meta';

// ===== Firestore 讀取節流設定 =====
// 目的：避免每次開啟/重新整理頁面都把整個 collection 從伺服器重新讀一次。
// 正常情況優先讀 IndexedDB 快取；距離上次完整雲端同步超過 24 小時才在背景更新。
const FIRESTORE_SYNC_INTERVAL_MS = 24 * 60 * 60 * 1000;
const FIRESTORE_LAST_SYNC_KEY = 'examarchive_firestore_last_full_sync_v1';

function getLastFirestoreSyncTime(){
  try{ return Number(localStorage.getItem(FIRESTORE_LAST_SYNC_KEY) || 0); }
  catch(e){ return 0; }
}

function setLastFirestoreSyncTime(ts = Date.now()){
  try{ localStorage.setItem(FIRESTORE_LAST_SYNC_KEY, String(ts)); }
  catch(e){}
}

function isFirestoreSyncDue(){
  const last = getLastFirestoreSyncTime();
  return !last || (Date.now() - last >= FIRESTORE_SYNC_INTERVAL_MS);
}

async function fetchAllEntriesFromFirestoreServer(){
  const snapshot = await db.collection(ENTRIES_COLLECTION).get({ source: 'server' });
  const list = [];
  snapshot.forEach(docSnap => { list.push({ id: docSnap.id, ...docSnap.data() }); });
  setLastFirestoreSyncTime();
  return list;
}

async function firestoreLoadAllEntries(){
  await firestorePersistenceReady;

  // 1) 優先從 Firestore 的 IndexedDB 本機快取讀取：不產生伺服器文件讀取費用。
  try{
    const cacheSnap = await db.collection(ENTRIES_COLLECTION).get({ source: 'cache' });
    if(!cacheSnap.empty){
      const list = [];
      cacheSnap.forEach(docSnap => { list.push({ id: docSnap.id, ...docSnap.data() }); });

      // 2) 只有超過 24 小時沒有完整同步，才在背景向伺服器抓一次全部資料。
      if(isFirestoreSyncDue()){
        fetchAllEntriesFromFirestoreServer().then(freshList=>{
          const changedFromCache = freshList.length !== entries.length ||
            JSON.stringify(freshList) !== JSON.stringify(entries);
          if(changedFromCache){
            entries = freshList;
            render();
          }
          updateStorageStatus('ok');
        }).catch(bgErr=>{
          window.__loadDiagnostics = window.__loadDiagnostics || {};
          window.__loadDiagnostics.backgroundRefreshError = 'server refresh failed: ' + (bgErr && bgErr.message);
          showDiagnosticsIfNeeded(entries.length);
        });
      }
      return list;
    }
  }catch(cacheErr){
    // 本機沒有快取或快取失敗：第一次使用時必須向伺服器完整讀取一次。
  }

  // 3) 沒有本機快取時才從伺服器完整下載一次，並記錄同步時間。
  return await fetchAllEntriesFromFirestoreServer();
}

// 手動強制同步：只有使用者主動按「檢查更新」時才立即完整讀取 Firestore。
async function forceFirestoreRefresh(){
  if(!window.__cloudMode || !db){
    alert('目前未連上 Firebase 雲端資料庫。');
    return;
  }
  const btn = document.getElementById('refreshPageBtn');
  const oldText = btn ? btn.textContent : '';
  try{
    if(btn){ btn.disabled = true; btn.textContent = '↻ 同步中…'; }
    updateStorageStatus('saving');
    const freshList = await fetchAllEntriesFromFirestoreServer();
    entries = freshList;
    render();
    updateStorageStatus('ok');
    alert('✓ 已從 Firebase 取得最新資料，共 ' + freshList.length + ' 筆。');
  }catch(err){
    updateStorageStatus('error');
    alert('同步失敗：' + (err && err.message ? err.message : String(err)));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = oldText || '↻ 檢查更新'; }
  }
}

async function firestoreGetImportedBatches(){
  const docSnap = await db.collection(META_COLLECTION).doc('importedBatches').get();
  return docSnap.exists ? (docSnap.data().list || []) : [];
}

async function firestoreSetImportedBatches(list){
  await db.collection(META_COLLECTION).doc('importedBatches').set({ list });
}

async function firestoreSaveEntry(entry){
  const data = {}; for(const k in entry){ if(k !== 'id') data[k] = entry[k]; }
  await db.collection(ENTRIES_COLLECTION).doc(entry.id).set(data, { merge: true });
}

async function firestoreDeleteEntry(id){
  await db.collection(ENTRIES_COLLECTION).doc(id).delete();
}

async function firestoreBatchWriteEntries(entriesArray){
  for(let i=0;i<entriesArray.length;i+=450){
    const chunk = entriesArray.slice(i, i+450);
    const batch = db.batch();
    chunk.forEach(entry=>{
      const data = {}; for(const k in entry){ if(k !== 'id') data[k] = entry[k]; }
      const ref = db.collection(ENTRIES_COLLECTION).doc(entry.id);
      batch.set(ref, data, { merge: true });
    });
    await batch.commit();
  }
}

// 離線／獨立瀏覽器備援機制：若不在 Claude 環境內（沒有 window.storage），
// 則自動改用瀏覽器內建的 localStorage，讓本檔案下載後可離線單獨開啟使用。
if(!window.storage){
  window.__storageMode = 'local';
  window.storage = {
    async get(key, shared){
      const k = 'exam-archive-local::' + (shared ? 'shared::' : '') + key;
      const v = localStorage.getItem(k);
      if(v === null){ throw new Error('Key not found'); }
      return { key, value: v, shared: !!shared };
    },
    async set(key, value, shared){
      const k = 'exam-archive-local::' + (shared ? 'shared::' : '') + key;
      localStorage.setItem(k, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared){
      const k = 'exam-archive-local::' + (shared ? 'shared::' : '') + key;
      localStorage.removeItem(k);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.startsWith('exam-archive-local::')) keys.push(k);
      }
      return { keys, prefix, shared: !!shared };
    }
  };
}else{
  window.__storageMode = 'claude';
}

{"category": "intl", "sub": "外交特考三等", "year": "114", "question": "一、在國際法上，不屬於「國家領土」的地區有那些？有那些國際規範？試舉二例說明之。（25 分）(110外)", "answer": "", "answerClaude": "一、不屬於「國家領土」的地區\n\n國際法上並非地球表面所有陸地或海域都屬於特定國家主權範圍，主要有以下幾類「非國家領土」（areas beyond national jurisdiction）：\n\n（一）南極（Antarctica）\n依1959年《南極條約》（Antarctic Treaty）第4條，凍結所有既存領土主張，締約國不得提出新主張，南極僅供和平及科學研究用途，非任何國家之領土。\n\n（二）公海（High Seas）\n依《聯合國海洋法公約》第89條，任何國家不得對公海任何部分主張主權；公海對所有國家開放，適用航行、飛越、鋪設海纜管線等自由。\n\n（三）「區域」（the Area，國家管轄範圍以外之海床洋底）\n依公約第136、137條，「區域」及其資源為人類共同繼承財產，任何國家不得主張主權或主權權利，由國際海底管理局代表全人類統一管理。\n\n（四）外太空及天體\n依1967年《外太空條約》（Outer Space Treaty）第2條，外太空、月球及其他天體不得由任何國家以主權主張、使用或占領等方式據為己有。\n\n以上四類均體現國際法上「人類共同繼承財產」或「不得據為己有」原則，其共通特徵為：透過多邊條約凍結或禁止主權主張，改以國際合作或全人類共同利益為管理基礎。"},
{"category": "intl", "sub": "外交特考三等", "year": "114", "question": "二、2022 年 3 月 2 日第 5 屆聯合國環境大會通過名為《終結塑膠污染：制定 具法律拘束力的國際文件》的決議，決議中確認塑膠污染應包含微塑膠， 並特別關注塑膠污染對海洋環境造成的衝擊。決議同時也強調海洋及其 他環境中的塑膠污染具有跨境的特性，不僅影響全球生態環境，同時也 危害全體人類健康。請依《聯合國海洋法公約》說明海洋環境污染與海 洋環境維護的規定。 （25 分）", "answer": "", "answerClaude": "二、《聯合國海洋法公約》關於海洋環境污染與維護之規定\n\n（一）一般性義務（第192、194條）\n公約第192條明定各國有保護及保全海洋環境之一般義務；第194條要求各國採取一切必要措施，防止、減少及控制來自任何來源（包括陸地來源、船舶、傾倒、海底活動、大氣層）之海洋環境污染，並不得將損害或污染從一個區域轉移至另一區域，或將一種污染轉變為另一種污染。\n\n（二）分類規範各污染來源（第207條至第212條）\n公約按污染來源分別課予國家立法及執法義務：陸地來源污染（第207條）、國家管轄海底活動污染（第208條）、「區域」內活動污染（第209條）、傾倒污染（第210條）、船舶污染（第211條）及大氣層污染（第212條），要求各國透過國內立法及國際合作（包括經由主管國際組織或外交會議訂定全球性及區域性規則）加以規範。\n\n（三）微塑膠與新興污染物之適用\n微塑膠雖非公約制定時所預見之污染型態，惟依第194條「任何來源」之廣泛用語及晚近國家實踐（如2022年聯合國環境大會第5屆決議），微塑膠污染應可涵蓋於「海洋環境污染」之定義內，屬各國依公約負有防制義務之對象。\n\n（四）環境影響評估義務（第206條）\n凡進行可能對海洋環境造成重大污染或重大有害變化之活動前，應盡可能就活動可能影響進行評估，並將評估結果公布。\n\n（五）跨界特性與國際合作（第123條、第197條）\n海洋污染具跨境流動特性，公約第197條要求各國在全球性基礎上，並於適當情形在區域性基礎上，直接或透過主管國際組織進行合作，以擬訂並訂立國際規則、標準及建議辦法。"},
{"category": "intl", "sub": "外交特考三等", "year": "114", "question": "三、國際法院如何定位和應用海洋劃界的方法論？請舉例說明之。（25 分）", "answer": "", "answerClaude": "三、國際法院海洋劃界方法論之定位與應用\n\n（一）方法論演進：由「等距離／特殊情況」走向「三階段法」\n國際法院早期（如1969年北海大陸礁層案）強調「公平原則」（equitable principles），拒絕將等距離線視為習慣法上唯一劃界方法。其後於2009年羅馬尼亞訴烏克蘭「黑海劃界案」中，國際法院確立了現行普遍適用之「三階段劃界法」：\n\n1. 第一階段：先劃設暫時等距離線（provisional equidistance line），以相關海岸上最適當之基點連接構成。\n\n2. 第二階段：檢視是否存在「相關情況」（relevant circumstances），如海岸線形狀特殊、島嶼存在、海岸線長度顯著不成比例等，據以調整暫時等距離線之位置，以達成公平解決（equitable solution）。\n\n3. 第三階段：進行「比例性檢驗」（disproportionality test），比較調整後界線劃分之海域面積與雙方相關海岸線長度之比例，確認結果並無顯著不成比例之情形，以驗證劃界結果之公平性。\n\n（二）舉例說明\n1. 北海大陸礁層案（1969）：確立公平原則為劃界之目標，惟尚未發展出標準化之三階段方法。\n\n2. 黑海劃界案（Romania v. Ukraine, 2009）：首次完整闡述三階段法，成為其後劃界案件之標準模板。\n\n3. 尼加拉瓜訴哥倫比亞案（2012）：適用三階段法處理島嶼與大陸海岸相向劃界，並就島嶼是否給予全部效力（full effect）或減弱效力（enclave）進行裁量。\n\n4. 加納/象牙海岸海洋劃界案（ITLOS特別分庭，2017）：延續並確認三階段法之普遍適用性，並強調單一劃界線（single maritime boundary）處理領海以外多重海域重疊之實務作法。\n\n（三）小結\n國際法院之方法論已由早期高度個案化、著重公平原則之裁量，發展為具高度可預測性、結構化之三階段法，兼顧法律安定性與個案公平調整之彈性，現已成為國際海洋法劃界爭端解決之主導方法論。"},
{"category": "intl", "sub": "外交特考三等", "year": "113", "question": "一、依據 1982 年《聯合國海洋法公約》（1982 United Nations Convention on the Law of the Sea）的規定，試從海盜之定義分析締約國於公海上對海盜行為予以扣押船舶之權力及其限制。（25 分）", "answer": "", "answerClaude": "一、公海海盜行為之定義與扣押權力及其限制\n\n（一）海盜行為之定義（UNCLOS第101條）\n依《聯合國海洋法公約》第101條，海盜行為係指：\n1. 私人船舶或私人航空器之船員、機組人員或乘客，為私人目的（for private ends），對公海上另一船舶或航空器，或其上人員、財物實施之任何非法暴力、扣留或掠奪行為；或對國家管轄範圍以外之地方（如公海、無主地）之船舶、人員財物實施上述行為。\n2. 明知船舶或航空器成為海盜船舶或飛機之事實而自願參加其活動之任何行為。\n3. 教唆或故意便利上述行為之任何行為。\n\n其核心要件包括：（1）須為私人船舶／航空器所為，排除軍艦、政府船舶執行公務之行為（惟第102條規定軍艦叛變後亦可構成）；（2）須為「私人目的」，排除政治動機之行為（此點學說上有爭議，如環保團體之激烈抗爭行為是否構成海盜行為）；（3）須涉及「兩船原則」（two-vessel requirement），即須有加害船舶對另一船舶或其人員財物實施行為，單一船舶內部之叛變或劫持較難單獨構成海盜行為；（4）行為地須在公海或任何國家管轄範圍以外之地方。\n\n（二）締約國之扣押權力（第105條）\n任何國家均得在公海上，或在任何國家管轄範圍以外之其他地方，扣押海盜船舶或航空器，或扣押由海盜行為劫持之船舶或航空器，並逮捕船上人員、扣押財物。此為海盜罪之普遍管轄權（universal jurisdiction）之明文化，任何國家均得追訴海盜，不以本國國籍、被害國籍或行為地與該國有連結為前提。\n\n（三）扣押權之限制\n1. 執行主體限制（第107條）：僅軍艦、軍用飛機，或經授權並有明顯標誌可識別之為政府服務之其他船舶或飛機，始得執行海盜扣押。\n2. 地域限制：扣押行為原則上限於公海或國家管轄範圍以外之地方，若海盜船逃入他國領海，扣押國原則上不得逕行追入他國領海進行扣押（涉及沿海國主權），須經沿海國同意或由沿海國自行處理。\n3. 惡意扣押之賠償責任（第106條）：若無充分理由而扣押涉嫌海盜之船舶或航空器，扣押國應對船旗國因此所受之任何損失或損害負賠償責任。\n4. 審判管轄之限制：扣押國之法院有權判定應處之刑罰，並得裁決對船舶、航空器或財產（善意第三人權利除外）應採之行動，惟其他方面之管轄權仍受一定限制，不能藉此擴張至海盜罪以外之其他犯罪。"},
{"category": "intl", "sub": "外交特考三等", "year": "113", "question": "二、世界貿易組織（World Trade Organization）成立至今約 30 年，爭端解決機制中的上訴機構運作瀕臨停擺，WTO 部分會員提出「多方臨時上訴仲裁協議」（Multi-Party Interim Appeal Arbitration Arrangement，MPIA）作 為上訴機構之臨時替代方案，試申論 WTO 爭端解決機制引發那些爭議？又 MPIA 之目的與程序為何？（25 分）", "answer": "", "answerClaude": "二、WTO爭端解決機制之爭議與MPIA之目的與程序\n\n（一）WTO爭端解決機制引發之爭議\n\n1. 上訴機構法官任命遭杯葛：美國自2017年起持續阻擋上訴機構（Appellate Body）法官之遴選程序，理由包括批評上訴機構逾越其審查範圍（如處理不必要之法律爭點、對既有裁決給予過度先例效力）、審理期限逾越DSU規定之90天上限，以及對成員國主權及國內政策空間造成侵蝕等，導致上訴機構自2019年12月起法官人數不足法定最低3人，實質陷入停擺。\n\n2. 「上訴至虛無」（appeal into the void）之策略性運用：因上訴機構停擺，敗訴方得對小組報告提起上訴，但因無法組成上訴庭審理，該案將無限期懸而未決，形同架空整體爭端解決機制之拘束力與可執行性。\n\n3. 爭端解決機制之正當性與司法造法之爭議：部分成員國質疑上訴機構透過解釋逐漸擴張其職權範圍，形同「司法造法」（judicial activism），與WTO作為會員驅動（member-driven）組織之定位產生緊張關係。\n\n（二）MPIA之目的\n\nMPIA（多方臨時上訴仲裁協議）之目的在於，於上訴機構停擺期間，為參與之會員國提供一套具有實質上訴審查功能之替代機制，維持二審終審制之爭端解決功能，避免爭端解決機制因上訴機構停擺而完全失去拘束力與可預測性，同時作為過渡性安排，待上訴機構恢復運作後即可終止適用。\n\n（三）MPIA之程序\n\n1. 法律依據：MPIA援引DSU第25條之仲裁機制作為法律基礎，將原本上訴機構之審查改由仲裁程序取代。\n2. 仲裁員組成：由參與MPIA之會員國自願組成之仲裁員庫（pool of 10名仲裁員）中，就個案選任3名仲裁員組成仲裁庭，其組成與運作方式高度模擬原上訴機構之三人小組運作模式。\n3. 審查範圍與標準：仲裁程序之審查範圍與標準比照原上訴機構之審查（僅限於法律問題及小組所為之法律解釋），並維持原上訴機構之審理期限規範。\n4. 適用對象：僅適用於參與MPIA之會員國之間所生爭端；未參與之會員國（如美國）之爭端仍面臨上訴機構停擺之風險，無法透過MPIA尋求救濟。\n5. 過渡性質：MPIA明定於上訴機構恢復正常運作後即失去適用必要，性質上屬臨時、補充性之安排，而非取代WTO上訴機構本身。"},
{"category": "intl", "sub": "外交特考三等", "year": "113", "question": "三、國際法上的管轄權（jurisdiction）主要由國家所行使之，而關於國家的「域外管轄」 （extraterritorial jurisdiction）則時常產生爭議。試舉例說明並解釋「域外管轄」所保護之利益及其可能與國際法衝突之處。 （25 分）", "answer": "", "answerClaude": "三、國家域外管轄及其保護之利益與國際法衝突\n\n（一）域外管轄之意涵\n域外管轄（extraterritorial jurisdiction）係指一國將其國內法規範，適用於發生在其領土範圍以外之人、事、物或行為，涵蓋立法管轄權（jurisdiction to prescribe）、執行管轄權（jurisdiction to enforce）及審判管轄權（jurisdiction to adjudicate）三個層次，其中域外管轄爭議多集中於立法管轄權之域外延伸，至於執行管轄權原則上仍受屬地原則嚴格限制，不得未經他國同意逕自在他國領域內執行公權力行為。\n\n（二）域外管轄之傳統理論基礎\n1. 屬地原則（territoriality）：包含主觀屬地原則（行為開始於本國）與客觀屬地原則（行為結果發生於本國，即「效果原則」effects doctrine）。\n2. 屬人原則（nationality/active personality）：本於行為人具本國國籍而行使管轄。\n3. 保護原則（protective principle）：對危害本國國家安全、政府職能或重大利益之域外行為主張管轄，即使行為人非本國國民。\n4. 消極屬人原則（passive personality）：以被害人具本國國籍為連結因素。\n5. 普遍管轄原則（universality）：對海盜、種族滅絕、戰爭罪等國際法上關注全人類利益之重大罪行，任何國家均得管轄，不問行為地、國籍等傳統連結因素。\n\n（三）域外管轄所保護之利益\n域外管轄之發動，通常旨在保護：本國市場競爭秩序（如反托拉斯法域外適用）、本國金融及證券市場穩定（如美國證券法域外效力）、國家安全及外交政策目標（如美國出口管制及次級制裁）、以及全人類共同關注之基本價值（如反貪腐、反洗錢、人權保障相關立法之域外適用）。\n\n（四）舉例及與國際法之衝突\n\n1. 美國反托拉斯法之域外適用：如美國「Hartford Fire Insurance v. California」案援引效果原則，對外國企業於境外從事、但對美國市場產生實質影響之反競爭行為主張管轄，引發歐盟等貿易夥伴之強烈抗議，認為過度擴張管轄權侵害他國之屬地管轄權及經濟主權。\n\n2. 美國域外次級制裁（secondary sanctions）：如對伊朗、俄羅斯之制裁，要求第三國企業亦不得與受制裁對象進行交易，否則將面臨美國之處罰，此舉實質上將美國國內政策強加於他國企業與市場，引發他國以「阻斷法」（blocking statutes，如歐盟阻斷法規）予以反制。\n\n3. 歐盟《一般資料保護規則》（GDPR）之域外效力：對於處理歐盟境內居民個資之境外企業課予合規義務，亦具有域外管轄之性質，惟因保護個人資料隱私之目的較具普遍正當性，爭議相對較小。\n\n（五）與國際法之衝突及調和\n過度擴張之域外管轄可能牴觸國際法上之不干涉原則、國家主權平等原則，並與他國之屬地管轄權發生管轄權競合甚至衝突，導致國際禮讓（international comity）原則、合理性原則（reasonableness test，如美國法律整編之「重大利益衡量」）及雙邊或多邊協調機制（如反托拉斯合作協定）成為緩解域外管轄衝突之重要途徑。"},
{"category": "intl", "sub": "外交特考三等", "year": "112", "question": "一、依據 1982 年《聯合國海洋法公約》 （1982 United Nations Convention on the Law of the Sea）的規定，闡述一國軍艦在公海、他國專屬經濟海域以 及他國領海中所行使之航行權利分別為何？（25 分）", "answer": "", "answerClaude": "一、軍艦在公海、他國專屬經濟海域及他國領海之航行權利\n\n（一）公海（High Seas）\n依UNCLOS第87條，公海航行自由為公海自由之核心內容，軍艦與其他船舶同享完全之航行自由，不受任何國家管轄（惟受船旗國專屬管轄，第92條），亦得從事第87條所列之飛越、鋪設海纜管線、建造人工島嶼與設施、捕魚、科學研究等自由，僅須顧及其他國家行使公海自由之利益（適當顧及原則，due regard）。\n\n（二）他國專屬經濟海域（EEZ）\n依第58條，其他國家（包括軍艦）在專屬經濟海域內享有第87條所定之航行及飛越自由，以及與此有關之公海其他合法用途之自由（如與船舶、飛機營運相關之海洋科學活動），但須顧及沿海國之權利及義務，並遵守沿海國依公約規定制訂之與本部分不牴觸之法律規章。軍艦在專屬經濟海域內進行軍事測量、偵察或演習等活動之合法性存有爭議，中國、部分開發中國家主張此類活動須經沿海國同意，美國等海洋強權則主張此屬於航行自由之當然內容，此為當前國際海洋法實踐上重大爭點之一。\n\n（三）他國領海（Territorial Sea）\n依第17條至第32條，包括軍艦在內之所有船舶享有無害通過權（right of innocent passage），惟通過須「無害」（innocent），即不得損害沿海國之和平、良好秩序或安全（第19條），且須連續不停迅速進行（第18條）。針對軍艦是否須事先通知或取得沿海國許可，公約本身並無明文要求，惟部分國家（如中國、南韓、若干拉丁美洲國家）國內法要求外國軍艦通過領海前應事先通知或取得許可，此等國內法要求是否符合公約，學說及國家實踐上仍有分歧；多數海洋強權及西方學說認為，公約未設此等前提要件，故此類國內法要求逾越公約規範。此外，依第30條，軍艦如不遵守沿海國關於通過領海之法律規章，經沿海國要求仍不遵行者，沿海國得要求該軍艦立即離開領海。"},
{"category": "intl", "sub": "外交特考三等", "year": "112", "question": "二、A 國國家研究單位擁有的無人科學探測氣球 MD-80 進入 B 國防空識別區（Air Defense Identification Zone, ADIZ）與領空，B 國得知後以飛彈將 MD-80 擊落，但墜落的 MD-80 砸毀 B 國民宅並造成 B 國人民三人死亡。A 國主張該科學探測氣球之航行係專為科學研究目的，但 B 國認為 該氣球非法侵入該國管轄空間。請依據所涉及之國際法規則分析此一事件。 （25 分）", "answer": "", "answerClaude": "二、A國科學探測氣球遭B國擊落事件之國際法分析\n\n（一）防空識別區（ADIZ）之國際法地位\n防空識別區並非國際法上明文承認之法律概念，亦非《國際民用航空公約》（芝加哥公約）或UNCLOS所規範之領域，而係沿海國基於國家安全考量單方面劃設之空域識別及預警機制，其效力原則上僅及於要求進入該區之航空器配合識別、通報等程序性義務，並不當然賦予劃設國得對進入該區（尤其是公海或他國專屬經濟海域上空）之外國航空器逕行使用武力之權利。惟若科學探測氣球已進入B國領空（即領土及領海上空），則其法律地位即轉變為主權空域內之外國航空器，適用不同規範。\n\n（二）領空主權與外國航空器之通過\n依芝加哥公約及國際習慣法，一國對其領空享有完全且排他之主權（complete and exclusive sovereignty），外國民用航空器未經許可進入他國領空原則上構成對該國領空主權之侵犯，惟此並不當然意味沿海國得逕以武力擊落之，蓋《芝加哥公約》第3條之2（因1983年大韓航空007號班機事件而增訂）明文規定，各締約國承認每一國家對飛越其領土上空之民用航空器行使武力必須加以節制，並於攔截時不得危及機上人員生命安全及航空器安全；如遇違反公約之民用航空器，得要求其降落於指定機場，但不得對其使用武器。\n\n（三）本案分析\n1. 若氣球係屬「無人」科學探測氣球（非載人航空器），芝加哥公約第3條之2有關保障機上人員生命安全之規定固不直接適用（因無機上人員），惟該條所反映之「使用武力應加以節制」之一般法理，仍應作為評價B國行為合法性之重要參考基準。\n2. B國若僅因氣球進入其防空識別區（尚未進入領空）即逕以飛彈擊落，若擊落地點仍在公海或B國領空以外，其正當性顯有疑義，蓋防空識別區本身不賦予使用武力之權利。\n3. 若氣球確已進入B國領空，B國依國家主權原則固得採取必要之因應措施（如攔截、要求降落、聯繫溝通等），惟逕行以飛彈擊落而未先窮盡其他較低度之因應手段（如攔截機接近識別、警告等），且其後果導致擊落物墜毀致平民傷亡，其武力使用之必要性與比例性亦有可議之處，可能構成國家責任之基礎。\n4. A國就其科學研究目的之主張，若經證實非軍事偵察用途，亦為評價B國反應是否過度、是否符合必要性與比例原則之重要事實因素。\n5. B國就其擊落行為所生之人員傷亡及財產損害（即使非直接故意造成），仍可能須負國家責任，惟若能證明其行為係出於合理自衛且符合必要比例，則可能阻卻或減輕其責任；此涉及具體事實之進一步認定。"},
{"category": "intl", "sub": "外交特考三等", "year": "111", "question": "一、A 國與 B 國為領土相鄰之二個國家，多年來為了邊界之劃界問題爭吵不 休。A 國遂以「特別軍事行動」為名，出兵占領 B 國的一省，B 國亦展 開反擊。試以國際法原理原則詳述下列問題：\n\n(一) A 國以「特別軍事行動」之占領行為且已實質控制該地區並行使管轄 權，能否主張為領土取得？（15 分）\n\n(二) B 國對 A 國展開軍事反擊，並以「無差別地毯式轟炸」屬於 A 國領 土的沿海地帶與其島嶼，能否主張此為國際法上的「自衛」（Self- defense）行動？（15 分）", "answer": "", "answerClaude": "一、特別軍事行動占領行為與無差別轟炸之國際法分析\n\n（一）「特別軍事行動」是否構成領土取得\n\n依現行國際法，武力征服（conquest）已非合法之領土取得方式。《聯合國憲章》第2條第4項禁止使用武力侵害他國領土完整；而「不承認主義」（史汀生主義，Stimson Doctrine）及「不法行為不產生權利」（ex injuria jus non oritur）原則，均否定以武力兼併他國領土之效力。縱使A國實質控制並行使管轄權，依聯合國大會第2625號決議（友好關係宣言）及國際法院晚近實踐（如對克里米亞、頓巴斯等地區併吞行為之國際普遍不承認），此類單方面武力占領及兼併，在國際法上不生領土主權移轉之效果，國際社會（包括聯合國大會）通常會透過不承認決議加以否定其法律效力。\n\n（二）B國「無差別地毯式轟炸」能否主張自衛權\n\n1. 自衛權之要件（憲章第51條）：須有「武力攻擊」（armed attack）之發生，自衛行為須符合必要性（necessity）與比例性（proportionality）兩大習慣法要件（Caroline原則）。\n2. B國固然因A國之侵略行為受武力攻擊，原則上享有自衛權，惟其行使方式──「無差別地毯式轟炸」（indiscriminate carpet bombing）──明顯違反國際人道法上之「區別原則」（principle of distinction，要求區分戰鬥人員與平民、軍事目標與民用目標）及「比例原則」（禁止對預期軍事利益顯不成比例之平民傷亡）。\n3. 因此，即便B國自衛權之發動具有正當性基礎，其execution方式若構成無差別攻擊，仍可能違反國際人道法（如1977年日內瓦公約第一附加議定書相關規範），且可能逾越自衛權必要性與比例性之界限，而使該自衛主張之正當性大打折扣，甚至該等轟炸行為本身可能獨立構成國際不法行為（如戰爭罪），不因整體自衛權主張而當然阻卻違法。"},
{"category": "intl", "sub": "外交特考三等", "year": "111", "question": "二、A 國與 B 國原簽訂有自由貿易協定，不僅已向 WTO 通報，且經由 A、 B 兩國之國內批准程序，並完成換文。歷經多年後，A、B 兩國因衝突而 斷交，試分析上開自由貿易協定是否仍有效？（20 分）", "answer": "", "answerClaude": "二、A、B兩國斷交後自由貿易協定之效力\n\n（一）條約效力與國家承認、外交關係之區辨\n依《維也納條約法公約》，條約之效力繫諸締約國之國家同意及條約本身之規定，與兩國是否維持外交關係原則上屬不同層次之問題。斷絕外交關係（斷交）並非法定之條約終止或停止履行事由，公約第63條明文規定：「除條約之適用有賴外交或領事關係之存在外，兩國斷絕外交或領事關係，並不影響兩國間現行條約所確定之法律關係。」\n\n（二）本案分析\n1. A、B兩國之自由貿易協定，其性質為經貿性質之條約，其履行原則上不需仰賴外交或領事關係之存續（即非「有賴外交關係存在」之條約類型，此類條約多為使領館運作、外交特權相關之條約），故依第63條，斷交本身並不當然導致該協定失效或終止。\n2. 該協定已完成國內批准程序並經換文生效，屬合法有效成立之條約，其效力應持續至依條約本身規定或依公約所定之終止、停止或退出事由（如第54條合意終止、第56條退出、第60條重大違約、第62條情勢變遷等）發生為止。\n3据此，除非協定本身訂有因斷交而自動終止之條款，或雙方另行合意終止，或存在其他法定終止事由，否則A、B斷交本身尚不足以使該自由貿易協定當然失效，該協定原則上仍應繼續有效，兩國仍受其拘束。\n4. 惟若協定之履行實質上需仰賴雙方使領館之運作（例如原產地證明之簽發、貿易爭端之外交協商機制等特定履行方式），則此部分履行機制可能因斷交而實務上受阻，但此屬「履行障礙」問題，與條約「效力」本身仍應加以區辨。"},
{"category": "intl", "sub": "外交特考三等", "year": "110", "question": "一、A 國和 B 國是《維也納外交關係公約》締約國，X 是 A 國駐 B 國大使。 2021 年 7 月，X 超速開車撞死一名 B 國十六歲男孩，由於 X 有外交官 身分，所以可以豁免 B 國的刑事訴訟；而 A 國目前則無意要召回 X，以便在自己的法院對其提起訴訟。同時，B 國打算派 Y 擔任駐 A 國大使。 請依據《維也納外交關係公約》，檢附理由詳細回答下列問題：\n\n(一)在上述情形下，X 大使是否可以自己拋棄豁免？（5 分）\n\n(二) B 國考慮通知 A 國，X 大使為「不受歡迎人員」（persona non grata， 或譯為「不受歡迎的人」），請提供有關「不受歡迎人員」的規定供 B 國外交部參考。（15 分）\n\n(三) A 國可以拒絕 Y 擔任 B 國駐 A 國大使，並且不給予理由嗎？（5 分）", "answer": "", "answerClaude": "一、維也納外交關係公約相關問題\n\n（一）X大使可否自行拋棄豁免\n依《維也納外交關係公約》第32條第1項，外交特權與豁免係屬「派遣國」之權利，而非外交人員個人之權利，故拋棄豁免之權利專屬於派遣國（A國），須由A國明示拋棄，外交官本人無權自行拋棄其管轄豁免。此一設計係為確保外交關係之穩定與外交人員執行職務之獨立性，避免外交人員個人任意拋棄豁免而使接受國藉此干預外交事務。\n\n（二）「不受歡迎人員」（persona non grata）之相關規定\n依公約第9條，接受國得於任何時候，不必說明理由，通知派遣國宣告其使館任何人員為不受歡迎人員（persona non grata）或使館任何其他職員為不能接受（not acceptable）。經此宣告後，派遣國應於合理期間內召回該人員或終止其於使館之職務；倘派遣國拒絕或不在合理期間內履行此項義務，接受國得拒絕承認該人員為使館人員（即拒絕繼續承認其外交身分及相應特權豁免）。此一制度賦予接受國單方面之裁量權，作為對外交人員行為不當（如本案之刑事犯罪行為）之制衡機制，惟B國於行使該權利前，通常仍應循外交慣例先向A國提出交涉或抗議。\n\n（三）A國可否拒絕Y擔任駐A國大使，且不給予理由\n依公約第4條，派遣國應查明擬派遣為駐該國使館館長之人選，已獲得接受國之同意（agrément）。接受國無須說明拒絕同意之理由（第4條第2項）。故A國得逕行拒絕Y擔任B國駐A國大使之人選，且依公約明文規定，無須向B國說明拒絕之理由，此屬接受國基於國家主權所享有之裁量權。"},
{"category": "intl", "sub": "外交特考三等", "year": "110", "question": "二、請依據《聯合國憲章》回答下列問題：\n\n(一)關於新會員入會案，聯合國大會和安理會的投票方式有何不同？（10 分）\n\n(二)《聯合國憲章》第 2 條規定了那些聯合國及其會員國應遵行的原則？ （15 分）", "answer": "", "answerClaude": "二、聯合國憲章相關問題\n\n（一）新會員入會案：大會與安理會投票方式之差異\n依《聯合國憲章》第4條，新會員入會須經大會依安理會之推薦決定之。\n1. 安理會層次：依憲章第27條第3項，關於非程序事項（包括推薦新會員入會，屬實質事項）之決議，應以9個理事國之可決票包括全體常任理事國之同意票表決之，即任一常任理事國均得行使否決權（veto）阻止推薦案通過。\n2. 大會層次：依憲章第18條第2項，關於接納新會員國之決議屬「重要問題」（important questions），應以出席並參加表決之會員國三分之二多數決定之，並無否決權之設計。\n因此，新會員入會案之關�卡實際上在於安理會層次（任一常任理事國均可否決推薦案），一旦安理會完成推薦，大會之三分之二多數決通常較容易達成。\n\n（二）憲章第2條所規定之原則\n《聯合國憲章》第2條規定聯合國及其會員國應遵行之原則，主要包括：\n1. 主權平等原則（第1項）：各會員國主權平等。\n2. 履行憲章義務原則（第2項）：善意履行憲章所負之義務。\n3. 和平解決爭端原則（第3項）：以和平方法解決國際爭端，不危及國際和平、安全及正義。\n4. 禁止使用武力原則（第4項）：各會員國不得使用威脅或武力，侵害任何國家之領土完整或政治獨立，或以與聯合國宗旨不符之任何其他方式為之。\n5. 協助聯合國並不得協助被制裁國原則（第5項）：對聯合國依憲章採取之行動盡力予以協助，對被聯合國採取防止或執行行動之國家不得予以協助。\n6. 確保非會員國遵行原則（第6項）：聯合國在維持國際和平及安全之必要範圍內，應確保非會員國遵行上述原則。\n7. 不干涉內政原則（第7項）：聯合國不得干涉在本質上屬於任何國家國內管轄之事件，但此不妨礙依憲章第七章採取執行辦法。"},
{"category": "intl", "sub": "外交特考三等", "year": "109", "question": "一、在 1982 年《聯合國海洋法公約》的條文規範下，創設了那些新的國際組 織？（25 分）", "answer": "", "answerClaude": "一、1982年《聯合國海洋法公約》創設之新國際組織\n\n《聯合國海洋法公約》為落實其各項制度之運作，創設或授權設立以下新的國際組織及機構：\n\n（一）國際海底管理局（International Seabed Authority, ISA）\n依公約第156條設立，為締約國組織，代表全人類對「區域」（國家管轄範圍以外之海床洋底及底土）內之資源進行管理，負責核發探勘及開發許可、監督相關活動並確保海洋環境受到保護。\n\n（二）國際海洋法法庭（International Tribunal for the Law of the Sea, ITLOS）\n依公約第287條及附件六設立，總部設於德國漢堡，為締約國間因公約解釋或適用所生爭端提供司法解決之專門法庭，具有強制管轄權之選項地位（締約國得選擇接受其管轄）。\n\n（三）大陸礁層界限委員會（Commission on the Limits of the Continental Shelf, CLCS）\n依公約第76條及附件二設立，負責就沿海國主張200浬以外大陸礁層外部界限之科學及技術資料提出建議，其建議為沿海國劃定最終及具拘束力大陸礁層外部界限之基礎。\n\n（四）仲裁法庭及特別仲裁法庭（附件七、附件八）\n公約另設仲裁及特別仲裁（就漁業、海洋環境保護、海洋科學研究、航行等特定技術性事項）之爭端解決機制，締約國得選擇以仲裁方式解決爭端。\n\n上述機構共同構成公約所建立之完整海洋治理及爭端解決體系，使公約不僅為實體規範性文件，亦具備制度性、程序性之執行機制。"},
{"category": "intl", "sub": "外交特考三等", "year": "109", "question": "二、請析論構成條約中止（suspension）或停止（termination）的原因，並舉 例說明。（25 分）", "answer": "", "answerClaude": "二、條約中止或停止之原因\n\n依1969年《維也納條約法公約》第五編第三節，條約之終止（termination）與停止施行（suspension）主要原因如下：\n\n（一）依條約規定終止或退出（第54條、第56條）\n條約明定終止日期、期限屆滿，或依條約條款允許締約國退出者。\n\n（二）當事國合意終止或停止（第54條、第57條）\n全體當事國於諮商其他締約國後，隨時得經全體同意終止或停止條約之施行。\n\n（三）嗣後條約之締結（第59條）\n全體當事國就同一事項另訂新條約，且有意以新約代替舊約，或新舊約不能同時適用者，舊約視為終止或停止施行。\n\n（四）重大違約（material breach，第60條）\n一當事國嚴重違反雙邊條約時，他當事國得援引違約作為終止或停止施行之理由；多邊條約情形下，其他當事國得一致同意在其相互關係上或對違約國停止施行該條約。\n\n（五）履行不能（supervening impossibility of performance，第61條）\n條約履行所不可缺少之標的物永久消滅或毀壞，致無法履行條約時，當事國得援引作為終止或退出之理由；惟若履行不能係因該當事國違反條約義務或其他國際義務所致，則不得援引。\n\n（六）情勢重大變遷（fundamental change of circumstances，第62條）\n條約締結時存在之情況發生基本改變，且該情況之存在構成當事國同意受條約拘束之必要基礎，該改變並使尚待履行之義務範圍發生根本變化者，得作為終止或退出之理由，惟此原則適用受嚴格限制（不適用於邊界條約，亦不得由自己違反國際義務所致之情勢變遷而援引）。\n\n（七）新強行法規範之產生（jus cogens，第64條）\n條約於締結後與新產生之一般國際法強制規律（強行法）牴觸者，該條約即成為無效並終止。\n\n（八）斷絕外交或領事關係（第63條，原則上不影響條約效力，僅於條約履行有賴外交關係存在時方生影響，已如前述）。\n\n上述各項原因均須依公約第65條至第68條所定之通知及爭端解決程序辦理，不得由當事國片面、任意主張終止或停止條約之施行。"},
{"category": "intl", "sub": "外交特考三等", "year": "108", "question": "一、假設 A 國與 B 國對於某個位於二國間的 C 島嶼經常發生爭執，雙方都 主張對該島嶼擁有主權。C 島嶼上已經有 A、B 兩國之部分居民於島嶼 上定居，且 A、B 兩國均為聯合國會員亦皆為國際法院規約之當事國。 以下請試從國際法上對於國家領土的理論加以分析：\n\n⑴ A 國主張應將 C 島嶼的主權問題提交國際法院（ICJ）來做裁判，試 從國際法院的管轄規範分析本案是否或於何種情況下可以成立？（10 分）\n\n⑵ A 國於提起訴訟時，對於 C 島嶼主權的歸屬乃主張該島嶼係「先占」 （occupation），試問以此主張的法律前提與要件為何？（10 分）\n\n⑶ B 國否定 A 國的主張，並提出對於 C 島嶼之主權取得乃基於「時效」 （prescription），試問以此主張的法律前提與要件為何？（5 分）", "answer": "", "answerClaude": "一、C島嶼主權爭議之國際法分析\n\n（一）國際法院管轄權之成立\n依《國際法院規約》第36條，國際法院之管轄權以當事國同意為基礎，可能之管轄依據包括：（1）雙方另行合意將本案提交國際法院之特別協定（compromis）；（2）雙方均為規約第36條第2項「任擇條款」（optional clause）之聲明國，且聲明內容涵蓋本類爭端；（3）雙方所締結之條約中訂有將爭端提交國際法院之管轄條款。A、B兩國均為聯合國會員及規約當事國，惟此僅代表兩國「得」利用國際法院，尚不當然構成「管轄權」之基礎，仍須具備上述至少一項管轄權連結因素，法院始得受理並為實體裁判；若欠缺上述基礎，A國片面提出訴訟，B國得提出先決反對（preliminary objection）主張法院無管轄權。\n\n（二）「先占」（occupation）主張之法律要件\n依國際法上先占之傳統法理（如帕爾馬斯島仲裁案Palmas Case所揭示），主張先占取得領土主權須具備：（1）標的須為無主地（terra nullius），即非屬其他國家主權範圍之土地；（2）須有國家有效占有之意思（animus occupandi）；（3）須有和平、持續且有效之國家權力行使（effective and continuous display of state authority），包括行政管理、立法、司法管轄等主權行為之實際展現，單純之發現（discovery）並不足以完成領土取得，僅生「不成熟權利」（inchoate title），須輔以其後之有效占領方能完足。惟本案C島已有A、B兩國部分居民定居，其是否仍屬「無主地」已有疑義，若非無主地，先占主張即無從成立。\n\n（三）「時效」（prescription）主張之法律要件\n時效取得領土主權，係指一國對原屬他國（或主權歸屬不明）之領土，經長期、持續、和平且公開行使主權權力，且未遭受他國有效抗議，因而依國際法取得該地主權之制度。其要件包括：（1）占有須公開、和平（非以武力或脅迫取得）；（2）須經相當期間持續行使主權（國際法未設固定期限，須綜合考量個案情況）；（3）他國（原主權國或競爭主張國）須未提出有效之外交抗議，若持續且及時提出抗議，則不生時效取得之效果。B國若主張時效取得，須舉證其確已長期、和平、公開對C島行使主權，且A國並未對此提出有效抗議，惟本案A、B雙方顯然一直存在主權爭執，恐難認定符合時效制度所要求之「未受抗議」要件。"},
{"category": "intl", "sub": "外交特考三等", "year": "108", "question": "二、在近年方興未艾的國際貿易糾紛中，國際經濟組織在國際法上的角色、 定位、功能等皆被世人重新檢視。在第二次世界大戰後，逐步建立起的 「布列頓森林體系」（Bretton Woods System），也遇到了前所未有的挑 戰。試從各國際組織之基本規範回答以下國際經濟組織的發展問題：\n\n⑴國際貨幣基金（IMF）、國際復興開發銀行（World Bank）、世界貿易 組織（WTO）三者在原始會員及新加入會員的資格規定上分別為何？ （15 分）\n\n⑵國際貨幣基金（IMF）、國際復興開發銀行（World Bank）、世界貿易 組織（WTO）三者在會員的決策模式上有何不同？（10 分）", "answer": "", "answerClaude": "二、國際經濟組織之會員資格與決策模式\n\n（一）原始會員與新加入會員資格\n1. 國際貨幣基金（IMF）：原始會員為參加1944年布列頓森林會議且於成立時簽署基金協定之國家；其後欲加入者，須經理事會（Board of Governors）決議通過，並依其經濟規模分配認股額（quota），繳納相應之份額始完成入會。\n2. 世界銀行（World Bank）：依其協定，入會資格原則上以已為IMF會員國為前提（IBRD協定第2條），此為兩機構會籍之聯動設計；新加入須經理事會核准並認繳股本。\n3. 世界貿易組織（WTO）：原始會員為WTO設立協定生效時已為GATT締約方且接受烏拉圭回合協定一攬子承諾之國家或個別關稅領域；新加入會員須經「入會工作小組」就其貿易體制進行審查，與現有會員完成雙邊及多邊市場開放談判，最終經WTO部長會議或總理事會以三分之二多數同意（實踐上多以共識決通過）始得加入，此程序遠較IMF、世銀複雜且耗時。\n\n（二）決策模式之差異\n1. IMF與World Bank：採加權投票制（weighted voting），會員國之投票權依其認股額（份額）多寡而定，經濟規模愈大之國家（如美國）享有愈高之投票權重，重大事項（如份額調整、協定修正）須經特定高門檻（如85%）多數決通過，使主要出資國（尤其美國）事實上享有否決權。\n2. WTO：原則上採「一國一票」（one member, one vote）之主權平等投票制，且實務上高度依賴「共識決」（consensus）而非正式投票，僅於共識決無法達成時始訴諸多數表決（依事項性質分別需簡單多數、三分之二或四分之三多數），此與IMF、World Bank之加權投票制形成鮮明對比，反映WTO作為貿易規則制定機構強調會員國主權平等之制度設計理念。"},
{"category": "intl", "sub": "外交特考三等", "year": "107", "question": "一、學習國際法不能忽視國際性司法機構的判決或是意見，它們對於國際法 的發展非常重要。例如 1951 年 5 月 28 日國際法院對於「防止及懲治殘 害人群罪公約保留的諮詢意見」（Advisory Opinion on Reservations to the Convention on the Prevention and Punishment of the Crime of Genocide）和 1927 年常設國際法院對法國控土耳其的蓮花號案（The S.S. Lotus Case），就是著名的例子。請回答下列問題：\n\n(一)關於條約保留的規定,防止懲治殘害人群罪公約保留的諮詢條件,推翻以往的見解，請說明以往的見解為何。（5 分）\n\n(二)關於公海上發生碰撞時,法律上應負責之人的管轄問題,常設國際法院蓮花號案的判決結果，和 1982 年聯合國海洋法公約規定不同，請 說明差異性。（5 分）\n\n(三)由蓮花號案的判決與其後國際法的發展可知,國際法院的判決,要在何種條件下，才能修訂既有規則或是創立新的規則？（5 分）\n\n(四)由於司法條例很重要,所以是國際法的淵源之一.請依據國際法院規約第 38 條，說明聯合國國際法院在適用自己的司法判例時，必須注 意的相關規範。（10 分）", "answer": "", "answerClaude": "一、國際法院判決先例相關問題\n\n（一）殘害人群罪公約保留諮詢意見所推翻之以往見解\n在1951年諮詢意見之前，國際法傳統見解（源自國際聯盟時期之實踐）認為，多邊條約之保留須經全體締約國一致同意始生效力（即所謂「完整性原則」integrity doctrine），任一締約國反對即足以排除保留國成為締約國，以維護多邊條約內容之統一性與完整性。國際法院於該號諮詢意見中推翻此一見解，改採「相容性標準」（compatibility test）：只要保留與條約之目的及宗旨相容（compatible with the object and purpose of the treaty），保留國即可能被視為締約國，此一見解嗣後為1969年《維也納條約法公約》第19條至第23條所採納並成文化，成為現行國際條約法上保留制度之基本原則。\n\n（二）碰撞管轄之差異：蓮花號案與海洋法公約\n常設國際法院於蓮花號案（1927）判決，就公海上發生船舶碰撞致生刑事責任問題，土耳其對碰撞影響及於其船舶（波茲考特號）之法國籍船員行使刑事管轄權並無不法，蓋國際法未明文禁止，土耳其得依「效果原則」對其領域內發生影響之行為主張管轄（「凡國際法未明文禁止者即為許可」之立場）。惟1982年《聯合國海洋法公約》第97條則明確規定，公海碰撞或其他航行事故所生之刑事或紀律責任，僅得向船旗國或該人員所屬國之司法或行政機關提起，非船旗國不得下令扣留船舶。此規定實質推翻蓮花號案之結論，改採船旗國專屬管轄原則，以避免各國競相對外國船員主張刑事管轄所生之法律不確定性與外交摩擦。\n\n（三）判決得修訂既有規則或創立新規則之條件\n國際法院之判決依規約第59條僅對當事國、就本案有拘束力（無先例拘束原則，即非普通法系之stare decisis），惟實務上，國際法院之判決常因其論理之權威性、反覆被引用及嗣後之國家實踐追認，逐漸形成或確認習慣國際法規則，甚至促成條約明文化既有判例見解（如前述保留制度）或反向修正判例所生規則（如碰撞管轄原則）。此種「規則變遷」通常須具備：（1）該判決之論理獲得廣泛國家實踐與法律確信之支持；（2）嗣後國家實踐與判決見解一致或以條約形式加以確認或推翻；（3）新規則之形成須符合習慣國際法「一般實踐」（general practice）及「法之確信」（opinio juris）之形成要件。\n\n（四）國際法院規約第38條與司法判例之適用\n依《國際法院規約》第38條第1項第4款，司法判例（judicial decisions）與各國權威公法學家學說，均僅屬「決定法律原則之補助資料」（subsidiary means for the determination of rules of law），而非獨立之法律淵源；此意味國際法院適用自己或其他國際法庭之判例時，須注意其僅具輔助性、參考性地位，終究仍須回歸條約、國際習慣及一般法律原則（第38條第1項第1至3款）作為實質法律淵源依據，不得逕以先前判例本身作為裁判之直接法律依據。"},
{"category": "intl", "sub": "外交特考三等", "year": "107", "question": "二、聯合國會員國 N 國是禁止核子武器擴散條約的會員國，而且被認為是非 核國。但是近年來該國秘密研發，生產並擁有核武。最近，N 國總統 K 一再表示鄰國應當歸還過去歷史上屬於 N 國的領土，他不但進行飛彈試 射威脅 J 國，不久又派部隊入侵占領盛產石油的 J 國島嶼 L 島，並且指 示殺害戰俘。K 總統還表示，依據國際法院的諮詢意見，N 國在必要時 有權使用核子武器。一個月前，N 國扶植 L 島上部分人民宣布獨立，建 立 L 國。面對這種情勢，聯合國安全理事會（下稱安理會）緊急開會， 決定因應之道。\n\n(一)請問依據國際法院在 1996 年的「核子武器使用和威脅的合法性諮詢 意見」的結論，N 國在何種特殊條件下，是可能可以合法使用核子 武器？（5 分）\n\n(二)安理會通過決議，要求所有會員國依據「南羅德西亞」 （South Rhodesia） 等先例，不承認 L 國，請說明安理會要求會員國「不承認」的意涵與 法律理由？（5 分）\n\n(三)聯合國法律顧問建議制裁 K，請問對於違反國際法的個人，國際法上 有何制裁方式？（5 分）\n\n(四)聯合國法律顧問建議安理會依據憲章第七章制裁違反條約和 N 國入 侵 L 島的行為。請問法律顧問建議是否有理？憲章第 7 章的相關規定 為何？（10 分）", "answer": "", "answerClaude": "二、核武使用、不承認原則及國際制裁相關問題\n\n（一）核子武器使用與威脅之合法性諮詢意見（1996）\n國際法院於1996年諮詢意見中認為，核子武器之使用或威脅使用一般而言違反武裝衝突法及國際人道法之相關原則與規則（尤其區別原則及比例原則），惟法院就「在國家生存面臨危急存亡之極端自衛情況下（an extreme circumstance of self-defence, in which the very survival of a State would be at stake），核子武器之使用或威脅使用是否合法」一節，表示無法確切斷定（could not conclude definitively），亦即法院並未完全排除在此種極端自衛情形下核武使用可能合法之可能性，此為該諮詢意見最受矚目且最具爭議之部分。\n\n（二）不承認原則（南羅德西亞先例）之意涵與法律理由\n聯合國安理會曾就南羅德西亞白人少數政權於1965年單方宣布獨立（UDI）一事，通過決議要求會員國不予承認，其法理基礎在於：（1）該政權之成立違反聯合國憲章所揭示之人民自決原則及禁止種族歧視原則；（2）依「不承認主義」（史汀生主義之延伸），對於違反國際法基本原則（尤其違反禁止使用武力、自決權等強行法性質規範）所產生之既成事實，國際社會不應賦予法律承認，以避免鼓勵或縱容此類違法行為；（3）此種集體不承認義務具有「對世義務」（erga omnes）之性質，任何國家均負有不承認之義務，不因其與該政權有無直接利害關係而異。本案中安理會要求各國不承認L國，其意涵即在於否定該以武力兼併及片面扶植獨立所生之既成事實在國際法上之正當性，防止既成事實轉化為受國際法承認之合法地位。\n\n（三）對個人之國際法制裁方式\n對於違反國際法之個人（如國家元首、軍事將領等），現行國際法上之制裁及究責方式包括：（1）國際刑事法院（ICC）或特設國際刑事法庭（如前南斯拉夫法庭、盧安達法庭）之刑事追訴，就滅絕種族罪、危害人類罪、戰爭罪及侵略罪行使管轄；（2）普遍管轄原則下，任何國家依其國內法對上述國際罪行行使域外刑事管轄；（3）標的性制裁（targeted/smart sanctions），如聯合國安理會或個別國家對特定個人實施旅行禁令、資產凍結等措施；（4）國內法院之民事求償或引渡程序等。\n\n（五）安理會依憲章第七章制裁之相關規定\n《聯合國憲章》第七章（第39條至第51條）規定安理會對於「和平之威脅、和平之破壞及侵略行為」之因應辦法：第39條由安理會認定上述情事之存在並提出建議或決定應採措施；第40條得先行採取臨時辦法；第41條得決定採取武力以外之辦法（如經濟制裁、外交關係斷絕、通訊及交通中斷等）；第42條若第41條辦法不足或已被證明不足時，得採取必要之空、海、陸軍行動。就N國入侵L島及違反條約義務之情事，若安理會認定已構成「和平之破壞」或「侵略行為」，依上開規定，安理會確有法律依據可決議採取第41條之非武力制裁措施，甚至於必要時援引第42條授權採取武力行動，惟第42條之發動須以第41條辦法不足為前提，且須經安理會決議（受五常任理事國一致決之限制，任一常任理事國均得否決相關決議）。"},
{"category": "intl", "sub": "外交特考三等", "year": "106", "question": "一、A 國與 B 國間有一無人小島 X，因欠缺淡水，亦無法農耕，只有少數野生羊群。自 1900 年來，A、B 兩國均主張 X 島為其領土，互不相讓。然因島小，兩國都沒有駐 軍占領或派人管理。1930 年間，A 國在 X 島岸邊建立燈塔及簡易碼頭，以利該國 漁民作業、休息。從此每年派人員登島維修燈塔及碼頭設施。B 國漁民及海巡人員 曾因颱風進入 X 島港口避難，並得到 A 國救援。1990 年初，A、B 兩國漁民在 X 島附近海域因捕魚發生嚴重衝突。B 國遂於同年 3 月派海軍控制 X 島及附近水域， 宣稱該國在 1880 年即已發現 X 島，1882 年公布之官方地圖已經將 X 島列為 B 國 領土。目前在 X 島附近海域捕魚者雖有九成為 A 國漁民，但 B 國漁民早於 1890 年間就開始在 X 島附近海域捕魚，比 A 國漁民還早了 30 年。B 國同時公布 X 島之 領海基線，並主張 200 浬專屬經濟海域，同時派遣海軍強力驅逐在 X 島 200 浬內 捕魚之 A 國漁船。由於 B 國海軍實力遠強於 A 國，A 國無力也無意進行武力對抗， 而擬透過談判或法律途徑解決爭議。如果你是 A 國外交部人員，請從國際法立場， 針對⑴X 島之領土主權、⑵X 島之海域疆界、及⑶X 島海域之捕魚權等問題，提出 有利於 A 國之主張及理由。（30 分）", "answer": "", "answerClaude": "一、X島領土主權、海域疆界與捕魚權主張\n\n（一）X島領土主權主張\n\n作為A國外交部人員，可主張：\n1. 先占與有效管領：A國自1930年起即在X島建立燈塔、簡易碼頭，並每年派員維修，展現持續、和平之國家權力行使（display of state authority），構成有效占領（effective occupation）之重要證據，符合帕爾馬斯島仲裁案所揭示「和平、持續行使國家權力」之先占要件。\n2. 實效控制（effectivités）：依國際法院實踐（如白礁案Pedra Branca），國家對爭議領土之行政、立法、司法等主權行為之實際展現（即使規模較小），較之單純之發現或歷史性主張更具證明力；A國之燈塔維護及對B國漁民之救助行為，均屬有利於A國之實效控制證據。\n3. 對B國1880年發現及1882年地圖主張之反駁：單純之發現至多僅生「不成熟權利」（inchoate title），須輔以嗣後之有效占領方能完足取得領土主權；B國若僅止於發現及地圖公布，而未能證明其有持續、有效之國家權力行使，其主張基礎將較A國薄弱。\n4. 就B國於1990年方以海軍控制X島一事，A國可主張B國此舉本身即係遲至數十年後始首次展現實效控制，難以推翻A國自1930年代起已長期建立之實效控制基礎；且B國此一片面軍事控制行為，本身亦可能構成對A國既有領土主權（或至少對等主權主張）之武力侵害。\n\n（二）X島海域疆界主張\nA國可主張，於雙方主權爭議未決前，依UNCLOS第74條、第83條及國家實踐，雙方應本諒解合作精神，尋求達成臨時性實際安排，B國不應片面公布領海基線並主張200浬專屬經濟海域，此種片面行為有違「不得片面採取行動危害最終劃界協議達成」之國際法義務。\n\n（三）X島海域捕魚權主張\nA國可主張：1. 現有九成漁民為A國籍，顯示A國漁民對該海域已形成長期、實質之利用利益，依國際法上「既得利益」及公平原則，於最終劃界或共同管理安排達成前，應維持現狀，保障A國漁民既有之捕魚活動；2. B國以武力驅逐A國漁船之片面執法行為，逾越其主權主張本身尚未確定之現狀，構成不當之片面行動，A國得要求B國停止此類片面驅離行為，並提議透過談判或國際司法／仲裁途徑（如依附件七提付仲裁）解決海域疆界及漁業權爭議。"},
{"category": "intl", "sub": "外交特考三等", "year": "106", "question": "二、甲國與其鄰國乙國夙來不睦，1990 年乙國發生軍事政變後成立之新政府，其政治 意識形態與甲國差異更大。乙國舊政府殘餘勢力盤據乙國與另一鄰國丙國間之山 區，進行游擊戰，且不時越界侵擾丙國人民，掠奪丙國資源。乙國新政府則繼續以 武力鎮壓游擊隊，雙方砲火不時波及丙國境內，造成丙國人民傷亡及財物損失。此 外，亦有大量乙國人民為逃難而越界進入丙國，要求庇護，致丙國不堪負擔。甲國 因敵視乙國新政府之意識形態，因此以乙國新政府實施軍事統治、大規模迫害舊政 府人士為由，宣布對乙國斷交，並以空軍轟炸丙國邊界附近的乙國軍隊，進而要求 乙國軍隊不得進入離丙國邊界 20 公里內的乙國領土，以保護乙國難民及丙國權 益。乙國向國際法院起訴，主張甲國上述行為違反國際法，並要求甲國賠償。甲國 則抗辯：⑴甲國與丙國間訂有共同防禦條約，甲國係基於條約義務，採取集體自衛 手段，以保護丙國不受攻擊。⑵乙國政府對該國人民之迫害及其內戰傷亡，情節嚴 重，甲國動武係出於「人道干預」（humanitarian intervention），應屬合法。請問 甲國之上述抗辯，能否成立？（20 分）", "answer": "", "answerClaude": "二、甲國空軍轟炸乙國軍隊及丙國境內衝突之國際法分析\n\n（一）甲國轟炸乙國軍隊之合法性\n1. 甲國以空軍轟炸位於丙國境內之乙國軍隊，此行為地點在丙國領土內，涉及對丙國主權之侵害問題，除非取得丙國同意，否則甲國此舉本身即可能違反《聯合國憲章》第2條第4項禁止使用武力原則，侵害丙國之領土完整。\n2. 甲國主張基於與丙國之共同防禁約而採取集體自衛，惟集體自衛之發動依憲章第51條及國際法院尼加拉瓜案之見解，須符合：（1）確有「武力攻擊」（armed attack）之發生（乙國舊政府殘餘勢力對丙國之越界侵擾行為是否已達「武力攻擊」之嚴重程度，尚待具體事實認定，一般性之越界騷擾或資源掠奪，未必達到武力攻擊之門檻）；（2）受攻擊國（丙國）須明確表示遭受攻擊並請求協助；（3）自衛行為須符合必要性與比例性。若乙國舊政府殘餘勢力之行為尚未達到「武力攻擊」之嚴重程度，甲國逕以空軍轟炸方式介入，其比例性及必要性均有可議之處。\n\n（二）「人道干預」主張之評估\n1. 傳統國際法及憲章體制下，「人道干預」（humanitarian intervention）並未獲得普遍承認為合法使用武力之依據，蓋此將牴觸憲章第2條第4項禁止使用武力及第2條第7項不干涉內政原則之明文規定。\n2. 雖然近年「保護的責任」（Responsibility to Protect, R2P）之新興理念逐漸受到重視，惟其正式適用仍高度依賴聯合國安理會依憲章第七章之授權（如利比亞案之安理會第1973號決議），若未經安理會授權，甲國逕自以「人道干預」為由對乙國採取單方面武力行動，難謂已獲得現行國際法之普遍承認為合法。\n3. 綜上，甲國前述兩項抗辯──集體自衛及人道干預──均存在相當程度之法律瑕疵，能否成立尚須視具體事實（尤其乙國舊政府殘餘勢力行為之嚴重程度、丙國請求協助之明確性及甲國轟炸行為之必要性與比例性）而定，惟就人道干預部分，在欠缺安理會授權之情形下，其合法性基礎相對薄弱。"},
{"category": "intl", "sub": "外交特考三等", "year": "105", "question": "一、條約發生錯誤是否得撤銷，大多數的國際法學家和 1969 年條約法公約第 48 條的見解都相當 一致。而國際法院有關錯誤的著名案例是國際法院 1961 年對高棉（柬埔寨）控泰國的「隆 端古寺案」（又譯「柏威夏寺案」，Case Concerning the Temple of Preah Vihear, Preliminary Objection）。在該案中，泰國與高棉（柬埔寨）邊境有一座隆端古寺，雙方爭執該地主權。 泰國先後提出了兩個錯誤問題。首先，泰國主張在 1929 年 9 月 20 日宣告接受常設國際法院 的強制管轄，為期十年；但在 1940 年 5 月 3 日它又更新這個宣言，為期仍為十年，即到 1950 年為止。到 1950 年 5 月 3 日它再度更新這個宣言十年。高棉（柬埔寨）在 1957 年 9 月 9 日 接受國際法院的強制管轄後，將它與泰國邊境寺廟爭執案，提交國際法院。泰國對此提出管 轄權的先決反對異議，認為它是基於錯誤的認識而於 1950 年更新宣言，因此不會發生接受 強制管轄的效果。其次，1962 年 6 月 15 日國際法院對隆端古寺案實質部分的判決中，泰國 又提出劃界方面的錯誤。在原訂的條約中，當事國同意在特定區域內，以某一個分水線為界， 但後來泰國發現，其所接受一份地圖上劃定的疆界與事實不符，泰國認為是一項錯誤。 請回答下列問題：⑴在「隆端古寺案」（Case Concerning the Temple of Preah Vihear, Preliminary Objection） 中，國際法院針對泰國先後提出的兩個錯誤問題，見解為何？請說明之。（15 分）⑵1969 年條約法公約第 48 條針對錯誤的規定為何？請說明之。（10 分）", "answer": "", "answerClaude": "一、隆端古寺案錯誤主張與條約法公約第48條\n\n（一）國際法院對泰國兩項錯誤主張之見解\n\n1. 就管轄權先決反對部分：國際法院認為，泰國於1950年更新接受強制管轄之宣言時，縱使泰國內部就是否更新宣言存有若干認識上之瑕疵，惟此並不構成得以推翻其宣言效力之「錯誤」，蓋泰國之更新宣言行為本身係其自主決定之結果，且泰國嗣後之行為（包括其後之外交實踐）並未及時對此表示異議，法院因此駁回泰國此部分之管轄權異議，認定其宣言仍屬有效，法院對此案具有管轄權。\n\n2. 就劃界地圖之實體部分：國際法院認為，即使附件地圖之繪製與條約所定分水嶺線確有技術上之出入，惟泰國於地圖送達後之相當期間內，透過其官方之接受、使用及默示行為（包括未及時提出異議、後續官員之正式訪問及接待儀式等），已構成對該地圖所定邊界之默示接受（acquiescence）及禁反言（estoppel），泰國不得於數十年後始翻異其詞、主張錯誤而否認地圖之拘束力，故法院最終認定隆端古寺主權歸屬柬埔寨。\n\n（二）1969年條約法公約第48條關於錯誤之規定\n\n依第48條：\n1. 第1項：一國得援引其同意受條約拘束時所犯之錯誤，作為使其同意無效之理由，惟該錯誤須關於該國於締約時假定為存在，且構成其同意受條約拘束必要基礎之事實或情況。\n2. 第2項：如該國以其本身行為導致該錯誤，或依當時情況該國本應注意及該錯誤之可能性者，不適用第1項規定，即不得主張錯誤。\n3. 第3項：僅與條約約文用語有關之錯誤，不影響條約之效力，此時應適用第79條（更正條約約文或正式副本內錯誤之程序）。\n\n上開規定與隆端古寺案所建立之法理高度契合：法院認為泰國本應注意（或至少有合理機會發現）地圖與分水嶺不符之情事，卻長期未予異議，此正對應第48條第2項「本應注意錯誤可能性」而排除錯誤主張之要件，顯示該案判決先於公約而實質確立之法理，嗣後為公約明文化並予以體系化。"},
{"category": "intl", "sub": "外交特考三等", "year": "105", "question": "二、國際公法範圍廣博，有些觀念需要加以區分澄清，以免混淆，請說明理由回答下列問題：⑴1979 年伊朗將美國外交領事人員拘禁為人質，違反美伊二國均參加的 1963 年的《維也 納領事關係公約》（Vienna Convention on Consular Relations）和 1961 年的《維也納外 交關係公約》（Vienna Convention on Diplomatic Relations），因此，美國總統卡特在 1979 年 11 月 14 日發布行政命令第 12170 號，將伊朗在美國財產全部凍結不得運用或 移出美國，請問這是國際法雙邊關係上的「報復」（retorsion）？還是「報仇」（reprisal）？ 請詳細說明理由。（7 分）⑵1810 年法國對英國宣布封鎖令，原告所有的船在當時為法國拿捕沒收後，被改裝為法 國軍艦，且將其重新命名。該船後因故而到美國港口，原告因而要求歸還船隻，但是 美國最高法院卻駁回原告之訴。請問美國最高法院的理由是基於「國家豁免」？還是 「國家行為主義」？請詳細說明理由。（6 分）⑶1991 至 1992 年間，蘇維埃社會主義共和國聯邦（the Union of Soviet Socialist Republics， 英文簡稱 USSR，中文簡稱蘇聯）解體，分裂為十五個國家，請問這是國家繼承中的全 部繼承（universal succession）？還是部分繼承（partial succession）？請詳細說明理由。 （6 分）⑷1982 年聯合國海洋法公約第 136 條及第 137 條規定國家管轄範圍以外海床區域。請問 國家管轄範圍以外海床區域是「公有物」（res communis）？還是「人類的共同繼承財 產」（common heritage of mankind）？請詳細說明理由。（6 分）", "answer": "", "answerClaude": "二、國際公法基本觀念之區分\n\n（一）報復（retorsion）或報仇（reprisal）\n美國凍結伊朗在美財產之行為，性質上應屬「報仇」（reprisal），而非單純之「報復」（retorsion）。報復係指以本身合法但不友好之行為（unfriendly but lawful act）回應他國之不友好或違法行為（如召回大使、中止外交關係、限制貿易優惠等，本身不違反國際法）；而報仇則係指以本身原屬違反國際法之行為（如凍結他國財產，本可能違反外交財產不可侵犯之相關國際法義務），作為對他國先前違法行為之對應措施，藉由「反致行為之不法性因對方先行違法而被阻卻」之法理，正當化己方原屬違法之行為。伊朗扣押人質、侵犯美國使領館不可侵犯性之行為已構成國際不法行為在先，美國凍結伊朗財產之行為原則上亦具有干涉他國財產之違法外觀，惟因係對伊朗先行違法行為之對應措施，故屬「報仇」性質，而非單純之「報復」。\n\n（二）國家豁免或國家行為主義\n美國最高法院駁回原告之訴，其理由應係基於「國家行為主義」（Act of State Doctrine），而非「國家豁免」（State Immunity）。國家行為主義係美國國內法上之司法自制原則，指法院對於外國政府在其本國領域內依其主權所為之行為（如沒收、國有化等），原則上不予審查其合法性，而逕予尊重承認其效力，此原則之基礎在於避免法院對外國主權行為妄加評斷，干預行政部門之外交裁量權限；而國家豁免原則則係處理外國政府「作為被告」時，法院對其有無管轄權之問題（管轄豁免、執行豁免）。本案原告並非以法國政府為被告請求賠償，而係就法國政府先前沒收、改裝船舶之行為效力本身提起訴訟請求返還船舶，法院係基於尊重外國主權行為之既成效果（不審查其合法性）而駁回，此核心爭點在於「行為效力之承認與否」，而非「管轄權之有無」，故應歸類為國家行為主義之適用，而非國家豁免。\n\n（三）國家繼承之全部繼承或部分繼承\n蘇聯解體分裂為十五個獨立國家，應屬「部分繼承」（partial succession，或稱「分離型繼承」dismemberment/separation之一種特殊型態，亦有學說稱為「多重延續」問題）。惟須注意，蘇聯解體之特殊實踐為：俄羅斯被國際社會普遍承認為蘇聯之「延續國」（continuing state），承接蘇聯之國際法人格、聯合國安理會常任理事國席位及大部分條約義務與國際債務，其餘十四個新獨立國家則被視為「新獨立國家」，僅就特定領域（如部分條約）發生繼承問題。此種安排並非典型「全部繼承」（如國家完全消滅、由單一繼承國概括承受，如兩德統一之西德延續模式的相反情形），亦非單純之「部分繼承」（如僅割讓部分領土），而係一種混合型態，惟主流見解仍傾向將俄羅斯定位為「延續國」，其餘國家則屬「新獨立國家」之繼承型態，而非全部由十五國平均分擔之全部繼承。\n\n（四）「區域」資源之公有物或人類共同繼承財產\n依UNCLOS第136條，明文規定「區域」及其資源為「人類共同繼承財產」（common heritage of mankind），而非傳統國際法上之「公有物」（res communis，如公海、公海生物資源，任何國家均得自由使用、先占先贏）。兩者關鍵差異在於：公有物任何國家均得自由開發利用，不生財產歸屬或利益分享問題；而人類共同繼承財產則強調：（1）任何國家不得主張主權或據為己有（第137條）；（2）資源之開發利用須透過國際海底管理局統一管理，並使全人類（尤其開發中國家）公平分享開發利益（第140條）；（3）強調為和平目的保留予全人類。此一制度設計明顯有別於公海資源傳統上「先占先贏」之公有物邏輯，而更強調國際共管與利益共享。"},
{"category": "intl", "sub": "外交特考三等", "year": "104", "question": "一、國際法與國際禮讓有何不同？試說明之。（25 分）", "answer": "", "answerClaude": "一、國際法與國際禮讓之區別\n\n（一）國際法（International Law）\n國際法係規範國家（及其他國際法主體，如國際組織）相互間權利義務關係之法律規範體系，其淵源依《國際法院規約》第38條包括：國際條約、國際習慣（一般實踐加上法之確信opinio juris）、文明國家所承認之一般法律原則，以及司法判例、學說等輔助資料。國際法具有法律拘束力（legally binding），違反國際法將產生國家責任，他國得依國際法上之救濟機制（外交保護、國際求償、對抗措施、司法或仲裁程序等）加以究責。\n\n（二）國際禮讓（Comity）\n國際禮讓（comity of nations）係指國家間基於禮貌、便利、互惠期待或善意，而非基於法律義務，所給予他國之尊重或優遇，例如外國判決之承認與執行、外國法律之適用、外交豁免範圍之從寬解釋等，在若干國內法（尤其英美法系）實踐上常訴諸「國際禮讓」作為法院自我節制或給予外國優遇之依據。\n\n（三）兩者之區別\n1. 拘束力來源不同：國際法之拘束力源於國家同意（條約）或普遍法律確信（習慣法），具有法律上之強制性；國際禮讓則純屬禮貌性、慣行性之互惠期待，並無法律上之強制拘束力，一國得隨時基於己身利益考量而不予遵循，不生違反國際法之責任問題。\n2. 違反後果不同：違反國際法將構成國際不法行為，產生國家責任；未依循國際禮讓，至多招致外交上之不快或關係惡化，不生法律責任問題。\n3. 性質定位不同：國際法屬於「法律規範」（law），國際禮讓則屬於「禮貌與便利之實踐」（practice of courtesy and convenience），兩者雖有時外觀相似（如皆涉及國家間之互動與尊重），惟性質截然不同，不應混淆。例如，外交豁免制度本身係國際法（如維也納外交關係公約）之明文規範，具法律拘束力；但若干國家對外國元首、政府高層來訪給予超出條約規定範圍之額外禮遇，則屬國際禮讓範疇，而非法律義務。"},
{"category": "intl", "sub": "外交特考三等", "year": "104", "question": "二、何謂國際人道法？國際人道法包含許多國際公約；這些公約可分為兩個系統，即 「海牙法系統」及「日內瓦法系統」。試就兩者規範之重點予以分析，又此二法系 統何時開始合而為一？（25 分）", "answer": "", "answerClaude": "二、國際人道法：海牙法系統與日內瓦法系統\n\n（一）國際人道法之意涵\n國際人道法（International Humanitarian Law, IHL），又稱武裝衝突法（Law of Armed Conflict）或戰爭法（Law of War），係規範武裝衝突期間交戰雙方行為之國際法規範體系，其目的在於限制戰爭方法及手段、保護未參與或不再參與敵對行動之人員（如平民、傷病者、戰俘），並於軍事必要性（military necessity）與人道考量（humanity）間求取平衡。\n\n（二）海牙法系統（Hague Law）\n海牙法系統源於1899年及1907年海牙和平會議所通過之一系列公約（尤其1907年海牙第四公約及其附件陸戰法規），其規範重點在於「作戰方法及手段之限制」（means and methods of warfare），包括交戰者資格之認定、禁止使用特定武器（如毒氣、爆炸性子彈等）、占領法規（占領國於被占領土之權利義務）等，核心關注點為「如何作戰」（jus in bello之作戰行為規範面向）。\n\n（三）日內瓦法系統（Geneva Law）\n日內瓦法系統源於1864年首部日內瓦公約，歷經多次修訂，現行體系以1949年四部日內瓦公約（分別保護：陸戰傷病者、海戰傷病者及船難者、戰俘、平民）及1977年兩項附加議定書（分別適用於國際性及非國際性武裝衝突）為核心，其規範重點在於「戰爭受難者之保護」（protection of victims of war），核心關注點為「如何保護不再參與或未參與戰鬥之人員」。\n\n（四）兩系統之合流\n海牙法系統著重限制作戰手段，日內瓦法系統著重保護戰爭受難者，兩者原各自發展，惟隨著武裝衝突型態演變及國際人道法之整合需求，1977年《日內瓦公約第一附加議定書》（適用於國際性武裝衝突）首度將海牙法系統之作戰方法手段限制規範（如禁止不分皂白之攻擊、比例原則、預防措施等）與日內瓦法系統之受難者保護規範整合於同一法律文件之中，實質上標誌著海牙法系統與日內瓦法系統自此開始合而為一，形成現行國際人道法兼顧「作戰行為規範」與「受難者保護」之統一體系，此一整合過程持續透過國際刑事法院羅馬規約等晚近文件進一步深化與體系化。"},
{"category": "intl", "sub": "外交特考三等", "year": "103", "question": "一、請附理由回答下列問題：\n\n(一)海岸相向或是相鄰國家間，如何進行領海和大陸架（大陸礁層）的劃界？請說明 1982 年 聯合國海洋法公約的規定。（8 分）(二)請參考「里約宣言」，說明「善鄰原則」和「永續發展」兩觀念。（8 分）(三)請依據聯合國憲章第 4 條第 2 項與聯大 396 號決議，說明新會員加入聯合國的程序及 規定，和一個以上的當局（authority）主張會員國代表權問題時的解決方式。（9 分）", "answer": "", "answerClaude": "一、海岸劃界、里約宣言與聯合國代表權問題\n\n（一）海岸相向或相鄰國家間領海及大陸礁層之劃界\n依UNCLOS第15條，海岸相向或相鄰國家間領海之劃界，除另有協議外，任一國均無權將其領海伸延至一條其每一點與兩國基線最近點距離相等之「中間線」（等距離線）以外，惟如因歷史性所有權或其他特殊情況，有必要按照與此不同之方法劃定兩國領海界限者，不適用此一規定（等距離／特殊情況原則）。就大陸礁層劃界，依第83條，海岸相向或相鄰國家間大陸礁層之界限，應在《國際法院規約》第38條所指之國際法基礎上，以協議劃定，以求得公平解決（equitable solution），並非強制適用等距離線，而係綜合考量海岸地形、比例性等因素，透過協議或國際爭端解決機制達成公平劃界結果。\n\n（二）里約宣言之「善鄰原則」與「永續發展」\n1. 善鄰原則（good neighbourliness）：源於1992年里約環境與發展宣言原則2，即國家於其管轄或控制範圍內之活動，不得對其他國家之環境或其國家管轄範圍以外之地區造成損害，此原則要求國家行使主權時須顧及鄰國及國際社會之環境利益，不得以鄰為壑。\n2. 永續發展（sustainable development）：指兼顧當代發展需求與後代子孫發展權益之發展模式，強調環境保護、經濟發展與社會公平三者之整合與平衡，里約宣言多項原則（如原則3、原則4）均體現此一核心理念，要求發展權之行使應公平滿足當代與後代在發展與環境方面之需要。\n\n（三）新會員加入聯合國之程序及代表權爭議之解決\n1. 依憲章第4條第2項，新會員入會由大會經安理會推薦後以決議行之（詳如前述，安理會非程序事項適用五常任理事國一致決，大會則以三分之二多數決定）。\n2. 聯大第396號決議（1950年，關於中國代表權問題）確立：當一個以上之當局（authority）就代表同一會員國在聯合國之席位發生爭執時，此一問題應依聯合國憲章之宗旨及原則，並參照各項事件之情況，由大會加以考量，若發生於大會開會期間，應由大會處理；若發生於大會閉會期間，則由臨時委員會或下屆大會處理之，藉此建立代表權爭議之處理機制及原則性指引，惟其實際適用仍高度受政治因素影響（如1971年中國代表權變更即為著例）。"},
{"category": "intl", "sub": "外交特考三等", "year": "103", "question": "二、A 國於 1990 年在 B 國發行政府公債美金一億元，預定於 2010 年歸還本金與利息，但是 到期未歸還，債券持有人甲等在 B 國法院提起訴訟，要求 A 國償還債務。訴訟期間，A 國大使館一直拒絕派員出庭，B 國法院在 2013 年判決 A 國應賠償所有債券持有人本金 利息合計美金一億四千萬元。A 國大使館發表聲明，強烈抗議，認為 B 國法院判決違反 了國際法上有關管轄豁免的規範。2014 年 1 月，AB 兩國駐荷蘭大使簽署協議，將本案 送海牙國際法院解決：(一)A 國聘僱的律師出現兩種主張，一派以為 B 國是違反「維也納外交關係公約」所規 範的「外交豁免」，另一派認為 B 國是違反國際習慣法所確立的「國家豁免」，請 附理由分別說明「外交豁免」和「國家豁免」二種主張，並回答本案應該是屬於「外 交豁免」還是「國家豁免」的適用範圍？確定適用範圍後，也請同樣附理由說明 B 國是否違反了國際法上有關管轄豁免的規範？（13 分）(二)A 國國會議員主張，不論國際法院判決結果如何，A 國應將 B 國在 A 國財產凍結， 禁止移轉，並說此一行為是一合法的報仇行為（reprisal），請附理由說明 A 國國會 議員的主張是否合乎 reprisal 的定義？（6 分）(三)國際法院規約第 38 條規定法院裁判時應適用條約、國際習慣和一般法律原則，但是 A 國律師團對於「國際習慣」意義不太瞭解，請依照國際法院規約第 38 條解釋之。 （6 分）", "answer": "", "answerClaude": "二、國家豁免、報仇與國際習慣相關問題\n\n（一）外交豁免與國家豁免之區辨及本案適用\n1. 外交豁免（diplomatic immunity）：規範於《維也納外交關係公約》，其保護對象為「人」（外交使節及其人員），賦予外交人員本身之刑事、民事管轄豁免及使館館舍、檔案之不可侵犯性，目的在確保外交人員得獨立執行職務，不受接受國干預。\n2. 國家豁免（state immunity）：規範基礎主要為習慣國際法（部分國家另有國內立法，如美國《外國主權豁免法》），其保護對象為「國家本身」，指一國於他國法院享有不受該他國法院管轄（管轄豁免）及其財產不受扣押執行（執行豁免）之權利，現行普遍採「限制豁免論」（restrictive immunity），區分國家之「主權行為」（acta jure imperii，享有豁免）與「商業或私法行為」（acta jure gestionis，不享有豁免）。\n3. 本案適用：A國發行政府公債之行為，性質上屬於國家從事之商業融資行為（借貸行為），依限制豁免論之通說及國家實踐，發行公債、舉借外債等行為多被認定屬「商業行為」性質，不屬於主權行為，故本案應屬「國家豁免」（而非外交豁免，因本案被告為A國本身，非特定外交人員）之適用範圍，且依限制豁免論，A國就此商業性質之發債行為，原則上不得主張管轄豁免，B國法院對此類商業性質之訴訟行使管轄權，並未違反國際法上有關管轄豁免之規範。\n\n（二）「報仇」（reprisal）主張之當否\nA國國會議員主張凍結B國財產作為合法報仇行為，惟依國際法，報仇之發動須符合：（1）須有他國先行違反國際法之行為存在；（2）報仇措施須符合必要性及比例性；（3）現行國際法（尤其WTO及投資協定體制下）已大幅限縮傳統自助式報仇之空間，改以多邊爭端解決機制為優先。本案中，B國法院依限制豁免論行使管轄權並判決A國敗訴，此為國際法所肯認之合法管轄權行使，並非國際不法行為，A國尚難主張B國有何「先行違法行為」存在，故A國凍結B國財產之行為，欠缺報仇成立所須之「他國先行違法」前提要件，難謂符合reprisal之定義，其正當性基礎薄弱。\n\n（三）國際法院規約第38條「國際習慣」之意涵\n依《國際法院規約》第38條第1項第2款，國際習慣（international custom）作為「通例之證明而經接受為法律者」（evidence of a general practice accepted as law），其構成須具備兩項要件：（1）客觀要件「一般實踐」（general practice, state practice）：即國家反覆、一致且廣泛之實踐；（2）主觀要件「法之確信」（opinio juris sive necessitatis）：即國家從事該實踐時，係出於認為其受法律義務拘束（而非僅出於禮讓、政策考量或巧合）之信念。兩要件須同時具備，方能認定該實踐已昇華為具拘束力之國際習慣法規則。"},
{"category": "intl", "sub": "外交特考三等", "year": "102", "question": "一、甲國近年軍方干政問題十分嚴重，2013 年 7 月間，該國最高軍事委員會主席宣布解除 現任總統職務，雙方支持者乃於首都發生嚴重武裝衝突。乙國記者 B 無視甲國政府 對外國人之警告，於甲國首都進行密集採訪，因過度接近衝突區域而遭槍殺身亡， 事後證明 B 係遭甲國政變軍人所誤殺。B 之家人於政變弭平後，欲對甲國政府提起 訴訟請求賠償，試依據聯合國「國際法委員會」（International Law Commission） 2001 年所通過之「有關國際不當行為之國家責任條文草案」（Draft Articles on Responsibility of States for Internationally Wrongful Acts），說明甲國政府是否應當負 責？又設若甲國軍方政變成功並取得政權，則結論有無不同？（25 分）", "answer": "", "answerClaude": "一、政變情勢下之國家責任分析\n\n（一）ILC國家責任條文草案之基本架構\n依2001年國際法委員會（ILC）通過之《國家對國際不法行為之責任條文草案》，國家責任之成立須具備：（1）行為可歸責於國家（attribution）；（2）該行為構成違反國際義務（breach of an international obligation）。就可歸責性，草案第4條規定國家機關（含政府軍隊）之行為可歸責於國家；第7條規定即使國家機關逾越權限或違反指示（ultra vires），其行為仍可歸責於國家，只要該機關係以此身分行事。\n\n（二）政變軍人誤殺記者之責任歸屬\n本案乙國記者B遭甲國政變軍人誤殺，若該軍人於行為時仍屬甲國正式政府軍之編制人員，依草案第4條及第7條，即使其行為出於誤判（誤殺）且逾越合法之武力使用限度，仍應歸責於甲國，蓋國家對其武裝部隊人員之行為原則上負有國家責任，不因該行為出於過失、誤判或違反上級指示而免責，惟仍須符合國際人道法上武力使用之必要性及比例性標準加以審視是否構成不法。\n\n（三）若政變成功並取得政權：草案第10條之特殊規則\n依草案第10條，若一叛亂運動（insurrectional movement）之行為其後成為一國新政府，則該運動先前之行為應視為該國之行為，溯及既往地歸責於國家。準此，若甲國軍方政變成功並取得政權，則政變軍人（即叛亂運動成員）於政變過程中所為之行為（包括誤殺記者B之行為），依第10條規定，仍將被視為甲國之國家行為而生國家責任，此一規則之設計目的在於避免透過政權更迭之外觀而規避先前不法行為所生之國家責任，確保國家責任不因政府更迭而中斷（此與「國家繼續原則」之法理相呼應）。準此，無論政變是否成功，就B之死亡，甲國原則上均應負國家責任，僅在責任成立之法律路徑（第4/7條之現職國家機關責任，或第10條之嗣後追溯責任）有所不同而已。"},
{"category": "intl", "sub": "外交特考三等", "year": "102", "question": "二、甲國人民 A 於乙國境內架設電腦網站，對丙國人民從事詐騙行為，而遭乙、丙兩國 通緝，並潛逃至我國。甲、乙、丙三國司法機關得知後，雖與我國無引渡條約，均 向我國提出引渡要求。試問甲、乙、丙三國依國際法相關規定是否對 A 均有管轄權？ 又我國依法應如何處理該等引渡問題？（25 分）", "answer": "", "answerClaude": "二、詐騙案之國際管轄權與引渡問題\n\n（一）甲、乙、丙三國管轄權之依據\n1. 甲國：依屬人原則（active personality principle），A為甲國國民，甲國得基於國籍管轄權對其在境外之行為主張刑事管轄。\n2. 乙國：依屬地原則（territoriality），A架設電腦網站之行為地（伺服器所在地或行為實施地）在乙國境內，乙國得依主觀屬地原則主張管轄。\n3. 丙國：依消極屬人原則（passive personality principle）或效果原則（effects doctrine），丙國人民為詐騙行為之被害人，且詐騙結果（財產損害）發生於丙國境內或對丙國人民產生實質影響，丙國得依被害人國籍或犯罪結果發生地主張管轄。\n綜上，甲、乙、丙三國依國際法上不同之管轄權基礎（屬人、屬地、消極屬人／效果原則），均對A之行為具有管轄權基礎，此為典型之管轄權競合（concurrent jurisdiction）情形，國際法原則上並不禁止此種管轄權重疊之現象，僅須各國於執行管轄權時尊重他國之主權及屬地管轄之優先性。\n\n（二）我國之處理方式\n1. 引渡條約之欠缺：依國際法及我國《引渡法》，引渡原則上以締有引渡條約為前提，惟《引渡法》第1條但書及國際實踐上亦承認得依「互惠原則」（reciprocity）於個案基礎上進行引渡合作，故欠缺引渡條約並非當然阻卻引渡之可能性，僅程序上須另行協商互惠安排。\n2. 政治犯不引渡及本國國民不引渡原則：若甲、乙、丙提出引渡請求之罪名屬普通刑事犯罪（詐欺），並非政治性犯罪，原則上不生政治犯不引渡之問題；惟若A具我國國籍，則可能涉及本國國民不引渡原則（如採此原則之國家，改以我國自行追訴之方式處理，即「或引渡或起訴」originally aut dedere aut judicare之精神）。\n3. 綜合處理原則：我國得依《引渡法》相關規定，審酌雙重犯罪原則（該行為依我國法及請求國法均構成犯罪）、罪刑相當原則、有無政治性質、我國與各請求國之外交關係及互惠可能性等因素，並得優先考量：（1）若A行為地、被害人國籍等連結因素與丙國關聯最為密切且丙國之請求證據完備，可優先考慮將A引渡予丙國；（2）若基於本國國民保護或欠缺互惠基礎等考量而不引渡任何一方，我國得依屬地原則或普遍性合作義務，自行對A涉犯之詐欺行為進行刑事追訴（前提是我國法律對此有域外管轄或至少行為結果與我國有一定關聯之管轄基礎），以避免A因管轄權競合及引渡障礙而完全逃避刑事究責。"},
{"category": "intl", "sub": "外交特考三等", "year": "101", "question": "一、甲國政府是一軍事極權政府，否認人民享有言論自由及集會自由。對此，乙國宣稱甲 國若不改變這種壓抑人民的政策，將與其斷絕所有的經濟關係。丙國也主張甲國倘若 不承認人民之基本人權，將立即召回駐在甲國之丙國軍事顧問團。 甲國則主張乙、丙兩國的行為是屬於對甲國的內政干涉行為。乙、丙兩國辯稱主張， 所謂干涉是指以軍事力強制某種特定政策實施之意，故乙、丙兩國之行為並非干涉； 即使是構成干涉行為，也是一種人道干涉，並非違法。 試問甲國與乙、丙二國雙方之主張是否正確？（25 分）", "answer": "", "answerClaude": "一、內政干涉之合法性分析\n\n（一）不干涉原則之內涵\n依《聯合國憲章》第2條第7項及1970年聯合國大會第2625號決議（友好關係宣言），不干涉原則禁止國家以任何形式（外交、經濟、軍事等）干預他國在本質上屬其國內管轄之事項，尤其明文禁止使用經濟、政治或其他措施脅迫他國，以求屈服其主權權利之行使或圖謀從中取得任何利益。\n\n（二）乙、丙兩國行為之定性\n1. 乙國宣稱將斷絕經濟關係：此屬「報復」（retorsion）性質之行為，即以本身合法之行為（斷絕自願性經濟往來，一國並無義務與他國維持經濟關係）表達對甲國人權狀況之不滿，此類經濟性反應措施原則上屬國家主權範圍內之外交裁量，並不當然構成國際法上禁止之「干涉」，蓋干涉之核心特徵在於「脅迫性」（coercion），而非單純消極地終止自願性合作關係。\n2. 丙國召回軍事顧問團之表示：性質上亦屬丙國對其自身資源（軍事顧問人員）之處分權，屬丙國主權範圍內之自主決定，同樣不構成脅迫性之干涉行為。\n\n（三）甲國主張之當否\n甲國主張乙、丙兩國行為構成內政干涉，惟依上述分析，乙、丙兩國之行為性質上屬報復而非脅迫性干涉，甲國之主張尚難成立。乙、丙兩國之抗辯（干涉須以軍事力強制特定政策實施）雖過於狹隘（現代國際法上干涉之範疇不以軍事脅迫為限，經濟脅迫達一定嚴重程度者亦可能構成干涉），惟其結論（本案行為並非干涉）尚屬可採，因其行為欠缺脅迫性要素。\n\n（四）人道干涉主張之補充評估\n乙、丙兩國進一步主張縱認定構成干涉，亦屬「人道干涉」而不違法，惟如前所述，現行國際法對於未經安理會授權之單方人道干涉，其合法性基礎仍屬薄弱，惟因本案乙丙兩國行為本身尚未達到「干涉」之門檻（欠缺脅迫性），故此部分抗辯於本案中僅具補充性、備位性質，尚無須進一步深究其合法性，惟仍應指出人道干涉於現行國際法上並非已獲普遍承認之合法例外。"},
{"category": "intl", "sub": "外交特考三等", "year": "101", "question": "二、A 國與 C 國發生武裝衝突，A 國全面禁止本國國民出國。A 國青年甲希望能前往 B 國 留學，遂逃離 A 國偷渡入境 B 國某大學就讀。求學期間甲在 B 國境內批判 A 國政府， 並加入由 A 國人組成之反政府組織積極進行反 A 國政府活動。就在此時，甲偷渡非 法入境之情事被 B 國發現，決定將甲強制遞解出境。甲主張：1.政治犯不引渡乃國際 習慣法。2.自己是政治犯。3.強制遞解出境違反「禁止驅逐、遣返原則」（principle of non-refoulement）。試問甲的 1、2、3 項主張是否合於現行國際法？（25 分）", "answer": "", "answerClaude": "二、政治犯不引渡、政治犯認定及禁止驅逐遣返原則\n\n（一）「政治犯不引渡」是否為國際習慣法\n政治犯不引渡原則（non-extradition of political offenders）廣泛見於各國引渡條約及國內引渡立法，惟其是否已昇華為具普遍拘束力之國際習慣法，學說上仍有爭議：多數見解認為，此原則主要係透過雙邊或多邊引渡條約及國內法予以落實之「條約及國內法原則」，而非獨立存在、不待條約即對所有國家生拘束力之國際習慣法規則，蓋此涉及國家於引渡合作上之高度裁量權限，各國實踐及例外規定（如排除暴力性政治犯罪、恐怖主義行為之「政治犯罪除外條款」）差異甚大，尚難認定已形成具普遍法之確信之一致實踐。故甲主張「政治犯不引渡乃國際習慣法」之論點，理論基礎尚有不足，較為精確之定性應為：政治犯不引渡係國際間普遍承認之引渡合作原則及實踐，惟其規範依據主要仍繫諸具體引渡條約或內國法之規定，而非獨立自足之強制性國際習慣法規則。\n\n（二）甲是否為「政治犯」\n政治犯之認定通常採「政治性行為理論」，須審酌：（1）行為人主觀上是否基於政治目的或政治信念而為；（2）行為與政治目的間是否具有相當關聯性（政治行為理論political offence doctrine之「附隨關係」incidence test）；（3）多數國家實踐排除暴力性、恐怖主義性質之行為列入政治犯罪範疇（政治犯罪除外條款）。甲僅係批判A國政府並加入反政府組織進行政治性活動，未涉及暴力手段，較符合政治犯之認定要件，惟仍須視B國國內法及相關引渡實踐之具體標準而定，不能一概而論。\n\n（三）禁止驅逐、遣返原則（non-refoulement）\n禁止驅逐遣返原則規範於1951年《難民地位公約》第33條及晚近國際人權法（如禁止酷刑公約第3條、公民與政治權利公約第6、7條所衍生之保護），禁止締約國將難民或面臨迫害風險之人員驅逐或送返至其生命或自由因種族、宗教、國籍、特定社會團體成員身分或政治意見而可能受威脅之領域。惟此原則之適用前提通常以當事人已具備「難民」身分（或至少face出真實風險）為要件，若甲僅屬非法入境之政治異議人士，尚未經難民地位認定程序確認其符合難民要件，B國逕行主張其強制遞解出境並未違反該原則，仍待viewed個案中甲是否確實面臨遭受迫害之真實風險，以及B國有無提供難民地位認定之正當程序而定；若甲確實可證明其返回A國將面臨政治迫害之真實風險，則不論其是否已正式取得難民身分，依國際人權法之發展（如人權事務委員會相關見解），仍可能對B國產生不遣返之義務。"},
{"category": "intl", "sub": "外交特考三等", "year": "100", "question": "一、請比較分析北極、南極、深海床、領海、太空之國際法地位。（25 分）", "answer": "", "answerClaude": "一、北極、南極、深海床、領海、太空之國際法地位比較\n\n（一）北極\n北極並無如南極條約般之統一國際法律體制，其海域部分適用UNCLOS一般規範（沿岸國得主張領海、專屬經濟區及大陸礁層，尤其涉及200浬以外大陸礁層外部界限之科學認定爭議，如俄羅斯、加拿大、丹麥就羅蒙諾索夫海嶺之主張），陸地及冰封區域則分屬俄、美（阿拉斯加）、加、挪、丹麥（格陵蘭）等環北極國家之主權範圍，國際合作主要透過「北極理事會」（Arctic Council）等軟性論壇進行協調，並無如南極條約凍結主權主張之強制性法律安排。\n\n（二）南極\n依1959年《南極條約》，凍結所有既存領土主張，禁止提出新主張，南極僅供和平及科學研究之用，非任何國家之領土，另有《南極條約環境保護議定書》禁止礦產資源商業開發，形成獨特之「非領土化、非軍事化」國際共管體制。\n\n（三）深海床（「區域」）\n依UNCLOS第136、137條，國家管轄範圍以外之深海床（the Area）及其資源，屬「人類共同繼承財產」，任何國家不得主張主權或據為己有，由國際海底管理局統一管理其資源探勘與開發，並確保開發利益公平分配予全人類（尤其開發中國家）。\n\n（四）領海\n依UNCLOS第2條，沿海國主權及於其領海（自基線起最寬12浬），並及於領海上覆空域及海床底土，惟外國船舶享有無害通過權（第17條至第26條）之限制，故領海雖屬沿海國主權範圍，惟其主權之行使受無害通過制度之限制，非如陸地領土般享有完全排他之支配。\n\n（五）外太空\n依1967年《外太空條約》，外太空、月球及其他天體不得由任何國家以主權主張、使用、占領或其他方式據為己有，供全人類探索及利用，各國應為和平目的從事太空活動，並對其太空活動負國際責任（第6條、第7條）。\n\n（六）小結比較\n上述五者之國際法地位可依「主權可主張程度」形成一光譜：陸地領海（沿海國完全主權，僅受通行權限制）→北極（部分陸地屬國家主權，海域依一般海洋法規範，無統一凍結機制）→南極（凍結既存主張，非任何國家領土）→深海床及外太空（明文禁止主權主張，均定性為全人類共同利益或共同繼承財產，惟深海床著重資源共管共享，外太空則著重和平探索利用及國家責任）。"},
{"category": "intl", "sub": "外交特考三等", "year": "100", "question": "二、我國於 1967 年 10 月簽署「公民與政治權利國際公約」及「經濟社會文化權利國際 公約」，於 2009 年 3 月批准這兩個公約，我國並於 2009 年 6 月透過友邦將批准書 遞交聯合國秘書長存放，但是聯合國秘書長沒有接受。立法院亦於 2009 年 3 月通 過「公民與政治權利國際公約及經濟社會文化權利國際公約施行法」。我國於 2007 年 1 月通過加入「消除對婦女一切形式歧視公約」，2007 年 3 月委由友邦代交加入 書給聯合國秘書處，但是聯合國秘書長沒有接受。立法院於 2011 年 5 月通過「消 除對婦女一切形式歧視公約施行法」。 請問：（25 分）⑴為何我國可以在 1967 年簽署「公民與政治權利國際公約」及「經濟社會文化權 利國際公約」，但是卻直到 2009 年才批准這兩個公約？⑵為何我國可以加入「消除對婦女一切形式歧視公約」？⑶「公民與政治權利國際公約」、「經濟社會文化權利國際公約」、「消除對婦女 一切形式歧視公約」有沒有國內法律效力？法律位階為何？⑷那些國家機關受到「公民與政治權利國際公約」、「經濟社會文化權利國際公約」、 「消除對婦女一切形式歧視公約」之拘束？", "answer": "", "answerClaude": "二、公民與政治權利國際公約等人權公約之締結、國內法效力問題\n\n（一）為何1967年得簽署，2009年始批准\n條約之簽署（signature）與批准（ratification）係條約締結程序上不同階段之行為：簽署原則上僅表示簽署國對條約內容初步認可，並使該國負有依《維也納條約法公約》第18條不得違反條約目的及宗旨之義務，惟尚不生完全受條約拘束之效果；批准則為國家依其國內憲政程序（如立法院審議通過），正式表示同意受條約拘束之最終確認行為。我國於1967年簽署該等公約後，因國內政治情勢（如退出聯合國後之國際處境變化）及立法院審議程序延宕等因素，遲至2009年始完成立法院審議並由總統批准，此為國內憲政程序及政治考量所致，簽署與批准間本得有相當時間落差，此為條約締結程序之常態設計，並非法律障礙所致。\n\n（二）為何得加入「消除對婦女一切形式歧視公約」\n「加入」（accession）係指一國未曾簽署條約，而於條約已對其他國家生效後，直接以加入方式表示同意受條約拘束之程序，通常適用於未及參與條約談判及簽署階段之國家。我國雖非聯合國會員國，惟依國際法及該公約性質，一國之加入原則上不以聯合國會籍為前提要件（除非公約本身明文限制僅聯合國會員國或特定機構會員國得加入），故我國依國內憲政程序（行政院提案、立法院審議通過）完成加入之國內程序後，即得以加入方式表示同意受该公約拘束，僅因欠缺國際承認，我國之加入書未能為聯合國秘書長（作為公約保管機關）所「接受」（存放），此涉及國際承認及普遍參與資格之政治現實問題，而非我國締約能力本身之法律障礙。\n\n（三）國內法律效力及位階\n依司法院大法官解釋（如釋字第329號）及晚近實踐，條約經立法院審議通過並經總統公布者，其位階通常被理解為與法律相當（部分學說主張條約優於一般法律，惟未有明確憲法位階之定論）。就本案三公約而言，立法院已分別通過《公民與政治權利國際公約及經濟社會文化權利國際公約施行法》及《消除對婦女一切形式歧視公約施行法》，此類「施行法」模式係我國特有之因應機制（因公約保管機關拒絕接受我國批准書／加入書，我國透過國內立法方式將公約內容內國法化，賦予其國內法效力），依施行法明文規定，該等公約之規定具有國內法律之效力，其位階應與一般法律相當（施行法本身即為法律位階）。\n\n（四）拘束之國家機關\n依上開施行法規定（如兩公約施行法第3條、第4條），各級政府機關（包括行政、立法、司法機關）行使職權，應符合公約有關人權保障之規定，避免侵害人權，並應積極促進各項人權之實現；同時應提出人權報告接受國際審查（我國透過邀請國際獨立專家進行審查之替代機制）。故上開公約於國內法化後，拘束範圍及於中央與地方之所有政府機關（行政、立法、司法），要求渠等於行使職權時均應遵循公約所定之人權保障標準。"},
{"category": "intl", "sub": "外交特考三等", "year": "99", "question": "一、何謂條約之「批准」（ratification）與「加入」（accession）？又條約能否為第三國 創設權利？（25 分）", "answer": "", "answerClaude": "一、條約之「批准」與「加入」及第三國權利問題\n\n（一）批准（ratification）\n依《維也納條約法公約》第2條及第14條，批准係指國家於簽署條約後，經其國內完成憲政程序（如國會審議、元首核可）後，正式向其他締約國或條約保管機關表示同意受條約拘束之國際法行為。批准之作用在於使簽署階段僅具初步政治承諾性質之條約，轉化為對批准國具完全法律拘束力之義務，通常適用於重大條約，賦予國家於簽署後仍有一段時間得依其國內程序審慎考慮是否最終同意受拘束之機制。\n\n（二）加入（accession）\n依公約第2條及第15條，加入係指國家並未參與條約之談判及簽署階段，而於條約已對其他國家生效（或雖未生效但條約另有規定允許）後，直接以單一之加入行為表示同意受條約拘束，其法律效果與批准相當（均使該國成為條約當事國），僅程序上省略簽署階段，通常適用於条約締結後始決定加入之國家，或原非談判參與國之情形。\n\n（三）條約可否為第三國創設權利\n依公約第34條，條約非經第三國同意，不為該国creates義務或權利，此即「條約相對效力原則」（pacta tertiis nec nocent nec prosunt）之明文化，惟公約第36條設有例外規定：若條約當事國有意以條約之一項規定對第三國或其所屬之一組國家或所有國家給予一項權利，且第三國對此表示同意，該項規定即對第三國發生賦予權利之效力，此種同意於未經表示相反意思前應推定其存在（除非條約另有規定或另有表示）。故條約於符合上開要件（當事國有意授予、第三國同意，得為默示同意）之情形下，確實得為第三國創設權利，惟此仍以第三國之同意為前提，並非當事國得片面對第三國課予義務或賦予權利而不問其意願，充分體現條約效力以國家同意為基礎之基本法理。"},
{"category": "intl", "sub": "外交特考三等", "year": "99", "question": "二、在成文的國際法規範中，有關「不受歡迎人士」（persona non grata）之規定為何？ （25 分）", "answer": "", "answerClaude": "二、不受歡迎人士（persona non grata）之成文規範\n\n（一）規範依據：《維也納外交關係公約》第9條\n依公約第9條第1項，接受國得於任何時候，不必說明理由，通知派遣國宣告該國使館館長或任何其他外交職員為不受歡迎人員（persona non grata），或使館任何其他職員為不能接受（not acceptable）。經此宣告後，派遣國應視情形將該員召回，或終止其在使館之職務。若派遣國拒絕履行，或不在合理期間內履行此項義務，接受國得拒絕承認該員為使館人員（第9條第2項）。\n\n（二）制度特徵與意涵\n1. 接受國之片面裁量權：接受國得逕行宣告，無須說明理由，亦無須經任何國際或司法程序之審查，此係基於國家主權及接受國對其領域內外國人員活動之固有管制權限。\n2. 適用時點之彈性：依第9條明文「於任何時候」（at any time），此宣告權不僅適用於外交人員抵任前（此時類似拒絕同意，見第4條agrément機制），亦得於外交人員已在職執行職務期間隨時行使，賦予接受國高度彈性之因應工具。\n3. 法律效果：宣告本身不當然剝奪外交人員之外交身分或豁免（於其實際離境前，其人身及豁免仍應受尊重，此涉及公約其他保障規定），惟課予派遣國召回或終止其職務之義務；若派遣國逾期不履行，接受國得逕自不再承認其外交身分，實質上使該人員喪失於接受國繼續享有外交特權豁免之基礎。\n4. 適用對象不限使館館長：依條文文義，不僅使館館長（大使等），使館其他外交職員及一般職員（如行政技術人員）亦均得為宣告對象（僅用語上區分「不受歡迎人員」persona non grata適用於外交職員，「不能接受」not acceptable適用於其他職員，惟法律效果相當）。\n此一制度為外交關係實踐中最常見之外交手段之一，作為接受國在不需完全斷絕外交關係之前提下，對特定外交人員行為表達不滿或予以制衡之重要法律工具。"},
{"category": "intl", "sub": "外交特考三等", "year": "98", "question": "一、假設 A、B 兩國於 1850 年間發生戰爭，B 國戰敗，A 國佔領位於兩國間之 X 島， 並有效統治至今。但 B 國仍繼續對 X 島主張領土主權，不承認 A 國之領土主權。 二次大戰後，A、B 兩國先後加入聯合國成為會員國。1984 年間，B 國以「收復固 有領土、維護主權完整」為由，趁 A 國內亂之際突然出兵佔領 X 島。請問：依據 現行國際法規範，A 國可以採取那些合法途徑來解決這項爭端？（25 分）", "answer": "", "answerClaude": "一、X島爭端之合法解決途徑\n\n（一）爭端背景與國際法上之現狀\nA國自1850年戰爭後即已佔領並有效統治X島至今（逾百年之久），已構成相當程度之「有效占領」及「時效」取得之事實基礎；B國雖始終不承認A國主權，惟長期未能透過有效之武力或合法途徑收復，其後B國趁A國內亂之際突然出兵佔領X島，此一行為本身即構成使用武力片面改變領土現狀之違法行為，違反《聯合國憲章》第2條第4項禁止使用武力原則。\n\n（二）A國可採取之合法途徑\n\n1. 訴諸聯合國安理會（憲章第35條、第六章、第七章）：A國得將此爭端提交安理會，主張B國之出兵構成對國際和平與安全之威脅或破壞，甚至構成侵略行為，請求安理會依憲章第39條至第42條採取相應之因應措施（包括要求B國撤軍、經濟制裁乃至授權集體安全行動）。\n\n2. 提交國際法院（ICJ）：若B國亦為《國際法院規約》第36條任擇條款之聲明國，或雙方另行合意（特別協定）將爭端提交國際法院，A國得訴請國際法院確認其對X島之主權（基於長期有效占領及時效），並確認B國之武力兼併行為違反國際法、不生領土主權移轉之效力，請求判命B國撤軍並回復原狀。\n\n3. 主張「不承認原則」並尋求國際社會集體不承認：援引史汀生主義及聯合國大會友好關係宣言之相關法理，主張B國以武力兼併所生之既成事實，國際社會不應予以承認，並得於聯合國大會尋求通過不承認決議，強化國際壓力。\n\n4. 尋求區域性或多邊爭端解決機制：如雙方均為特定區域組織成員，亦得利用該組織之爭端解決機制（調解、仲裁等和平解決手段）。\n\n5. 自衛權之保留：依憲章第51條，若B國之武力占領構成持續之武力攻擊狀態，A國固保有行使自衛權、以武力收復失土之權利，惟此非A國之優先或唯一選項，現行國際法秩序更鼓勵並要求優先透過上述和平解決途徑（憲章第2條第3項、第33條）處理爭端，避免武力衝突升級。\n\n綜上，A國應優先運用聯合國安理會及國際法院等制度性、和平性之爭端解決機制，並輔以不承認原則之外交操作，作為其收復X島主權之合法途徑，而非逕以武力對抗方式解決爭端。"},
{"category": "intl", "sub": "外交特考三等", "year": "98", "question": "二、依 1969 年維也納條約法公約（Vienna Convention on the Law of Treaties）之規定， 條約絕對無效的事由有那些？（25 分）", "answer": "", "answerClaude": "二、1969年維也納條約法公約下條約絕對無效之事由\n\n依公約規定，條約無效之事由可區分為「相對無效」（得由受害國選擇主張撤銷，如錯誤、詐欺、賄賂等，且此類瑕疵得因嗣後之明示同意或默示追認而治癒）與「絕對無效」（void ab initio，自始、當然、絕對無效，不因任何後續行為而治癒或補正）兩大類。屬於「絕對無效」之事由，依公約規定主要有以下三種：\n\n（一）強制締約代表（第51條）\n以強制行為對一國代表本人施加強制（coercion of a representative of a State），迫使其代表國家表示同意受條約拘束者，該項同意應無法律效果，屬絕對無效，此類強制係針對代表個人（如脅迫、人身威脅），而非針對國家整體。\n\n（二）以威脅或使用武力強制締約國（第52條）\n條約之締結違反《聯合國憲章》所含國際法原則，係以威脅或使用武力（threat or use of force）之方式而獲致者，該條約無效。此為現代國際法禁止使用武力原則於條約法領域之具體化，任何透過武力脅迫他國締結之條約，均自始絕對無效，此原則明確否定傳統國際法上「城下之盟」之效力。\n\n（三）與一般國際法強制規律（強行法，jus cogens）相牴觸（第53條）\n條約於締結時與一般國際法強制規律相牴觸者，無效。依第53條之定義，一般國際法強制規律係指國家之國際社會全體接受並公認為不許損抑，且僅有以後具有同等性質之一般國際法規律始得更改之規律（如禁止侵略、禁止種族滅絕、禁止奴隸制度、禁止酷刑等基本規範）。任何條約若其內容與此類強行法規範相牴觸（如約定共同侵略他國、販賣奴隸等），該條約自始絕對無效。\n\n上述三種絕對無效事由之共通特徵在於：其所保護之利益已超越個別締約國之私益，而涉及國際社會之根本公共秩序（如國家意思自主之核心保障、禁止使用武力之基本原則、國際強行法之根本價值），故其法律效果為自始、絕對、當然無效，不因當事國之嗣後同意、默示追認或時效經過而治癒，此與前述相對無效事由（如錯誤、詐欺）僅得由受害國選擇是否主張撤銷、且得因追認而補正之法律效果，形成鮮明對比。"}
];

{"category": "intl", "sub": "台大政治所", "year": "114", "question": "四、WTO的GATT 第21條之國家安全例外條款規定道「本協定各項規定不得用以禁止任何締約國, 採取下列為保護其重大安全利益(essential security interests)之必要措施:(一)關於具有原子分裂性之物質或製造該物質之原料;(二)關於販賣武器、彈藥或其他戰爭物質及關於販賣直接或間接供給軍用之其他物品;(三)在戰爭或其他國際關係緊張時期所採行之措施。」請問,當A國不定期在B國周邊領海以外之海域進行軍事演習,或是每日以軍機飛入B國的航空識別區時,B國能否以 「重大安全利益」為理由,對所有從A國進口之貨物採取高額關稅?(20%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "113", "question": "巴勒斯坦在加薩走廊實際統治的團體「哈瑪斯」,在2023年10月7日宣布展開新的行動,武裝分子史無前例地滲透到以色列南部,並且發射了數千枚火箭。以色列國防軍宣布戰備狀態,並且開始針對加薩走廊的目標展開報復性打擊。美聯社與BBC報導,行蹤飄忽不定的「哈瑪斯」軍事派別領導人戴夫(Mohammad Deif),宣布展開他口中的「阿克薩風暴行動」(Operation Al-Aqsa Storm),並指「哈瑪斯」已經朝以色列發射了5千多枚火箭, 同時呼籲巴勒斯坦民眾加入戰鬥。而流亡在外的哈瑪斯領導人阿魯里(Salah Arouri)說,此次行動是回應「占領者的罪行」。以色列軍方證實,以國南部鄰近加薩走廊邊境的數個地點發生了滲透行徑,命令居民留在家中, 同時宣布進入「戰備狀態」。以色列媒體報導,當日夜幕降臨時,至少已有300人死亡,1500多人受傷,加薩周圍20多個地點的戰鬥,仍在激烈進行。 在以色列一連串的報復行動中,根據巴勒斯坦衛生部門的報告指出,以色列軍隊曾經對加薩走廊中部的馬加齊難民營(al-Maghazi)發動空襲,結果導致70名巴勒斯坦人不幸在戰火中喪命。半島電視台也表示,馬加齊難民營是加薩走廊人口最為密集的地方,而且以色列軍方曾表示會將馬加齊難民營設為安全點,但如今馬加齊難民營卻因為以色列的空襲而被夷為平地。而距離馬加齊難民營最近的醫院是阿克薩(Al-Aqsa)醫院,但因為以色列軍隊密集的對加薩走廊進行攻擊,這也導致加薩走廊當地的衛生醫療機構已經無法正常運作。加薩走廊自 10月7日開戰以來,已經有超過2萬400名巴勒斯坦人喪命,同時有230萬名巴勒斯坦人流離失所,佔了原本加薩走廊的人口有80%之多。 請根據國際法相關規範,回答下列問題:\n\n一、巴勒斯坦作為聯合國的觀察會員國,並且有139個國家承認巴勒斯坦是國家,但巴勒斯坦政府與哈瑪斯, 分別控制著兩個不同的區域。請妳/你從國際法的國家要件,分析巴勒斯坦此一實體,是否具有國家地位? (20%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "113", "question": "二、2005年開始,以色列就已經從加薩走廊撤軍,並且不再於加薩行使政府統治權,但依然會控制著加薩走廊的部份邊界與領海。請問: (一)加薩走廊是否仍為以色列佔領區?(15%) (二)以色列對馬加齊難民營與周遭附近的軍事行動,是否符合比例原則?(15%) (三)以色列對加薩的武裝衝突行動中,不論是對平民或戰俘,是否僅需受到最低程度國際人道法之約束(如: 共同第三條款),或是應該受到其他更高程度的法律約束?(25%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "113", "question": "三、近日,獲得伊朗支持的葉門叛軍「青年運動」自從2023年10月以色列與哈瑪斯爆發戰爭以來,一直將目標鎖定紅海,攻擊行經這條戰略航道的船隻,以展現對巴勒斯坦武裝團體哈瑪斯的支持,而遭到美、英兩國的空襲。請問,美、英兩國所發動的空襲行動,是否具有國際法上的理由?(25%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "112", "question": "近來,華夏國與太陽國對於釣龜島主權爭議,呈現著日漸白熱化的趨勢。兩國海軍船艦除了在釣龜島周圍 12海里內,會發生海上接近事件外,雙方的海警船也頻頻出沒在該島周邊12海里之水域。某日,太陽國發現, 距離釣龜島大約24海里的海域中,有大約300艘懸掛著華夏船旗的大型鐵殼漁船,正在繞行釣龜島航行;甚至,有少數漁船試圖進入釣龜島12海里的範圍,但都被太陽國所攔截。過了大約一小時後,又出現了10艘華夏國海警船,出沒在距離釣龜島大約50海里的海域中來回巡航,該300艘大型鐵殼漁船則駛離釣龜島附近水域。據悉,華夏國的大型鐵殼漁船的平民,平日除了捕魚外,也必須接受華夏武警單位的督導指揮,並接受該國漁政單位的油料補助。\n\n此事件發生後一個月,太陽國對外宣布,將在釣龜島周邊劃設大約50海里的海洋生態保護區,未經許可的船舶禁止進入該區域內。隔日,釣龜島周邊再度出現了300艘華夏船旗的大型鐵殼漁船,不僅直接駛入海洋生態保護區,並且在該生態保護區投入劇毒,瞬間造成大量漁群暴斃與珊瑚礁白化。同時,這些大型鐵殼漁船, 又進一步對包夾碰撞太陽國海警船,並朝太陽國海警船丟擲汽油彈,並造成太陽國海警船有三人遭到嚴重傷害。 太陽國海警船見狀即對漁船噴發水柱,但無法抵擋於鐵殼漁船繼續往前進,遂請求該國海軍前來支援。太陽國海軍前去馳援後,發現大量的鐵殼漁船,已經在華夏國海警船的掩護下試圖登島,並準備在釣龜島上插上華夏國國旗。太陽國海軍見對方人數與漁船數量眾多,除了直接朝漁船開槍外,並曾發射一次砲擊行動,擊沈了五艘即將上岸的漁船後,其餘鐵殼漁船駛離釣龜島。\n\n請以國際法相關規範回答下列問題:\n\n一、請問太陽國請求華夏國,必須對太陽國海警船與船員,遭受到華夏國漁船攻擊的損害負擔國家責任,在法律上是否有理由?(25%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "112", "question": "二、太陽國在有領土爭議的釣龜島單邊宣布設置海洋生態保護區,是否違反國際法?(20%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "112", "question": "三、若太陽國主張基於國際法上的自衛權而砲擊華夏國漁船的行為,在國際法上是否有理由?(30%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "112", "question": "四、太陽國發現,華夏國漁船所施放的毒劑,是由華夏國的大米生化公司所製造。因此,太陽國對於在太陽國直接投資的大米公司,下令大米公司禁止生產有毒化學產品。若在太陽國的大米公司因為該禁令而破產, 遂依據太陽與華夏國所簽訂的雙邊投資條約規定,在常設仲裁庭直接對太陽國政府提起仲裁。請問,太陽國的大米公司在該仲裁案中是否會勝訴?(25%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "111", "question": "一、自從COVID-19從武漢的海鮮市場開始爆發嚴重的疫情,且加上在北京的市場中發現,外國進口食品中(如:鮭魚)所帶有的COVID-19病毒,是造成北京該疫情的原因之一。中國遂在2020年6月宣布,為求審慎並預防中國的大規模疫情再起,對進口貨櫃與冷凍食品,要進行嚴格的病毒核酸檢驗。其後,中國也基於其食品測試的結果,禁止了美國著名的冷凍食品公司Tyson的冷凍豬肉產品之進口。如果妳/你是美國政府的法律顧問,可能會運用哪些WTO的法律規範,評價本案的合法性?(25%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "111", "question": "二、美國政府在2020年時,與被美國認定是阿富汗恐怖組織的塔利班,簽訂了一份名為”Agreement for Bringing Peace to Afghanistan between the Islamic Emirate of Afghanistan which is not recognized by the United States as a state and is known as the Taliban and the United States of America”的「和平協議」。在這份協議中,相當引起矚目者是:塔利班與阿富汗政府進行協商,以及包括建立一個新的阿富汗伊斯蘭政府的阿富汗之未來政治路徑。其後,美軍與NATO在2021年從阿富汗撤軍的過程中,不僅塔利班勢如破竹地拿下首都喀布爾,且在短短一個月的過程中,在塔利班當時已經有效控制的地方,發生了超過1000名平民的死亡、強迫失蹤、或者20多萬人被迫逃離家園。請問:\n\n(一)美國在這份協議中,如何定位塔利班的國際法地位?(10%)\n\n(二)從該和平協議的內容來看,美國有沒有對阿富汗構成違法干涉?(20%)\n\n(三)美國是否應為其從阿富汗撤軍後,阿富汗平民的死傷與流離失所,負有國際法上的國家責任?(15%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "111", "question": "三、2021年6月23日,根據多家媒體報導指出,英國軍艦在通過克里米亞半島的領海時,俄羅斯海軍全程伴隨。又,根據俄羅斯的聲明指出,英國軍艦違法進入其領海,其後透過警告性射擊,並透過戰機投下炸彈至附近水域,迫使英國軍艦離開俄羅斯在克利米亞的領海。不過,英國也反擊表示,英國是合法無害通過烏克蘭的克里米亞的領海。普丁曾經在記者會中表示,並不認為俄羅斯這樣的行為會導致第三次世界大戰,但俄羅斯的其他高級官員也表示,任何英國的挑釁行動,都有可能會遭致包含軍事行動的反應。 請問,俄羅斯對英國在克里米亞領海內所施加的行為,有沒有構成違法武力威脅?(30%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "110", "question": "一、請從國家責任、國際環境、和國際人權法的角度,分析此前川普總統欲向中國請求美國因 COVID-19 疫情所受到的損害,在國際法上是否有足夠的理由?(30%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "110", "question": "二、若中國不理會美國的賠償請求,於是美國隨即主張美、中必須要加速在衛生產業方面的脫鉤,因而對在美國進行直接投資的中國藥廠,課徵250%的緊急衛生稅。假設美、中兩國之間有簽訂雙邊投資條約,而妳/你是中國藥廠的法律顧問,妳/你會如何回覆下面的問題:\n\n(一)美國的緊急衛生稅是否具有國際投資法上的依據?(15%)\n\n(二)如果美國政府另外以貪腐案件準備在美國國內起訴該中國藥廠,後來該中國藥廠準備抗辯表示,該藥廠的最大股東是中國政府,佔有35%的股權,所以,該藥廠應享有主權豁免。請問, 該藥廠的抗辯是否有理由?(15%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "110", "question": "三、若美國進一步表示要透過結合西太平洋國家共同圍堵中國,而宣佈要每三天派出一艘海軍艦艇通過台灣海峽以西的水域。若中國旋即聲明表示:\n\n(一)美國軍艦通過台灣海峽以西的水域,必須事先得到中國的許可。請問,該等聲明的內容在海洋法上是否有理由?(20%)\n\n(二)中國將每日派出軍機,在距離台灣本島約60海里的防空識別區內巡弋。請問,台灣可否對防空識別區內的軍機行使自衛權?(20%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "109", "question": "一、請分別說明美國透過目標謀殺(targeted killing)方式,在伊拉克境內殺害伊朗聖城軍指揮官蘇雷曼尼,是否符合武裝衝突法規範?(13%)又,在蘇雷曼尼遭到殺害後,伊朗革命衛隊以導彈攻擊伊拉克境內的美軍基地, 是否符合自衛權的規範?(15%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "109", "question": "二、假設在美、伊情勢緊張之際,伊朗政府下達了一個行政命令,要求該國境內所有和美國關係密切的外國公司,必須轉移75%的技術給伊朗公司。此時,如果有一個捷克公司在此命令下,被迫轉移了技術給一家伊朗政府所 100%控股的A公司。如果捷克和伊朗政府訂有雙邊投資保障條約,而妳/你是該捷克公司的法律顧問,被問及:\n\n1. 若該捷克公司想在國內法院起訴請求該伊朗公司禁止使用其轉移的技術,該伊朗公司在捷克法院中是否享有國家豁免權?(12%) 2. 若該捷克公司想要透過雙邊投資條約中的爭端解決機制,直接在世界銀行下的投資爭端解決中心告伊朗政府,應以什麼理由控訴伊朗政府? (15%) 3. 捷克政府可否請求伊朗政府必須負國際法上國家責任之賠償?(12%)", "answer": ""},

{"category": "intl", "sub": "台大政治所", "year": "108", "question": "請先閱讀下列背景資訊:\n\n烏克蘭2017年6月憲法日當天,曾遭名為「NotPetya」的電腦病毒攻擊。烏國聯同美國和英國譴責俄國開展「NotPetya」。在該病毒擴散至全球之前,烏國多個政府部門和企業受襲,導致數十億美元的損失。其後一些國際企業如巧克力製造商Mondelez 國際公司和貨運物流公司FedEx亦蒙受巨大損失。根據報導指出,「NotPetya」病毒先是用45秒搞垮了該國第二大銀行 Oschadbank 的處理系統。 隨後在全國範圍內,NotPetya 用令人驚悚的速度吞噬了烏克蘭幾乎所有可用的電腦。此外,該病毒只用了16秒,就致使其一個重要交通樞紐陷入癱瘓。僅在烏國首都基輔,就有至少4家醫院,6家電力公司,2家機場,超過22家烏克蘭銀行的網路系統被勒索和摧毀,零售商、ATM等支付系統以及近乎所有的聯邦機構也在一瞬間徹底奔潰。「政府已經死了。」烏克蘭基建部長 Volodymyr Omelyan 總結道。烏克蘭人民甚至在思考自己有沒有錢買明天的麵包。根據北大西洋公約組織「合作網絡防禦卓越中心」的專家表示,「NotPetya病毒很可能是由國家或非國家行為者,在獲得國家授權或支持的狀況下,所展開的一項網路攻擊行動。」在NotPetya爆發一周後,烏克蘭警方全副武裝, 衝進了駭客的網路潛伏地,位於基輔的 Linkos 集團總部大樓,找到了製造這場 NotPetya 服務器, 才終止了這一場網路攻擊。根據後來的統計,烏克蘭在此次網路攻擊行動中,遭受數百億美元的損失, 且諸多電腦檔案已經無法回復。\n\n請根據以上背景資訊,搭配下述問題或假設性事實,依據國際法規範回答下列問題:\n\n一、若烏克蘭經過三個月的調查後,發現該次網路攻擊是來自俄羅斯政府的資金支持,烏克蘭可否以國際法上的自衛權為基礎,而對俄羅斯發動武力攻擊?(25%)", "answer": ""},

{"category": "intl", "sub": "台大政治所", "year": "108", "question": "四、在此事件後,若烏克蘭要針對伏特加酒課予更高的稅率,遂依據該國「菸酒增值稅法」規定,對於從外國進口以單一純麥或單一馬鈴薯所蒸餾釀造之伏特加酒,必須課予10%的增值稅;但對於混合原料蒸餾釀造的伏特加酒,不需要另外課予該增值稅。另外,對於烏克蘭製造的伏特加酒的郵政費率費用,和國外製造的伏特加酒的郵政費率費用也有5%的差別。若妳/你是俄國政府所聘請的WTO 專業律師,妳/你會主張烏克蘭違反WTO的甚麼規定?(30%)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "107", "question": "請先閱讀下列背景資訊:\n\n2014年南海爭端與菲、中南海仲裁案升高之際,中國在越南主張為其專屬經濟海域之內,設置「海洋石油981」深水油氣田鑽井平台以探勘石油。其後,越南軍方派出軍艦阻止,引發兩國軍艦在海上的對峙。 新聞見報後,越南民眾發動了連串對於中國此一行動的示威與抗議的排華抗議,並在其後造成包含日本、 台灣在內,部分直接投資企業人員與廠房的財產、身體或甚至生命損失。事件發生後,台灣的經濟部官員表示,除了將要求越南政府賠償外,並表示要與越南政府協商,重新簽訂雙方於1993年簽訂的投資保障協定。不過,協商至今,台越雙方尚無具體成果出現。\n\n除了南海爭端所引起的排華事件外,台塑在越南的河靜鋼鐵工廠,於2016年4月被發現排放汙廢水至附近海域造成大量魚群暴斃,造成越南人民對台灣廠商的嚴重不滿。據報導,被沖到岸上的死魚就超過 140噸,死在海中的魚類、珊瑚更是難以計數。事後,台塑承諾支付越南政府5億美元的罰金。但據河靜省榮市教區神父 Nguyen Dinh Thuc 來台揭露訊息表示,他的教區有2500~3000個教友,其中85% 都是漁工,無法拿從政府手上拿到任何台塑所支付的金額。台灣環境法律人協會秘書長林仁惠表示,此案已讓台塑公司成為「環境汙染」和「人權侵害」的代名詞,希望台灣政府能強化對台商的管理,以挽回台灣惡名昭彰的形象。\n\n請根據以上背景資訊,搭配下述問題或假設性事實,依據國際法規範回答下列問題:(每題25分)\n\n一、南海仲裁案後,中國政府發表的其中一項聲明表示:「基於中國人民和中國政府的長期歷史實踐及歷屆中國政府的一貫立場,根據中國國內法以及包括《聯合國海洋法公約》在內的國際法,中國在南海的領土主權和海洋權益包括.... 中國在南海擁有歷史性權利。」請問,國際法上的歷史性權利有哪些類型?中國在南海所主張的歷史性權利是否合於國際法規範?", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "107", "question": "二、台塑河靜鋼鐵場污染事件發生後,越南政府與學界出現許多討論,是否或如何強化對於外資環境管理與企業社會責任之規範。假設越南政府發布了一份名為《台灣投資廠商環境管制規則》的命令,規定每一位台灣投資廠商工廠之碳排放量,僅能佔越南根據《巴黎協定》所提出之「國家自訂預期貢獻」 15%之排放量。若該命令發布三年後,由於台塑連續違反該管制規則,而遭到越南政府連續處罰達到一百億台幣,因而宣布撤出所有在越南的投資。如果台塑公司決定訴諸國際法上的救濟途徑,而妳/你是台塑公司的法律顧問,請問妳/你會如何在實體問題上,為台塑公司向越南政府提出有關該《台灣投資廠商環境管制規則》賠償請求?", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "107", "question": "三、根據資料記載,台塑河靜鋼鐵場,屬於在開曼登記之台塑河靜有限公司所有。台塑河靜有限公司,則是台灣台塑股份有限公司所轉投資之公司。如果在台塑污染事件中,受到傷害且沒有從越南政府拿到任何金額的越南漁工,直接到台灣的法院,起訴請求台塑公司賠償。如果妳/你是本案審理法官,會如何審理本案?", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "107", "question": "四、假設中國和菲律賓於南海再次於黃岩島發生爭端,為了一勞永逸解決中菲南海問題,中國決定對菲律賓發動戰爭。詎料,菲律賓派出前所未見的「人工智慧無人海軍艦艇隊」。在公海交戰的過程中,人工智慧艦艇誤以為兩艘懸掛日本國旗的麗星觀光郵輪是敵軍,遂自動回報菲國海軍指揮官,是否要擊沉 「敵軍」。菲國海軍指揮官查詢一分鐘後不疑有它,下令控制人員讓人工智慧艦艇擊沉「敵軍」。兩艘麗星觀光油輪在一瞬間擊沉,造成六百多人死亡。事發後,日本不僅要求菲律賓負起賠償責任外,也要求菲律賓應在國內,應依據「違反人道罪」,審判負責控制人工智慧海軍艦艇隊的相關高階指揮與控制人員。但是,菲律賓經過一年後,仍沒有在國內調查與起訴相關人員。由於日本和菲律賓都是《羅馬規約》締約國,日本遂向國際刑事法院檢察官,請求調查該起攻擊案,並起訴審判相關指揮與控制人員。如果妳/你是本案檢察官,是否會起訴菲律賓的指揮官或控制人員呢?為什麼?", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "106", "question": "一、有關在海牙之常設仲裁法庭對於南海仲裁案之判決,引起國際社會的廣大關注,各國有不同立場與解讀。其中,仲裁法庭稱太平島是「岩礁」而非島,太平島僅能宣稱12海浬領海,不得主張專屬經濟海域。\n\n1.請簡述海洋法之島嶼制度。(15分)\n\n2.試反駁仲裁法庭對於太平島是岩礁而非島之意見。(15分)", "answer": ""},

{"category": "intl", "sub": "台大政治所", "year": "105", "question": "請閱讀下列故事後回答問題\n\nAlbert 是X國公民與該國積極的經濟社會文化人權運動者,專門以監督 X 國政府的教育相關法令政策為主。X國在2015年批准聯合國經社文化權利國際公約時,曾經對該公約第十三條第二項第一款提出一個保留:「X國有權延後全民初等教育相關法令政策的實施。雖然X國完全贊同該條有關初等教育規定的原則,也同意採取必要步驟完整落實該款規定,但由於為了落實該規定需要付出極大財政支出,因此X國無法保證在此階段落實該款規定。」聯合國經濟社會文化權利國際公約第十三條第二項第一款規定:「本公約締約國為求充分實現此種權利起見,確認:(一)初等教育應屬強迫性質,免費普及全民。」\n\n當Albert 看到X國政府提出這樣的保留後,開始推動廢除上述條約保留與推動免費初等教育普及化運動。不過,X國政府認為Albert以及他所領導的人權團體,是想要革命推翻政府的組織,於是宣布X國進入緊急狀態,連續逮捕拘禁了 Albert 與其他人權運動者超過100人。X國政府在拘禁人權運動者時, 為要求 Albert 等人提供其他運動者資料,X國政府禁止 Albert 等人睡覺,並恐嚇 Albert 等人其家人將有出車禍的風險。\n\n【國政府得知X國政府對待 Albert 等人權運動者的資訊後,命其派駐於X 國的大使 Benjamin,向X國表達關注該國人權實施狀況。X國在知悉 Benjamin 大使的關注後,向Benjamin表示「雖然X國和貴國都是『公民與政治權利國際公約』的締約國,但貴國應該很清楚該公約允許締約國在緊急狀態下,可暫時減免公約義務。同時,希望貴國不要干涉我國內政。」Benjamin 大使則回覆表示,「貴國對『公民與政治權利國際公約』的理解不合於國際法,且我國可以進一步對貴國採取法律上行動,並無違反不干涉原則之虞。」X國在知悉\n\nBenjamin 的回覆後,將其列為X國不受歡迎人物,要求Benjamin 在兩天內離開 X國。\n\nX國的行為引起其他國家在聯合國內的關切,其後安理會決議經濟制裁X 國,禁止他國和X國進行貿易與直接投資。X國在聯合國的經濟制裁下,財政更為困窘,於是宣布刪減佔該國人口約10%的貧窮線下人民的糧食救助券,並開始積極尋求他國的投資。X國法律官員建議尋求向不是聯合國會員國的Z國幫助。Z國在了解X國的意願後,認為當他國不能進入X國時,也就是對Z國來說一個投資X國的最佳時間點。因此,Z國便和X國簽訂雙邊投資條約,作為吸引Z國商人到X國投資的法律手段。後來,Z國擁有80%股份的Carson 海洋石油公司,即前往X國直接投資並在X國專屬經濟海域內開採石油。\n\nCarson 海洋石油公司在開採石油後一年,不慎產生漏油的海洋生態汙染事件。X國政府表示,依據該國海洋環境保護法規定,「外國石油公司汙染本國環境者,得處該公司過去平均利潤二到十倍的罰鍰,且可命該公司移轉石油開採技術。」因此,X國表示課予Carson 公司三倍利潤的罰鍰,且移轉該公司的開採技術,但Carson 公司不服該處分不願繳納罰鍰與轉移技術。X國表示若不繳納與轉移,將以情勢變更為由終止與Z國的雙邊投資條約。Z國政府則表示, 若X國不撤銷上述處分,將採取一切必要行動保護Z國投資人的權益。X國表示,「我們不是嚇大的!」於是乎Z國為了保住面子,在X國專屬經濟海域內進行了多次軍事演習。\n\n請依據現行國際法規範,回答下列問題:(請掌握答題時間)\n\n一、X國對「聯合國經濟社會文化權利公約」所提出的保留,與刪減糧食券的預算,是否符合國際法規定?(15%)", "answer": ""},

{"category": "intl", "sub": "台大政治所", "year": "104", "question": "「圖一」中的A、B兩國是隔著「阿卡巴灣」相向的兩個國家,「阿卡巴灣」 的入口是「蒂朗海峽」。A、B兩國的漁民,約莫500年前開始在「阿卡巴灣」 中,捕撈一種只有「阿卡巴灣」才有生長的「阿卡巴魚」。但是「阿卡巴魚」多刺且肉質差,A、B兩國人民並未將「阿卡巴魚」當作平日主要食物,而是將「阿卡巴魚」當作每年為期三周的海洋祭典貢品,以及每個月進行兩天的賽魚民俗活動。\n\n直到兩年前C國的科學研究指出,「阿卡巴魚」經過提煉後,是一種低成本的糖尿病治療用藥。由於只有C國政府才有這種低成本糖尿病的提煉技術,A、 B兩國遂分別與C國簽訂雙邊投資條約,以讓C國所直接控股的「阿卡巴生技公司」,就近取得生產原料。A、B兩國與C國所分別簽訂的雙邊投資條約相同, 均規定投資人與地主國有爭端時,可直接對地主國提出仲裁。\n\n「阿卡巴生技公司」為了取得「阿卡巴魚」原料,分別與A、B兩國國內的許多漁民,簽訂「阿卡巴魚供應契約」。該供應契約均約定,每提供一百斤的「阿卡巴魚」,可獲得300美元的價金。經過兩年後,A、B兩國政府眼見「阿卡巴生技公司」以低價取得阿卡巴魚,作為糖尿病治療用藥的生產原料,卻在國際上賣出獲得極高利潤,遂想「教訓」「阿卡巴生技公司」。一方面,A國以「阿卡巴生技公司」在A國侵害童工權利而違反「經濟社會文化權利國際公約」與「兒童權利公約」為由,要求「阿卡巴生技公司」改善。但「阿卡巴生技公司」置之不理,A國則進一步要求「阿卡巴生技公司」轉移生產阿卡巴魚糖尿病用藥的技術。另一方面,B國認為「阿卡巴生技公司」可能造成「阿卡巴魚」有大量減少的疑慮,遂規定「阿卡巴生技公司」每個月,可利用「阿卡巴魚」生產糖尿病治療用藥的最高可生產量。\n\nC國政府眼見「阿卡巴生技公司」與A、B兩國的關係日趨緊張,決定派出兩艘軍艦與軍機,前往阿卡巴灣。A、B兩國為了因應C國的行動,遂採取數項聯合行動。首先,A、B兩國主張在「阿卡巴灣」的入口處,亦即,「蒂朗海峽」 劃出一道封口線,主張是兩國共同的「歷史性海灣」。其次,要求所有欲通過「蒂朗海峽」進入「阿卡巴灣」的船隻與飛機,應事先獲得A、B兩國的同意。最後, A、B兩國宣布建立「聯合紅海防空識別區」,並規定欲通過或進入「聯合紅海防空識別區」之外國飛機,均應通知A、B兩國,否則將採取一切必要行動。\n\n請根據以上資訊,並依據現行國際法規範或法理,回答下列問題:\n\n1. 若C國政府所派出的軍艦通過「蒂朗海峽」前未事先獲得A、B兩國同意, 且其軍機通過「聯合紅海防空識別區」時也沒有事先通知A、B兩國,雙雙進入了「阿卡巴灣」。請問,A、B兩國可否主張C國侵犯A、B兩國的領土主權?(30%)", "answer": "", "questionImage": ""},

{"category": "intl", "sub": "台大政治所", "year": "103", "question": "二、懸掛A國國旗的「大甲號」漁船,在距離A國漁民習慣稱為「拉特納」島約100海里之海域進行捕魚時,B國「鐵面號」海上警察船廣播要求「大甲號」漁船,即刻駛離B國的專屬經濟區。但由於A國政府向來主張「拉特納」島不屬B國所有,所以「大甲號」漁船認為自己並沒有進入B國專屬經濟區,繼續淡定地在原處捕魚。「鐵面號」見狀,旋即對「大甲號」漁船開槍停船,並在經過一陣追逐後,登臨「大甲號」漁船後,逮捕「大甲號」 船員並扣押漁船。\n\nA國政府得知相關訊息後,立刻向B國政府抗議,並發佈有關「拉特納」 島的領土主權聲明。聲明中表示,「拉特納」島在一千年前,即是由古巴單帝國所統治;「拉特納」即是古巴單帝國語中,表示「魚群豐富之地」。古巴單帝國在三百年前瓦解後,分別由五個部族所統治,但「拉特納」島一直都是被五個部族的漁民,在其上用當作休憩之地。直到一百五十年前,殖民強國瓦格納帝國來到此地,並統一了五個部族。在瓦格納殖民統治五十年後, 瓦格納帝國與B國簽訂條約,約定「拉特納」島「以西」之海域,讓B國漁民與巴丹漁民共同使用;但「拉特納」島「以東」海域,仍由巴丹漁民單獨使用。距今約八十年前,巴丹從瓦格納帝國殖民統治中獨立出來成為A 國。又,A國去年和D國的石油公司,在「拉特納」島「以東」之海域, 也簽訂了進行石油探勘協議。據此,A國政府主張,「拉特納」島歸屬於A 國,且B國政府無權在「拉特納」島附近海域,逮捕並扣押A國漁民與漁船。\n\nB國政府表示,B國的確曾與瓦格納帝國簽訂過上述「拉特納」島「以西」 海域的共同使用條約。但A國獨立後,少有政府船隻出現在「拉特納」島附近水域。五十年前,「鐵大尼」號行經「拉特納」島「以東」的海域時, 觸碰礁石沉沒時,B國曾經救援並調查事故發生原因,並發佈「拉特納」島危險海域通知。其後,B國也與周邊國家,在「拉特納」島「以東」與「以西」之海域,成立緊急海難救援機制,在可能發生危險時,B國也會管制該海域的船隻。此外,四十年前B國已將「拉特納」島和附近危險海域,在其官方地圖中,標記為「屬於B國」,A國亦無抗議。\n\n除了在「拉特納」島上的主權歸屬爭議進行法理上的交鋒外,A國人民情緒沸騰,要求A國政府應強力回應B國。但眼看A國政府營救漁民沒有任何進度,A國恐怖組織「鐵拳」,連續在B國各大城市引爆汽車炸彈,引發B 國人民的恐慌。為防止「鐵拳」進一步的恐怖攻擊,B國派出無人轟炸機, 非常精準地將「鐵拳」的領導與高階幹部狙擊殺害。\n\n請根據現行國際法規範,回答下列問題:\n\n(一)、請問「拉特納」島的「原始權利名義」與「領土主權」歸屬於A國還是 B國?(25%)\n\n(二)、請問B國政府有無法律上的理由,派出無人轟炸機,狙殺A國境內「鐵拳」的恐怖份子?(25%)\n\n(三)、若您是A國政府的法律顧問,會建議A國政府向B國政府,就B國政府的哪些行為,請求B國負擔對A國的國家責任?(25%)", "answer": ""},

{"category": "intl", "sub": "台大政治所", "year": "102", "question": "二、請依據現行國際法規範,回答下列問題:\n\n走味的異國戀:威廉與瑪莉總統的政治一夜情\n\nA國總統 William 率領其外交訪問團,受邀到B國參加B國新總統Mary的就職典禮。 就職典禮後,B國準備簽訂兩項條約:一個是「A-B雙邊投資條約」,另一個是「ABCD 四國自由貿易協定」。William 體恤B國剛辦完就職大典很繁忙,遂向Mary 建議在A 國駐B國大使館,進行「A-B雙邊投資條約」的簽署暨酒會儀式。\n\n其中,AB兩國在該投資條約中有如下約定:1.若B國徵收A國投資人之投資,應給予補償;2.A國將協助B國進行海上油氣田開發案;3.A國投資人與B國發生投資爭端時,得選擇在C國法院進行訴訟。完成投資條約的簽署後,隨即舉行酒會慶祝儀式。在酒會席間,William與Mary 相談甚歡,惺惺相惜,William就對Mary說:「先別管自由貿易協定了,你有聽過真愛要即時嗎?」兩人便在大使館中,共度了「浪漫」的一個夜晚。\n\n第二天,ABCD四國幕僚,又接著緊鑼密鼓地協商「四國貿易協定」。在談判過程中,AB兩國幕僚對於是否允許B國輸出牛肉內臟至A國,有激烈爭論。AB兩國協商代表僵持不下後,分別請示兩國總統。Mary知悉談判僵局後,便將William找去。見面時,Mary便拿出她前一晚,用iPhone5所偷錄下兩人前一夜的「浪漫」紀錄。Mary 跟William說,若不答應進口B國牛內臟,就將浪漫紀錄公開。William無奈之下,指示幕僚答應進口牛肉內臟。隨後,ABCD四國也正式完成簽署程序,各國外交團也旋即返國。\n\n返國後,A國依照「A-B雙邊投資條約」之約定,商請「太平洋石油公司」,與B 國政府所直接控股營運的「印度洋石油公司」簽約。兩公司約定:1.「太平洋石油公司」 擁有「印度洋石油公司」25%的股權,並派出三人擔任「印度洋石油公司」董事。2.「印度洋石油公司」每年另外支付「太平洋石油公司」100萬美金,由「太平洋石油公司」 負責進行人員訓練與技術授權合作,協助「印度洋石油公司」進行專屬經濟區的油氣田開發案。\n\n不料,當「太平洋石油公司」完成訓練與技術授權後不到一年,「印度洋石油公司」 董事會開除「太平洋石油公司」的三位董事,並停止支付技術授權金。「太平洋石油公儿司」旋即提出抗議,但「印度洋石油公司」以其依據B國新制訂之「能源開發自主法」規定,能源應自主開發以及外國人不得擔任能源公司董事為由,表示一切依法行事。 聞訊後,「太平洋石油公司」決定在C國起訴「印度洋石油公司」與B國政府。\n\nAB兩國因為石油開發案,陷入了緊張的局面。William總統與幕僚進行協商後, 做出下列兩項行動:1.修改「食品衛生管理法」,規定外國進口牛肉內臟,改為接受海關30天嚴格檢疫,費用由外國出口商負擔;2.派出無人偵察機,在B國專屬經濟區之油氣田上空,蒐證「印度洋石油公司」有無海洋違法開發情形。\n\nA國採取行動後,進一步引發了B國的兩項行動。Mary總統派出空軍,以巡弋飛彈打下A國無人偵察機。又,B國經濟部決定徵收「太平洋石油公司」25%的股權。就在AB兩國陷入了前所未有的緊張局面之時,E國派出特使斡旋。斡旋後,兩國決定先行冷靜,等待法院判決後再做協商。\n\n(一)請問「太平洋石油公司」,可否分別以「印度洋石油公司」(1)開除董事與停付技術授權金(15%),以及(2)B國政府徵收其股權(5%)等兩個理由,在C國對B國政府提起這兩個訴訟?\n\n(二)假設上題的兩個訴訟,C國法官認為都可以起訴,你認為在這兩個案件中,誰會勝訴?(訴訟1:5%;訴訟2:15%)\n\n(三)B國可否以行使專屬經濟區的自衛權為理由,打下A國無人偵察機?(15%)\n\n(四)B國若要求A國依據「自由貿易協定」重新開放牛肉進口,William 總統可否以當初受到Mary 脅迫公開「浪漫」紀錄為由,主張「自由貿易協定」無效?或者, 即便有效,也違反「食品衛生管理法」為由,拒絕進口?(20%,請假設A國為我國法制)", "answer": ""},

{"category": "intl", "sub": "台大政治所", "year": "101", "question": "六、改編劇:神鬼奇航之新不老泉篇(40%)\n\n大海盜傑克船長自從到達世界的盡頭後,與大家道別並各奔東西。而巴布船長在取得了英國政府所繪製的「不老泉藏寶地圖」後,即刻召集各方人馬,準備駕船前往不老泉以獲取長生不老之術。但巴布船長卻不知道, 他手上的不老泉藏寶地圖,已被傑克船長動了手腳,調包成英國政府在100 年前所繪製之位於伊朗境內的「不老泉藏寶地圖」。巴布船長在航行中得知, 不老泉發揮長生不老效用的方式,是必須殺了其他人並接受他人的剩餘生命後,始能收到延壽之效。因此,巴布船長下令,將船上15歲以下的人加以綑綁,準備在到達不老泉後進一步殺害以獲得延壽。\n\n未料,命運多舛的巴布船長在途中,遇到了同樣覬覦不老泉的黑鬍子船長。黑鬍子船長靠著優勢海戰技巧,在阿拉伯外海將巴布船長轟得落荒而逃。本來被巴布船長所持有的不老泉藏寶地圖,以及被他綑綁的不老泉人質,都被黑鬍子船長搶走,以作為前往不老泉之航行與延壽之用。\n\n想要圖謀再起的巴布船長則駕著船並帶著餘眾,投靠英國皇家海軍。 英國皇家海軍下令,巴布船長應即刻與約翰上校所指揮的皇家海軍會合, 並追捕黑鬍子船長以解救人質。投靠皇家海軍後,巴布船長才發現,原來現在真正的不老泉是在阿富汗。於是,巴布船長告訴約翰上校,黑鬍子船長會前往伊朗,而不是阿富汗。但是,約翰上校也想要取得長生不老之術, 還是預備駛向阿富汗。而另懷鬼胎的巴布船長,則準備自行脫隊前往伊朗, 以報黑鬍子船長一箭之仇。\n\n另一方面,西班牙政府也一直在尋找不老泉,希望能毀掉這個引起貪婪和衝突的根源。西班牙政府根據最新情報發現,黑鬍子船長手上握有不老泉藏寶圖。於是,西班牙的喬治總理派出無敵艦隊,跟蹤並追捕黑鬍子船長,以期獲得不老泉藏寶圖。就在黑鬍子船長快要到達伊朗領海時,西班牙無敵艦隊與脫隊的巴布船長,都找到了黑鬍子船長,而紛紛以子母炸彈對黑鬍子船長展開攻擊。寡不擊眾的黑鬍子船長不但失去了藏寶圖,也被西班牙政府加以拘禁。\n\n黑鬍子船長被拘禁後,西班牙與伊朗政府達成協議,西班牙可以派人進入伊朗境內尋找不老泉,但西班牙必須給付伊朗500萬英鎊。但西班牙仍無法依照錯誤的藏寶圖找到不老泉,西班牙遂將矛頭指向了巴布船長。 於是,西班牙總理喬治下令:無敵艦隊全力追捕巴布船長,抓到巴布船長後,若巴布船長不吐露不老泉的秘密,就不給他進食。同時,取消西班牙應給付伊朗500萬英鎊的義務。\n\n巴布船長被西班牙追捕後,因受不了飢餓,而透漏了不老泉其實是在阿富汗境內的秘密。但巴布船長也欺騙西班牙政府,宣稱英國的約翰上校已抵達阿富汗,並已經細綁了並準備殺害一群西班牙人質,以獲得不老泉的長生術。西班牙政府隨即發出最後通牒,要求阿富汗政府逮捕並交出約翰上校。但阿富汗政府認為西班牙的要求太無道理而拒絕。於是,西班牙派出五萬大軍,以保護西班牙公民的理由,攻入阿富汗。隨後,西班牙大軍順利毀掉不老泉,但也發現其實約翰上校並沒有綑綁任何西班牙人質。 為了解決不老泉事件所引發與阿富汗之間的衝突,西班牙喬治總理,遂親自前往阿富汗準備與阿富汗重修舊好。\n\n在看過上述的故事後,請依據現行的國際法規範,回答下列問題:\n\n(1)西班牙政府進攻阿富汗以保護僑民的行為有無理由?\n\n(2)如果你是西班牙的檢察官,有無任何理由起訴審判黑鬍子與巴布船長?\n\n(3)西班牙可否拒絕履行應給付伊朗500萬英鎊的義務?\n\n(4)如果你是阿富汗的檢察官,有無任何理由起訴審判西班牙總理喬治?", "answer": ""},

{"category": "intl", "sub": "台大政治所", "year": "100", "question": "三、2011年1月9日,南蘇丹臨時政府依據2005年臨時憲法的規定,在聯合國與非洲聯盟的監督下,與蘇丹共和國合作舉行了南蘇丹獨立公投案。根據初步的記票結果顯示,將近99%的南蘇丹投票人贊成此一獨立公投案。蘇丹共和國與南蘇丹臨時政府已宣佈,南蘇丹將於2011年7月9日正式獨立,也象徵性地結束了蘇丹內部數十年的南北衝突。又,依據南蘇丹臨時憲法第1條的規定,南蘇丹北邊與蘇丹共和國的石油接壤地帶(下稱”Abyei”),應另外舉行公投以劃定 Abyei 地區的南北界線。雖然南蘇丹臨時憲法已規劃了 Abyei 公投案時程,但因 Abyei 地帶仍持續發生南蘇丹民兵與蘇丹民兵或族群派系的武裝衝突,已幾乎沒有人民居住於此。因此,南蘇丹與蘇丹兩政府,決議再行協商 Abyei 地區的國界公投案,以先讓南蘇丹獨立公投案得順利進行。請依據上列事實,回答下列問題:(25%) (一)試從國際法上的承認理論,分析南蘇丹臨時政府在獨立正式生效前的國際法地位。 (二)假設,南蘇丹臨時政府與蘇丹共和國在協商 Abyei 地區公投案上面僵持不下,並因此發生大規模的武裝衝突。在衝突過程當中,蘇丹共和國不斷供應民兵軍火武器,讓他們可以大規模攻擊南蘇丹的臨時政府軍。於此同時,蘇丹共和國也大量俘虜南蘇丹臨時政府軍,以做為要脅南蘇丹臨時政府接受國界協商案的籌碼。試問:(1)蘇丹共和國的民兵武裝行為,是否應受到日內瓦第一公約及第一附加議定書之拘束?(2)蘇丹共和國民兵俘虜南蘇丹臨時政府軍的威脅行為,是否違反日內瓦公約共同第三條款(Common Article III of Geneva Convention)之規定?", "answer": ""},

{"category": "intl", "sub": "台大政治所", "year": "99", "question": "一、(一)馬英九總統在就職一週年的中文記者會中稱「中華民國的主權屬於國民全體,台灣是中華民國,這點非常的清楚」;另外,馬英九總統又經常宣稱; 「台灣未來前途應由台灣2300萬人共同決定」,這表示,台灣人民應有權利選擇統一或台獨。請問馬英九總統這些談話是否與我國目前憲法主張主權涵蓋全中國有所衝突?(二)目前中華人民共和國的憲法也是主張主權涵蓋全中國,如果北京以「台灣前途應由大陸地區與台灣地區人民共同決定」,而干涉「台灣未來前途應由台灣2300萬人共同決定」的選擇權,依國際法規範有沒有錯?(三)國際社會又會如何看待「台灣前途應由2300萬台灣人民決定」這句話?以上三個問題請分別從憲法(是否違憲及理由)、國際法及國際政治(主權與自決)的角度分析之。(25分)", "answer": ""},
{"category": "intl", "sub": "台大政治所", "year": "99", "question": "二、我政府近年來在釣魚台列嶼護魚問題上與日本屢有爭議。護魚爭議牽涉到領土主權的認定問題。在有關釣魚台列嶼的主權上,日本先依據先占說,主張對釣魚台列嶼的主權,是依據1895年日本內閣的決議,在釣魚台設立國標。 另再依據時效說,認為「明治二十八年(1895年)以迄1971年,尚未受到世界上任何國家之抗議,而平穩地使用該列島」。1972年5月美國將琉球「歸還」予日本,同時將釣魚台之「行政權」一併轉送,從此之後,日本實際控制釣魚台列嶼,並驅逐進入該列嶼十二海里的我國漁民。1996年日本批准 1982年聯合國海洋法公約,並據以實施二百浬專屬經濟海域,由於日本許多小島鄰近我國,雙方經濟海域嚴重重疊,漁權糾紛隨即產生。(一)日本的「先占說」、「時效說」、「美國歸還日本說」問題在哪裡?(二)我政府應採取何種具有國際法意義的行為才能確保釣魚台的主權?(三)2002年9月24日前總統李登輝接受日本《沖繩時報》的專訪中稱,釣魚台是日本固有的領土, 所有權應屬於日本沖繩縣。以李登輝的前總統身分,其談話是否會影響未來我政府維護釣魚台主權的立場?(25分)", "answer": ""},
