  entries.forEach(e=>{
    if(e.sub === '司法官海海組'){ e.sub = '司法官海洋組'; changed = true; }
    if(typeof e.answer === 'string' && e.answerChatGPT === undefined && e.answerGemini === undefined && e.answerClaude === undefined){
      e.answerClaude = e.answer;
      delete e.answer;
      changed = true;
    }
    if(e.category === 'intl' && e.sub === '國際經濟商務人員'){ e.sub = '國際經濟商務一般組'; changed = true; }
    if(e.category === 'intl' && e.sub === '外交特考國際法組'){ e.sub = '外交特考國際法組海洋法與人權法'; changed = true; }
    if(e.category === 'intl' && e.sub === '司法官海洋組'){ e.sub = '司法官律師海商法與海洋法'; changed = true; }
    if(e.category === 'intl' && e.sub === '中央大學碩士班'){ e.sub = '中央警察大學碩士班'; changed = true; }
    if(e.category === 'ir' && e.sub === '地特'){ e.sub = '地特三等'; changed = true; }
    if(e.sub === '台大研究所'){ e.sub = '台大政治所'; changed = true; }
    if(e.sub === '政大研究所'){ e.sub = '政大外交所'; changed = true; }
    if(e.category === 'intl' && e.sub === '國際公法(含條約法)'){ e.sub = '外交特考國際法組國際公法(含條約法)'; changed = true; }
    if(e.category === 'intl' && e.sub === '國際經濟商務人員國際經濟組織'){
      e.category = 'econ';
      e.sub = '國際經濟商務人員';
      changed = true;
    }
    if(e.category === 'ir' && e.sub === '僑務行政'){ e.sub = '高考僑務'; changed = true; }
    if(e.sub === '國際文化行政'){ e.sub = '國際文教行政'; changed = true; }
    if(e.category === 'history' && e.sub === '其他'){ e.sub = '政大日研所'; changed = true; }
    if(e.id && e.id.indexOf('zhengda-history-111-115') !== -1 && e.category === 'history'){
      e.category = 'ir';
      changed = true;
    }
  });
  }catch(fixErr){
    // 修正舊資料命名失敗不應阻擋後續匯入流程
  }

  // 遷移舊版「國際關係與近代外交史」合併分類（category: 'diplo'）為兩個獨立分類
  const WAIJIAO3_DIPLO_CLASSIFY = {
    '114': ['ir','ir','history','history'],
    '113': ['ir','ir','history','history'],
    '112': ['ir','ir','history','history'],
    '111': ['ir','ir','history','history'],
    '110': ['ir','ir','history','history'],
    '109': ['ir','ir','history','ir'],
    '108': ['ir','ir','history','history'],
    '107': ['ir','ir','history','history'],
    '106': ['ir','ir','history','history'],
    '105': ['ir','ir','history','ir'],
    '104': ['ir','ir','history','history'],
    '103': ['ir','ir','history','history'],
    '102': ['history','history','history','history'],
    '101': ['history','history','history','ir'],
    '100': ['history','history','history','history']
  };
  entries.forEach(e=>{
    if(e.category !== 'diplo') return;
    if(e.sub === '外交特考四等'){
      e.category = 'ir';
      changed = true;
      return;
    }
    if(e.sub === '外交特考三等'){
      const m = e.question.match(/^(\d{1,2})\./);
      const yearMap = WAIJIAO3_DIPLO_CLASSIFY[e.year];
      if(m && yearMap && yearMap[parseInt(m[1],10)-1]){
        e.category = yearMap[parseInt(m[1],10)-1];
      }else{
        e.category = 'ir';
      }
      changed = true;
      return;
    }
    // 其他未知舊資料，預設歸入國際關係，使用者可自行編輯調整
    e.category = 'ir';
    changed = true;
  });

  // 一次性匯入歷屆試題批次（不會重複匯入）
  if(window.__cloudMode && db){
    try{
      importedBatches = await firestoreGetImportedBatches();
    }catch(cloudIbErr){
      importedBatches = [];
      window.__loadDiagnostics.importedBatchesGetError = 'cloud: ' + cloudIbErr.message;
    }
  }else{
    try{
      const ib = await window.storage.get('exam-archive-imported-batches', false);
      importedBatches = ib ? JSON.parse(ib.value) : [];
    }catch(e){
      importedBatches = [];
      window.__loadDiagnostics.importedBatchesGetError = e.message;
    }
  }
  // 自我修復：若已記錄大量批次為「已匯入」，但實際題目數量遠低於合理值，
  // 判斷極可能是先前因儲存空間不足導致「假匯入完成」的異常狀態，清空批次紀錄強制重新匯入。
  if(importedBatches.length >= 10 && entries.length < 10){
    importedBatches = [];
    window.__loadDiagnostics.selfHealTriggered = '偵測到批次已標記匯入但題目數量異常偏低，已重置匯入紀錄，將重新嘗試完整匯入。';
    changed = true;
  }
  // 一次性修復：先前的舊版錯誤曾將「台大政治所」實際資料從資料庫中刪除並回寫，
  // 即使程式邏輯已修正，仍需針對這個已被誤刪的批次強制重新匯入一次。
  const ntuDataRestoreFlag = 'ntu-intl-98-115-data-restore-v1';
  if(!importedBatches.includes(ntuDataRestoreFlag)){
    const ntuCount = entries.filter(e => e.category === 'intl' && e.sub === '台大政治所').length;
    if(ntuCount === 0){
      importedBatches = importedBatches.filter(b => b !== 'ntu-intl-98-115' && b !== 'ntu-intl-98-115-v2fix');
      window.__loadDiagnostics.selfHealTriggered = (window.__loadDiagnostics.selfHealTriggered || '') + ' 偵測到「台大政治所」資料先前遭誤刪，已重新觸發匯入。';
      changed = true;
    }
    importedBatches.push(ntuDataRestoreFlag);
    changed = true;
  }
  // 強制重新匯入台大研究所國際法批次（已修正為逐題拆分版本）
  const ntuReimportFlag = 'ntu-intl-98-115-v2fix';
  if(!importedBatches.includes(ntuReimportFlag)){
    importedBatches = importedBatches.filter(b => b !== 'ntu-intl-98-115');
    importedBatches.push(ntuReimportFlag);
    changed = true;
  }
  // 強制重新匯入國際經濟商務人員批次（已修正為內嵌真實附圖版本）：僅替換原本4題文字說明為內嵌圖片版本，不重複匯入整批
  const jingmaoReimportFlag = 'jingmao-econstudy-97-114-v2img';
  if(!importedBatches.includes(jingmaoReimportFlag)){
    entries = entries.filter(e => !(e.category === 'econstudy' && e.sub === '國際經濟商務人員' && (e.question.indexOf('原卷附圖') !== -1 || e.question.indexOf('原卷附表') !== -1)));
    const imgFixEntries = SEED_ECONSTUDY_JINGMAO.filter(s => s.questionImage);
    imgFixEntries.forEach(s=>{
      entries.push({
        id: 'seed-jingmao-imgfix-' + Math.random().toString(36).slice(2,9),
        createdAt: Date.now(),
        ...s
      });
    });
    importedBatches.push(jingmaoReimportFlag);
    changed = true;
  }

  // 一次性補丁：政大103年「巴塞隆納牽引力案」erga omnes 補上 Gemini 解答
  const geminiPatchId = 'patch-zhengda-103-erga-omnes-gemini';
  if(!importedBatches.includes(geminiPatchId)){
    const target = entries.find(e => e.category === 'intl' && e.sub === '政大外交所' && e.year === '103' && e.question.indexOf('巴塞隆納牽引力') !== -1);
    if(target && !target.answerGemini){
      target.answerGemini = GEMINI_PATCH_103_ERGA_OMNES;
      changed = true;
    }
    importedBatches.push(geminiPatchId);
    changed = true;
  }

  // 一次性補丁：政大103年（開羅宣言/條約錯誤/erga omnes/國籍繼續規則）四題補上 Claude 解答
  const claudePatch103Id = 'patch-zhengda-103-claude-answers';
  if(!importedBatches.includes(claudePatch103Id)){
    const q1 = entries.find(e => e.category === 'intl' && e.sub === '政大外交所' && e.year === '103' && e.question.indexOf('開羅宣言') !== -1);
    const q2 = entries.find(e => e.category === 'intl' && e.sub === '政大外交所' && e.year === '103' && e.question.indexOf('隆瑞古寺案') !== -1);
    const q3 = entries.find(e => e.category === 'intl' && e.sub === '政大外交所' && e.year === '103' && e.question.indexOf('巴塞隆納牽引力') !== -1);
    const q4 = entries.find(e => e.category === 'intl' && e.sub === '政大外交所' && e.year === '103' && e.question.indexOf('國籍繼續規則') !== -1);
    if(q1 && !q1.answerClaude){ q1.answerClaude = CLAUDE_PATCH_103_Q1; changed = true; }
    if(q2 && !q2.answerClaude){ q2.answerClaude = CLAUDE_PATCH_103_Q2; changed = true; }
    if(q3 && !q3.answerClaude){ q3.answerClaude = CLAUDE_PATCH_103_Q3; changed = true; }
    if(q4 && !q4.answerClaude){ q4.answerClaude = CLAUDE_PATCH_103_Q4; changed = true; }
    importedBatches.push(claudePatch103Id);
    changed = true;
  }

  // 一次性補丁：政大103年第二題（條約錯誤/隆瑞古寺案）補上 ChatGPT 解答
  const geminiPatch103Q2Id = 'patch-zhengda-103-q2-chatgpt-v2';
  if(!importedBatches.includes(geminiPatch103Q2Id)){
    const q2t = entries.find(e => e.category === 'intl' && e.sub === '政大外交所' && e.year === '103' && e.question.indexOf('隆瑞古寺案') !== -1);
    if(q2t){
      // 修正先前誤植到 Gemini 欄位的情況
      if(q2t.answerGemini === CHATGPT_PATCH_103_Q2){
        delete q2t.answerGemini;
        changed = true;
      }
      if(!q2t.answerChatGPT){ q2t.answerChatGPT = CHATGPT_PATCH_103_Q2; changed = true; }
    }
    importedBatches.push(geminiPatch103Q2Id);
    changed = true;
  }

  // 修正：地特三等/四等國際經濟學批次因舊版遷移邏輯造成的重複題目，進行去重清理
  // （原本種子資料已直接內嵌圖片，不再需要額外的重新匯入補丁，故移除該補丁並清除其造成的重複）
  const diteDedupFlag = 'dite-econstudy-dedup-v1';
  if(!importedBatches.includes(diteDedupFlag)){
    const seen = new Map();
    const deduped = [];
    entries.forEach(e=>{
      if(e.category === 'econstudy' && (e.sub === '地特三等' || e.sub === '地特四等')){
        const key = e.category + '|' + e.sub + '|' + e.year + '|' + e.question.slice(0, 20);
        if(seen.has(key)){
          const existingIdx = seen.get(key);
          // 若新的一筆有圖片而舊的沒有，改保留有圖片的那筆
          if(e.questionImage && !deduped[existingIdx].questionImage){
            deduped[existingIdx] = e;
          }
          return; // 略過重複項
        }
        seen.set(key, deduped.length);
        deduped.push(e);
      }else{
        deduped.push(e);
      }
    });
    if(deduped.length !== entries.length){
      entries = deduped;
      changed = true;
    }
    importedBatches.push(diteDedupFlag);
    changed = true;
  }

  // 一次性搬家：把題目資料裡直接內嵌的附圖，搬到獨立的 IMAGES_COLLECTION，
  // 主要題目資料只留下輕量標記（hasQuestionImage），加快日後每次開啟網站時的載入速度。
  // 圖片改成「點進題目才去抓」，不影響已存在的圖片內容，只是換個地方放。
  const imageOffloadFlag = 'offload-question-images-to-collection-v1';
  if(!importedBatches.includes(imageOffloadFlag)){
    if(window.__cloudMode && db){
      for(const e of entries){
        if(e.questionImage && e.questionImage !== LAZY_IMAGE_MARKER && e.questionImage.indexOf('data:image') === 0){
          try{
            await firestoreSaveImage(e.id, e.questionImage);
            imageCache[e.id] = e.questionImage;
            e.questionImage = LAZY_IMAGE_MARKER;
            e.hasQuestionImage = true;
            changed = true;
          }catch(imgOffloadErr){
            // 單張圖片搬移失敗不影響其他題目，保留原本內嵌圖片，下次再嘗試
          }
        }
      }
      importedBatches.push(imageOffloadFlag);
      changed = true;
    }
  }

  // 一次性補丁：國際法外交特考三等 36題補上 Claude 解答
  const waijiao3ClaudeAnsFlag = 'patch-waijiao3-claude-answers-v1';
  if(!importedBatches.includes(waijiao3ClaudeAnsFlag)){
    WAIJIAO3_CLAUDE_ANSWERS_LOOKUP.forEach(item=>{
      const target = entries.find(e => e.category === 'intl' && e.sub === '外交特考三等' && e.year === item.year && e.question.indexOf(item.prefix) === 0);
      if(target && !target.answerClaude){
        target.answerClaude = item.answer;
        changed = true;
      }
    });
    importedBatches.push(waijiao3ClaudeAnsFlag);
    changed = true;
  }

  // 一次性補丁：身心障礙三等國際經濟學 98/101年 6題文字修正（依考選部官方原卷逐題複核修正版）
  const shenzhangCorrectionFlag = 'patch-shenzhang-econstudy-v2-corrections';
  if(!importedBatches.includes(shenzhangCorrectionFlag)){
    SHENZHANG_CORRECTIONS_V2.forEach(c=>{
      const target = entries.find(e => e.category === 'econstudy' && e.sub === '身心障礙' && e.question.indexOf(c.old_prefix) === 0);
      if(target){
        target.question = c.new;
        changed = true;
      }
    });
    importedBatches.push(shenzhangCorrectionFlag);
    changed = true;
  }

  // 一次性補丁：台北大學法律所115年第一題（條約失效六類型）補上 ChatGPT 解答
  const ntpu115Q1Flag = 'patch-ntpu-115-q1-chatgpt';
  if(!importedBatches.includes(ntpu115Q1Flag)){
    const target = entries.find(e => e.category === 'intl' && e.sub === '台北大學法律所' && e.year === '115' && e.question.indexOf('條約失效的規定') !== -1);
    if(target && !target.answerChatGPT){
      target.answerChatGPT = NTPU_115_Q1_CHATGPT_ANSWER;
      changed = true;
    }
    importedBatches.push(ntpu115Q1Flag);
    changed = true;
  }

  // 一次性補丁：台大政治所104年第一題（阿卡巴灣/蒂朗海峽）補上地圖圖片
  const ntu104MapFlag = 'patch-ntu-104-map-image';
  if(!importedBatches.includes(ntu104MapFlag)){
    const target = entries.find(e => e.category === 'intl' && e.sub === '台大政治所' && e.year === '104' && e.question.indexOf('「圖一」') === 0);
    if(target && !target.questionImage){
      target.questionImage = NTU_104_MAP_IMAGE;
      changed = true;
    }
    importedBatches.push(ntu104MapFlag);
    changed = true;
  }

  }catch(migrationErr){
    // 任何舊資料修正邏輯失敗都不應阻擋歷屆試題批次的匯入
    window.__loadDiagnostics.migrationError = migrationErr.message;
  }

  const batchesToImport = [
    { id: IMPORT_BATCH_ID, data: SEED_INTL_WAIJIAO3 },
    { id: IMPORT_BATCH_ID_2, data: SEED_INTL_NTU },
    { id: IMPORT_BATCH_ID_3, data: SEED_INTL_ZHENGDA },
    { id: IMPORT_BATCH_ID_4, data: SEED_DIPLO_WAIJIAO3 },
    { id: IMPORT_BATCH_ID_5, data: SEED_DIPLO_WAIJIAO4 },
    { id: IMPORT_BATCH_ID_6, data: SEED_INTL_JINGMAO },
    { id: IMPORT_BATCH_ID_7, data: SEED_INTL_GENERAL },
    { id: IMPORT_BATCH_ID_8, data: SEED_INTL_GONGFA },
    { id: IMPORT_BATCH_ID_9, data: SEED_INTL_GONGFA_108_113 },
    { id: IMPORT_BATCH_ID_10, data: SEED_INTL_HAIYANG_RENQUAN },
    { id: IMPORT_BATCH_ID_11, data: SEED_INTL_JINGJI_ZUZHI },
    { id: IMPORT_BATCH_ID_12, data: SEED_IR_GAOKAO_QIAOWU },
    { id: IMPORT_BATCH_ID_13, data: SEED_IR_PUKAO_QIAOWU },
    { id: IMPORT_BATCH_ID_14, data: SEED_IR_GAOKAO_115 },
    { id: IMPORT_BATCH_ID_15, data: SEED_IR_GUOAN },
    { id: IMPORT_BATCH_ID_16, data: SEED_IR_JIANREN },
    { id: IMPORT_BATCH_ID_17, data: SEED_IR_WENJIAO },
    { id: IMPORT_BATCH_ID_18, data: SEED_HISTORY_ZHENGDA },
    { id: IMPORT_BATCH_ID_19, data: SEED_HISTORY_NTU },
    { id: IMPORT_BATCH_ID_20, data: SEED_INTL_JIANREN_QINGBAO },
    { id: IMPORT_BATCH_ID_21, data: SEED_INTL_HAIYANGFA },
    { id: IMPORT_BATCH_ID_22, data: SEED_INTL_ZHENGDA2 },
    { id: IMPORT_BATCH_ID_23, data: SEED_IR_ZHENGDA2 },
    { id: IMPORT_BATCH_ID_24, data: SEED_HISTORY_ZHENGDA2 },
    { id: IMPORT_BATCH_ID_25, data: SEED_INTL_ZHONGYANG },
    { id: IMPORT_BATCH_ID_26, data: SEED_INTL_SHUISHANG },
    { id: IMPORT_BATCH_ID_27, data: SEED_INTL_SIFAGUAN },
    { id: IMPORT_BATCH_ID_28, data: SEED_IR_NTU },
    { id: IMPORT_BATCH_ID_29, data: SEED_INTL_NTU_LAW_G },
    { id: IMPORT_BATCH_ID_30, data: SEED_IR_DITE3 },
    { id: IMPORT_BATCH_ID_31, data: SEED_IR_DITE4 },
    { id: IMPORT_BATCH_ID_32, data: SEED_IR_LITTE113 },
    { id: IMPORT_BATCH_ID_33, data: SEED_ECONSTUDY_WAIJIAO },
    { id: IMPORT_BATCH_ID_34, data: SEED_IR_GAOKAO_NEWS },
    { id: IMPORT_BATCH_ID_35, data: SEED_ECONSTUDY_JINGMAO },
    { id: IMPORT_BATCH_ID_36, data: SEED_ECONSTUDY_DITE3 },
    { id: IMPORT_BATCH_ID_37, data: SEED_ECONSTUDY_DITE4 },
    { id: IMPORT_BATCH_ID_38, data: SEED_ECONSTUDY_GUOAN },
    { id: IMPORT_BATCH_ID_39, data: SEED_ECONSTUDY_JIANREN },
    { id: IMPORT_BATCH_ID_40, data: SEED_ECONSTUDY_YUANZHU3 },
    { id: IMPORT_BATCH_ID_41, data: SEED_ECONSTUDY_YUANZHU4 },
    { id: IMPORT_BATCH_ID_42, data: SEED_ECONSTUDY_GAOKAO3 },
    { id: IMPORT_BATCH_ID_43, data: SEED_ECONSTUDY_SHENZHANG },
    { id: IMPORT_BATCH_ID_44, data: SEED_INTL_WAISHI_POLICE },
    { id: IMPORT_BATCH_ID_45, data: SEED_INTL_NTPU },
    { id: IMPORT_BATCH_ID_46, data: SEED_INTL_NTPU2 },
    { id: IMPORT_BATCH_ID_47, data: SEED_INTL_ZHENGDA_102 },
    { id: IMPORT_BATCH_ID_48, data: SEED_IR_ZHENGDA_EA }
  ];

  if(batchesToImport.some(b => !importedBatches.includes(b.id))){
    updateLoadingProgress(65, '正在準備匯入歷屆試題批次…');
  }

  batchesToImport.forEach(batch=>{
    try{
      if(!importedBatches.includes(batch.id)){
        if(Array.isArray(batch.data)){
          batch.data.forEach((seed, idx)=>{
            entries.push({
              id: 'seed-' + batch.id + '-' + idx,
              createdAt: Date.now(),
              ...seed
            });
          });
        }
        importedBatches.push(batch.id);
        changed = true;
      }
    }catch(batchErr){
      // 單一批次失敗不應影響其他批次的匯入
      window.__loadDiagnostics.batchError = (window.__loadDiagnostics.batchError || '') + batch.id + ': ' + batchErr.message + '; ';
    }
  });

  let saveOk = true;
  if(changed){
    updateLoadingProgress(80, '正在將更新後的資料寫回 Firebase…');
    if(window.__cloudMode && db){
      try{
        await firestoreBatchWriteEntries(entries);
        await firestoreSetImportedBatches(importedBatches);
        updateStorageStatus('ok');
      }catch(cloudSaveErr){
        saveOk = false;
        window.__loadDiagnostics.saveEntriesFailed = 'cloud: ' + cloudSaveErr.message;
        updateStorageStatus('error');
      }
    }else{
      saveOk = await saveToStorage();
      if(saveOk){
        try{ await window.storage.set('exam-archive-imported-batches', JSON.stringify(importedBatches), false); }catch(e){}
      }else{
        window.__loadDiagnostics.importedBatchesSkipped = '題目資料存檔失敗，已跳過標記已匯入批次，下次會重新嘗試匯入。';
      }
    }
  }

  showDiagnosticsIfNeeded(batchesToImport.length);
  render();
}

function showDiagnosticsIfNeeded(expectedBatchCount){
  const d = window.__loadDiagnostics || {};
  const hasError = d.storageGetError || d.migrationError || d.batchError || d.importedBatchesGetError;
  const suspiciouslyLow = entries.length === 0 && expectedBatchCount > 0;
  if(!hasError && !suspiciouslyLow) return;

  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#A63A32;color:#fff;padding:12px 16px;font-family:-apple-system,sans-serif;font-size:13px;line-height:1.6;max-height:60vh;overflow-y:auto;';
  let html = '<strong>⚠ 診斷訊息（請截圖給 Claude）</strong><br>';
  html += '題目數量：' + entries.length + '（預期批次數：' + expectedBatchCount + '）<br>';
  if(d.storageGetError) html += 'storageGetError: ' + chineseSafe(d.storageGetError) + '<br>';
  if(d.selfHealTriggered) html += '🔧 ' + chineseSafe(d.selfHealTriggered) + '<br>';
  if(d.importedBatchesGetError) html += 'importedBatchesGetError: ' + chineseSafe(d.importedBatchesGetError) + '<br>';
  if(d.migrationError) html += 'migrationError: ' + chineseSafe(d.migrationError) + '<br>';
  if(d.batchError) html += 'batchError: ' + chineseSafe(d.batchError) + '<br>';
  if(d.saveEntriesFailed) html += 'saveEntriesFailed: ' + chineseSafe(d.saveEntriesFailed) + '（資料量可能超過瀏覽器離線儲存空間上限）<br>';
  if(d.importedBatchesSkipped) html += chineseSafe(d.importedBatchesSkipped) + '<br>';
  html += '<button onclick="this.parentElement.remove()" style="margin-top:8px;padding:4px 10px;">關閉</button>';
  banner.innerHTML = html;
  document.body.insertBefore(banner, document.body.firstChild);
}

async function saveToStorage(){
  updateStorageStatus('saving');
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
    updateStorageStatus('ok');
    return true;
  }catch(e){
    try{
      await new Promise(r=>setTimeout(r, 800));
      await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
      updateStorageStatus('ok');
      return true;
    }catch(e2){
      try{
        await new Promise(r=>setTimeout(r, 1500));
        await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
        updateStorageStatus('ok');
        return true;
      }catch(e3){
        // 完全靜默：不輸出任何 console 訊息，避免介面跳出提示面板
        updateStorageStatus('error');
        window.__loadDiagnostics = window.__loadDiagnostics || {};
        window.__loadDiagnostics.saveEntriesFailed = e3.message || String(e3);
        return false;
      }
    }
  }
}

function updateStorageStatus(state){
  const el = document.getElementById('storageStatus');
  const textEl = document.getElementById('storageStatusText');
  if(!el || !textEl) return;
  let mode;
  if(window.__cloudMode){ mode = 'Firebase 雲端儲存'; }
  else if(window.__storageMode === 'local'){ mode = '本機離線儲存'; }
  else{ mode = 'Claude 雲端儲存'; }
  el.classList.remove('saving','error');
  if(state === 'saving'){
    el.classList.add('saving');
    textEl.textContent = mode + '・儲存中…';
  }else if(state === 'error'){
    el.classList.add('error');
    textEl.textContent = mode + '・儲存失敗';
  }else{
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    textEl.textContent = mode + '・已存檔 ' + hh + ':' + mm;
  }
}

function chineseSafe(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function inlineMarkdown(s){
  // 先跳脫HTML，再處理行內語法：**粗體**、*斜體*、`代碼`
  let out = escapeHtml(s);
  out = out.replace(/`([^`]+?)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
  return out;
}

function renderMarkdown(text){
  if(!text) return '';
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  let html = '';
  let i = 0;
  let listType = null; // 'ul' | 'ol' | null
  let inTable = false;
  let tableRows = [];

  function closeList(){
    if(listType){ html += listType === 'ul' ? '</ul>' : '</ol>'; listType = null; }
  }
  function flushTable(){
    if(!inTable) return;
    const rows = tableRows.filter(r => !/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(r));
    if(rows.length){
      html += '<table>';
      rows.forEach((row, idx)=>{
        const cells = row.replace(/^\||\|$/g, '').split('|').map(c=>c.trim());
        const tag = idx === 0 ? 'th' : 'td';
        html += '<tr>' + cells.map(c=>'<'+tag+'>'+inlineMarkdown(c)+'</'+tag+'>').join('') + '</tr>';
      });
      html += '</table>';
    }
    inTable = false;
    tableRows = [];
  }

  while(i < lines.length){
    const raw = lines[i];
    const line = raw.trim();

    if(line === ''){
      flushTable();
      closeList();
      i++;
      continue;
    }

    // 表格偵測：含有 | 且下一行是分隔線，或已經在表格中
    if(/\|/.test(line) && (inTable || (lines[i+1] && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i+1])))){
      closeList();
      inTable = true;
      tableRows.push(line);
      i++;
      continue;
    }
    flushTable();

    const hMatch = line.match(/^(#{1,4})\s+(.*)$/);
    if(hMatch){
      closeList();
      const level = hMatch[1].length;
      html += '<h'+level+'>' + inlineMarkdown(hMatch[2]) + '</h'+level+'>';
      i++;
      continue;
    }

    if(/^(-{3,}|\*{3,})$/.test(line)){
      closeList();
      html += '<hr>';
      i++;
      continue;
    }

    const ulMatch = line.match(/^[-*]\s+(.*)$/);
    if(ulMatch){
      if(listType !== 'ul'){ closeList(); html += '<ul>'; listType = 'ul'; }
      html += '<li>' + inlineMarkdown(ulMatch[1]) + '</li>';
      i++;
      continue;
    }

    const olMatch = line.match(/^\d+[.、]\s+(.*)$/);
    if(olMatch){
      if(listType !== 'ol'){ closeList(); html += '<ol>'; listType = 'ol'; }
      html += '<li>' + inlineMarkdown(olMatch[1]) + '</li>';
      i++;
      continue;
    }

    closeList();
    html += '<p>' + inlineMarkdown(line) + '</p>';
    i++;
  }
  flushTable();
  closeList();
  return html;
}

function renderSubbar(){
  const subbar = document.getElementById('subbar');
  const catEntries = entries.filter(e => e.category === currentCat);
  const subs = subLists[currentCat];
  const unassignedCount = catEntries.filter(e => !e.sub || !subs.includes(e.sub)).length;

  const chips = [`<div class="subchip ${currentSub==='all'?'active':''}" data-sub="all">全部<span class="n">${catEntries.length}</span></div>`]
    .concat(subs.map(s=>{
      const n = catEntries.filter(e=>e.sub===s).length;
      return `<div class="subchip ${currentSub===s?'active':''}" data-sub="${chineseSafe(s)}">${chineseSafe(s)}<span class="n">${n}</span></div>`;
    }));

  if(unassignedCount > 0){
    chips.push(`<div class="subchip unassigned ${currentSub==='__unassigned__'?'active':''}" data-sub="__unassigned__">未分類<span class="n">${unassignedCount}</span></div>`);
  }

  subbar.innerHTML = chips.join('');
  subbar.querySelectorAll('.subchip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      currentSub = chip.dataset.sub;
      render();
    });
  });
}

function render(){
  document.getElementById('panel-title').textContent = '卷宗分類：' + catNames[currentCat];
  document.getElementById('count-intl').textContent = entries.filter(e=>e.category==='intl').length || '';
  document.getElementById('count-ir').textContent = entries.filter(e=>e.category==='ir').length || '';
  document.getElementById('count-history').textContent = entries.filter(e=>e.category==='history').length || '';
  document.getElementById('count-econ').textContent = entries.filter(e=>e.category==='econ').length || '';
  document.getElementById('count-politics').textContent = entries.filter(e=>e.category==='politics').length || '';
  document.getElementById('count-econstudy').textContent = entries.filter(e=>e.category==='econstudy').length || '';
  hideLoadingOverlay();

  renderSubbar();

  const list = entries.filter(e => {
    if(e.category !== currentCat) return false;
    if(currentSub === 'all') return true;
    if(currentSub === '__unassigned__') return !e.sub || !subLists[currentCat].includes(e.sub);
    return e.sub === currentSub;
  });
  const content = document.getElementById('content');
  const scopeLabel = currentSub === 'all' ? catNames[currentCat] : (currentSub === '__unassigned__' ? '未分類' : currentSub);

  if(list.length === 0){
    content.innerHTML = `<div class="empty-state"><span class="big">卷宗空白</span>尚未建立「${chineseSafe(scopeLabel)}」的題目，點擊右上角「＋ 新增題目」開始存卷。</div>`;
    return;
  }

  const byYear = {};
  list.forEach(e=>{
    const y = e.year || '未標年度';
    if(!byYear[y]) byYear[y] = [];
    byYear[y].push(e);
  });

  const years = Object.keys(byYear).sort((a,b)=>{
    const na = parseInt(a), nb = parseInt(b);
    if(!isNaN(na) && !isNaN(nb)) return nb - na;
    return b.localeCompare(a);
  });

  content.innerHTML = years.map(y=>{
    const isOpen = openYears.has(currentCat+'-'+y);
    const items = byYear[y];
    const entriesHtml = items.map((e, idx)=>{
      return `
        <div class="entry">
          <div class="stamp">${idx+1}</div>
          <div class="entry-body">
            ${currentSub==='all' ? `<div class="sub-tag">${chineseSafe(e.sub||'未分類')}</div>` : ''}
            <p class="q-text">${chineseSafe(e.question)}</p>
            ${(() => {
              if(e.questionImage && e.questionImage !== LAZY_IMAGE_MARKER){
                return `<img class="q-image" src="${e.questionImage}" alt="題目附圖">`;
              } else if(e.questionImage === LAZY_IMAGE_MARKER || e.hasQuestionImage){
                if(imageCache[e.id]){
                  return `<img class="q-image" src="${imageCache[e.id]}" alt="題目附圖">`;
                }
                return `<div class="q-image-placeholder" id="img-ph-${e.id}"><button class="link-btn" onclick="loadEntryImage('${e.id}')">📷 載入附圖</button></div>`;
              }
              return '';
            })()}
            <div class="entry-actions">
              <button class="link-btn" onclick="copyQuestion('${e.id}', this)">複製</button>
              <button class="link-btn" onclick="toggleAnswer('${e.id}','chatgpt')">ChatGPT 解答</button>
              <button class="link-btn" onclick="toggleAnswer('${e.id}','gemini')">Gemini 解答</button>
              <button class="link-btn" onclick="toggleAnswer('${e.id}','claude')">Claude 解答</button>
              <button class="link-btn" onclick="editEntry('${e.id}')">編輯</button>
            </div>
            <div class="answer-box" id="ans-${e.id}-chatgpt">
              <div class="answer-label">ChatGPT 解答</div>
              ${e.answerChatGPT ? renderMarkdown(e.answerChatGPT) : chineseSafe('（尚未填寫解答）')}
            </div>
            <div class="answer-box" id="ans-${e.id}-gemini">
              <div class="answer-label">Gemini 解答</div>
              ${e.answerGemini ? renderMarkdown(e.answerGemini) : chineseSafe('（尚未填寫解答）')}
            </div>
            <div class="answer-box" id="ans-${e.id}-claude">
              <div class="answer-label">Claude 解答</div>
              ${e.answerClaude ? renderMarkdown(e.answerClaude) : chineseSafe('（尚未填寫解答）')}
            </div>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="year-block ${isOpen?'open':''}" id="yb-${currentCat}-${y}">
        <div class="year-head" onclick="toggleYear('${y}')">
          <span class="year-tag">${y}</span>
          <span class="year-label">年度題卷</span>
          <span class="year-meta">共 ${items.length} 題</span>
          <span class="chevron">▶</span>
        </div>
        <div class="year-entries">${entriesHtml}</div>
      </div>
    `;
  }).join('');
}

async function loadEntryImage(id){
  const ph = document.getElementById('img-ph-' + id);
  if(!ph) return;
  const btn = ph.querySelector('button');
  if(btn){ btn.textContent = '載入中…'; btn.disabled = true; }
  try{
    const dataUrl = await firestoreLoadImage(id);
    if(dataUrl){
      ph.outerHTML = `<img class="q-image" src="${dataUrl}" alt="題目附圖">`;
    }else{
      if(btn){ btn.textContent = '圖片載入失敗，點我重試'; btn.disabled = false; }
    }
  }catch(err){
    if(btn){ btn.textContent = '圖片載入失敗，點我重試'; btn.disabled = false; }
  }
}

function copyQuestion(id, btn){
  const e = entries.find(x=>x.id===id);
  if(!e) return;
  const text = e.question;

  const showCopied = () => {
    if(!btn) return;
    const original = btn.textContent;
    btn.textContent = '已複製 ✓';
    btn.disabled = true;
    setTimeout(()=>{
      btn.textContent = original;
      btn.disabled = false;
    }, 1500);
  };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(()=>{
      fallbackCopy(text, showCopied);
    });
  }else{
    fallbackCopy(text, showCopied);
  }
}

function fallbackCopy(text, cb){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    if(cb) cb();
  }catch(e){
    alert('複製失敗，請手動選取文字複製。');
  }
}

function toggleAnswer(id, source){
  const box = document.getElementById('ans-'+id+'-'+source);
  if(!box) return;
  const willShow = !box.classList.contains('show');
  ['chatgpt','gemini','claude'].forEach(s=>{
    const b = document.getElementById('ans-'+id+'-'+s);
    if(b) b.classList.remove('show');
  });
  if(willShow) box.classList.add('show');
}

  document.getElementById('modalTitle').textContent = '編輯題目';
  document.getElementById('editId').value = e.id;
  document.getElementById('f-cat').value = e.category;
  populateSubSelect(e.category, e.sub);

  document.getElementById('f-answer-gemini').value = e.answerGemini || '';
  document.getElementById('f-answer-claude').value = e.answerClaude || '';
  document.getElementById('f-image-input').value = '';
  document.getElementById('overlay').classList.add('show');

    document.getElementById('image-preview-wrap').style.display = 'none';
    try{
      const realImage = await firestoreLoadImage(e.id);
      currentImageData = realImage || null;
      if(realImage){
        document.getElementById('image-preview').src = realImage;
        document.getElementById('image-preview-wrap').style.display = 'block';
      }
    }catch(err){
      currentImageData = null;
    }
  }else if(e.questionImage){
    currentImageData = e.questionImage;
    document.getElementById('image-preview').src = e.questionImage;
    document.getElementById('image-preview-wrap').style.display = 'block';
  }else{
    currentImageData = null;
    document.getElementById('image-preview-wrap').style.display = 'none';
  }
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const id = document.getElementById('editId').value;
  const cat = document.getElementById('f-cat').value;
  const sub = document.getElementById('f-sub').value;
  const year = document.getElementById('f-year').value.trim();
  const question = document.getElementById('f-question').value.trim();
  const answerChatGPT = document.getElementById('f-answer-chatgpt').value.trim();
  const answerGemini = document.getElementById('f-answer-gemini').value.trim();
  const answerClaude = document.getElementById('f-answer-claude').value.trim();

  if(!question){
    alert('請至少填寫題目內容');
    return;
  }

  let savedEntry = null;
  if(id){
    const e = entries.find(x=>x.id===id);
    if(e){
      e.category = cat; e.sub = sub; e.year = year; e.question = question;
      e.answerChatGPT = answerChatGPT; e.answerGemini = answerGemini; e.answerClaude = answerClaude;
      delete e.answer;
      if(currentImageData){ e.questionImage = currentImageData; delete e.hasQuestionImage; }
      else{ delete e.questionImage; delete e.hasQuestionImage; }
      savedEntry = e;
    }
  }else{
    const newEntry = {
      id: 'e' + Date.now() + Math.random().toString(36).slice(2,7),
      category: cat, sub, year, question,
      answerChatGPT, answerGemini, answerClaude,
      createdAt: Date.now()
    };
    if(currentImageData){ newEntry.questionImage = currentImageData; }
    entries.push(newEntry);
    savedEntry = newEntry;
  }

  if(window.__cloudMode && db && savedEntry){
    updateStorageStatus('saving');
    try{
      await firestoreSaveEntry(savedEntry);
      updateStorageStatus('ok');
    }catch(cloudSaveErr){
      updateStorageStatus('error');
      // 雲端寫入失敗時，仍嘗試寫入本機離線儲存作為備援，避免這次編輯完全遺失
      try{ await saveToStorage(); }catch(e){}
    }
  }else{
    await saveToStorage();
  }
  currentCat = cat;
  currentSub = sub;
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.cat === cat);
  });
  document.getElementById('overlay').classList.remove('show');
  render();
});

const fsBtn = document.getElementById('fullscreenBtn');
if(fsBtn){
  fsBtn.addEventListener('click', async ()=>{
    const el = document.documentElement;
    const isFull = document.fullscreenElement || document.webkitFullscreenElement;
    try{
      if(!isFull){
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
        if(!req) throw new Error('unsupported');
        await req.call(el);
      }else{
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if(exit) await exit.call(document);
      }
    }catch(err){
      alert('目前所在的瀏覽器視窗不允許切換全螢幕（通常是因為被包在 Claude 的預覽框架內，這是 Claude 那一層的限制，無法從網頁內部解除）。建議改用瀏覽器直接開啟此檔案，或使用瀏覽器本身的全螢幕／閱讀模式功能。');
    }
  });
  ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(evt=>{
    document.addEventListener(evt, ()=>{
      const isFull = document.fullscreenElement || document.webkitFullscreenElement;
      fsBtn.textContent = isFull ? '⤢' : '⛶';
    });
  });
}

function exportSnapshotHtml(){
  try{
    const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const startMarker = 'window.__SNAPSHOT_EXPORT_TAIL_START__';
    const endMarker = '__SNAPSHOT_EXPORT_TAIL_END__';
    const startIdx = fullHtml.indexOf(startMarker);
    if(startIdx === -1){
      alert('匯出失敗：找不到起始標記，請截圖回報給 Claude。');
      return;
    }
    const endIdx = fullHtml.indexOf(endMarker, startIdx);
    if(endIdx === -1){
      alert('匯出失敗：找不到結尾標記，請截圖回報給 Claude。');
      return;
    }
    const entriesJson = JSON.stringify(entries);
    const replacement =
      "window.__cloudMode = false;\n" +
      "entries = " + entriesJson + ";\n" +
      "render();\n" +
      "updateStorageStatus('ok');\n" +
      "hideLoadingOverlay();\n" +
      "saveToStorage();\n";
    // 只依賴起始標記本身是否存在，不依賴中間程式碼的確切格式，
    // 也不怕日後部署平台對 JS 做壓縮/移除註解導致比對失敗。
    const finalHtml = fullHtml.slice(0, startIdx) + replacement + '<\/script>\n</body>\n</html>';

    const blob = new Blob([finalHtml], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const now = new Date();
    const pad = n => String(n).padStart(2,'0');
    const filename = 'archive-snapshot-' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) + '-' + pad(now.getHours()) + pad(now.getMinutes()) + '.html';
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }catch(exportErr){
    alert('匯出失敗：' + (exportErr.message || String(exportErr)));
  }
}

document.addEventListener('DOMContentLoaded', ()=>{
  const dlBtn = document.getElementById('downloadSnapshotBtn');
  if(dlBtn) dlBtn.addEventListener('click', exportSnapshotHtml);
  const refreshBtn = document.getElementById('refreshPageBtn');
  if(refreshBtn) refreshBtn.addEventListener('click', ()=>location.reload());
});

window.__SNAPSHOT_EXPORT_TAIL_START__ = true;
(function(){
  const loadingTimeoutMs = 20000;
  let finished = false;
  const timer = setTimeout(()=>{
    if(finished) return;
    const panel = document.querySelector('.panel');
    if(panel){
      const notice = document.createElement('div');
      notice.style.cssText = 'padding:16px;background:#fff3cd;border:1px solid #D9A441;border-radius:6px;margin:12px 0;font-size:13px;line-height:1.6;';
      notice.innerHTML = '⏳ 載入時間較久（超過20秒），可能是第一次把資料寫入 Firebase 雲端資料庫，資料量較大需要較長時間，請耐心等候；如果超過1-2分鐘仍無反應，代表可能真的卡住了，請截圖給 Claude 看主控台（Console）錯誤訊息。';
      panel.insertBefore(notice, panel.firstChild);
    }
  }, loadingTimeoutMs);
  loadEntries().then(()=>{
    finished = true;
    clearTimeout(timer);
    updateStorageStatus('ok');
  }).catch((err)=>{
    finished = true;
    clearTimeout(timer);
    const panel = document.querySelector('.panel');
    if(panel){
      const notice = document.createElement('div');
      notice.style.cssText = 'padding:16px;background:#A63A32;color:#fff;border-radius:6px;margin:12px 0;font-size:13px;line-height:1.6;';
      notice.textContent = '⚠ 載入發生錯誤：' + (err && err.message ? err.message : String(err));
      panel.insertBefore(notice, panel.firstChild);
    }
  });
})();
window.__SNAPSHOT_EXPORT_TAIL_END__ = true;
</script>
